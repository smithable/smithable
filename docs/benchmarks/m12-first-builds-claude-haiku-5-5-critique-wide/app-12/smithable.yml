smithable: 0.1
app:
  name: Municipal Service Status
  description: Shows whether the municipality's online services are working, what is being fixed, and what maintenance is planned.
models:
  Service:
    fields:
      name: string! unique
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
      maintenances: Maintenance[]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      service: Service
      detectedAt: datetime!
      resolvedAt: datetime
      summary: markdown
      updates: IncidentUpdate[]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
  Maintenance:
    fields:
      title: string!
      service: Service
      startsAt: datetime!
      endsAt: datetime!
      description: text
actions:
  identified:
    on: Incident
    when:
      status: investigating
    set:
      status: identified
    add:
      IncidentUpdate:
        at: NOW()
        status: identified
        message: The cause is found and a fix is being worked on.
    intent: The cause is found; the incident moves to identified, with an update saying so.
  monitoring:
    on: Incident
    when:
      status: [investigating, identified]
    set:
      status: monitoring
    add:
      IncidentUpdate:
        at: NOW()
        status: monitoring
        message: A fix is out. We are watching before we close this.
    intent: A fix is out; the incident is watched before it is closed, with an update saying so.
  resolve:
    on: Incident
    when:
      status: [investigating, identified, monitoring]
    set:
      status: resolved
      resolvedAt: NOW()
    add:
      IncidentUpdate:
        at: NOW()
        status: resolved
        message: This incident is resolved.
    intent: The incident is over, with an update saying so. The service's state stays what the team sets.
pages:
  incidents:
    crud: Incident
    filters: [status]
  maintenance:
    crud: Maintenance
  services:
    crud: Service
  home:
    route: /
    landing:
      hero:
      services:
        records: Service
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
      recent:
        records: Incident
        where:
          status: resolved
      planned:
        records: Maintenance
      footer:
  team:
    users: manage
