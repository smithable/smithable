smithable: 0.1
app:
  name: IT Status Board
  description: Shows which of our IT systems are down, what is being fixed, and when planned work will happen, so staff always know the state of things.
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime! = NOW()
      resolvedAt: datetime
      summary: markdown
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime! = NOW()
      status: investigating | identified | monitoring | resolved
      message: text!
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
actions:
  identified:
    on: Incident
    when:
      status: investigating
    set:
      status: identified
    add:
      IncidentUpdate:
        at: NOW()
        status: identified
        message: The cause is found and a fix is being worked on.
    intent: The cause is found; the incident moves to identified, with an update saying so.
  monitoring:
    on: Incident
    when:
      status: [investigating, identified]
    set:
      status: monitoring
    add:
      IncidentUpdate:
        at: NOW()
        status: monitoring
        message: A fix is out. We are watching before we close this.
    intent: A fix is out; the incident is watched before it is closed, with an update saying so.
  resolve:
    on: Incident
    when:
      status: [investigating, identified, monitoring]
    set:
      status: resolved
      resolvedAt: NOW()
    add:
      IncidentUpdate:
        at: NOW()
        status: resolved
        message: This incident is resolved.
    intent: The incident is over, with an update saying so. The component's state stays what the team sets.
pages:
  overview:
    dashboard:
      openIncidents:
        count: Incident
        where:
          status: [investigating, identified, monitoring]
      downNow:
        count: Component
        where:
          status: down
      perMonth:
        count: Incident
        by: detectedAt
      latest:
        list: Incident
        limit: 5
  incidents:
    crud: Incident
    filters: [status, component]
    defaultFilter:
      status: [investigating, identified, monitoring]
  components:
    crud: Component
  maintenance:
    crud: Maintenance
  team:
    users: manage
navigation: [overview, incidents, maintenance, components, team]
