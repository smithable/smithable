smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  staff:
    description: Writes incidents and their updates.
    pages: [overview, incidents, maintenance]
    create: [Incident, IncidentUpdate, Maintenance]
    write: [Incident, IncidentUpdate, Maintenance]
    actions: all
assistant:
  for: signed-in
defaultRole: staff
admins: [johan@smithable.ai]
