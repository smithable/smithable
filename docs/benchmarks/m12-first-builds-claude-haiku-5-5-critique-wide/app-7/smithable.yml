smithable: 0.1
app:
  name: Flea Market
  description: Post things you no longer need to sell, with photos and a price, and browse what your neighbors have for sale.
models:
  Item:
    fields:
      title: string!
      photos: pictures!
      description: text!
      price: money
      category: furniture | bikes | electronics | sports | kids | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
    review: [photos]
pages:
  catalog:
    route: /
    crud: Item
    search: [title, description, place]
    filters: [category, price, condition, available]
    sortable: [price, createdAt]
    favorites: true
    contact: owner
  myItems:
    crud: Item
    mine: true
  saved:
    crud: Item
    favorites: only
  review:
    review: all
  home:
    route: /welcome
    landing:
      hero:
        button: catalog
      latest:
        records: Item
        where:
          available: true
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
navigation: [catalog, myItems, saved, review, team]
