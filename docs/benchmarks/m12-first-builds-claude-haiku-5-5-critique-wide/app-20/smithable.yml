smithable: 0.1
app:
  name: Joogastudio Virta
  description: Joogatuntien aikataulu ja verkkovaraukset pienelle joogastudiolle.
  currency: EUR
  timezone: Europe/Helsinki
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: allLevels | beginner | advanced
      durationMinutes: int! = 60
      sessions: Session[]
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      sessions: Session[]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
    namedBy: [classType, startsAt]
  Booking:
    fields:
      session: Session! unique
      attendee: User
    namedBy: session
    ownedBy: attendee
    capacity:
      per: session
      max: session.capacity
      closes: session.startsAt
      cancelUntil: 2 hours before session.startsAt
  Post:
    fields:
      title: string!
      address: string unique
      summary: text
      cover: picture
      body: markdown!
      publishedOn: date
      status: draft | published
  Message:
    fields:
      name: string!
      email: email!
      message: text!
pages:
  home:
    route: /
    landing:
      hero:
        button: schedule
        shortcuts: [schedule, blog]
      classes:
        records: ClassType
      news:
        records: Post
      faq:
        faq:
      contact:
        form: Message
        contact:
      callToAction:
        button: schedule
        callToAction:
      footer:
  sessions:
    crud: Session
    filters: [classType, instructor, startsAt]
    defaultFilter:
      startsAt: upcoming
    sortable: [startsAt, capacity]
  class-types:
    crud: ClassType
    filters: [level]
  instructors:
    crud: Instructor
  messages:
    crud: Message
  posts:
    crud: Post
    actions: [publish]
  my-bookings:
    route: /my-bookings
    crud: Booking
  schedule:
    calendar:
      model: Session
      starts: startsAt
  blog:
    articles: Post
  about:
    sections:
      intro:
        text:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
  admin:
    data: all
actions:
  publish:
    on: Post
    when:
      status: draft
    set:
      status: published
    intent: Juttu julkaistaan kaikille luettavaksi.
timers:
  remind:
    on: Booking
    at: 1 day before session.startsAt
  publish:
    on: Post
    at: publishedOn
    where:
      status: draft
    run: publish
outgoing:
  reminder:
    when: remind
    to: mail
    recipient: owner
  bookingMade:
    when: Booking created
    to: mail
    recipient: owner
  bookingChanged:
    when: Booking changed
    to: mail
    recipient: owner
  bookingCancelled:
    when: Booking deleted
    to: mail
    recipient: owner
navigation:
  main: [home, sessions, class-types, instructors, messages, posts, my-bookings, schedule, blog, about, privacy, team, admin]
  schedule: [schedule, my-bookings, sessions]
  messages: [messages]
  studioSetup: [class-types, instructors, team]
  website: [blog, about, posts, home]
  admin: [admin]
