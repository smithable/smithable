smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  staff:
    description: Nimmt die Vorbestellungen an und pflegt Produkte und Abholzeiten.
    pages: [orders, products, pickups]
    create: all
    write: all
    actions: all
assistant:
  for: signed-in
public:
  read: [Product, PickupSlot]
  create: [Order]
defaultRole: staff
admins: [johan@smithable.ai]
