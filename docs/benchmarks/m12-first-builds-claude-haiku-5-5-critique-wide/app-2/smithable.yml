smithable: 0.1
app:
  name: Pipeline
  description: Tracks the agency's leads and deals, and who follows up on each and when.
models:
  Lead:
    fields:
      name: string!
      company: string
      email: email
      phone: phone
      source: referral | website | outbound | event
      status: new | contacted | qualified | lost
      followUpOn: date
      assignee: User
      notes: text
      deals: Deal[]
    ownedBy: assignee
  Deal:
    fields:
      title: string!
      lead: Lead!
      value: money
      stage: proposal | negotiation | won | lost
      closeDate: date
      salesperson: User
    ownedBy: salesperson
pages:
  leads:
    crud: Lead
    search: [name, company, email]
    filters: [status, assignee]
  deals:
    crud: Deal
    filters: [stage, salesperson]
    actions: [markWon, markLost]
  team:
    users: manage
actions:
  markWon:
    on: Deal
    when:
      stage: [proposal, negotiation]
    set:
      stage: won
      closeDate: TODAY()
  markLost:
    on: Deal
    when:
      stage: [proposal, negotiation]
    set:
      stage: lost
      closeDate: TODAY()
outgoing:
  leadAssigned:
    when: Lead changed
    fields: [assignee]
    to: mail
    recipient: assignee
