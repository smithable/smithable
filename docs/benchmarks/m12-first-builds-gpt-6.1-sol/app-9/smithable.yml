smithable: 0.1
app:
  name: IT Help Desk
  description: A shared help desk for an IT team to track tickets, prioritize work and assign responsibility.
  timezone: UTC
models:
  Ticket:
    fields:
      title: string!
      description: text!
      priority: normal | low | high | urgent
      status: open | inProgress | resolved
      assignee: User
      resolvedAt: datetime
pages:
  tickets:
    crud: Ticket
    search: [title, description]
    actions: [takeTicket, resolve, reopen]
  team:
    users: manage
actions:
  takeTicket:
    on: Ticket
    when:
      status: [open, inProgress]
    set:
      assignee: ME()
      status: inProgress
  resolve:
    on: Ticket
    when:
      status: [open, inProgress]
    set:
      status: resolved
      resolvedAt: NOW()
  reopen:
    on: Ticket
    when:
      status: resolved
    set:
      status: open
      resolvedAt:
