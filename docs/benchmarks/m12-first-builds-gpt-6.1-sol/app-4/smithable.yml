smithable: 0.1
app:
  name: Neighbor Tool Library
  description: Find, lend and borrow tools from neighbors in your community.
models:
  Item:
    fields:
      title: string!
      description: text!
      category: handTools | powerTools | garden | ladders | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
pages:
  catalog:
    route: /
    crud: Item
    search: [title, description, place]
    filters: [category, condition, available]
    sortable: [title, createdAt]
    favorites: true
    contact: owner
  myItems:
    crud: Item
    mine: true
  saved:
    crud: Item
    favorites: only
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latest:
        records: Item
        where:
          available: true
actions:
  lendTool:
    on: Item
    when:
      available: true
    set:
      available: false
  returnTool:
    on: Item
    when:
      available: false
    set:
      available: true
