smithable: 0.1
app:
  name: Bakery Inventory
  description: Track a small bakery's ingredients, suppliers and current stock levels.
models:
  Supplier:
    fields:
      name: string!
      email: email
      phone: phone
      notes: text
  Item:
    fields:
      name: string!
      summary: text
      supplier: Supplier
      stockLevel: decimal! = 0
      unit: kg | g | l | ml | units
      reorderLevel: decimal! = 0
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
pages:
  items:
    crud: Item
    search: [name, summary]
    filters: [supplier, unit]
  suppliers:
    crud: Supplier
    search: [name, email, phone]
  team:
    users: manage
