smithable: 0.1
app:
  name: Greenfield FC
  description: The teams, players and matches of Greenfield Football Club.
  timezone: Europe/London
models:
  Team:
    fields:
      name: string!
      ageGroup: string!
      coach: string
      trainingDays: string
      trainingTime: string
  Player:
    fields:
      name: string!
      team: Team!
      position: string
      number: int
      dateOfBirth: date
      height: decimal
      weight: decimal
      nationality: string
  Match:
    fields:
      team: Team!
      opponent: string!
      date: date!
      time: string
      venue: string
      home: bool = true
      result: string
      score: string
      report: markdown
pages:
  teams:
    crud: Team
  players:
    crud: Player
  matches:
    crud: Match
  home:
    route: /
    landing:
      hero:
        shortcuts: [teams, players, matches]
      footer:
      teams:
        records: Team
  privacy:
    route: /privacy
    legal: privacy
navigation: [teams, players, matches]
