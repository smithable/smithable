smithable: 0.1
app:
  name: Greenfield FC
  description: The club's teams, players, matches and results.
  timezone: Europe/London
models:
  Team:
    fields:
      name: string!
      ageGroup: string!
      coach: string
      homeGround: string
      logo: picture
  Player:
    fields:
      name: string!
      team: Team!
      position: string!
      number: int
      dateOfBirth: date!
      nationality: string
      height: decimal
      weight: decimal
      profilePicture: picture
  Match:
    fields:
      team: Team!
      opponent: string!
      date: datetime!
      venue: string!
      competition: string
      homeScore: int
      awayScore: int
      result: win | draw | loss
      report: markdown
      highlights: url
pages:
  teams:
    crud: Team
  players:
    crud: Player
  matches:
    route: /fixtures-and-results
    crud: Match
    filters: [team, result, date]
    defaultFilter:
      date: upcoming
  home:
    route: /
    landing:
      hero:
        button: matches
        secondButton: teams
        shortcuts: [teams, players, matches]
      teams:
        records: Team
      upcoming:
        records: Match
        view: table
      footer:
  privacy:
    route: /privacy
    legal: privacy
navigation: [home, teams, players, matches]
