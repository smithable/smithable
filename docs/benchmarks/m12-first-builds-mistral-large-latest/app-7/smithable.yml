smithable: 0.1
app:
  name: Football Club
  description: Teams, players, matches and results.
  timezone: Europe/London
models:
  Team:
    fields:
      name: string!
      ageGroup: youth | senior
      coach: string
      homeGround: string
  Player:
    fields:
      name: string!
      team: Team!
      position: goalkeeper | defender | midfielder | forward
      number: int
      dateOfBirth: date
      height: decimal
      nationality: string
  Match:
    fields:
      homeTeam: Team!
      awayTeam: Team!
      date: datetime!
      venue: string
      competition: string
      homeScore: int
      awayScore: int
      result: scheduled | homeWin | awayWin | draw
      report: markdown
pages:
  teams:
    crud: Team
  players:
    crud: Player
  matches:
    crud: Match
  home:
    route: /
    landing:
      hero:
      footer:
      upcomingMatches:
        records: Match
        where:
          result: scheduled
      recentResults:
        records: Match
        where:
          result: [homeWin, awayWin, draw]
  privacy:
    route: /privacy
    legal: privacy
navigation: [home, teams, players, matches]
