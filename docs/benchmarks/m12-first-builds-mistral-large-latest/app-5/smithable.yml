smithable: 0.1
app:
  name: SweetStock
  description: Track ingredients, suppliers and stock levels for a small bakery.
  timezone: Europe/Mariehamn
models:
  Ingredient:
    fields:
      name: string!
      description: text
      stock: int! = 0
      minimum: int! = 5
      unit: string! = kg
      lastUpdated: date! = TODAY()
      supplier: Supplier!
  Supplier:
    fields:
      name: string!
      contact: string!
      email: email
      phone: phone
      address: text
pages:
  ingredients:
    crud: Ingredient
  suppliers:
    crud: Supplier
  team:
    users: manage
