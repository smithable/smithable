smithable: 0.1
app:
  name: SweetStock
  description: Track ingredients, suppliers and stock levels for a small bakery.
  timezone: Europe/London
models:
  Supplier:
    fields:
      name: string!
      contact: string
      email: email
      phone: phone
      address: text
  Ingredient:
    fields:
      name: string!
      summary: text
      unit: kg | g | l | ml | item
      currentStock:
        type: decimal!
        description: The amount of this ingredient currently in stock, in its unit (kg, g, l, ml or item).
      minimumStock: decimal!
      supplier: Supplier
pages:
  suppliers:
    crud: Supplier
  ingredients:
    crud: Ingredient
    search: [name]
    filters: [supplier]
  home:
    route: /
    landing:
      hero:
      footer:
