smithable: 0.1
app:
  name: Bakery Inventory
  description: Track ingredients, suppliers and stock levels for a small bakery.
  timezone: Europe/Mariehamn
models:
  Supplier:
    fields:
      name: string!
      contact: string!
      email: email
      phone: phone
      address: text
  Ingredient:
    fields:
      name: string!
      summary: text
      quantity: decimal!
      unit: string!
      minimumStock: decimal!
      supplier: Supplier!
      lastUpdated: date! = TODAY()
pages:
  suppliers:
    crud: Supplier
  team:
    users: manage
  ingredients:
    crud: Ingredient
    filters: [supplier]
    actions: [restock]
navigation: [ingredients, suppliers]
actions:
  restock:
    on: Ingredient
    set:
      quantity:
      lastUpdated: TODAY()
    intent: Update the stock level when restocking an ingredient.
