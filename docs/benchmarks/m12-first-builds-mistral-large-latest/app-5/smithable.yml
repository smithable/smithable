smithable: 0.1
app:
  name: Bakery Inventory
  description: Track ingredients, suppliers and stock levels for a small bakery.
  timezone: Europe/Mariehamn
models:
  Supplier:
    fields:
      name: string!
      contact: string
      email: email
      phone: phone
      address: text
    access:
      create: [manager]
      write: [manager]
      delete: [manager]
  Ingredient:
    fields:
      name: string!
      description: text
      supplier: Supplier
      unit: string! = kg
      stock: decimal!
      minimumStock: decimal = 5
      costPerUnit: money
pages:
  ingredients:
    crud: Ingredient
    search: [name, description]
    filters: [supplier]
    sortable: [name, stock, costPerUnit]
  suppliers:
    crud: Supplier
  team:
    users: manage
navigation: [ingredients, suppliers, team]
