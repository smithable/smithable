smithable: 0.1
app:
  name: IT Help Desk
  description: Tickets from users, assigned and tracked by the IT team.
models:
  Ticket:
    fields:
      subject: string!
      requesterEmail:
        type: email!
        locked: true
      status: open | inProgress | resolved | closed | reopened
      priority:
        type: int!
        min: 1
        max: 5
        default: 3
      assignee:
        type: User
        required:
          status: [inProgress, resolved, closed]
      body: text
      attachments: files
      messages: Message[]
  Message:
    fields:
      content: text!
      sender: agent | requester
      agent:
        type: User
        by: app
        default: ME()
      fromEmail: email
      attachments: files
      ticket: Ticket!
pages:
  tickets:
    crud: Ticket
    search: [subject, requesterEmail]
    filters: [status, priority, assignee]
    sortable: [priority, createdAt]
    actions: [assignToMe, assignTo, startWork, resolve, close, reopen]
  team:
    users: manage
navigation: [tickets, team]
actions:
  assignToMe:
    on: Ticket
    set:
      assignee: ME()
    intent: "Take the ticket: you become its assignee."
  assignTo:
    on: Ticket
    set:
      assignee:
    intent: Give the ticket to an agent, chosen from the team.
  startWork:
    on: Ticket
    when:
      status: [open, reopened]
    set:
      status: inProgress
    intent: Someone is working on the ticket now; it needs an assignee.
  resolve:
    on: Ticket
    when:
      status: [open, inProgress, reopened]
    set:
      status: resolved
    intent: The issue is fixed; the requester can confirm.
  close:
    on: Ticket
    when:
      status: [resolved]
    set:
      status: closed
    intent: The requester is satisfied; the ticket is closed.
  reopen:
    on: Ticket
    when:
      status: [resolved, closed]
    set:
      status: reopened
    intent: The ticket needs more work after all.
outgoing:
  ticketReceived:
    when: Ticket created
    to: mail
    recipient: requesterEmail
  replySent:
    when: Message created
    where:
      sender: agent
    to: mail
    recipient: ticket.requesterEmail
