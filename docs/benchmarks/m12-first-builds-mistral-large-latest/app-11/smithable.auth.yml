smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  member: { pages: all, create: all }
assistant:
  for: signed-in
public:
  pages: [home]
  read: [Component, { Incident: { where: { status: [investigating, identified, monitoring, resolved] } } }, IncidentUpdate, Maintenance]
api:
  models: [Component, Incident]
  actions: [resolve]
  assistants: true
admins: [johan@smithable.ai]
