smithable: 0.1
app:
  name: Conference Connect
  description: "Event registration for a conference: talks, speakers and attendees."
models:
  Talk:
    fields:
      title: string!
      description: markdown
      startsAt: datetime!
      endsAt: datetime!
      location: string!
      capacity: int! = 100
      attendees: Attendee[]
      spotsLeft:
        type: int
        formula: capacity - COUNT(attendees)
  Speaker:
    fields:
      name: string!
      bio: markdown
      portrait: picture
  Attendee:
    fields:
      name: string!
      email: email!
      company: string
      talk: Talk!
      registeredAt:
        type: datetime
        by: app
        default: NOW()
    capacity:
      per: talk
      max: talk.capacity
  Message:
    fields:
      name: string!
      email: email!
      message: text!
pages:
  talks:
    crud: Talk
  speakers:
    crud: Speaker
  attendees:
    crud: Attendee
  home:
    route: /
    landing:
      hero:
      footer:
      featured-speakers:
        records: Speaker
      faq:
      contact:
        form: Message
  privacy:
    route: /privacy
    legal: privacy
outgoing:
  registrationConfirmed:
    when: Attendee created
    to: mail
    recipient: email
