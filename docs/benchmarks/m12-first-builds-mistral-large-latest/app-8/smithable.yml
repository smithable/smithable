smithable: 0.1
app:
  name: Conference Registration
  description: Manage talks, speakers and attendees for a conference.
  timezone: Europe/Mariehamn
models:
  Speaker:
    fields:
      name: string!
      bio: text
      email: email!
      phone: phone
      website: url
      picture: picture
  Talk:
    fields:
      title: string!
      description: text
      startsAt: datetime!
      endsAt: datetime!
      speaker: Speaker!
      room: string
      status: draft | scheduled | canceled
      capacity: int! = 100
  Attendee:
    fields:
      name: string!
      email: email!
      phone: phone
      company: string
      ticket: standard | vip
  Registration:
    fields:
      attendee: Attendee!
      talk: Talk!
      registeredAt: datetime! = NOW()
      status: confirmed | canceled
    capacity:
      per: talk
      max: talk.capacity
      where:
        status: confirmed
pages:
  talks:
    crud: Talk
    actions: [cancelTalk]
  speakers:
    crud: Speaker
  attendees:
    crud: Attendee
  registrations:
    crud: Registration
    actions: [cancelRegistration]
  home:
    route: /
    landing:
      hero:
      footer:
      talks:
        records: Talk
        where:
          status: scheduled
      speakers:
        records: Speaker
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  cancelTalk:
    on: Talk
    when:
      status: scheduled
    set:
      status: canceled
    intent: Cancel a scheduled talk.
  cancelRegistration:
    on: Registration
    when:
      status: confirmed
    set:
      status: canceled
    intent: Cancel a confirmed registration.
