smithable: 0.1
app:
  name: Conference Connect
  description: "Event registration for a conference: talks, speakers and attendees."
  timezone: Europe/Helsinki
models:
  Talk:
    fields:
      title: string!
      description: text
      summary: text
      startsAt: datetime!
      endsAt: datetime!
      room: string
      capacity: int! = 50
      status: draft | scheduled | cancelled
      cover: picture
      speaker: Speaker!
      attendees: Attendee[]
  Speaker:
    fields:
      name: string!
      bio: markdown
      portrait: picture
  Attendee:
    fields:
      talk: Talk! unique
      participant: User
      registeredAt:
        type: datetime
        formula: NOW()
    ownedBy: participant
    capacity:
      per: talk
      max: talk.capacity
      closes: talk.startsAt
      cancelUntil: talk.startsAt
pages:
  talks:
    crud: Talk
    actions: [cancelTalk, scheduleTalk]
  speakers:
    crud: Speaker
  my-attendance:
    crud: Attendee
  home:
    route: /
    landing:
      hero:
        button: talks
        secondButton: speakers
      upcoming-talks:
        records: Talk
        where:
          status: scheduled
      featured-speakers:
        records: Speaker
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  cancelTalk:
    on: Talk
    when:
      status: scheduled
    set:
      status: cancelled
  scheduleTalk:
    on: Talk
    when:
      status: draft
    set:
      status: scheduled
navigation: [home, talks, speakers, my-attendance]
