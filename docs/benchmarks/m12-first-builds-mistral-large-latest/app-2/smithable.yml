smithable: 0.1
app:
  name: SalesFlow CRM
  description: Lightweight CRM for a small B2B sales team.
  currency: EUR
  timezone: Europe/London
models:
  Company:
    fields:
      name: string!
      email: email unique
      phone: phone
      segment: smb | enterprise | government
      creditLimit:
        type: money
        min: 0
        description: Maximum outstanding balance before new deals are held.
      notes: text
      accountManager: User
      contacts: Contact[]
      deals: Deal[]
      followUps: FollowUp[]
    ownedBy: accountManager
  Contact:
    fields:
      firstName: string!
      lastName: string!
      email: email unique
      phone: phone
      company: Company!
      title: string
      notes: text
      followUps: FollowUp[]
    ownedBy: company
  Deal:
    fields:
      title: string!
      company: Company!
      contact: Contact
      status: prospect | negotiation | closedWon | closedLost
      amount: money!
      expectedCloseDate: date
      notes: text
      followUps: FollowUp[]
    ownedBy: company
  FollowUp:
    fields:
      company: Company
      contact: Contact
      deal: Deal
      dueOn: date! = TODAY()
      done: bool
      note: text
    unique: [{ fields: [company, contact, deal], scope: owner }]
    ownedBy: company
pages:
  companies:
    crud: Company
    search: [name, email]
    sortable: [name, createdAt]
    actions: [mergeCompanies]
  contacts:
    crud: Contact
    search: [firstName, lastName, email, company]
    sortable: [lastName, createdAt]
  deals:
    crud: Deal
    search: [title, company, contact]
    filters: [status]
    sortable: [expectedCloseDate, amount, createdAt]
  follow-ups:
    crud: FollowUp
    search: [company, contact, note]
    filters: [done]
    sortable: [dueOn]
  team:
    users: manage
  start:
    dashboard:
      companies:
        count: Company
      openDeals:
        count: Deal
        where:
          status: [prospect, negotiation]
      followUpsDue:
        list: FollowUp
        where:
          done: false
        limit: 10
actions:
  mergeCompanies:
    merge: Company
  scheduleFollowUps:
    custom: true
    input:
      company: Company!
      contact: Contact
      deal: Deal
      count: int!
      everyDays: int!
    output:
      created: int!
    intent: Plan a series of follow-up notes for a company, contact or deal, one every so many days.
    touches:
      reads: [Company, Contact, Deal, FollowUp]
      writes: [FollowUp]
navigation: [start, companies, contacts, deals, follow-ups, team]
