smithable: 0.1
app:
  name: Sales Team CRM
  description: A lightweight CRM for managing companies, contacts, deals, and follow-ups.
  currency: EUR
  timezone: Europe/London
models:
  Company:
    fields:
      name: string!
      email: email unique
      phone: phone
      segment: smb | enterprise | government
      website: url
      notes: text
      accountManager: User
      contacts: Contact[]
    ownedBy: accountManager
    access:
      delete: [admin]
  Contact:
    fields:
      firstName: string!
      lastName: string!
      email: email!
      phone: phone
      position: string
      company: Company!
      notes: text
    access:
      delete: [admin]
  FollowUp:
    fields:
      dueDate: date!
      notes: text
      completed: bool = false
      completedAt: datetime
      deal: Deal!
    access:
      delete: [admin]
      write: [sales]
  Deal:
    fields:
      name: string!
      company: Company!
      contact: Contact
      amount: money
      stage:
        type: lead | prospect | proposal | negotiation | closedWon | closedLost
        default: lead
      expectedCloseDate: date
      probability: int = 50
      notes: text
    access:
      write: [sales]
      delete: [admin]
pages:
  companies:
    crud: Company
    search: [name, email]
  contacts:
    crud: Contact
    search: [firstName, lastName, email]
  team:
    users: manage
  deals:
    crud: Deal
    search: [name, company]
    filters: [stage, company]
    sortable: [name, amount, expectedCloseDate]
    actions: [loseDeal]
actions:
  markFollowUpComplete:
    on: FollowUp
    when:
      completed: false
    set:
      completed: true
      completedAt: NOW()
    intent: Mark a follow-up as completed.
  loseDeal:
    on: Deal
    when:
      stage: [lead, prospect, proposal, negotiation]
    set:
      stage: closedLost
    intent: Mark a deal as lost.
navigation: [companies, contacts, deals, team]
