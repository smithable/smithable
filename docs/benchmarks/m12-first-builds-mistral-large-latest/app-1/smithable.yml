smithable: 0.1
app:
  name: Yoga Studio Booking
  description: Class schedule and online booking for a yoga studio.
models:
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      sessions: Session[]
  Session:
    fields:
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
  Booking:
    fields:
      session: Session! unique
    capacity:
      per: session
      max: session.capacity
  Post:
    fields:
      title: string!
      address: string unique
      summary: text
      cover: picture
      body: markdown!
      publishedOn: date
      status: draft | published
  Message:
    fields:
      name: string!
      email: email!
      message: text!
pages:
  sessions:
    crud: Session
  instructors:
    crud: Instructor
  messages:
    crud: Message
  posts:
    crud: Post
    filters: [status]
  my-bookings:
    crud: Booking
  home:
    route: /
    landing:
      hero:
      footer:
      estimate:
        custom: EstimateCalculator
      gallery:
      faq:
      news:
        records: Post
        where:
          status: published
      contact:
        form: Message
  schedule:
    calendar: Session
  blog:
    articles: Post
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
outgoing:
  bookingMade:
    when: Booking created
    to: mail
    recipient: owner
  bookingChanged:
    when: Booking changed
    to: mail
    recipient: owner
  bookingCancelled:
    when: Booking deleted
    to: mail
    recipient: owner
