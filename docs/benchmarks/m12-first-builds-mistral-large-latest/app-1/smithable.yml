smithable: 0.1
app:
  name: Harmony Yoga Studio
  description: Class schedule and online booking for a yoga studio in the city center.
  currency: EUR
  timezone: Europe/Berlin
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level:
        type: beginner | allLevels | advanced | prenatal
        default: allLevels
      durationMinutes: int! = 75
    access:
      create: [admin]
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
    access:
      create: [admin]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 15
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
    access:
      create: [admin]
  Booking:
    fields:
      session: Session! unique
    capacity:
      per: session
      max: session.capacity
  Post:
    fields:
      title: string!
      address: string unique
      summary: text
      cover: picture
      body: markdown!
      publishedOn: date
      status: draft | published
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Message:
    fields:
      name: string!
      email: email!
      message: text!
    access:
      read: [admin]
      write: [admin]
      delete: [admin]
pages:
  schedule:
    crud: Session
  sessions:
    crud: Session
    access: [admin]
  class-types:
    crud: ClassType
    access: [admin]
  instructors:
    crud: Instructor
    access: [admin]
  blog:
    crud: Post
  posts:
    crud: Post
    access: [admin]
  my-bookings:
    crud: Booking
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule, blog]
      footer:
      classes:
        records: ClassType
      estimate:
        custom: PassCalculator
      gallery:
      faq:
      callToAction:
      news:
        records: Post
        where:
          status: published
      contact:
        form: Message
