smithable: 0.1
app:
  name: Harmony Yoga Studio
  description: Class schedule and online booking for a yoga studio.
  currency: USD
  timezone: America/New_York
models:
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      sessions: Session[]
  Session:
    fields:
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
      classType: ClassType!
    namedBy: [classType, startsAt]
  Booking:
    fields:
      session: Session! unique
      attendee: User
    ownedBy: attendee
    capacity:
      per: session
      max: session.capacity
      closes: session.startsAt
      cancelUntil: session.startsAt
  Post:
    fields:
      title: string!
      address: string unique
      summary: text
      cover: picture
      body: markdown!
      publishedOn: date
      status: draft | published
  Message:
    fields:
      name: string!
      email: email!
      message: text!
  ClassType:
    fields:
      name: string!
      summary: text
      level: beginner | allLevels | advanced
      durationMinutes: int! = 60
actions:
  publish:
    on: Post
    when:
      status: draft
    set:
      status: published
    intent: The post is out for everyone to read.
pages:
  schedule:
    crud: Session
  sessions:
    crud: Session
    sortable: [startsAt, capacity]
    filters: [classType, instructor, startsAt]
    defaultFilter:
      startsAt: upcoming
  instructors:
    crud: Instructor
  messages:
    crud: Message
  blog:
    crud: Post
  home:
    route: /
    landing:
      hero:
        button: schedule
        secondButton: blog
      estimate:
        custom: MonthlyPassCalculator
      gallery:
      faq:
      callToAction:
        button: schedule
      news:
        records: Post
      contact:
        form: Message
      classes:
        records: ClassType
      footer:
  about:
    sections:
      intro:
        text:
      story:
        mediaText:
      team:
        records: Instructor
      faq:
  privacy:
    route: /privacy
    legal: privacy
  posts:
    crud: Post
    filters: [status]
  my-bookings:
    crud: Booking
    sections:
      cancelling:
        text:
  bookings:
    crud: Booking
    filters: [session.startsAt, session.classType]
    defaultFilter:
      session.startsAt: today
  admin:
    data: all
  class-types:
    crud: ClassType
navigation:
  main: [schedule, sessions, instructors, messages, blog, home, about, privacy, posts, my-bookings, bookings, admin, class-types]
  schedule: [schedule, my-bookings, sessions, bookings]
  messages: [messages]
  website: [blog, about, posts, home]
  admin: [admin]
  studioSetup: [class-types, instructors]
timers:
  morning:
    every: day
    at: 06:30
  remind:
    on: Booking
    at: 1 day before session.startsAt
  publish:
    on: Post
    at: publishedOn
    where:
      status: draft
    run: publish
outgoing:
  reminder:
    when: remind
    to: mail
    recipient: owner
  bookingMade:
    when: Booking created
    to: mail
    recipient: owner
  bookingChanged:
    when: Booking changed
    to: mail
    recipient: owner
  bookingCancelled:
    when: Booking deleted
    to: mail
    recipient: owner
  sessionMoved:
    when: Session changed
    fields: [startsAt]
    to: mail
    recipient: bookings.owner
    show: [classType, startsAt, instructor]
    previous: true
  todaysBookings:
    when: morning
    to: mail
    recipient: admin
    list:
      model: Booking
      when: session.startsAt
      within: today
      columns: [session, attendee]
