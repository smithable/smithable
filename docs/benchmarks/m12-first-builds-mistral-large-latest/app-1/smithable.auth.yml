smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  staff:
    description: Reception. Manages the schedule, bookings, and messages.
    pages: [sessions, bookings, messages]
    read: [Session, Booking, Message]
    create: [Session, Booking]
    write: [Session, Booking]
    delete: [Booking]
  member:
    description: A student who books classes.
    pages: [my-bookings]
    create: [Booking]
assistant:
  for: signed-in
public:
  pages: [home, schedule, blog, about, privacy]
  read: [Instructor, Session, { Post: { where: { status: published } } }, ClassType]
  create: [Message]
defaultRole: member
admins: [johan@smithable.ai]
