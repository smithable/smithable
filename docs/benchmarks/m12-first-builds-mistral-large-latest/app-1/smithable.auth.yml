smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin:
    description: Studio staff. Manage the schedule, classes and teachers.
  member:
    description: A student who books classes.
    pages: [my-bookings]
    create: [Booking]
assistant:
  for: signed-in
public:
  pages: [home, schedule, blog, about, privacy]
  create: [Message]
  read: [ClassType, Instructor, Session, { Post: { where: { status: published } } }]
defaultRole: member
admins: [johan@smithable.ai]
