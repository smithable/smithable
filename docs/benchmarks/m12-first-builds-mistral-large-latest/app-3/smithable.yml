smithable: 0.1
app:
  name: Freelance Invoicing
  description: Manage clients, invoices and payments as a freelancer.
  currency: EUR
models:
  BusinessProfile:
    fields:
      businessName: string!
      vatNumber: string
      iban: string
      paymentTermDays: int! = 30
      invoiceFooter: text
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      invoice: Invoice!
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      status: draft | sent | paid | overdue
      contract: file
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
pages:
  clients:
    crud: Client
  invoice-lines:
    crud: InvoiceLine
  settings:
    crud: BusinessProfile
  invoices:
    crud: Invoice
    filters: [client, status]
    actions: [markSent, markPaid, markOverdue]
  overview:
    dashboard:
      latest:
        list: Invoice
        limit: 5
      outstanding:
        sum: Invoice.total
        where:
          status: sent
      overdue:
        sum: Invoice.total
        where:
          status: overdue
      paid:
        sum: Invoice.total
        where:
          status: paid
      invoiced:
        sum: Invoice.total
        by: issuedOn
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice.
  markOverdue:
    on: Invoice
    when:
      status: sent
    set:
      status: overdue
    intent: The invoice is late.
outgoing:
  invoiceSent:
    when: markSent
    to: mail
    recipient: client.email
