smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  member:
    description: Can view and create shopping lists.
    pages: all
    create: [ShoppingList]
    write: [ShoppingList]
    delete: [ShoppingList]
assistant:
  for: signed-in
public:
  pages: [home, recipes]
  read: [Recipe]
defaultRole: member
admins: [johan@smithable.ai]
