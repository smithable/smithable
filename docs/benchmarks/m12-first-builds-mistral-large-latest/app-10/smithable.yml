smithable: 0.1
app:
  name: Family Recipes
  description: A place to keep and share family recipes and shopping lists.
models:
  Recipe:
    fields:
      name: string!
      summary: text
      ingredients: text!
      instructions: markdown!
      prepTime: int = 0
      cookTime: int = 0
      servings: int = 1
      category: breakfast | lunch | dinner | dessert | snack | drink
      difficulty: easy | medium | hard
      favorite: bool = false
      addedOn: date! = TODAY()
  ShoppingList:
    fields:
      name: string!
      items: text!
      completed: bool = false
  Ingredient:
    fields:
      name: string!
      quantity: string
      unit: string
      recipe: Recipe!
pages:
  recipes:
    crud: Recipe
  shopping-lists:
    crud: ShoppingList
  home:
    route: /
    landing:
      hero:
      footer:
      featured-recipes:
        records: Recipe
        where:
          favorite: true
      recent-recipes:
        records: Recipe
      call-to-action:
        button: recipes
        callToAction:
  privacy:
    route: /privacy
    legal: privacy
navigation: [home, recipes, shopping-lists]
