smithable: 0.1
app:
  name: Family Recipes
  description: A place to keep our family's recipes and shopping lists.
models:
  Recipe:
    fields:
      name: string!
      description: text
      servings: int = 4
      prepTime: int
      cookTime: int
      difficulty: easy | medium | hard
      category: breakfast | lunch | dinner | dessert | snack | drink
      ingredients: text!
      instructions: text!
      notes: text
      addedOn: date! = TODAY()
      isFavorite: bool = false
      image: url
  ShoppingList:
    fields:
      name: string! = "Weekly Shopping"
      items: text!
      completed: bool = false
  Ingredient:
    fields:
      name: string!
      quantity: decimal
      unit: string
      recipe: Recipe!
      isPurchased: bool = false
pages:
  recipes:
    crud: Recipe
    favorites: true
    search: [name, description, ingredients]
    filters: [category, difficulty]
    sortable: [name, addedOn, prepTime, cookTime]
  shopping-lists:
    crud: ShoppingList
  home:
    route: /
    landing:
      hero:
      footer:
      featured-recipes:
        records: Recipe
        where:
          isFavorite: true
navigation: [home, recipes, shopping-lists]
