smithable: 0.1
app:
  name: Family Recipes
  description: A place to keep and share family recipes and shopping lists.
  timezone: Europe/Mariehamn
models:
  ShoppingList:
    fields:
      name: string!
      items: text!
      completed: bool = false
      forRecipe: Recipe
  Recipe:
    fields:
      name: string!
      description: text
      ingredients: text!
      instructions: markdown!
      prepTime: int
      cookTime: int
      servings: int
      category: starter | main | dessert | side | snack | drink
      difficulty: easy | medium | hard
      favorite: bool = false
      tags: string
pages:
  shopping-lists:
    crud: ShoppingList
  home:
    route: /
    landing:
      hero:
      footer:
      featured-recipes:
        records: Recipe
        where:
          favorite: true
  privacy:
    route: /privacy
    legal: privacy
  recipes:
    crud: Recipe
navigation: [home, recipes, shopping-lists]
