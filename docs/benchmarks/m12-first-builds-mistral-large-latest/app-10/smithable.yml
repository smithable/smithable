smithable: 0.1
app:
  name: Family Recipes
  description: A collection of family recipes with ingredients and shopping lists.
  timezone: Europe/Mariehamn
models:
  Ingredient:
    fields:
      name: string!
      amount: decimal
      unit: string
    description: An ingredient of a recipe, with amount and unit.
  ShoppingList:
    fields:
      name: string!
      createdOn: date! = TODAY()
      completed: bool = false
    description: A list of ingredients to buy.
  ShoppingListItem:
    fields:
      ingredient: Ingredient!
      amount: decimal
      unit: string
      list: ShoppingList!
      purchased: bool = false
    description: An item on a shopping list, linked to a recipe's ingredient.
  Recipe:
    fields:
      name: string!
      summary: string
      kind: general | favorite
      link: url
      addedOn: date! = TODAY()
      servings: int! = 4
      prepTime: int
      cookTime: int
      instructions: markdown!
      recipeIngredients: RecipeIngredient[]
    description: A recipe with ingredients and instructions.
  RecipeIngredient:
    fields:
      recipe: Recipe!
      ingredient: Ingredient!
      amount: decimal
      unit: string
pages:
  ingredients:
    crud: Ingredient
  shopping-lists:
    crud: ShoppingList
  shopping-list-items:
    crud: ShoppingListItem
  home:
    route: /
    landing:
      hero:
        button: recipes
      featured:
        records: Recipe
        where:
          kind: favorite
      footer:
  privacy:
    route: /privacy
    legal: privacy
  recipes:
    crud: Recipe
navigation: [recipes, shopping-lists]
