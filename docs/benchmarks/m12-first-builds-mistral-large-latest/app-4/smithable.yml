smithable: 0.1
app:
  name: NeighborTools
  description: Borrow and lend tools with your neighbors.
models:
  Tool:
    fields:
      name: string!
      photo: picture!
      description: text!
      category: gardening | woodworking | cleaning | power | hand | other
      condition: new | likeNew | good | worn
      location: string
      available: bool = true
    review: [photo]
pages:
  tools:
    crud: Tool
    search: [name, description, location]
    filters: [category, condition, available]
    sortable: [name, createdAt]
    favorites: true
    contact: owner
  home:
    route: /
    landing:
      hero:
      footer:
      latest:
        records: Tool
        where:
          available: true
  privacy:
    route: /privacy
    legal: privacy
  myTools:
    crud: Tool
    mine: true
  saved:
    crud: Tool
    favorites: only
