smithable: 0.1
app:
  name: NeighborTools
  description: A tool library where neighbors lend each other tools.
  timezone: Europe/Helsinki
models:
  Tool:
    fields:
      name: string!
      photos: pictures!
      description: text!
      category: gardening | woodworking | cleaning | kitchen | power | hand | other
      condition: new | likeNew | good | worn
      location: string
      available: bool = true
    review: [photos]
  Loan:
    fields:
      tool: Tool!
      borrower: User!
      borrowedAt: datetime = NOW()
      dueAt: datetime
      returnedAt: datetime
      status: requested | approved | returned
pages:
  tools:
    crud: Tool
    search: [name, description, location]
    filters: [category, condition, available]
    sortable: [name, createdAt]
    favorites: true
  loans:
    crud: Loan
    actions: [approveLoan, returnTool]
  home:
    route: /
    landing:
      hero:
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
  admin:
    data: all
actions:
  approveLoan:
    on: Loan
    when:
      status: requested
    set:
      status: approved
  returnTool:
    on: Loan
    when:
      status: approved
    set:
      status: returned
      returnedAt: NOW()
outgoing:
  loanRequested:
    when: Loan created
    where:
      status: requested
    to: mail
    recipient: owner
  loanApproved:
    when: approveLoan
    to: mail
    recipient: borrower
  loanDueSoon:
    when: Loan changed
    where:
      status: approved
    fields: [dueAt]
    to: mail
    recipient: borrower
