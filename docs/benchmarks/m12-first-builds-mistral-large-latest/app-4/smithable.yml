smithable: 0.1
app:
  name: NeighborTools
  description: A tool library where neighbors lend each other tools.
models:
  Tool:
    fields:
      name: string!
      photos: pictures!
      description: text!
      category: gardening | woodworking | plumbing | electrical | automotive | cleaning | other
      condition: new | likeNew | good | worn | broken
      location: string
      available: bool = true
      borrower:
        type: User
        locked:
          available: false
      dueBack: date
  Borrowing:
    fields:
      tool: Tool!
      borrower: User!
      borrowedOn: date = TODAY()
      dueBack: date!
      returnedOn: date
      notes: text
pages:
  tools:
    crud: Tool
  myTools:
    crud: Tool
  borrowings:
    crud: Borrowing
  home:
    route: /
    landing:
      hero:
      footer:
      availableTools:
        records: Tool
        where:
          available: true
  privacy:
    route: /privacy
    legal: privacy
navigation: [tools, myTools, borrowings]
actions:
  borrow:
    on: Tool
    when:
      available: true
    set:
      available: false
      borrower: ME()
      dueBack:
    add:
      Borrowing:
        borrower: ME()
        dueBack:
    intent: Mark a tool as borrowed and create a borrowing record.
  returnTool:
    on: Tool
    when:
      available: false
    set:
      available: true
      borrower:
      dueBack:
    intent: Mark a tool as returned and available.
