smithable: 0.1
app:
  name: NeighborTools
  description: A tool library where neighbors lend each other tools.
models:
  Tool:
    fields:
      name: string!
      photos: pictures!
      description: text!
      category: gardening | woodworking | automotive | cleaning | power | hand | other
      condition: new | likeNew | good | worn
      location: string!
      available: bool = true
      borrower: User
      dueBack: date
    review: [photos]
pages:
  catalog:
    crud: Tool
    search: [name, description, location]
    filters: [category, condition, available]
    sortable: [name, createdAt]
    favorites: true
    contact: owner
  home:
    route: /
    landing:
      hero:
      footer:
      latest:
        records: Tool
        where:
          available: true
  privacy:
    route: /privacy
    legal: privacy
  myTools:
    crud: Tool
    mine: true
  review:
    review: all
navigation: [catalog, myTools, review]
actions:
  return:
    on: Tool
    when:
      available: false
    set:
      available: true
      borrower:
      dueBack:
    intent: Mark this tool as returned and available again.
  borrow:
    on: Tool
    when:
      available: true
    set:
      available: false
      borrower: ME()
      dueBack: DATEADD(TODAY(), 7, "day")
    intent: Mark this tool as borrowed by me for one week.
