smithable: 0.1
app:
  name: Union Jobs
  description: Find and post union jobs in your area.
  timezone: Europe/Helsinki
models:
  JobPost:
    fields:
      title: string!
      description: markdown!
      category: construction | healthcare | education | transportation | hospitality | other
      location: string!
      wage: money
      hours: string
      contactEmail: email!
      contactPhone: phone
      postedAt:
        type: datetime
        by: app
        default: NOW()
      expiresAt: date
      filled: bool = false
    ownedBy: contactEmail
  Application:
    fields:
      job: JobPost!
      name: string!
      email: email!
      phone: phone
      resume: file
      coverLetter: text
      appliedAt:
        type: datetime
        by: app
        default: NOW()
      status: pending | reviewed | interviewed | rejected | hired
    ownedBy: email
pages:
  jobPosts:
    crud: JobPost
    search: [title, description, location]
    filters: [category, wage, filled]
    sortable: [wage, postedAt]
    favorites: true
  myApplications:
    crud: Application
  home:
    route: /
    landing:
      hero:
      latest:
        records: JobPost
        where:
          filled: false
      callToAction:
        button: jobPosts
      footer:
  privacy:
    route: /privacy
    legal: privacy
navigation: [jobPosts, myApplications]
