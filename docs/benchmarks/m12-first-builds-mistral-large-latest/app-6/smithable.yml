smithable: 0.1
app:
  name: Union Jobs
  description: Job posts and applications for union members and local employers.
pages:
  home:
    route: /
    landing:
      hero:
      footer:
      latest:
        records: JobPost
        where:
          status: open
  jobs:
    crud: JobPost
    search: [title, description, location]
  my-jobs:
    crud: JobPost
    mine: true
models:
  JobPost:
    fields:
      title: string!
      description: text!
      category: construction | healthcare | education | transportation | hospitality | other
      location: string!
      wage: money
      hours: fullTime | partTime | temporary | seasonal
      contactEmail: email!
      contactPhone: phone
      postedBy: User!
      status: open | closed
      applications: JobApplication[]
    ownedBy: postedBy
  JobApplication:
    fields:
      job: JobPost!
      name: string!
      email: email!
      phone: phone
      message: text
      resume: picture
      status: submitted | reviewed | interviewed | rejected | hired
    access:
      create: [member]
actions:
  closeJob:
    on: JobPost
    when:
      status: open
    set:
      status: closed
    intent: Close a job post when it is no longer open.
  reopenJob:
    on: JobPost
    when:
      status: closed
    set:
      status: open
    intent: Reopen a job post when it is available again.
navigation: [jobs, my-jobs]
