smithableUx: 0.1
theme:
  preset: minimal
  density: comfortable
  brand:
    primary: "#2563eb"
    font: Inter
pages:
  incidents:
    table:
      columns: [title, component, status, detectedAt, resolvedAt]
      sort: -detectedAt
  updates:
    table:
      sort: -at
tones:
  Component.status:
    operational: success
    degraded: warning
    down: danger
  Incident.status:
    resolved: success
