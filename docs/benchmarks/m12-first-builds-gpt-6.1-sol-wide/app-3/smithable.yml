smithable: 0.1
app:
  name: Salon Booking
  description: Online hair salon booking where customers choose a stylist and reserve an available appointment time.
models:
  ClassType:
    fields:
      name: string!
      summary: text
      durationMinutes: int! = 60
    access:
      create: [admin]
  Instructor:
    fields:
      name: string!
      bio: text
    access:
      create: [admin]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 1
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
    access:
      create: [admin]
  Booking:
    fields:
      session: Session! unique
    capacity:
      per: session
      max: session.capacity
pages:
  my-bookings:
    crud: Booking
  sessions:
    crud: Session
    access: [admin]
  class-types:
    crud: ClassType
    access: [admin]
  instructors:
    crud: Instructor
    access: [admin]
  schedule:
    calendar:
      model: Session
      starts: startsAt
  home:
    route: /
    landing:
      hero:
      footer:
      stylists:
        records: Instructor
      services:
        records: ClassType
