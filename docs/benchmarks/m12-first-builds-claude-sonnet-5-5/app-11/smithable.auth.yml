smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  staff:
    description: Writes incidents and their updates.
    pages: [overview, incidents, updates, maintenance]
    create: all
    write: all
assistant:
  for: signed-in
public:
  pages: [home, privacy]
  read: [Component, Incident, IncidentUpdate, Maintenance]
defaultRole: staff
api:
  models: [Component, Incident]
  actions: [resolve]
  assistants: true
admins: [johan@smithable.ai]
