smithable: 0.1
app:
  name: Local Museum Collection
  description: An online collection where visitors browse the museum's objects and read their stories.
models:
  Artifact:
    fields:
      title: string!
      story: markdown
      period: string
      origin: string
      category: painting | textile | tool | photograph | other
      image: picture
      featured: bool
pages:
  home:
    route: /
    landing:
      hero:
        button: collection
      objects:
        records: Artifact
        where:
          featured: true
      footer:
  collection:
    crud: Artifact
    search: [title, story]
    filters: [category]
