smithable: 0.1
app:
  name: Office Swap Shelf
  description: Colleagues offer things they no longer need and others claim them from the office shelf.
models:
  Item:
    fields:
      title: string!
      description: text
      photo: picture
      condition: likeNew | good | worn
      place: string
      status: available | claimed
      claimedBy: User
pages:
  shelf:
    crud: Item
    search: [title, description, place]
    filters: [condition, status]
    defaultFilter:
      status: available
  mine:
    crud: Item
    mine: true
  team:
    users: manage
actions:
  claim:
    on: Item
    when:
      status: available
    set:
      status: claimed
      claimedBy: ME()
