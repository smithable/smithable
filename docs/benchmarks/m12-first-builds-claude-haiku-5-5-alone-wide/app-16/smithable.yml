smithable: 0.1
app:
  name: Allotment Society
  description: Keeps track of which member holds which plot, the waiting list and each year's fee.
models:
  Member:
    fields:
      name: string!
      email: email
      phone: phone
      joinedOn: date! = TODAY()
  Plot:
    fields:
      number: string! unique
      status: let | free
      holder: Member
      notes: text
  WaitingEntry:
    fields:
      name: string!
      email: email
      phone: phone
      requestedOn: date! = TODAY()
      status: waiting | offered | withdrawn
      note: text
  Fee:
    fields:
      member: Member!
      year: int! = 2026
      amount: money
      status: due | paid
      paidOn: date
pages:
  plots:
    crud: Plot
    filters: [status]
  members:
    crud: Member
    search: [name, email]
  waiting-list:
    crud: WaitingEntry
  fees:
    crud: Fee
    filters: [status, year]
  team:
    users: manage
