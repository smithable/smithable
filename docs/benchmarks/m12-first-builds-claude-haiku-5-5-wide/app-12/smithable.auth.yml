smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  staff:
    description: Writes incidents and their updates.
    pages: [overview, incidents]
    create: [Incident, IncidentUpdate]
    write: all
    actions: all
assistant:
  for: signed-in
public:
  pages: [home]
  read: [Component, Incident, IncidentUpdate]
defaultRole: staff
admins: [johan@smithable.ai]
