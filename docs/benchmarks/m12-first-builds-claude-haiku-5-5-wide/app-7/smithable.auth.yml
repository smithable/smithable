smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  member:
    description: Sells and saves items.
    pages: all
    create: all
assistant:
  for: signed-in
public:
  pages: [home, catalog, privacy]
  read: [{ Item: { where: { available: true } } }]
defaultRole: member
admins: [johan@smithable.ai]
