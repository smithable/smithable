smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  staff:
    description: "Works the incidents: opens them, posts updates and moves them on."
    pages: [services, incidents, overview]
    create: all
    write: all
    actions: [identified, monitoring, resolve]
assistant:
  for: signed-in
defaultRole: staff
admins: [johan@smithable.ai]
