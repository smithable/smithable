smithable: 0.1
app:
  name: Byggkoll
  description: Håller koll på offerter, kunder och fakturor för en liten byggfirma.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Customer:
    fields:
      name: string!
      email: email
      phone: phone
      address: text
      quotes: Quote[]
      invoices: Invoice[]
  Quote:
    fields:
      number: string! unique
      customer: Customer!
      issuedOn: date! = TODAY()
      validUntil: date
      status: draft | sent | accepted | rejected
      workDescription: text
      lines: QuoteLine[]
      total:
        type: money
        formula: SUM(lines.amount)
  QuoteLine:
    fields:
      quote: Quote!
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      invoice: Invoice!
  Invoice:
    fields:
      number: string! unique
      customer: Customer!
      issuedOn: date! = TODAY()
      dueOn:
        type: date
        formula: DATEADD(issuedOn, 30, "day")
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
pages:
  quotes:
    crud: Quote
    filters: [status, customer]
    actions: [markQuoteSent, markQuoteAccepted]
  customers:
    crud: Customer
    search: [name]
  invoices:
    crud: Invoice
    filters: [status, customer]
    actions: [markInvoiceSent, markInvoicePaid]
  team:
    users: manage
actions:
  markQuoteSent:
    on: Quote
    when:
      status: draft
    set:
      status: sent
    intent: Offerten har skickats till kunden.
  markQuoteAccepted:
    on: Quote
    when:
      status: sent
    set:
      status: accepted
    intent: Kunden har accepterat offerten.
  markInvoiceSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: Fakturan har skickats till kunden.
  markInvoicePaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: Kunden har betalat fakturan.
