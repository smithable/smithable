smithable: 0.1
app:
  name: Clean Invoices
  description: One place for the cleaning company's monthly invoices to its household clients.
models:
  Household:
    fields:
      name: string!
      email: email!
      address: text
      invoices: Invoice[]
  Invoice:
    fields:
      number: string! unique
      household: Household!
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
  InvoiceLine:
    fields:
      invoice: Invoice!
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice was sent to the household.
  markPaid:
    on: Invoice
    when:
      status: sent
    set:
      status: paid
    intent: The household paid the invoice.
  duplicate:
    on: Invoice
    copy:
      status: draft
      number:
      issuedOn: TODAY()
    intent: Make next month's invoice from this one.
outgoing:
  invoiceSent:
    when: markSent
    to: mail
    recipient: household.email
pages:
  invoices:
    crud: Invoice
    filters: [status, household]
    search: [number]
    actions: [duplicate]
  households:
    crud: Household
  team:
    users: manage
