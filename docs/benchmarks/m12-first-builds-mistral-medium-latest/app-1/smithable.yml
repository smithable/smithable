smithable: 0.1
app:
  name: Yoga Studio Booking
  description: Class schedule and online booking for a yoga studio.
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: beginner | allLevels | advanced
      durationMinutes: int! = 60
    access:
      create: [admin]
  Instructor:
    fields:
      name: string!
      bio: text
      portrait: picture
    access:
      create: [admin]
  Post:
    fields:
      title: string!
      address: string unique
      summary: text
      cover: picture
      body: text!
      publishedOn: date
      status: draft | published
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Message:
    fields:
      name: string!
      email: email!
      message: text!
    access:
      read: [admin]
      write: [admin]
      delete: [admin]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Booking:
    fields:
      session: Session!
      member: User!
    capacity:
      per: session
      max: session.capacity
pages:
  team:
    users: manage
    access: [admin]
  class-types:
    crud: ClassType
    access: [admin]
  instructors:
    crud: Instructor
    access: [admin]
  posts:
    crud: Post
    access: [admin]
  messages:
    crud: Message
    access: [admin]
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule]
      footer:
      classes:
        records: ClassType
      gallery:
      faq:
      news:
        records: Post
      contact:
        form: Message
      callToAction:
        button: schedule
  admin:
    data: all
    access: [admin]
  sessions:
    crud: Session
    access: [admin]
  my-bookings:
    crud: Booking
    access: [member]
  schedule:
    calendar:
      model: Session
      starts: startsAt
navigation: [home, schedule, my-bookings]
