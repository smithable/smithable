smithable: 0.1
app:
  name: App
pages:
  admin:
    data: all
    access: [admin]
  team:
    users: manage
    access: [admin]
  class-types:
    crud: ClassType
    access: [admin]
  instructors:
    crud: Instructor
    access: [admin]
  sessions:
    crud: Session
    access: [admin]
  my-bookings:
    crud: Booking
    mine: true
  schedule:
    calendar:
      model: Session
      starts: startsAt
    access: [admin]
  home:
    route: /
    landing:
      hero:
      footer:
models:
  ClassType:
    fields:
      name: string!
      description: text
      duration: int! = 60
      level: beginner | intermediate | advanced
      price: money!
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Instructor:
    fields:
      name: string!
      bio: text
      photo: url
      email: email! unique
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      endsAt: datetime!
      maxCapacity: int! = 20
      bookings: Booking[]
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Booking:
    fields:
      session: Session!
      user: User!
      status: booked | attended | cancelled
      bookedAt: datetime = NOW()
navigation: [home, schedule, my-bookings, class-types, instructors, sessions]
