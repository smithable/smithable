smithable: 0.1
app:
  name: Yoga Studio Booking
  description: Class schedule and online booking for a yoga studio.
  timezone: UTC
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: beginner | allLevels | advanced
      durationMinutes: int! = 60
    access:
      create: [admin]
  Instructor:
    fields:
      name: string!
      bio: text
      portrait: picture
    access:
      create: [admin]
  Message:
    fields:
      name: string!
      email: email!
      message: text!
    access:
      read: [admin]
      write: [admin]
      delete: [admin]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft: int = capacity - COUNT(bookings)
    access:
      create: [admin]
  Booking:
    fields:
      session: Session!
      user: User!
    capacity:
      per: session
      max: session.capacity
pages:
  class-types:
    crud: ClassType
    access: [admin]
  instructors:
    crud: Instructor
    access: [admin]
  messages:
    crud: Message
    access: [admin]
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule]
      footer:
      classes:
        records: ClassType
      contact:
        form: Message
  sessions:
    crud: Session
    access: [admin]
  my-bookings:
    crud: Booking
  schedule:
    calendar:
      model: Session
      starts: startsAt
