smithable: 0.1
app:
  name: Yoga Studio
  description: Class schedule and online booking for a yoga studio.
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: beginner | allLevels | advanced
      durationMinutes: int! = 60
    access:
      create: [admin]
  Instructor:
    fields:
      name: string!
      bio: text
      portrait: picture
    access:
      create: [admin]
  Message:
    fields:
      name: string!
      email: email!
      message: text!
    access:
      read: [admin]
      write: [admin]
      delete: [admin]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
    access:
      create: [admin]
      delete: [admin]
  Booking:
    fields:
      session: Session!
      status: booked | attended | cancelled
    capacity:
      per: session
      max: session.capacity
      where:
        status: [booked, attended]
    access:
      create: [member, admin]
      delete: [member, admin]
pages:
  class-types:
    crud: ClassType
    access: [admin]
  instructors:
    crud: Instructor
    access: [admin]
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule]
      footer:
      classes:
        records: ClassType
      gallery:
      faq:
      contact:
        form: Message
      callToAction:
        button: schedule
  team:
    users: manage
  admin:
    data: all
  sessions:
    crud: Session
    access: [admin]
  my-bookings:
    crud: Booking
    mine: true
  schedule:
    calendar:
      model: Session
      starts: startsAt
