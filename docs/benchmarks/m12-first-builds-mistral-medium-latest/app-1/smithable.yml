smithable: 0.1
app:
  name: Yoga Studio Booking
  description: Class schedule and online booking for a yoga studio.
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: beginner | allLevels | advanced
      durationMinutes: int! = 60
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
  Booking:
    fields:
      session: Session! unique
    capacity:
      per: session
      max: session.capacity
  Post:
    fields:
      title: string!
      address: string unique
      summary: text
      cover: picture
      body: markdown!
      publishedOn: date
      status: draft | published
  Message:
    fields:
      name: string!
      email: email!
      message: text!
pages:
  sessions:
    crud: Session
  class-types:
    crud: ClassType
  instructors:
    crud: Instructor
  messages:
    crud: Message
  posts:
    crud: Post
  my-bookings:
    crud: Booking
  home:
    route: /
    landing:
      hero:
      footer:
      classes:
        records: ClassType
      gallery:
      faq:
      news:
        records: Post
      contact:
        form: Message
      estimate:
        custom: EstimateCalculator
  estimate:
    calculator:
      fields:
        classesPerMonth: int = 8
        dropIn: money = 16
        pass: money = 99
        withoutPass:
          type: money
          formula: classesPerMonth * dropIn
        saved:
          type: money
          formula: classesPerMonth * dropIn - pass
