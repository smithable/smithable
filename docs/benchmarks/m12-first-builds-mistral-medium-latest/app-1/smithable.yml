smithable: 0.1
app:
  name: App
  timezone: UTC
pages:
  admin:
    data: all
  team:
    users: manage
  class-types:
    crud: ClassType
    access: [admin]
  instructors:
    crud: Instructor
    access: [admin]
  sessions:
    crud: Session
    access: [admin]
  my-bookings:
    crud: Booking
    access: [member, admin]
    mine: true
    actions: [cancelBooking]
  home:
    route: /
    landing:
      hero:
      footer:
  schedule:
    calendar:
      model: Session
      starts: startsAt
models:
  ClassType:
    fields:
      name: string!
      description: text
      duration: int! = 60
      level: beginner | intermediate | advanced
      color: "string = #6366f1"
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Instructor:
    fields:
      name: string!
      bio: text
      photo: url
      email: email! unique
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      endsAt: datetime!
      capacity: int! = 20
      bookings: Booking[]
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Booking:
    fields:
      session: Session!
      member: User!
      status: booked | attended | cancelled
      bookedAt: datetime = NOW()
    capacity:
      per: session
      max: session.capacity
      where:
        status: [booked, attended]
navigation: [home, schedule, my-bookings]
actions:
  cancelBooking:
    on: Booking
    when:
      status: booked
    set:
      status: cancelled
    intent: Cancel this booking.
