smithableUx: 0.1
tones:
  Application.status:
    hired: success
    rejected: danger
  Job.status:
    open: success
    closed: danger
pages:
  jobs:
    table:
      sort: -postedAt
      view: cards
      columns: [title, company, location, type, salary, status]
    form:
      sections: [{ name: details, fields: [title, description, company, location] }, { name: compensation, fields: [salary, type] }]
  applications:
    table:
      columns: [job, name, email, status]
    form:
      sections: [{ name: job, fields: [job] }, { name: applicant, fields: [name, email, phone] }, { name: documents, fields: [resume, coverLetter] }]
