smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  member:
    description: Applies to jobs and manages own applications.
    pages: all
    create: all
  employer:
    description: Posts jobs and reviews applications.
    create: [JobPost]
    read: [Application]
    write: [Application]
assistant:
  for: signed-in
public:
  pages: [home, jobs]
defaultRole: member
admins: [johan@smithable.ai]
