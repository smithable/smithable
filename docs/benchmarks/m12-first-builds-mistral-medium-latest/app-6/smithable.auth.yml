smithableAuth: 0.1
signIn:
  providers: [google]
  selfSignUp: false
defaultAccess: shared
roles:
  employer:
    description: Posts job openings.
  member:
    description: Applies to jobs.
defaultRole: member
public:
  pages: [home, jobs]
  read: [{ Job: { where: { status: open } } }]
admins: [johan@smithable.ai]
