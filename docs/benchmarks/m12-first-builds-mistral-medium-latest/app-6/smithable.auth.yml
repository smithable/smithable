smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin:
    description: Manages the job board.
  member:
    description: Posts jobs and views applications.
defaultRole: member
public:
  pages: [home, jobs]
  read: [{ JobPost: { where: { status: open } } }]
admins: [johan@smithable.ai]
