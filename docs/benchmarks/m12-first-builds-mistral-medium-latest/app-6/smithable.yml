smithable: 0.1
app:
  name: Union Job Board
  description: A local union job board for posting and applying to jobs.
models:
  JobPost:
    fields:
      title: string!
      description: text!
      company: string!
      location: string
      salary: money
      type: fullTime | partTime | contract | temporary
      status: open | closed
      postedBy: User!
  Application:
    fields:
      jobPost: JobPost!
      applicantName: string!
      applicantEmail: email!
      resume: file
      coverLetter: text
      status: submitted | reviewed | rejected | hired
      appliedBy: User!
pages:
  jobs:
    crud: JobPost
    search: [title, description, company, location]
    filters: [type, status]
    sortable: [salary, createdAt]
    contact: owner
  applications:
    crud: Application
  myJobs:
    crud: JobPost
    mine: true
  myApplications:
    crud: Application
    mine: true
  home:
    route: /
    landing:
      hero:
      footer:
  privacy:
    route: /privacy
    legal: privacy
navigation: [jobs, myJobs, myApplications]
