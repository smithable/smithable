smithable: 0.1
app:
  name: Union Job Board
  description: A job board for a local union to post jobs and receive applications.
  timezone: Europe/Helsinki
models:
  JobPost:
    fields:
      title: string!
      description: text!
      company: string!
      location: string
      salary: money
      type: fullTime | partTime | contract | temporary
      status: open | closed
      postedBy: User
    ownedBy: postedBy
  Application:
    fields:
      jobPost: JobPost!
      applicantName: string!
      applicantEmail: email!
      resume: file
      coverLetter: text
      status: submitted | reviewed | rejected | hired
      appliedAt: datetime = NOW()
pages:
  jobs:
    crud: JobPost
    search: [title, description, company]
  applications:
    crud: Application
  home:
    route: /
    landing:
      hero:
      footer:
  privacy:
    route: /privacy
    legal: privacy
navigation: [jobs, applications]
