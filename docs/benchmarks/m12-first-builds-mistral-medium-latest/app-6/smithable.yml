smithable: 0.1
app:
  name: Union Job Board
  description: A job board for a local union to post jobs and receive applications.
models:
  JobPost:
    fields:
      title: string!
      description: text!
      company: string!
      location: string
      salary: money
      type: fullTime | partTime | contract | temporary
      status: open | closed
      postedAt: date = TODAY()
    access:
      create: [employer, admin]
      delete: [employer, admin, owner]
  Application:
    fields:
      jobPost: JobPost!
      name: string!
      email: email!
      phone: phone
      resume: text
      coverLetter: text
      status: submitted | reviewed | shortlisted | rejected
    access:
      create: [member, employer, admin]
      read: [employer, admin, owner]
      delete: [employer, admin]
pages:
  jobs:
    route: /
    crud: JobPost
    search: [title, description, company, location]
    filters: [type, status, salary]
    sortable: [postedAt, salary]
    actions: [closeJob]
  applications:
    crud: Application
    actions: [reviewApplication, shortlistApplication, rejectApplication]
  home:
    route: /home
    landing:
      hero:
      footer:
  team:
    users: manage
actions:
  closeJob:
    on: JobPost
    when:
      status: open
    set:
      status: closed
    intent: Close a job post when it is no longer open.
  reviewApplication:
    on: Application
    when:
      status: submitted
    set:
      status: reviewed
    intent: Mark an application as reviewed.
  shortlistApplication:
    on: Application
    when:
      status: [reviewed, submitted]
    set:
      status: shortlisted
    intent: Shortlist an application for further consideration.
  rejectApplication:
    on: Application
    when:
      status: [submitted, reviewed, shortlisted]
    set:
      status: rejected
    intent: Reject an application.
navigation: [jobs, applications, team]
