smithable: 0.1
app:
  name: Local Union Job Board
  description: A job board for a local union to post jobs and receive applications.
models:
  JobPost:
    fields:
      title: string!
      description: text!
      company: string!
      location: string
      salary: money
      type: fullTime | partTime | contract | temporary
      status: open | closed
      postedAt: datetime = NOW()
  Application:
    fields:
      jobPost: JobPost!
      name: string!
      email: email!
      phone: phone
      resume: text
      coverLetter: text
      status: submitted | reviewed | interviewed | hired | rejected
      appliedAt: datetime = NOW()
pages:
  jobs:
    crud: JobPost
    search: [title, description, company, location]
    filters: [type, status, salary]
    sortable: [postedAt, salary]
    actions: [closeJob]
  applications:
    crud: Application
    access: [admin]
    actions: [reviewApplication, interviewApplication, hireApplication, rejectApplication]
  home:
    route: /
    landing:
      hero:
      footer:
actions:
  closeJob:
    on: JobPost
    when:
      status: open
    set:
      status: closed
    intent: Close a job post when it is no longer accepting applications.
  reviewApplication:
    on: Application
    when:
      status: submitted
    set:
      status: reviewed
    intent: Mark an application as reviewed.
  interviewApplication:
    on: Application
    when:
      status: reviewed
    set:
      status: interviewed
    intent: Mark an application for interview.
  hireApplication:
    on: Application
    when:
      status: interviewed
    set:
      status: hired
    intent: Mark an application as hired.
  rejectApplication:
    on: Application
    when:
      status: [submitted, reviewed, interviewed]
    set:
      status: rejected
    intent: Reject an application.
