smithable: 0.1
app:
  name: Union Job Board
  description: A job board for a local union to post jobs and receive applications.
models:
  JobPost:
    fields:
      title: string!
      description: text!
      company: string!
      location: string
      salary: money
      type: fullTime | partTime | contract | temporary
      status: open | closed
      postedAt: date = TODAY()
    access:
      delete: [admin]
  Application:
    fields:
      jobPost: JobPost!
      name: string!
      email: email!
      phone: phone
      resume: text
      coverLetter: text
      status: submitted | reviewed | shortlisted | rejected
    access:
      delete: [admin]
pages:
  jobs:
    route: /
    crud: JobPost
    search: [title, description, company, location]
    filters: [type, status]
    sortable: [postedAt, salary]
    actions: [closeJob]
  applications:
    crud: Application
    search: [name, email]
    filters: [jobPost, status]
    actions: [reviewApplication, shortlistApplication, rejectApplication]
  home:
    route: /home
    landing:
      hero:
      footer:
      latest:
        records: JobPost
        where:
          status: open
actions:
  closeJob:
    on: JobPost
    when:
      status: open
    set:
      status: closed
    allow: [admin]
  reviewApplication:
    on: Application
    when:
      status: submitted
    set:
      status: reviewed
    allow: [admin]
  shortlistApplication:
    on: Application
    when:
      status: [reviewed, shortlisted]
    set:
      status: shortlisted
    allow: [admin]
  rejectApplication:
    on: Application
    when:
      status: [reviewed, shortlisted]
    set:
      status: rejected
    allow: [admin]
navigation: [jobs, applications]
