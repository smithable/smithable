smithable: 0.1
app:
  name: Union Job Board
  description: A job board for local union members to post and apply for jobs.
models:
  JobPost:
    fields:
      title: string!
      description: text!
      category: fullTime | partTime | contract | temporary | seasonal
      location: string!
      salary: money
      postedBy: User!
      status: open | filled | expired
      deadline: date
      requirements: text
      contactEmail: email
    access:
      delete: [admin, owner]
      create: [member]
  Application:
    fields:
      jobPost: JobPost!
      applicant: User!
      coverLetter: text!
      resume: string
      status: submitted | reviewed | shortlisted | rejected | hired
      submittedAt: datetime = NOW()
    access:
      delete: [admin, owner]
      create: [member]
pages:
  jobs:
    route: /
    crud: JobPost
    search: [title, description, location, category]
    sortable: [deadline, salary, createdAt]
  my-jobs:
    route: /my-jobs
    crud: JobPost
    mine: true
  applications:
    route: /applications
    crud: Application
  home:
    route: /welcome
    landing:
      hero:
      footer:
navigation: [jobs, my-jobs, applications]
