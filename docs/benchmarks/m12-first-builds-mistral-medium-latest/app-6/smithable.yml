smithable: 0.1
app:
  name: Union Job Board
  description: A job board for a local union to post jobs and receive applications.
models:
  Application:
    fields:
      name: string!
      email: email!
      phone: phone
      resume: text
      coverLetter: text
      status: submitted | reviewed | interviewed | hired | rejected
      job: Job!
    access:
      create: [member, employer, admin]
      read: [employer, admin, owner]
  Job:
    fields:
      title: string!
      description: text!
      company: string!
      location: string
      salary: money
      type: fullTime | partTime | contract | temporary
      status: open | closed
      postedAt: date = 2025-01-01
    access:
      create: [employer, admin]
      delete: [employer, admin]
pages:
  applications:
    crud: Application
    access: [employer, admin]
  jobs:
    route: /
    crud: Job
    access: [employer, member, admin]
    search: [title, description, company, location]
    filters: [type, status, salary]
    sortable: [postedAt, salary]
  myJobs:
    route: /my-jobs
    crud: Job
    access: [employer, admin]
    mine: true
navigation: [jobs, myJobs, applications]
