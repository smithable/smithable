smithable: 0.1
app:
  name: Union Job Board
  description: A job board for a local union to post jobs and receive applications.
models:
  JobPost:
    fields:
      title: string!
      description: text!
      company: string!
      location: string
      salary: money
      type: fullTime | partTime | contract | temporary
      status: open | closed
      postedAt: datetime = NOW()
    access:
      delete: [admin]
  Application:
    fields:
      jobPost: JobPost!
      name: string!
      email: email!
      phone: phone
      resume: text
      coverLetter: text
      status: submitted | reviewed | shortlisted | rejected | hired
      submittedAt: datetime = NOW()
    access:
      delete: [admin]
pages:
  jobs:
    route: /
    crud: JobPost
    search: [title, description, company, location]
    filters: [type, status, salary]
    sortable: [salary, postedAt]
  myJobs:
    route: /my-jobs
    crud: JobPost
    mine: true
  applications:
    crud: Application
    access: [admin]
  home:
    route: /welcome
    landing:
      hero:
      footer:
  team:
    users: manage
navigation: [jobs, myJobs, applications, team]
