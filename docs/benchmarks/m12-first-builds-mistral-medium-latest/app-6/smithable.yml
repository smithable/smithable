smithable: 0.1
app:
  name: Union Job Board
  description: A job board for a local union to post jobs and receive applications.
models:
  JobPost:
    fields:
      title: string!
      description: text!
      company: string!
      location: string
      salary: money
      type: fullTime | partTime | contract | temporary
      status: open | closed
      postedAt: datetime = NOW()
  Application:
    fields:
      jobPost: JobPost!
      name: string!
      email: email!
      phone: phone
      resume: url
      coverLetter: text
      status: submitted | reviewed | shortlisted | rejected | hired
      appliedAt: datetime = NOW()
pages:
  jobs:
    route: /
    crud: JobPost
    search: [title, description, company, location]
    filters: [type, status, salary]
    sortable: [postedAt, salary]
    favorites: true
    contact: owner
  home:
    route: /home
    landing:
      hero:
      footer:
      latest:
        records: JobPost
        where:
          status: open
  applications:
    crud: Application
navigation: [jobs, applications]
