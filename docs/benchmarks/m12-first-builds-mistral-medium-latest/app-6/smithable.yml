smithable: 0.1
app:
  name: Union Job Board
  description: A job board for a local union to post jobs and receive applications.
models:
  Job:
    fields:
      title: string!
      description: text!
      company: string!
      location: string
      salary: money
      type: fullTime | partTime | contract | temporary
      status: open | filled | expired
      postedAt: date!
    access:
      create: [employer]
      delete: [employer, owner]
  Application:
    fields:
      job: Job!
      name: string!
      email: email!
      phone: phone
      resume: text
      coverLetter: text
      status: submitted | reviewed | interviewed | hired | rejected
    access:
      create: [member]
      read: [employer, owner]
pages:
  jobs:
    route: /
    crud: Job
    search: [title, description, company, location]
    sortable: [postedAt, salary]
  applications:
    crud: Application
    search: [name, email]
    filters: [job, status]
    access: [employer]
  home:
    route: /home
    landing:
      hero:
      footer:
      latest:
        records: Job
        where:
          status: open
  team:
    users: manage
navigation: [jobs, applications, team]
