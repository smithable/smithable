smithable: 0.1
app:
  name: Tool Library
  description: A tool library where neighbors lend each other tools.
  timezone: Europe/Helsinki
models:
  Tool:
    fields:
      name: string!
      description: text!
      category: garden | power | hand | measuring | other
      condition: likeNew | good | worn
      available: bool = true
      photo: picture
pages:
  tools:
    route: /
    crud: Tool
    search: [name, description, category]
    filters: [category, condition, available]
    sortable: [name, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  home:
    route: /welcome
    landing:
      hero:
        button: tools
      story:
        button: tools
        mediaText:
      footer:
  privacy:
    route: /privacy
    legal: privacy
navigation: [tools, myTools]
