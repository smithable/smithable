smithable: 0.1
app:
  name: Tool Library
  description: A tool library where neighbors lend each other tools.
pages:
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latest:
        records: Tool
        where:
          available: true
  tools:
    route: /
    crud: Tool
    search: [name, description]
    filters: [category, condition, available]
    sortable: [name, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
models:
  Tool:
    fields:
      name: string!
      description: text!
      category: garden | power | hand | measuring | other
      condition: likeNew | good | worn
      available: bool = true
navigation: [tools, myTools]
