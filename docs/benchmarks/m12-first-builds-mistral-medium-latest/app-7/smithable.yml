smithable: 0.1
app:
  name: Football Club
  description: A football club's site with teams, players, matches and results.
models:
  Team:
    fields:
      name: string!
      description: text
      sport: football | futsal | beach
      founded: date
    access:
      delete: [admin]
  Player:
    fields:
      name: string!
      position: goalkeeper | defender | midfielder | forward
      team: Team!
      number: int
      birthDate: date
    access:
      delete: [admin]
  Match:
    fields:
      homeTeam: Team!
      awayTeam: Team!
      date: datetime!
      location: string
      status: scheduled | played | canceled
    access:
      delete: [admin]
  Result:
    fields:
      match: Match!
      homeScore: int!
      awayScore: int!
      scorers: text
    access:
      delete: [admin]
pages:
  teams:
    crud: Team
    search: [name]
  players:
    crud: Player
    search: [name, position]
    filters: [team, position]
  matches:
    crud: Match
    search: [location]
    filters: [status, homeTeam, awayTeam]
  results:
    crud: Result
  home:
    route: /
    landing:
      hero:
      footer:
      teams:
        records: Team
      matches:
        records: Match
        where:
          status: scheduled
  team:
    users: manage
navigation: [home, teams, players, matches, results, team]
