smithable: 0.1
app:
  name: Football Club
  description: A football club's site with teams, players, matches and results.
  timezone: Europe/Helsinki
models:
  Team:
    fields:
      name: string!
      description: text
      sport: football | futsal | beach
      founded: int
      logo: picture
  Player:
    fields:
      name: string!
      position: goalkeeper | defender | midfielder | forward
      number: int
      team: Team!
      birthDate: date
      photo: picture
  Match:
    fields:
      homeTeam: Team!
      awayTeam: Team!
      startsAt: datetime!
      location: string
      status: scheduled | inProgress | completed | canceled
      homeScore: int
      awayScore: int
pages:
  teams:
    crud: Team
  players:
    crud: Player
  matches:
    crud: Match
  home:
    route: /
    landing:
      hero:
      teams:
        records: Team
      matches:
        records: Match
        where:
          status: [scheduled, inProgress]
      footer:
  privacy:
    route: /privacy
    legal: privacy
navigation: [home, teams, players, matches]
