smithable: 0.1
app:
  name: Football Club
  description: A football club's site with teams, players, matches and results.
models:
  Team:
    fields:
      name: string!
      description: text
      founded: int
      logo: file
  Player:
    fields:
      name: string!
      position: goalkeeper | defender | midfielder | forward
      team: Team!
      number: int
      bio: text
      photo: file
  Match:
    fields:
      homeTeam: Team!
      awayTeam: Team!
      date: datetime!
      venue: string
      status: scheduled | played | canceled
      homeScore: int
      awayScore: int
pages:
  teams:
    crud: Team
  players:
    crud: Player
  matches:
    crud: Match
  home:
    route: /
    landing:
      hero:
      footer:
      teams:
        records: Team
      matches:
        records: Match
        where:
          status: [scheduled, played]
  privacy:
    route: /privacy
    legal: privacy
navigation: [home, teams, players, matches]
