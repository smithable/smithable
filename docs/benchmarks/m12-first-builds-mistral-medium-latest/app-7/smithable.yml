smithable: 0.1
app:
  name: Football Club
  description: A football club's site with teams, players, matches and results.
models:
  Team:
    fields:
      name: string!
      description: text
      founded: int
      logo: url
    access:
      delete: [admin]
      write: [admin]
      create: [admin]
  Player:
    fields:
      name: string!
      position: goalkeeper | defender | midfielder | forward
      team: Team!
      number: int
      birthDate: date
      bio: text
    access:
      delete: [admin]
      write: [admin]
      create: [admin]
  Match:
    fields:
      homeTeam: Team!
      awayTeam: Team!
      date: datetime!
      location: string
      status: scheduled | inProgress | completed | canceled
      homeScore: int = 0
      awayScore: int = 0
    access:
      delete: [admin]
      write: [admin]
      create: [admin]
pages:
  teams:
    crud: Team
    search: [name, description]
  players:
    crud: Player
    search: [name, position, bio]
  matches:
    crud: Match
    filters: [status, homeTeam, awayTeam]
  home:
    route: /
    landing:
      hero:
      footer:
      teams:
        records: Team
      matches:
        records: Match
        where:
          status: [scheduled, inProgress]
  team:
    users: manage
navigation: [home, teams, players, matches, team]
