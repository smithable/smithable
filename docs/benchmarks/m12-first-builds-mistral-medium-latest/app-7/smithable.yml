smithable: 0.1
app:
  name: Football Club
  description: A football club's site with teams, players, matches and results.
models:
  Team:
    fields:
      name: string!
      description: text
      sport: football | futsal | beachSoccer
      founded: date
  Player:
    fields:
      name: string!
      position: goalkeeper | defender | midfielder | forward
      team: Team!
      number: int
      birthDate: date
  Match:
    fields:
      homeTeam: Team!
      awayTeam: Team!
      date: datetime!
      location: string
      status: scheduled | played | cancelled
  Result:
    fields:
      match: Match!
      homeScore: int!
      awayScore: int!
      scorers: text
pages:
  teams:
    crud: Team
  players:
    crud: Player
  matches:
    crud: Match
  results:
    crud: Result
  home:
    route: /
    landing:
      hero:
      footer:
      teams:
        records: Team
navigation: [teams, players, matches, results]
