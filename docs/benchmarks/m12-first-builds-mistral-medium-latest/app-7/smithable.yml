smithable: 0.1
app:
  name: Football Club
  description: A football club's site with teams, players, matches and results.
models:
  Team:
    fields:
      name: string!
      description: text
      sport: football | futsal | beach
      founded: int
      logo: url
  Player:
    fields:
      name: string!
      position: goalkeeper | defender | midfielder | forward
      number: int
      team: Team!
      birthDate: date
      nationality: string
      photo: url
  Match:
    fields:
      homeTeam: Team!
      awayTeam: Team!
      date: datetime!
      location: string
      status: scheduled | played | canceled
      homeScore: int
      awayScore: int
pages:
  teams:
    crud: Team
    search: [name, description]
    sortable: [name, founded]
  players:
    crud: Player
    search: [name, position, nationality]
    filters: [team, position]
    sortable: [name, number, birthDate]
  matches:
    crud: Match
    search: [location]
    filters: [homeTeam, awayTeam, status, date]
    sortable: [date, homeScore, awayScore]
  home:
    route: /
    landing:
      hero:
      footer:
      teams:
        records: Team
navigation: [home, teams, players, matches]
