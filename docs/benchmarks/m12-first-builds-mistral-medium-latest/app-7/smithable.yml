smithable: 0.1
app:
  name: Football Club
  description: A football club's site with teams, players, matches and results.
models:
  Team:
    fields:
      name: string!
      description: text
      sport: football | futsal | beach
    access:
      delete: [admin]
  Player:
    fields:
      name: string!
      position: goalkeeper | defender | midfielder | forward
      team: Team!
      number: int
      birthDate: date
    access:
      delete: [admin, coach]
  Match:
    fields:
      homeTeam: Team!
      awayTeam: Team!
      date: datetime!
      location: string
      status: scheduled | played | cancelled
    access:
      delete: [admin, coach]
  Result:
    fields:
      match: Match!
      homeScore: int!
      awayScore: int!
      scorers: text
    access:
      delete: [admin, coach]
pages:
  teams:
    crud: Team
    access: [admin, coach, member]
  players:
    crud: Player
    access: [admin, coach, member]
  matches:
    crud: Match
    access: [admin, coach, member]
  results:
    crud: Result
    access: [admin, coach, member]
  home:
    route: /
    landing:
      hero:
      footer:
      teams:
        records: Team
      matches:
        records: Match
        where:
          status: scheduled
