smithable: 0.1
app:
  name: Web Shop Status
  description: A public uptime page showing which services work, outages and their updates.
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      summary: markdown
      updates: IncidentUpdate[]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
pages:
  incidents:
    crud: Incident
    access: [admin, staff]
  updates:
    crud: IncidentUpdate
    access: [admin, staff]
  components:
    crud: Component
    access: [admin]
  maintenance:
    crud: Maintenance
    access: [admin, staff]
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Component
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
  team:
    users: manage
  admin:
    data: all
actions:
  identified:
    custom: true
    input:
      incident: Incident!
    intent: The cause is found; the incident moves to identified.
    allow: [admin, staff]
  monitoring:
    custom: true
    input:
      incident: Incident!
    intent: A fix is out; the incident is watched before it is closed.
    allow: [admin, staff]
  resolve:
    custom: true
    input:
      incident: Incident!
    intent: The incident is over.
    allow: [admin, staff]
