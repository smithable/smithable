smithable: 0.1
app:
  name: Shop Uptime
  description: "A public uptime page for a web shop: which services work, outages and their updates."
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      summary: markdown
      updates: IncidentUpdate[]
    access:
      create: [admin, staff]
      write: [admin, staff]
      delete: [admin, staff]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
    access:
      create: [admin, staff]
      write: [admin, staff]
      delete: [admin, staff]
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
    access:
      create: [admin, staff]
      write: [admin, staff]
      delete: [admin, staff]
pages:
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Component
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
      recent:
        records: Incident
        where:
          status: resolved
      planned:
        records: Maintenance
  history:
    crud: Incident
  incidents:
    crud: Incident
    filters: [status, component]
    search: [title]
    access: [admin, staff]
  updates:
    crud: IncidentUpdate
    access: [admin, staff]
  components:
    crud: Component
    access: [admin]
  maintenance:
    crud: Maintenance
    access: [admin, staff]
  overview:
    crud: Incident
    access: [admin, staff]
  team:
    users: manage
    access: [admin]
navigation: [overview, incidents, updates, maintenance, components, team]
actions:
  identified:
    on: Incident
    when:
      status: investigating
    set:
      status: identified
    add:
      IncidentUpdate:
        at: NOW()
        status: identified
        message: The cause is found and a fix is being worked on.
    allow: [admin, staff]
    intent: The cause is found; the incident moves to identified, with an update saying so.
  monitoring:
    on: Incident
    when:
      status: [investigating, identified]
    set:
      status: monitoring
    add:
      IncidentUpdate:
        at: NOW()
        status: monitoring
        message: A fix is out. We are watching before we close this.
    allow: [admin, staff]
    intent: A fix is out; the incident is watched before it is closed, with an update saying so.
  resolve:
    on: Incident
    when:
      status: [investigating, identified, monitoring]
    set:
      status: resolved
      resolvedAt: NOW()
    add:
      IncidentUpdate:
        at: NOW()
        status: resolved
        message: This incident is resolved.
    allow: [admin, staff]
    intent: The incident is over, with an update saying so.
