smithable: 0.1
app:
  name: Web Shop Status
  description: A public uptime page showing which services work and current outages with updates.
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      summary: markdown
      updates: IncidentUpdate[]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
pages:
  incidents:
    crud: Incident
  updates:
    crud: IncidentUpdate
  components:
    crud: Component
    access: [admin]
  maintenance:
    crud: Maintenance
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Component
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
  team:
    users: manage
  admin:
    data: all
