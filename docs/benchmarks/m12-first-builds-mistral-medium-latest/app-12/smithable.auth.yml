smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin:
    description: The owner. Runs the team and the settings, and keeps the components.
  staff:
    description: Writes incidents and their updates.
    pages: [overview, incidents, updates, maintenance]
    create: all
    write: all
assistant:
  for: signed-in
public:
  pages: [home, privacy]
  read: [Component, { Incident: { where: { status: [investigating, identified, monitoring, resolved] } } }, IncidentUpdate, Maintenance]
defaultRole: staff
admins: [johan@smithable.ai]
api:
  models: [Component, Incident]
  actions: [resolve]
  assistants: true
