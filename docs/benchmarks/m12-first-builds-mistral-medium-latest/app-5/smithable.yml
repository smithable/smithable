smithable: 0.1
app:
  name: Bakery Inventory
  description: Track ingredients, suppliers, and stock levels for a small bakery.
models:
  Ingredient:
    fields:
      name: string!
      description: text
      category: dry | wet | frozen
      unit: string! = grams
      minStockLevel: int = 10
      currentStock: int = 0
  Supplier:
    fields:
      name: string!
      contactPerson: string
      email: email
      phone: phone
      address: text
  StockUpdate:
    fields:
      ingredient: Ingredient!
      date: date! = TODAY()
      quantity: int!
      type: in | out
      supplier: Supplier
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, description, category]
  suppliers:
    crud: Supplier
    search: [name, contactPerson, email]
  stock-updates:
    crud: StockUpdate
    filters: [ingredient, type, date, supplier]
navigation: [ingredients, suppliers, stock-updates]
