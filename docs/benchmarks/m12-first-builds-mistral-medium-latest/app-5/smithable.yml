smithable: 0.1
app:
  name: Bakery Inventory
  description: Track ingredients, suppliers and stock levels for a small bakery.
models:
  Ingredient:
    fields:
      name: string!
      description: text
      category: dry | wet | frozen
      unit: string!
      minStockLevel: int = 0
    access:
      delete: [manager]
  Supplier:
    fields:
      name: string!
      contactName: string
      email: email
      phone: phone
      address: text
    access:
      delete: [manager]
  Stock:
    fields:
      ingredient: Ingredient!
      supplier: Supplier
      quantity: decimal!
      lastRestocked: date
      expiryDate: date
    access:
      delete: [manager]
pages:
  ingredients:
    crud: Ingredient
    search: [name, description, category]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  stock:
    crud: Stock
    search: [ingredient]
    filters: [ingredient, supplier]
  team:
    users: manage
navigation: [stock, ingredients, suppliers, team]
