smithable: 0.1
app:
  name: Bakery Inventory
  description: Track ingredients, suppliers, and stock levels for a small bakery.
  timezone: Europe/Helsinki
models:
  Ingredient:
    fields:
      name: string!
      description: text
      category: dry | wet | frozen
      unit: string!
      unitCost: money
      supplier: Supplier
  Supplier:
    fields:
      name: string!
      contactName: string
      email: email
      phone: phone
      address: text
  Stock:
    fields:
      ingredient: Ingredient!
      quantity: decimal!
      lastUpdated: date! = TODAY()
      expiryDate: date
      location: string
pages:
  ingredients:
    crud: Ingredient
    search: [name, description, category]
  suppliers:
    crud: Supplier
  stock:
    crud: Stock
  team:
    users: manage
navigation: [stock, ingredients, suppliers, team]
