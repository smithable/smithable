smithable: 0.1
app:
  name: Bakery Inventory
  description: An inventory app for a small bakery to manage ingredients, suppliers and stock levels.
models:
  Ingredient:
    fields:
      name: string!
      description: text
      category: dry | wet | frozen
      unit: string!
      minStockLevel: int = 0
    access:
      delete: [baker]
  Supplier:
    fields:
      name: string!
      contactPerson: string
      email: email
      phone: phone
      address: text
    access:
      delete: [baker]
  Stock:
    fields:
      ingredient: Ingredient!
      supplier: Supplier
      quantity: decimal!
      lastRestocked: date
      expiryDate: date
    access:
      delete: [baker]
pages:
  ingredients:
    crud: Ingredient
    search: [name, description]
  suppliers:
    crud: Supplier
    search: [name, contactPerson, email]
  stock:
    crud: Stock
    search: [ingredient]
    filters: [ingredient, supplier]
  team:
    users: manage
navigation: [ingredients, suppliers, stock, team]
