smithable: 0.1
app:
  name: Bakery Inventory
  description: Track ingredients, suppliers and stock levels for a small bakery.
models:
  Ingredient:
    fields:
      name: string!
      description: text
      category: dry | wet | frozen | packaging
      unit: string!
      minStockLevel: int = 0
  Supplier:
    fields:
      name: string!
      contactPerson: string
      email: email
      phone: phone
      address: text
  Stock:
    fields:
      ingredient: Ingredient!
      supplier: Supplier
      quantity: decimal!
      lastRestocked: date
      expiryDate: date
pages:
  ingredients:
    crud: Ingredient
    search: [name, description]
  suppliers:
    crud: Supplier
    search: [name, contactPerson, email]
  stock:
    crud: Stock
    search: [ingredient]
    filters: [ingredient, supplier]
navigation: [ingredients, suppliers, stock]
