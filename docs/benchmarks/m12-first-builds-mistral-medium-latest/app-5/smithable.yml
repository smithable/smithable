smithable: 0.1
app:
  name: Bakery Inventory
  description: Track ingredients, suppliers and stock levels for a small bakery.
models:
  Ingredient:
    fields:
      name: string!
      description: text
      category: dry | wet | frozen
      unit: string!
      minStock: int = 0
      supplier: Supplier
    access:
      delete: [admin]
  Supplier:
    fields:
      name: string!
      contactName: string
      email: email
      phone: phone
      address: text
    access:
      delete: [admin]
  Stock:
    fields:
      ingredient: Ingredient!
      quantity: decimal!
      lastUpdated: date! = TODAY()
      expiryDate: date
pages:
  ingredients:
    crud: Ingredient
    search: [name, description, category]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  stock:
    crud: Stock
    search: [ingredient]
    filters: [ingredient, lastUpdated]
  team:
    users: manage
navigation: [ingredients, suppliers, stock, team]
