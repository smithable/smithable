smithable: 0.1
app:
  name: IT Help Desk
  description: A help desk for an IT team to manage tickets, priorities and assignments.
  timezone: Europe/Helsinki
models:
  Ticket:
    fields:
      subject: string!
      requesterEmail: email!
      status: open | inProgress | resolved | reopened
      priority:
        type: int!
        min: 1
        max: 5
        default: 3
      assignee: User
      description: text
      attachments: files
      messages: Message[]
  Message:
    fields:
      content: text!
      sender: agent | requester
      agent:
        type: User
        by: app
        default: ME()
      fromEmail: email
      attachments: files
      ticket: Ticket!
pages:
  tickets:
    crud: Ticket
    search: [subject, requesterEmail]
    filters: [status, priority, assignee]
    sortable: [priority, createdAt]
    actions: [assignToMe, assignTo, startWork, resolve, reopen]
  team:
    users: manage
actions:
  assignToMe:
    on: Ticket
    when:
      assignee: not ME()
    set:
      assignee: ME()
    intent: "Take the ticket: you become its assignee."
  assignTo:
    on: Ticket
    set:
      assignee:
    intent: Give the ticket to an agent, chosen from the team.
  startWork:
    on: Ticket
    when:
      status: [open, reopened]
    set:
      status: inProgress
    intent: Start working on the ticket; it needs an assignee.
  resolve:
    on: Ticket
    when:
      status: [open, inProgress, reopened]
    set:
      status: resolved
    intent: The requester has their answer.
  reopen:
    on: Ticket
    when:
      status: resolved
    set:
      status: reopened
    intent: The ticket needs more work after all.
navigation: [tickets, team]
outgoing:
  ticketReceived:
    when: Ticket created
    to: mail
    recipient: requesterEmail
  replySent:
    when: Message created
    where:
      sender: agent
    to: mail
    recipient: ticket.requesterEmail
