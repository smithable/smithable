smithable: 0.1
app:
  name: IT Help Desk
  description: A help desk for an IT team to manage support tickets, priorities and assignments.
models:
  Ticket:
    fields:
      title: string!
      description: text
      priority: low | medium | high | urgent
      status: open | inProgress | resolved | closed
      assignee: User
    access:
      delete: [itSupport]
pages:
  tickets:
    crud: Ticket
    search: [title, description]
    sortable: [priority, status, createdAt]
    actions: [startWork, resolve, close, reopen]
  team:
    users: manage
actions:
  startWork:
    on: Ticket
    when:
      status: open
    set:
      status: inProgress
    intent: Start working on a ticket.
  resolve:
    on: Ticket
    when:
      status: inProgress
    set:
      status: resolved
    intent: Mark a ticket as resolved.
  close:
    on: Ticket
    when:
      status: [resolved, inProgress]
    set:
      status: closed
    intent: Close a ticket.
  reopen:
    on: Ticket
    when:
      status: [closed, resolved]
    set:
      status: open
    intent: Reopen a closed or resolved ticket.
navigation: [tickets, team]
