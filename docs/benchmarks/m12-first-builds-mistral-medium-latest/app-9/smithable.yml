smithable: 0.1
app:
  name: IT Help Desk
  description: A help desk for an IT team to manage support tickets, priorities and assignments.
models:
  Ticket:
    fields:
      title: string!
      description: text
      priority: low | medium | high | critical
      status: open | inProgress | resolved | closed
      assignee: User
    access:
      delete: [admin]
pages:
  tickets:
    crud: Ticket
    search: [title, description]
    sortable: [priority, status, createdAt]
    actions: [startWork, resolve, reopen, close]
  team:
    users: manage
actions:
  startWork:
    on: Ticket
    when:
      status: open
    set:
      status: inProgress
      assignee: ME()
    intent: Assign the ticket to yourself and start working on it.
  resolve:
    on: Ticket
    when:
      status: inProgress
    set:
      status: resolved
    intent: Mark the ticket as resolved.
  reopen:
    on: Ticket
    when:
      status: [resolved, closed]
    set:
      status: open
    intent: Reopen the ticket for further work.
  close:
    on: Ticket
    when:
      status: resolved
    set:
      status: closed
    intent: Close the ticket.
