smithable: 0.1
app:
  name: IT Help Desk
  description: A help desk for an IT team to manage tickets, priorities and assignments.
models:
  Ticket:
    fields:
      title: string!
      description: text
      priority: low | normal | high | urgent
      status: open | inProgress | resolved | closed
      assignee: User
pages:
  tickets:
    crud: Ticket
    search: [title, description]
    sortable: [priority, status, createdAt]
    actions: [resolve, close, reopen, startWork]
    filters: [priority, status]
  team:
    users: manage
actions:
  resolve:
    on: Ticket
    when:
      status: inProgress
    set:
      status: resolved
    intent: Mark the ticket as resolved.
  close:
    on: Ticket
    when:
      status: resolved
    set:
      status: closed
    intent: Close the ticket.
  reopen:
    on: Ticket
    when:
      status: [closed, resolved]
    set:
      status: open
    intent: Reopen the ticket.
  startWork:
    on: Ticket
    when:
      status: open
    set:
      status: inProgress
      assignee: ME()
    intent: Start working on the ticket.
