smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin:
    description: The owner. Runs the team and the settings, and sees everything the agents do.
  agent:
    description: Handles tickets, takes them and passes them on.
    pages: [tickets]
    create: all
    write: all
    actions: all
assistant:
  for: signed-in
defaultRole: agent
admins: [johan@smithable.ai]
