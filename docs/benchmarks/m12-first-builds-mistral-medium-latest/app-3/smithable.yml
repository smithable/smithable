smithable: 0.1
app:
  name: Freelance Invoicing
  description: Invoicing for freelancers, with clients, invoices and payments.
  currency: EUR
models:
  BusinessProfile:
    fields:
      businessName: string!
      vatNumber: string
      iban: string
      paymentTermDays: int! = 30
      invoiceFooter: text
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      invoices: Invoice[]
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount: money
      invoice: Invoice!
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      dueOn: date! = DATEADD(issuedOn, 30, "day")
      status: draft | sent | paid | overdue
      total: money
      lines: InvoiceLine[]
pages:
  clients:
    crud: Client
    search: [name, email]
  settings:
    crud: BusinessProfile
  team:
    users: manage
  home:
    route: /
    landing:
      hero:
      footer:
  invoices:
    crud: Invoice
    search: [number, client]
    filters: [status, client]
    sortable: [issuedOn, dueOn, total, number]
  invoice-lines:
    crud: InvoiceLine
  overview:
    crud: Invoice
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice.
navigation: [overview, invoices, clients, settings, team]
