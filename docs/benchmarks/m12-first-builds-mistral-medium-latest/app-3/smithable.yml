smithable: 0.1
app:
  name: Invoicing for Freelancers
  description: Invoicing app for freelancers to manage clients, invoices, and payments.
  currency: EUR
models:
  BusinessProfile:
    fields:
      businessName: string!
      vatNumber: string
      iban: string
      paymentTermDays: int! = 30
      invoiceFooter: text
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      invoices: Invoice[]
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid | overdue
      total: money
      lines: InvoiceLine[]
  InvoiceLine:
    fields:
      invoice: Invoice!
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount: money
pages:
  overview:
    crud: Invoice
  invoices:
    crud: Invoice
  clients:
    crud: Client
  settings:
    crud: BusinessProfile
  home:
    route: /
    landing:
      hero:
      footer:
      features:
      pricing:
      faq:
      callToAction:
        button: overview
  dashboard:
    crud: Invoice
navigation: [dashboard, invoices, clients, settings]
