smithableUx: 0.1
pages:
  invoices:
    table:
      sort: -issuedOn
      columns: [number, client, issuedOn, dueOn, status, total]
    form:
      columns: 2
  clients:
    table:
      sort: name
      below:
        name: address
      columns: [name, email, vatNumber]
    form:
      columns: 2
  invoice-lines:
    table:
      columns: [description, quantity, unitPrice, amount]
    form:
      columns: 2
tones:
  Invoice.status:
    paid: success
    overdue: danger
    sent: warning
