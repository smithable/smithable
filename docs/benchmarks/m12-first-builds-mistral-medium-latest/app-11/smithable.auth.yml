smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin:
    description: Administrator with full access.
  staff:
    description: Writes incidents and their updates.
    pages: [overview, incidents, updates, maintenance]
    create: all
    write: all
public:
  pages: [home]
  read: [Component, { Incident: { where: { status: [investigating, identified, monitoring, resolved] } } }, IncidentUpdate, Maintenance]
defaultRole: staff
api:
  models: [Component, Incident]
  actions: [resolve]
  assistants: true
admins: [johan@smithable.ai]
