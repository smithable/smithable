smithable: 0.1
app:
  name: API Status
  description: Live status of our API services, incidents and planned maintenance.
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
    access:
      delete: [admin]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      summary: markdown
      updates: IncidentUpdate[]
    access:
      delete: [admin]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
    access:
      delete: [admin]
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
    access:
      delete: [admin]
pages:
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Component
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
  history:
    crud: Incident
  incidents:
    crud: Incident
    search: [title, summary]
    filters: [status, component]
  updates:
    crud: IncidentUpdate
    search: [message]
    filters: [status, incident]
  components:
    crud: Component
    search: [name, description]
    filters: [status]
    access: [admin]
  maintenance:
    crud: Maintenance
    search: [title, description]
    filters: [component]
  overview:
    crud: Incident
  team:
    users: manage
    access: [admin]
navigation: [overview, incidents, updates, maintenance, components, team]
