smithable: 0.1
app:
  name: API Status
  description: Live status of our API services, incidents, and planned maintenance.
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
    access:
      delete: [admin]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      summary: markdown
      updates: IncidentUpdate[]
    access:
      delete: [admin]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
    access:
      delete: [admin]
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
    access:
      delete: [admin]
pages:
  incidents:
    crud: Incident
    actions: [identified, monitoring, resolve]
  updates:
    crud: IncidentUpdate
  components:
    crud: Component
    access: [admin]
  maintenance:
    crud: Maintenance
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Component
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
  team:
    users: manage
  admin:
    data: all
  overview:
    dashboard:
      open:
        count: Incident
        where:
          status: [investigating, identified, monitoring]
      perMonth:
        count: Incident
        by: detectedAt
      latest:
        list: Incident
        limit: 5
navigation: [overview, incidents, updates, maintenance, components, team, admin]
actions:
  identified:
    on: Incident
    when:
      status: investigating
    set:
      status: identified
    add:
      IncidentUpdate:
        at: NOW()
        status: identified
        message:
    allow: [admin, staff]
    intent: The cause is found; the incident moves to identified, with an update saying so.
  monitoring:
    on: Incident
    when:
      status: [investigating, identified]
    set:
      status: monitoring
    add:
      IncidentUpdate:
        at: NOW()
        status: monitoring
        message:
    allow: [admin, staff]
    intent: A fix is out; the incident is watched before it is closed, with an update saying so.
  resolve:
    on: Incident
    when:
      status: [investigating, identified, monitoring]
    set:
      status: resolved
      resolvedAt: NOW()
    add:
      IncidentUpdate:
        at: NOW()
        status: resolved
        message:
    allow: [admin, staff]
    intent: The incident is over, with an update saying so.
