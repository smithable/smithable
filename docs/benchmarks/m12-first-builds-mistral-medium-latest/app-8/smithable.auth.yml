smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: private
roles:
  admin:
    description: Conference organizers. Manage talks, speakers, and attendees.
  attendee:
    description: Conference attendee. Can register for talks.
    pages: [registrations]
    create: [Registration]
public:
  pages: [home, talks, privacy]
  read: [Talk]
defaultRole: attendee
admins: [johan@smithable.ai]
