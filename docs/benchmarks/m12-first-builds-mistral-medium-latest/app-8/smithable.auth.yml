smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  organizer:
    description: Manages talks, speakers, and registrations.
  attendee:
    description: A conference participant.
defaultRole: attendee
public:
  pages: [home]
  read: [Talk, Speaker]
  create: [Attendee]
admins: [johan@smithable.ai]
