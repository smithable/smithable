smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
public:
  pages: [home, talks]
  read: [Talk, Speaker]
  create: [Attendee]
roles:
  admin:
    description: Conference organizer. Manages talks, speakers and registrations.
  attendee:
    description: A conference participant.
defaultRole: attendee
admins: [johan@smithable.ai]
