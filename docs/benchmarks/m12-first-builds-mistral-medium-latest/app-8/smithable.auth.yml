smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin:
    description: Conference organizer. Manages talks, speakers, and registrations.
  attendee:
    description: Conference participant. Can register for talks.
    pages: [talks, registrations]
    create: [Registration]
assistant:
  for: signed-in
public:
  pages: [home, talks]
  read: [Talk, Speaker]
defaultRole: attendee
admins: [johan@smithable.ai]
