smithableAuth: 0.1
signIn:
  providers: [google]
  selfSignUp: false
defaultAccess: shared
roles:
  organizer:
    description: Manages conference talks, speakers, and registrations.
  attendee:
    description: A conference participant who registers for talks.
defaultRole: attendee
public:
  pages: [home]
  read: [Talk, Speaker]
admins: [johan@smithable.ai]
