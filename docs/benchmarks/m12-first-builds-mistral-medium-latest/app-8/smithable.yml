smithable: 0.1
app:
  name: Conference Registration
  description: Event registration for a conference with talks, speakers and attendees.
models:
  Talk:
    fields:
      title: string!
      summary: text
      startsAt: datetime!
      endsAt: datetime!
      room: string
      capacity: int! = 50
      speaker: Speaker!
      registrations: Registration[]
    access:
      create: [organizer]
      write: [organizer]
      delete: [organizer]
  Speaker:
    fields:
      name: string!
      bio: text
      photo: picture
      email: email
      company: string
    access:
      create: [organizer]
      write: [organizer]
      delete: [organizer]
  Registration:
    fields:
      talk: Talk! unique
      registeredAt: datetime! = NOW()
      attendee: Attendee!
    capacity:
      per: talk
      max: talk.capacity
    access:
      create: [organizer, attendee]
      delete: [organizer, owner]
  Attendee:
    fields:
      name: string!
      email: email! unique
      company: string
      dietaryRequirements: text
    access:
      create: [organizer, attendee]
      write: [organizer, owner]
      delete: [organizer, owner]
pages:
  talks:
    crud: Talk
    access: [organizer]
  speakers:
    crud: Speaker
    access: [organizer]
  attendees:
    crud: Attendee
    access: [organizer]
  registrations:
    crud: Registration
  home:
    route: /
    landing:
      hero:
      footer:
      talks:
        records: Talk
      speakers:
        records: Speaker
      contact:
        form: Attendee
  team:
    users: manage
  admin:
    data: all
