smithable: 0.1
app:
  name: Conference Registration
  description: Event registration system for conference talks, speakers and attendees.
models:
  Talk:
    fields:
      title: string!
      summary: text
      startsAt: datetime!
      endsAt: datetime!
      room: string
      capacity: int! = 50
      speaker: Speaker!
      registrations: Registration[]
  Speaker:
    fields:
      name: string!
      bio: text
      photo: picture
      email: email!
      company: string
  Registration:
    fields:
      talk: Talk! unique
      registeredAt: datetime! = NOW()
      attendee: Attendee!
    capacity:
      per: talk
      max: talk.capacity
  Attendee:
    fields:
      name: string!
      email: email! unique
      company: string
      dietaryRequirements: text
pages:
  talks:
    crud: Talk
  speakers:
    crud: Speaker
  attendees:
    crud: Attendee
  registrations:
    crud: Registration
  team:
    users: manage
