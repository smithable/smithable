smithable: 0.1
app:
  name: Conference Registration
  description: "Event registration for a conference: talks, speakers and attendees."
models:
  Talk:
    fields:
      title: string!
      summary: text
      startsAt: datetime!
      endsAt: datetime!
      room: string
      capacity: int! = 100
      speaker: Speaker!
      registrations: Registration[]
    access:
      delete: [admin]
      create: [admin]
      write: [admin]
  Speaker:
    fields:
      name: string!
      bio: text
      photo: picture
      email: email
      company: string
    access:
      delete: [admin]
      create: [admin]
      write: [admin]
  Attendee:
    fields:
      name: string!
      email: email! unique
      company: string
      phone: phone
    access:
      delete: [admin]
      create: [admin, attendee]
      write: [admin, owner]
  Registration:
    fields:
      talk: Talk!
      attendee: Attendee!
      registeredAt: datetime! = NOW()
      status: registered | attended | canceled
    capacity:
      per: talk
      max: talk.capacity
    access:
      delete: [admin, owner]
      create: [admin, attendee]
      write: [admin, owner]
pages:
  talks:
    crud: Talk
  speakers:
    crud: Speaker
  attendees:
    crud: Attendee
  registrations:
    crud: Registration
  home:
    route: /
    landing:
      hero:
      footer:
      talks:
        records: Talk
      speakers:
        records: Speaker
      contact:
        form: Attendee
  team:
    users: manage
