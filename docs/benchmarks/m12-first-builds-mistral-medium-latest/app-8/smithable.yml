smithable: 0.1
app:
  name: Conference Registration
  description: Event registration for a conference with talks, speakers and attendees.
models:
  Talk:
    fields:
      title: string!
      summary: text
      startsAt: datetime!
      endsAt: datetime!
      room: string
      capacity: int! = 50
      speaker: Speaker!
      registrations: Registration[]
  Speaker:
    fields:
      name: string!
      bio: text
      photo: picture
      email: email
      company: string
  Attendee:
    fields:
      name: string!
      email: email! unique
      company: string
      phone: phone
  Registration:
    fields:
      talk: Talk! unique
      attendee: Attendee!
      registeredAt: datetime! = NOW()
    capacity:
      per: talk
      max: talk.capacity
pages:
  talks:
    crud: Talk
  speakers:
    crud: Speaker
  attendees:
    crud: Attendee
  registrations:
    crud: Registration
  home:
    route: /
    landing:
      hero:
      footer:
      talks:
        records: Talk
      speakers:
        records: Speaker
      contact:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
