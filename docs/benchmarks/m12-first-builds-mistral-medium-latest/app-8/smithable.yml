smithable: 0.1
app:
  name: Conference Registration
  description: Event registration for a conference with talks, speakers and attendees.
  timezone: Europe/Helsinki
models:
  Talk:
    fields:
      title: string!
      summary: text
      startsAt: datetime!
      durationMinutes: int! = 45
      capacity: int! = 100
      speaker: Speaker!
  Speaker:
    fields:
      name: string!
      bio: markdown
      portrait: picture
  Attendee:
    fields:
      name: string!
      email: email! unique
  Registration:
    fields:
      talk: Talk! unique
      attendee: User
      status: registered | cancelled
    ownedBy: attendee
    capacity:
      per: talk
      max: talk.capacity
      closes: talk.startsAt
      cancelUntil: talk.startsAt
pages:
  talks:
    crud: Talk
  speakers:
    crud: Speaker
  attendees:
    crud: Attendee
  registrations:
    crud: Registration
  home:
    route: /
    landing:
      hero:
      talks:
        records: Talk
      speakers:
        records: Speaker
      faq:
        text:
      footer:
  privacy:
    route: /privacy
    legal: privacy
navigation: [home, talks, speakers, registrations]
