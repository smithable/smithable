smithable: 0.1
app:
  name: Conference Registration
  description: Event registration system for conference talks, speakers and attendees.
models:
  Talk:
    fields:
      title: string!
      summary: text
      startsAt: datetime!
      endsAt: datetime!
      room: string
      capacity: int! = 100
      speaker: Speaker!
      registrations: Registration[]
    access:
      delete: [organizer]
      create: [organizer]
  Speaker:
    fields:
      name: string!
      bio: text
      photo: picture
      email: email!
      company: string
    access:
      delete: [organizer]
      create: [organizer]
  Attendee:
    fields:
      name: string!
      email: email! unique
      company: string
      dietaryRestrictions: text
    access:
      delete: [organizer]
      create: [organizer]
  Registration:
    fields:
      talk: Talk!
      attendee: Attendee!
      status: registered | attended | cancelled
    capacity:
      per: talk
      max: talk.capacity
pages:
  talks:
    crud: Talk
    search: [title, summary, room]
  speakers:
    crud: Speaker
    search: [name, company]
  attendees:
    crud: Attendee
    search: [name, email, company]
  registrations:
    crud: Registration
    filters: [talk, status]
  home:
    route: /
    landing:
      hero:
      footer:
      talks:
        records: Talk
      speakers:
        records: Speaker
      contact:
  team:
    users: manage
