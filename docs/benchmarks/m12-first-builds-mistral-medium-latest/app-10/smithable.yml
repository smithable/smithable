smithable: 0.1
app:
  name: Family Recipes
  description: A place to keep and share family recipes with ingredients and shopping lists.
models:
  Recipe:
    fields:
      name: string!
      description: text
      servings: int = 4
      prepTime: int
      cookTime: int
      instructions: text!
      category: breakfast | lunch | dinner | dessert | snack | drink
      difficulty: easy | medium | hard
      image: url
    access:
      delete: [admin]
  Ingredient:
    fields:
      name: string!
      quantity: string
      unit: string
      recipe: Recipe!
  ShoppingList:
    fields:
      name: string!
      date: date! = TODAY()
      status: pending | completed
      items: string!
    access:
      delete: [admin]
pages:
  recipes:
    crud: Recipe
    search: [name, description, category, difficulty]
    filters: [category, difficulty]
    sortable: [name, servings, prepTime, cookTime]
  shopping-lists:
    crud: ShoppingList
    search: [name]
    filters: [status]
  home:
    route: /
    landing:
      hero:
      footer:
      recipes:
        records: Recipe
        where:
          category: [breakfast, lunch, dinner, dessert, snack, drink]
navigation: [recipes, shopping-lists]
