smithable: 0.1
app:
  name: Family Recipes
  description: A place to keep and share family recipes with ingredients and shopping lists.
  timezone: Europe/Helsinki
models:
  Recipe:
    fields:
      name: string!
      description: text
      servings: int! = 4
      prepTime: int
      cookTime: int
      instructions: markdown!
      category: breakfast | lunch | dinner | dessert | snack | drink
      difficulty: easy | medium | hard
      favorite: bool = false
  Ingredient:
    fields:
      name: string!
      amount: decimal
      unit: string
      recipe: Recipe!
  ShoppingList:
    fields:
      name: string!
      recipe: Recipe
      completed: bool = false
  ShoppingItem:
    fields:
      name: string!
      amount: decimal
      unit: string
      purchased: bool = false
      shoppingList: ShoppingList!
pages:
  recipes:
    crud: Recipe
    search: [name, description, instructions]
    filters: [category, difficulty, favorite]
  shopping-lists:
    crud: ShoppingList
  home:
    route: /
    landing:
      hero:
      recipes:
        records: Recipe
        where:
          favorite: true
      features:
        features:
      footer:
  privacy:
    route: /privacy
    legal: privacy
navigation: [recipes, shopping-lists]
