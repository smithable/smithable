smithable: 0.1
app:
  name: Family Recipes
  description: A private collection of family recipes with ingredients and shopping lists.
models:
  Recipe:
    fields:
      name: string!
      description: text
      servings: int = 4
      prepTime: int
      cookTime: int
      instructions: text!
      category: breakfast | lunch | dinner | dessert | snack | drink
      difficulty: easy | medium | hard
      image: url
    access:
      delete: [admin]
  Ingredient:
    fields:
      name: string!
      quantity: string
      unit: string
      recipe: Recipe!
  ShoppingList:
    fields:
      name: string!
      recipe: Recipe
      items: text!
      status: pending | completed
      dueDate: date
    access:
      delete: [admin]
pages:
  recipes:
    crud: Recipe
    search: [name, description, category, difficulty]
    filters: [category, difficulty]
  shopping-lists:
    crud: ShoppingList
navigation: [recipes, shopping-lists]
