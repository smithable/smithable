smithable: 0.1
app:
  name: Family Recipes
  description: A place to keep and share family recipes with ingredients and shopping lists.
models:
  Recipe:
    fields:
      name: string!
      description: text
      servings: int = 4
      prepTime: int
      cookTime: int
      instructions: text!
      category: breakfast | lunch | dinner | dessert | snack | drink
      difficulty: easy | medium | hard
      image: url
    access:
      delete: [admin]
      write: [admin, member]
  Ingredient:
    fields:
      name: string!
      quantity: string
      unit: string
      recipe: Recipe!
    access:
      delete: [admin, owner]
      write: [admin, owner]
  ShoppingList:
    fields:
      name: string!
      date: date! = TODAY()
      status: planned | inProgress | completed
      items: ShoppingItem[]
    access:
      delete: [admin, owner]
      write: [admin, owner]
  ShoppingItem:
    fields:
      name: string!
      quantity: string
      unit: string
      bought: bool = false
      shoppingList: ShoppingList!
    access:
      delete: [admin, owner]
      write: [admin, owner]
pages:
  recipes:
    crud: Recipe
    search: [name, description, category]
    filters: [category, difficulty]
    sortable: [name, servings, prepTime, cookTime]
  shopping-lists:
    crud: ShoppingList
    filters: [status, date]
    search: [name]
    actions: [markCompleted, markInProgress]
  home:
    route: /
    landing:
      hero:
      footer:
      recipes:
        records: Recipe
        where:
          category: [breakfast, lunch, dinner, dessert]
actions:
  markCompleted:
    on: ShoppingList
    when:
      status: [planned, inProgress]
    set:
      status: completed
  markInProgress:
    on: ShoppingList
    when:
      status: planned
    set:
      status: inProgress
navigation: [recipes, shopping-lists]
