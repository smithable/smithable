smithable: 0.1
app:
  name: Family Recipes
  description: A recipe collection for a family, with ingredients and shopping lists.
models:
  Recipe:
    fields:
      name: string!
      description: text
      servings: int = 4
      prepTime: int
      cookTime: int
      instructions: text!
      category: breakfast | lunch | dinner | dessert | snack
      difficulty: easy | medium | hard
      image: url
    access:
      delete: [admin]
  Ingredient:
    fields:
      name: string!
      quantity: string
      unit: string
      recipe: Recipe!
  ShoppingList:
    fields:
      name: string!
      date: date! = TODAY()
      status: pending | completed
      items: ShoppingItem[]
    access:
      delete: [admin]
  ShoppingItem:
    fields:
      name: string!
      quantity: string
      unit: string
      purchased: bool = false
      shoppingList: ShoppingList!
    access:
      delete: [admin]
pages:
  recipes:
    crud: Recipe
    search: [name, description, category]
    filters: [category, difficulty]
  shopping-lists:
    crud: ShoppingList
    search: [name]
    filters: [status, date]
  team:
    users: manage
navigation: [recipes, shopping-lists, team]
