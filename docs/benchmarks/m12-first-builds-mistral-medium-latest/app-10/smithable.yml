smithable: 0.1
app:
  name: Family Recipes
  description: A place to keep and share family recipes with ingredients and shopping lists.
models:
  Recipe:
    fields:
      name: string!
      description: text
      servings: int = 4
      prepTime: string
      cookTime: string
      instructions: text!
      category: breakfast | lunch | dinner | dessert | snack | drink
      difficulty: easy | medium | hard
      image: url
    access:
      delete: [admin]
  Ingredient:
    fields:
      name: string!
      quantity: string
      unit: string
      recipe: Recipe!
  ShoppingList:
    fields:
      name: string!
      date: date! = TODAY()
      status: planned | inProgress | completed
      recipe: Recipe
    access:
      delete: [admin]
      write: [admin, member]
      create: [admin, member]
  ShoppingItem:
    fields:
      name: string!
      quantity: string
      unit: string
      bought: bool = false
      shoppingList: ShoppingList!
pages:
  recipes:
    crud: Recipe
    search: [name, description, category, difficulty]
    filters: [category, difficulty]
  shopping-lists:
    crud: ShoppingList
    filters: [status, date]
    actions: [markAsInProgress, markAsCompleted]
  home:
    route: /
    landing:
      hero:
      footer:
      recipes:
        records: Recipe
        where:
          category: [breakfast, lunch, dinner, dessert, snack, drink]
actions:
  markAsInProgress:
    on: ShoppingList
    when:
      status: planned
    set:
      status: inProgress
  markAsCompleted:
    on: ShoppingList
    when:
      status: inProgress
    set:
      status: completed
navigation: [recipes, shopping-lists]
