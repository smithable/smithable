smithable: 0.1
app:
  name: Sales CRM
  description: A lightweight CRM for a small sales team to manage companies, contacts, deals and follow-ups.
models:
  Company:
    fields:
      name: string!
      email: email
      phone: phone
      segment: smb | enterprise | government
      notes: text
      accountManager: User
    access:
      delete: [admin]
  Contact:
    fields:
      firstName: string!
      lastName: string!
      email: email
      phone: phone
      role: decisionMaker | influencer | endUser
      company: Company!
      notes: text
    access:
      delete: [admin]
  Deal:
    fields:
      name: string!
      company: Company!
      contact: Contact
      value: money
      stage: prospecting | qualified | proposal | negotiation | closedWon | closedLost
      closeDate: date
      notes: text
    access:
      delete: [admin]
  FollowUp:
    fields:
      title: string!
      company: Company!
      contact: Contact
      deal: Deal
      dueDate: date!
      status: pending | completed | canceled
      notes: text
    access:
      delete: [admin]
pages:
  companies:
    crud: Company
    search: [name, email]
  contacts:
    crud: Contact
    search: [firstName, lastName, email]
  deals:
    crud: Deal
    search: [name, company, stage]
    filters: [stage, company]
    actions: [markDealWon, markDealLost]
  follow-ups:
    crud: FollowUp
    search: [title, company, status]
    filters: [status, dueDate, company]
    actions: [completeFollowUp, cancelFollowUp]
  team:
    users: manage
actions:
  markDealWon:
    on: Deal
    when:
      stage: negotiation
    set:
      stage: closedWon
      closeDate: TODAY()
  markDealLost:
    on: Deal
    when:
      stage: negotiation
    set:
      stage: closedLost
      closeDate: TODAY()
  completeFollowUp:
    on: FollowUp
    when:
      status: pending
    set:
      status: completed
  cancelFollowUp:
    on: FollowUp
    when:
      status: pending
    set:
      status: canceled
navigation: [companies, contacts, deals, follow-ups, team]
