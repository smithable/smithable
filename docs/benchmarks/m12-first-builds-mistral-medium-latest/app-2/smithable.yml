smithable: 0.1
app:
  name: Sales CRM
  description: Lightweight CRM for a small sales team to manage companies, contacts, deals and follow-ups.
models:
  Company:
    fields:
      name: string!
      email: email
      phone: phone
      segment: smb | enterprise | government
      notes: text
      accountManager: User
    access:
      delete: [admin]
  Contact:
    fields:
      firstName: string!
      lastName: string!
      email: email
      phone: phone
      role: decisionMaker | influencer | endUser
      company: Company!
      notes: text
    access:
      delete: [admin]
  Deal:
    fields:
      name: string!
      company: Company!
      value: money!
      stage: lead | qualified | proposal | negotiation | closedWon | closedLost
      closeDate: date
      notes: text
      contact: Contact
    access:
      delete: [admin]
  FollowUp:
    fields:
      title: string!
      dueDate: date!
      status: pending | completed | canceled
      notes: text
      deal: Deal!
    access:
      delete: [admin]
pages:
  companies:
    crud: Company
    search: [name, email]
  team:
    users: manage
  contacts:
    crud: Contact
    search: [firstName, lastName, email, company]
  deals:
    crud: Deal
    search: [name, company, stage]
    filters: [stage, company, owner]
    sortable: [value, closeDate, createdAt]
    actions: [qualify, sendProposal, startNegotiation, closeWon, closeLost]
  follow-ups:
    crud: FollowUp
    search: [title, status]
    filters: [status, dueDate, deal, owner]
    sortable: [dueDate, createdAt]
    actions: [complete, cancel]
actions:
  qualify:
    on: Deal
    when:
      stage: lead
    set:
      stage: qualified
  sendProposal:
    on: Deal
    when:
      stage: qualified
    set:
      stage: proposal
  startNegotiation:
    on: Deal
    when:
      stage: proposal
    set:
      stage: negotiation
  closeWon:
    on: Deal
    when:
      stage: negotiation
    set:
      stage: closedWon
      closeDate: TODAY()
  closeLost:
    on: Deal
    when:
      stage: negotiation
    set:
      stage: closedLost
      closeDate: TODAY()
  complete:
    on: FollowUp
    when:
      status: pending
    set:
      status: completed
  cancel:
    on: FollowUp
    when:
      status: pending
    set:
      status: canceled
navigation: [companies, contacts, deals, follow-ups, team]
