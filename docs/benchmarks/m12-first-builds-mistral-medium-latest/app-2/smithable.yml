smithable: 0.1
app:
  name: Small Sales CRM
  description: A CRM for a small sales team to manage companies, contacts, deals and follow-ups.
  timezone: Europe/Helsinki
models:
  Company:
    fields:
      name: string!
      email: email
      phone: phone
      segment: smb | enterprise | government
      notes: text
      accountManager: User
      contacts: Contact[]
      deals: Deal[]
      followUps: FollowUp[]
    ownedBy: accountManager
  Contact:
    fields:
      name: string!
      email: email
      phone: phone
      role: decisionMaker | influencer | user | other
      company: Company!
      notes: text
  Deal:
    fields:
      name: string!
      company: Company!
      contact: Contact
      value: money
      status: prospect | qualified | proposal | negotiation | closedWon | closedLost
      closeDate: date
      notes: text
  FollowUp:
    fields:
      company: Company!
      contact: Contact
      dueOn: date! = TODAY()
      done: bool
      note: text
pages:
  companies:
    crud: Company
    search: [name, email]
    sortable: [name, createdAt]
    filters: [segment, accountManager]
  contacts:
    crud: Contact
    search: [name, email]
    sortable: [name, createdAt]
    filters: [role, company]
  deals:
    crud: Deal
    search: [name, company]
    sortable: [closeDate, value, name]
    filters: [status, company, contact]
    actions: [closeDealWon, closeDealLost]
  followUps:
    crud: FollowUp
    search: [note, company]
    sortable: [dueOn]
    filters: [done, company, contact]
    defaultFilter:
      done: false
  team:
    users: manage
actions:
  closeDealWon:
    on: Deal
    when:
      status: negotiation
    set:
      status: closedWon
      closeDate: TODAY()
  closeDealLost:
    on: Deal
    when:
      status: negotiation
    set:
      status: closedLost
      closeDate: TODAY()
navigation: [companies, contacts, deals, followUps, team]
