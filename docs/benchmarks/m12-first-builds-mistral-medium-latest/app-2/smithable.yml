smithable: 0.1
app:
  name: Sales CRM
  description: Lightweight CRM for a small sales team to manage companies, contacts, deals and follow-ups.
models:
  Company:
    fields:
      name: string!
      email: email
      phone: phone
      segment: smb | enterprise | government
      notes: text
      accountManager: User
    access:
      delete: [admin]
      write: [sales]
  Contact:
    fields:
      firstName: string!
      lastName: string!
      email: email
      phone: phone
      role: decisionMaker | influencer | endUser
      company: Company!
      notes: text
    access:
      delete: [admin]
      write: [sales]
  Deal:
    fields:
      name: string!
      company: Company!
      contact: Contact
      value: money!
      stage: lead | qualified | proposal | negotiation | closedWon | closedLost
      closeDate: date
      notes: text
    access:
      delete: [admin]
      write: [sales]
  FollowUp:
    fields:
      title: string!
      deal: Deal!
      dueDate: date!
      status: pending | completed | canceled
      notes: text
    access:
      delete: [admin]
      write: [sales]
pages:
  companies:
    crud: Company
    search: [name, email]
  contacts:
    crud: Contact
    search: [firstName, lastName, email]
  deals:
    crud: Deal
    search: [name, company]
    filters: [stage, company, contact]
    sortable: [value, closeDate, stage]
    actions: [markWon, markLost]
  follow-ups:
    crud: FollowUp
    search: [title, deal]
    filters: [status, dueDate, deal]
    sortable: [dueDate, status]
    actions: [completeFollowUp, cancelFollowUp]
  team:
    users: manage
actions:
  markWon:
    on: Deal
    when:
      stage: negotiation
    set:
      stage: closedWon
      closeDate: TODAY()
    intent: Mark a deal as won.
  markLost:
    on: Deal
    when:
      stage: negotiation
    set:
      stage: closedLost
      closeDate: TODAY()
    intent: Mark a deal as lost.
  completeFollowUp:
    on: FollowUp
    when:
      status: pending
    set:
      status: completed
    intent: Mark a follow-up as completed.
  cancelFollowUp:
    on: FollowUp
    when:
      status: pending
    set:
      status: canceled
    intent: Cancel a follow-up.
navigation: [companies, contacts, deals, follow-ups, team]
