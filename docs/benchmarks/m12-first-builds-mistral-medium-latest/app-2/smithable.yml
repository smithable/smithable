smithable: 0.1
app:
  name: Small Sales Team CRM
  description: A CRM for a small sales team to manage companies, contacts, deals and follow-ups.
models:
  Company:
    fields:
      name: string!
      industry: string
      website: url
      notes: text
      accountManager: User
    access:
      delete: [admin]
  Contact:
    fields:
      firstName: string!
      lastName: string!
      email: email
      phone: phone
      position: string
      company: Company!
      notes: text
    access:
      delete: [admin]
  Deal:
    fields:
      name: string!
      company: Company!
      contact: Contact
      value: money
      stage: prospect | qualified | proposal | negotiation | closedWon | closedLost
      closeDate: date
      notes: text
    access:
      delete: [admin]
  FollowUp:
    fields:
      title: string!
      deal: Deal!
      dueDate: date!
      notes: text
      completed: bool = false
    access:
      delete: [admin]
pages:
  companies:
    crud: Company
    search: [name]
  contacts:
    crud: Contact
    search: [firstName, lastName, email]
  deals:
    crud: Deal
    search: [name, company]
    filters: [stage, company, contact]
  follow-ups:
    crud: FollowUp
    search: [title, deal]
    filters: [completed, dueDate, deal]
  team:
    users: manage
navigation: [companies, contacts, deals, follow-ups, team]
