smithable: 0.1
app:
  name: Club Site
  description: A football club's site with its teams, players, fixtures and results.
  timezone: Europe/Mariehamn
models:
  Team:
    fields:
      name: string!
      ageGroup: string
      coach: string
      photo: picture
      about: text
      players: Player[]
      matches: Match[]
  Player:
    fields:
      name: string!
      team: Team!
      number:
        type: int
        min: 1
        max: 99
      position: goalkeeper | defender | midfielder | forward
      photo: picture
      bio: text
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away
      ground: string
      competition: string
      status: scheduled | played | postponed | cancelled
      goalsFor:
        type: int
        min: 0
      goalsAgainst:
        type: int
        min: 0
      report: text
pages:
  matches:
    crud: Match
    filters: [team, venue, status]
    search: [opponent, competition]
    actions: [recordResult, postpone]
  teams:
    crud: Team
  players:
    crud: Player
    filters: [team, position]
    search: [name]
  home:
    route: /
    landing:
      hero:
      fixtures:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      squads:
        records: Team
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      goalsFor:
      goalsAgainst:
    intent: Enter the final score of a match that has been played.
  postpone:
    on: Match
    when:
      status: scheduled
    set:
      status: postponed
    intent: Mark a scheduled match as postponed.
