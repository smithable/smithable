smithable: 0.1
app:
  name: Club Football
  description: The club's public site with its teams, players, fixtures and results.
  timezone: Europe/Stockholm
models:
  Team:
    fields:
      name: string!
      ageGroup: string
      coach: string
      about: text
      photo: picture
      players: Player[]
      matches: Match[]
  Player:
    fields:
      name: string!
      team: Team!
      position: goalkeeper | defender | midfielder | forward
      shirtNumber:
        type: int
        min: 1
        max: 99
      photo: picture
      bio: text
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away | neutral
      location: string
      competition: string
      status: scheduled | played | postponed | cancelled
      goalsFor:
        type: int
        min: 0
      goalsAgainst:
        type: int
        min: 0
      report: text
    namedBy: [team, opponent, kickoff]
pages:
  matches:
    crud: Match
    filters: [team, status, venue, kickoff]
    search: [opponent, competition]
    actions: [recordResult, postpone]
  teams:
    crud: Team
  players:
    crud: Player
    filters: [team, position]
    search: [name]
  home:
    route: /
    landing:
      hero:
        button: matches
        secondButton: teams
      upcoming:
        records: Match
        view: table
        where:
          status: scheduled
      results:
        records: Match
        view: table
        where:
          status: played
      ourTeams:
        records: Team
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      goalsFor:
      goalsAgainst:
    intent: Enter the final score of a match and mark it played.
  postpone:
    on: Match
    when:
      status: scheduled
    set:
      status: postponed
    intent: Mark a match as postponed.
