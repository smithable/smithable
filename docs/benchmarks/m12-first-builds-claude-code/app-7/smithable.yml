smithable: 0.1
app:
  name: Club Football
  description: "The football club's site: our teams, players, fixtures and results."
  timezone: Europe/Mariehamn
models:
  Team:
    fields:
      name: string!
      category: senior | youth | women | veterans
      coach: string
      description: text
      players: Player[]
      matches: Match[]
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Player:
    fields:
      name: string!
      team: Team!
      position: goalkeeper | defender | midfielder | forward
      shirtNumber: int
      bio: text
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away
      location: string
      competition: string
      status: scheduled | played | postponed | canceled
      goalsFor: int
      goalsAgainst: int
      report: text
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
pages:
  matches:
    crud: Match
    filters: [team, status, venue]
    search: [opponent, competition]
    actions: [recordResult, postpone, cancel]
  teams:
    crud: Team
  players:
    crud: Player
    filters: [team, position]
    search: [name]
  home:
    route: /
    landing:
      hero:
      footer:
      upcoming:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      ourTeams:
        records: Team
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      goalsFor:
      goalsAgainst:
    allow: [admin]
    intent: Enter the final score of a match and mark it played.
  postpone:
    on: Match
    when:
      status: scheduled
    set:
      status: postponed
    allow: [admin]
    intent: Mark a scheduled match as postponed.
  cancel:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: canceled
    allow: [admin]
    intent: Mark a match as canceled.
