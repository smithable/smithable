smithable: 0.1
app:
  name: Club Football
  description: The football club's site, with its teams, players, fixtures and results.
models:
  Team:
    fields:
      name: string!
      ageGroup: senior | youth | junior | veterans
      league: string
      coach: string
      photo: picture
      about: text
      players: Player[]
      matches: Match[]
  Player:
    fields:
      name: string!
      team: Team!
      number:
        type: int
        min: 1
        max: 99
      position: goalkeeper | defender | midfielder | forward
      photo: picture
      bio: text
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away
      location: string
      competition: league | cup | friendly
      status: scheduled | played | postponed | cancelled
      goalsFor:
        type: int
        min: 0
      goalsAgainst:
        type: int
        min: 0
      report: text
pages:
  teams:
    crud: Team
    search: [name, league]
    filters: [ageGroup]
  players:
    crud: Player
    search: [name]
    filters: [team, position]
  matches:
    crud: Match
    search: [opponent, location]
    filters: [team, status, competition, venue, kickoff]
    actions: [recordResult, postpone]
  home:
    route: /
    landing:
      hero:
        shortcuts: [teams, players, matches]
      footer:
      fixtures:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      squads:
        records: Team
  privacy:
    route: /privacy
    legal: privacy
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      goalsFor:
      goalsAgainst:
    intent: Enter the final score of a match that has been played.
  postpone:
    on: Match
    when:
      status: scheduled
    set:
      status: postponed
    intent: Mark a scheduled match as postponed.
