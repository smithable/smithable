smithable: 0.1
app:
  name: Riverside FC
  description: The football club's site with its teams, players, fixtures and results.
  timezone: Europe/London
models:
  Team:
    fields:
      name: string!
      ageGroup: string
      coach: string
      description: text
      players: Player[]
      matches: Match[]
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Player:
    fields:
      name: string!
      team: Team!
      position: goalkeeper | defender | midfielder | forward
      shirtNumber: int
      bio: text
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away
      location: string
      competition: league | cup | friendly
      status: scheduled | played | postponed | canceled
      goalsFor: int
      goalsAgainst: int
      report: text
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
pages:
  matches:
    crud: Match
    search: [opponent, location]
    filters: [team, status, venue, competition]
    actions: [recordResult, postpone]
  teams:
    crud: Team
    search: [name, coach]
  players:
    crud: Player
    search: [name]
    filters: [team, position]
  home:
    route: /
    landing:
      hero:
        shortcuts: [matches, teams, players]
      footer:
      fixtures:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      squads:
        records: Team
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      goalsFor:
      goalsAgainst:
    allow: [admin]
    intent: Record the final score of a match that has been played.
  postpone:
    on: Match
    when:
      status: scheduled
    set:
      status: postponed
      kickoff:
    allow: [admin]
    intent: Postpone a match to a new kick-off time.
