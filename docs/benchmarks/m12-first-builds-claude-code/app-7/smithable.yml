smithable: 0.1
app:
  name: Football Club
  description: The club's public site with its teams, players, matches and results.
  timezone: Europe/Helsinki
models:
  Team:
    fields:
      name: string!
      category: men | women | youth
      coach: string
      about: text
      picture: picture
      players: Player[]
      matches: Match[]
  Player:
    fields:
      name: string!
      team: Team!
      number:
        type: int
        min: 1
        max: 99
      position: goalkeeper | defender | midfielder | forward
      photo: picture
      about: text
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away
      ground: string
      status: scheduled | played | postponed | canceled
      goalsFor:
        type: int
        min: 0
        required:
          status: played
      goalsAgainst:
        type: int
        min: 0
        required:
          status: played
      report: text
    namedBy: [team, opponent]
pages:
  home:
    route: /
    landing:
      hero:
        button: matches
        secondButton: teams
      fixtures:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      squads:
        records: Team
      footer:
  teams:
    crud: Team
    search: [name, coach]
    filters: [category]
  players:
    crud: Player
    search: [name]
    filters: [team, position]
  matches:
    crud: Match
    actions: [recordResult]
    search: [opponent, ground]
    filters: [team, status, venue]
  privacy:
    route: /privacy
    legal: privacy
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      goalsFor:
      goalsAgainst:
    intent: Enter the final score once a match has been played.
