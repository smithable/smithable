smithable: 0.1
app:
  name: Club Pitch
  description: The football club's public site with its teams, players, fixtures and results.
  timezone: Europe/London
  clock: 24h
  date: day-month
  week: monday
models:
  Team:
    fields:
      name: string! unique
      ageGroup: senior | youth | junior | veterans
      league: string
      coach: string
      photo: picture
      about: text
      players: Player[]
      matches: Match[]
  Player:
    fields:
      name: string!
      team: Team!
      shirtNumber:
        type: int
        min: 1
        max: 99
      position: goalkeeper | defender | midfielder | forward
      photo: picture
      bio: text
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoffAt: datetime!
      venue: home | away
      ground: string
      competition: string
      status: scheduled | played | postponed | cancelled
      ourScore:
        type: int
        min: 0
      theirScore:
        type: int
        min: 0
      report: text
    namedBy: [team, opponent, kickoffAt]
pages:
  matches:
    crud: Match
    filters: [team, status, venue, kickoffAt]
    search: [opponent, competition]
    actions: [recordResult]
  teams:
    crud: Team
  players:
    crud: Player
    search: [name]
    filters: [team, position]
  home:
    route: /
    landing:
      hero:
        button: matches
        secondButton: teams
      fixtures:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      ourTeams:
        records: Team
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      ourScore:
      theirScore:
    intent: Enter the final score once a match has been played.
