smithable: 0.1
app:
  name: Football Club
  description: The club's site with its teams, players, fixtures and results.
  timezone: Europe/Mariehamn
models:
  Team:
    fields:
      name: string!
      ageGroup: string
      coach: string
      description: text
      players: Player[]
      matches: Match[]
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Player:
    fields:
      name: string!
      team: Team!
      position: goalkeeper | defender | midfielder | forward
      shirtNumber: int
      bio: text
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away
      location: string
      status: scheduled | played | postponed | canceled
      goalsFor: int
      goalsAgainst: int
      report: text
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
pages:
  matches:
    crud: Match
    actions: [recordResult]
    filters: [team, venue, status]
  teams:
    crud: Team
  players:
    crud: Player
    search: [name]
    filters: [team, position]
  home:
    route: /
    landing:
      hero:
      footer:
      fixtures:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      teamsList:
        records: Team
actions:
  recordResult:
    on: Match
    when:
      status: scheduled
    set:
      status: played
      goalsFor:
      goalsAgainst:
    allow: [admin]
    intent: Enter the final score of a match.
navigation: [matches, teams, players]
