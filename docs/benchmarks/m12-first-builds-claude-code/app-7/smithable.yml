smithable: 0.1
app:
  name: Club Football
  description: A football club's site with its teams, players, fixtures and results.
  timezone: Europe/Mariehamn
models:
  Team:
    fields:
      name: string!
      ageGroup: string
      coach: string
      about: text
      photo: picture
      players: Player[]
      matches: Match[]
  Player:
    fields:
      name: string!
      team: Team!
      position: goalkeeper | defender | midfielder | forward
      shirtNumber: int
      photo: picture
      bio: text
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: string
      homeOrAway: home | away
      competition: string
      status: scheduled | played | postponed | canceled
      ourScore: int
      theirScore: int
      report: text
pages:
  matches:
    crud: Match
    search: [opponent, competition]
    filters: [team, status, kickoff]
    actions: [recordResult, postpone]
  teams:
    crud: Team
  players:
    crud: Player
    search: [name, position]
    filters: [team, position]
  home:
    route: /
    landing:
      hero:
      upcoming:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      squads:
        records: Team
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      ourScore:
      theirScore:
    intent: Enter the final score of a match that has been played.
  postpone:
    on: Match
    when:
      status: scheduled
    set:
      status: postponed
    intent: Mark a scheduled match as postponed.
