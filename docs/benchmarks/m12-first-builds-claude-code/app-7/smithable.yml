smithable: 0.1
app:
  name: Club Football
  description: The club's site with its teams, players, fixtures and results.
  timezone: Europe/Mariehamn
models:
  Team:
    fields:
      name: string!
      category: senior | youth | women | veterans
      coach: string
      photo: picture
      about: text
      players: Player[]
      matches: Match[]
  Player:
    fields:
      name: string!
      team: Team!
      position: goalkeeper | defender | midfielder | forward
      number:
        type: int
        min: 1
        max: 99
      photo: picture
      bio: text
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away
      ground: string
      competition: string
      status: scheduled | played | postponed | canceled
      goalsFor:
        type: int
        min: 0
      goalsAgainst:
        type: int
        min: 0
      report: text
pages:
  matches:
    crud: Match
    filters: [team, status, venue]
    search: [opponent, competition]
    actions: [recordResult, postpone]
  teams:
    crud: Team
    filters: [category]
  players:
    crud: Player
    filters: [team, position]
    search: [name]
  home:
    route: /
    landing:
      hero:
      footer:
      upcoming:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      ourTeams:
        records: Team
  privacy:
    route: /privacy
    legal: privacy
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      goalsFor:
      goalsAgainst:
    intent: Enter the final score of a match.
  postpone:
    on: Match
    when:
      status: scheduled
    set:
      status: postponed
    intent: Mark a match as postponed.
navigation: [matches, teams, players]
