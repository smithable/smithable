smithable: 0.1
app:
  name: Club Pitch
  description: The club's public site with its teams, players, fixtures and results.
  timezone: Europe/Mariehamn
models:
  Team:
    fields:
      name: string!
      ageGroup: senior | youth | junior
      gender: men | women | mixed
      coach: string
      picture: picture
      about: text
      players: Player[]
      matches: Match[]
  Player:
    fields:
      name: string!
      team: Team!
      number:
        type: int
        min: 1
        max: 99
      position: goalkeeper | defender | midfielder | forward
      photo: picture
      bio: text
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away
      ground: string
      competition: string
      status: scheduled | played | postponed | cancelled
      goalsFor:
        type: int
        min: 0
      goalsAgainst:
        type: int
        min: 0
      report: text
    namedBy: [team, opponent, kickoff]
pages:
  matches:
    crud: Match
    search: [opponent, competition, ground]
    filters: [team, status, venue, kickoff]
    actions: [enterResult, postpone]
  teams:
    crud: Team
    search: [name, coach]
    filters: [ageGroup, gender]
  players:
    crud: Player
    search: [name]
    filters: [team, position]
  home:
    route: /
    landing:
      hero:
        button: matches
        secondButton: teams
      upcoming:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      ourTeams:
        records: Team
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  enterResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      goalsFor:
      goalsAgainst:
    intent: Record the final score of a match that has been played.
  postpone:
    on: Match
    when:
      status: scheduled
    set:
      status: postponed
    intent: Mark a scheduled match as postponed.
