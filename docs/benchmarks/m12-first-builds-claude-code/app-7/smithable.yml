smithable: 0.1
app:
  name: Club Football
  description: The club's site with its teams, players, fixtures and results.
  timezone: Europe/London
models:
  Team:
    fields:
      name: string!
      ageGroup: senior | youth | veterans
      coach: string
      about: text
      players: Player[]
      matches: Match[]
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Player:
    fields:
      name: string!
      team: Team!
      position: goalkeeper | defender | midfielder | forward
      shirtNumber: int
      about: text
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away
      competition: string
      status: scheduled | played | postponed | cancelled
      goalsFor: int
      goalsAgainst: int
      report: text
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
pages:
  matches:
    crud: Match
    filters: [team, status, venue]
    search: [opponent, competition]
    actions: [recordResult, postpone]
  teams:
    crud: Team
  players:
    crud: Player
    filters: [team, position]
    search: [name]
  home:
    route: /
    landing:
      hero:
        shortcuts: [matches, teams, players]
      footer:
      fixtures:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      ourTeams:
        records: Team
  privacy:
    route: /privacy
    legal: privacy
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      goalsFor:
      goalsAgainst:
    allow: [admin]
    intent: Record the final score of a match.
  postpone:
    on: Match
    when:
      status: scheduled
    set:
      status: postponed
    allow: [admin]
    intent: Mark a match as postponed.
navigation: [matches, teams, players]
