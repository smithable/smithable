smithable: 0.1
app:
  name: Riverside FC
  description: "The football club's site: our teams, players, fixtures and results."
  timezone: Europe/Mariehamn
models:
  Team:
    fields:
      name: string!
      ageGroup: string
      coach: string
      summary: text
      photo: picture
      players: Player[]
      matches: Match[]
  Player:
    fields:
      name: string!
      team: Team!
      position: goalkeeper | defender | midfielder | forward
      number:
        type: int
        min: 1
        max: 99
      photo: picture
      bio: text
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away
      location: string
      competition: string
      status: scheduled | played | postponed | cancelled
      goalsFor:
        type: int
        min: 0
      goalsAgainst:
        type: int
        min: 0
      report: text
pages:
  matches:
    crud: Match
    filters: [team, status, venue, kickoff]
    search: [opponent, competition]
    actions: [recordResult, postpone]
  teams:
    crud: Team
  players:
    crud: Player
    filters: [team, position]
    search: [name]
  home:
    route: /
    landing:
      hero:
      footer:
      fixtures:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      ourTeams:
        records: Team
  privacy:
    route: /privacy
    legal: privacy
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      goalsFor:
      goalsAgainst:
    intent: Record the final score of a match.
  postpone:
    on: Match
    when:
      status: scheduled
    set:
      status: postponed
    intent: Mark a match as postponed.
