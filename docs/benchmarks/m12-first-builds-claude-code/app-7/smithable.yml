smithable: 0.1
app:
  name: Clubhouse FC
  description: "The football club's site: our teams, their players, the fixtures and the results."
  timezone: Europe/Helsinki
models:
  Team:
    fields:
      name: string!
      ageGroup: senior | youth | junior | veterans
      coach: string
      picture: picture
      about: text
      players: Player[]
      matches: Match[]
  Player:
    fields:
      name: string!
      team: Team!
      number:
        type: int
        min: 1
        max: 99
      position: goalkeeper | defender | midfielder | forward
      picture: picture
      bio: text
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away
      ground: string
      competition: league | cup | friendly
      status: scheduled | played | postponed | canceled
      goalsFor:
        type: int
        min: 0
      goalsAgainst:
        type: int
        min: 0
      report: text
    namedBy: [team, opponent, kickoff]
pages:
  matches:
    crud: Match
    search: [opponent, ground]
    filters: [team, status, competition, venue, kickoff]
    actions: [recordResult, postpone]
  teams:
    crud: Team
  players:
    crud: Player
    search: [name]
    filters: [team, position]
  home:
    route: /
    landing:
      hero:
        button: matches
        secondButton: teams
      fixtures:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      ourTeams:
        records: Team
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      goalsFor:
      goalsAgainst:
    intent: Enter the final score of a match once it has been played.
  postpone:
    on: Match
    when:
      status: scheduled
    set:
      status: postponed
