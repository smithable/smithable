smithable: 0.1
app:
  name: Club Football
  description: The club's site with its teams, players, fixtures and results.
  currency: EUR
  timezone: Europe/Mariehamn
  clock: 24h
  date: day-month
  week: monday
models:
  Team:
    fields:
      name: string!
      ageGroup: senior | youth | junior
      league: string
      coach: string
      photo: picture
      about: text
      players: Player[]
      matches: Match[]
  Player:
    fields:
      name: string!
      team: Team!
      position: goalkeeper | defender | midfielder | forward
      shirtNumber:
        type: int
        min: 1
        max: 99
      photo: picture
      bio: text
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away | neutral
      ground: string
      competition: league | cup | friendly
      status: scheduled | played | postponed | cancelled
      goalsFor:
        type: int
        min: 0
        required:
          status: played
      goalsAgainst:
        type: int
        min: 0
        required:
          status: played
      report: text
    namedBy: [team, opponent, kickoff]
pages:
  matches:
    crud: Match
    filters: [team, status, venue, competition, kickoff]
    search: [opponent, ground]
    actions: [recordResult, postpone]
  teams:
    crud: Team
  players:
    crud: Player
    search: [name]
    filters: [team, position]
  home:
    route: /
    landing:
      hero:
        button: matches
        secondButton: teams
      upcoming:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      ourTeams:
        records: Team
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      goalsFor:
      goalsAgainst:
    intent: Enter the final score of a match once it has been played.
  postpone:
    on: Match
    when:
      status: scheduled
    set:
      status: postponed
    intent: Mark a match as postponed.
