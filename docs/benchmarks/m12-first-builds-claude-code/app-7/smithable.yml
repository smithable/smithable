smithable: 0.1
app:
  name: Club Football
  description: "The football club's site: our teams, their players, the fixtures coming up and the results."
  currency: EUR
  timezone: Europe/Helsinki
models:
  Team:
    fields:
      name: string!
      category: senior | youth | women | veterans
      coach: string
      about: text
      photo: picture
      players: Player[]
      matches: Match[]
  Player:
    fields:
      name: string!
      team: Team!
      number:
        type: int
        min: 1
        max: 99
      position: goalkeeper | defender | midfielder | forward
      photo: picture
      bio: text
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away | neutral
      ground: string
      competition: string
      status: scheduled | played | postponed | cancelled
      goalsFor:
        type: int
        min: 0
      goalsAgainst:
        type: int
        min: 0
      report: text
    namedBy: [team, opponent, kickoff]
pages:
  matches:
    crud: Match
    search: [opponent, competition, ground]
    filters: [team, status, venue, kickoff]
    actions: [recordResult, postpone]
  teams:
    crud: Team
    search: [name, coach]
    filters: [category]
  players:
    crud: Player
    search: [name]
    filters: [team, position]
  home:
    route: /
    landing:
      hero:
        button: matches
        secondButton: teams
      upcoming:
        records: Match
        view: table
        where:
          status: scheduled
      results:
        records: Match
        view: table
        where:
          status: played
      ourTeams:
        records: Team
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      goalsFor:
      goalsAgainst:
    intent: Enter the final score once a match has been played.
  postpone:
    on: Match
    when:
      status: scheduled
    set:
      status: postponed
    intent: Mark a match as postponed.
navigation: [matches, teams, players]
