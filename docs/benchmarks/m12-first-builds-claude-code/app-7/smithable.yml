smithable: 0.1
app:
  name: Our Football Club
  description: The club's public site with its teams, players, fixtures and results.
  timezone: Europe/Helsinki
models:
  Team:
    fields:
      name: string!
      ageGroup: senior | youth | veterans
      coach: string
      photo: picture
      about: text
      players: Player[]
      matches: Match[]
  Player:
    fields:
      name: string!
      team: Team!
      number:
        type: int
        min: 1
        max: 99
      position: goalkeeper | defender | midfielder | forward
      photo: picture
      about: text
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away
      ground: string
      status: scheduled | played | postponed
      goalsFor:
        type: int
        min: 0
        required:
          status: played
      goalsAgainst:
        type: int
        min: 0
        required:
          status: played
      report: text
    namedBy: [team, opponent]
pages:
  teams:
    crud: Team
    search: [name, coach]
    filters: [ageGroup]
  players:
    crud: Player
    search: [name]
    filters: [team, position]
  matches:
    crud: Match
    search: [opponent, ground]
    filters: [team, status, venue]
    actions: [recordResult]
  home:
    route: /
    landing:
      hero:
        button: matches
        secondButton: teams
      fixtures:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      ourTeams:
        records: Team
      footer:
  privacy:
    route: /privacy
    legal: privacy
  staff:
    users: manage
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      goalsFor:
      goalsAgainst:
    intent: Enter the final score of a match and mark it as played.
