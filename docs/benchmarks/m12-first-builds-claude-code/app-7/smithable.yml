smithable: 0.1
app:
  name: Club Football
  description: The football club's site with its teams, players, fixtures and results.
  timezone: Europe/Mariehamn
models:
  Team:
    fields:
      name: string!
      ageGroup: string
      coach: string
      description: text
      players: Player[]
      matches: Match[]
  Player:
    fields:
      name: string!
      team: Team!
      position: goalkeeper | defender | midfielder | forward
      shirtNumber: int
      bio: text
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away
      location: string
      status: scheduled | played | postponed | canceled
      goalsFor: int
      goalsAgainst: int
      report: text
pages:
  matches:
    crud: Match
    filters: [team, status, venue]
    search: [opponent, location]
    actions: [recordResult, postpone]
  teams:
    crud: Team
    search: [name, coach]
  players:
    crud: Player
    search: [name]
    filters: [team, position]
  home:
    route: /
    landing:
      hero:
        shortcuts: [matches, teams, players]
      footer:
      upcoming:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      ourTeams:
        records: Team
  privacy:
    route: /privacy
    legal: privacy
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      goalsFor:
      goalsAgainst:
    intent: Enter the final score of a match that has been played.
  postpone:
    on: Match
    when:
      status: scheduled
    set:
      status: postponed
    intent: Mark a scheduled match as postponed.
