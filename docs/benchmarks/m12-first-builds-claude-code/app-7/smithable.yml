smithable: 0.1
app:
  name: Club Pitch
  description: The football club's site with its teams, players, fixtures and results.
  timezone: Europe/Mariehamn
models:
  Team:
    fields:
      name: string!
      category: senior | youth | women | veterans
      coach: string
      photo: picture
      about: text
      players: Player[]
      matches: Match[]
  Player:
    fields:
      name: string!
      team: Team!
      shirtNumber:
        type: int
        min: 1
        max: 99
      position: goalkeeper | defender | midfielder | forward
      photo: picture
      bio: text
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away
      ground: string
      competition: string
      status: scheduled | played | postponed | canceled
      goalsFor:
        type: int
        min: 0
      goalsAgainst:
        type: int
        min: 0
      report: text
    namedBy: [team, opponent, kickoff]
pages:
  matches:
    crud: Match
    search: [opponent, competition]
    filters: [team, status, venue, kickoff]
    actions: [recordResult, postpone]
  teams:
    crud: Team
    search: [name, coach]
    filters: [category]
  players:
    crud: Player
    search: [name]
    filters: [team, position]
  home:
    route: /
    landing:
      hero:
        button: matches
        secondButton: teams
      fixtures:
        records: Match
        view: table
        where:
          status: scheduled
      results:
        records: Match
        view: table
        where:
          status: played
      squads:
        records: Team
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      goalsFor:
      goalsAgainst:
    intent: Enter the final score of a match that has been played.
  postpone:
    on: Match
    when:
      status: scheduled
    set:
      status: postponed
    intent: Mark a scheduled match as postponed.
