smithable: 0.1
app:
  name: Club Pitch
  description: A football club's site with its teams, players, fixtures and results.
  currency: GBP
  timezone: Europe/London
models:
  Team:
    fields:
      name: string!
      ageGroup: senior | youth | junior | veterans
      coach: string
      about: text
      photo: picture
      players: Player[]
      matches: Match[]
  Player:
    fields:
      name: string!
      team: Team!
      position: goalkeeper | defender | midfielder | forward
      shirtNumber:
        type: int
        min: 1
        max: 99
      photo: picture
      bio: text
  Match:
    fields:
      team: Team!
      opponent: string!
      kickoff: datetime!
      venue: home | away
      ground: string
      status: scheduled | played | postponed | cancelled
      ourScore:
        type: int
        min: 0
      theirScore:
        type: int
        min: 0
      report: text
    namedBy: [team, opponent, kickoff]
pages:
  matches:
    crud: Match
    filters: [team, status, venue, kickoff]
    search: [opponent, ground]
    actions: [recordResult, postpone]
  teams:
    crud: Team
    filters: [ageGroup]
  players:
    crud: Player
    filters: [team, position]
    search: [name]
  home:
    route: /
    landing:
      hero:
        button: matches
        secondButton: teams
      fixtures:
        records: Match
        where:
          status: scheduled
      results:
        records: Match
        where:
          status: played
      ourTeams:
        records: Team
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  recordResult:
    on: Match
    when:
      status: [scheduled, postponed]
    set:
      status: played
      ourScore:
      theirScore:
    intent: Enter the final score of a match that has been played.
  postpone:
    on: Match
    when:
      status: scheduled
    set:
      status: postponed
    intent: Mark a fixture as postponed.
