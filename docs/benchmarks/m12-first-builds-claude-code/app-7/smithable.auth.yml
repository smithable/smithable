smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  member:
    description: Follows the club; only administrators add and change teams, players and matches.
    pages: all
assistant:
  for: signed-in
public:
  pages: [home, matches, teams, players, privacy]
  read: [Team, Player, Match]
defaultRole: member
admins: [johan@smithable.ai]
