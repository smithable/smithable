    features:
      items: [{ title: "Borrow, don't buy", text: Need a drill for one afternoon? Someone down the street probably has one sitting in a drawer. }, { title: Share what you own, text: Add the tools in your shed with a photo and say where to pick them up. }, { title: Keep track of loans, text: "Note who has your tool and when it is due back, then mark it returned when it comes home." }]
    faq:
      items: [{ question: Does it cost anything?, answer: No. Neighbors lend their tools for free; agree on anything else between yourselves. }, { question: How do I borrow a tool?, answer: "Sign in, open the tool and send its owner a message to arrange a time to pick it up." }, { question: What if something breaks?, answer: Talk it over with the owner and treat borrowed tools as carefully as your own. }]
