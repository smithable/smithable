smithableContent: 0.1
pages:
  home:
    features:
      items: [{ title: "Borrow, don't buy", text: Need a drill for one afternoon? Find one a few doors away instead of buying a new one. }, { title: Share what sits in your shed, text: "List the ladder, hedge trimmer or pressure washer you rarely use and let neighbors put it to work." }, { title: Keep track of every loan, text: "Note when a tool goes out and when it is due back, and mark it returned with one click." }, { title: Get to know your street, text: Every loan is a reason to say hello to someone who lives nearby. }]
    faq:
      items: [{ question: Does it cost anything?, answer: No. Neighbors lend their tools for free. }, { question: How do I borrow a tool?, answer: "Sign in, open the tool and send its owner a message to agree on a time, then record the loan." }, { question: What if a tool breaks?, answer: Talk it over with the owner. Most neighbors agree on a fair fix or a replacement. }]
