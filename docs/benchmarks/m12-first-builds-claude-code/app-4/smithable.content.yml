smithableContent: 0.1
pages:
  home:
    features:
      items: [{ title: Borrow instead of buying, text: Need a drill for one afternoon? Find one a few doors away instead of buying one. }, { title: Share what sits in your shed, text: Post the tools you rarely use so your neighbors can put them to work. }, { title: Ask the owner directly, text: Send the owner a message from the tool's page and agree on when to pick it up. }, { title: Save your favorites, text: Heart the tools you will need again and find them in one place. }]
    faq:
      items: [{ question: Does it cost anything?, answer: No. Neighbors lend their tools for free; anything else is between you and the owner. }, { question: How do I borrow a tool?, answer: "Sign in, open the tool and send its owner a message. You agree on pick-up and return together." }, { question: Who sees my contact details?, answer: Nobody browsing the catalog. The owner only hears from you when you write to them. }, { question: Why does my tool not show yet?, answer: "Photos are checked before a tool is listed, so it shows up as soon as they are approved." }]
    hero:
      title: Your neighborhood's toolshed
      subtitle: Borrow the tools you need from people nearby, and lend out the ones gathering dust.
      button: Browse tools
      secondButton: Lend a tool
      image:
        src: images/hero.webp
        alt: A carpenter's workshop with a workbench, hand tools on the wall and sawdust in the light from a window
        generated: true
logo:
  src: images/logo.webp
  alt: A toolbox
  generated: true
