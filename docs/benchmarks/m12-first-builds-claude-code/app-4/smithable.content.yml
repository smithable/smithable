    hero:
      title: Borrow the drill, skip the store
      subtitle: Your neighbors already own the ladder, the hedge trimmer and the tile cutter. Find what you need nearby and give your own tools a second life.
      button: Browse tools
      secondButton: Ask to borrow
      image:
        src: images/hero.webp
        alt: A carpenter's workshop with a workbench, hand tools on the wall and sawdust in the light from a window
        generated: true
    features:
      items: [{ title: See what's on the street, text: "Look through every tool the neighborhood has shared, with photos, condition and where to pick it up." }, { title: Ask for the days you need, text: "Pick a tool, choose the dates and add a note. The owner says yes or no." }, { title: Share what sits in your shed, text: List a tool in a minute and decide who borrows it and when. }, { title: Keep track of what's out, text: Every loan shows who has the tool and when it's due back. }]
    faq:
      items: [{ question: Does borrowing cost anything?, answer: No. Tools are lent between neighbors for free. }, { question: Who can join?, answer: Neighbors invited by the library's organizers. Anyone can browse the tools first. }, { question: What if something breaks?, answer: Talk to the owner and note it on the loan. Mark a tool's condition so the next borrower knows. }]
