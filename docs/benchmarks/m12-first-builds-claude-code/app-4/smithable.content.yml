smithableContent: 0.1
pages:
  home:
    features:
      items: [{ title: Borrow instead of buying, text: That drill you need once a year is probably sitting in a garage down the street. }, { title: Share what you own, text: "List your ladder, mower or sander with a photo and let neighbors ask to borrow it." }, { title: Ask the owner directly, text: Send a message from the tool's page to agree on when to pick it up. }, { title: Keep track of loans, text: "Note who has your tool and when it should come back, then mark it returned." }]
    faq:
      items: [{ question: Does it cost anything?, answer: "No. Lending happens between neighbors, on terms you agree together." }, { question: Who sees my contact details?, answer: Nobody browsing the library. Owners only hear from neighbors who message them. }, { question: Why does my tool not show yet?, answer: "Photos are checked before a listing appears, which usually takes a short while." }]
    hero:
      title: Your neighborhood's shared toolshed
      subtitle: Browse the tools your neighbors are happy to lend, and share your own.
      button: Browse tools
      secondButton: Lend a tool
      image:
        src: images/hero.webp
        alt: A carpenter's workshop with a workbench, hand tools on the wall and sawdust in the light from a window
        generated: true
logo:
  src: images/logo.webp
  alt: A toolbox
  generated: true
