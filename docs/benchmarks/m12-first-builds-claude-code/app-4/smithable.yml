smithable: 0.1
app:
  name: Neighborhood Tool Library
  description: Neighbors list the tools they own and lend them to each other.
  timezone: Europe/Helsinki
models:
  Tool:
    fields:
      name: string!
      photos: pictures!
      description: text!
      category: powerTools | handTools | garden | ladders | cleaning | other
      condition: likeNew | good | worn
      area: string
      available: bool = true
    review: [photos]
  Loan:
    fields:
      tool: Tool!
      borrower:
        type: User
        by: app
        default: ME()
      neededFrom: date!
      returnBy: date!
      note: text
      status:
        type: requested | lent | returned | declined
        by: app
    namedBy: tool
    capacity:
      per: tool
      max: 1
      where:
        status: [requested, lent]
pages:
  tools:
    route: /
    crud: Tool
    search: [name, description, area]
    filters: [category, condition, available]
    defaultFilter:
      available: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  borrowing:
    crud: Loan
    filters: [borrower, status]
    defaultFilter:
      borrower: me
  lending:
    crud: Loan
    mine: true
    filters: [status]
    defaultFilter:
      status: [requested, lent]
  review:
    review: all
  home:
    route: /welcome
    landing:
      hero:
        button: tools
        secondButton: myTools
      latest:
        records: Tool
        where:
          available: true
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  lend:
    on: Loan
    when:
      status: requested
    set:
      status: lent
    intent: The tool's owner agrees to the request and hands the tool over.
  decline:
    on: Loan
    when:
      status: requested
    set:
      status: declined
    intent: The tool's owner turns the request down, which frees the tool for others.
  markReturned:
    on: Loan
    when:
      status: lent
    set:
      status: returned
    intent: The tool's owner has the tool back, so others can ask for it.
navigation: [tools, myTools, borrowing, lending, review]
