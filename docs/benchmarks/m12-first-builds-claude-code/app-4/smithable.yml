smithable: 0.1
app:
  name: Shed Share
  description: Neighbors list the tools they own and lend them to each other.
  currency: EUR
models:
  Tool:
    fields:
      title: string!
      photos: pictures!
      description: text!
      category: powerTools | handTools | garden | ladders | cleaning | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
    review: [photos]
pages:
  catalog:
    route: /
    crud: Tool
    search: [title, description, place]
    filters: [category, condition, available]
    sortable: [title, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  saved:
    crud: Tool
    favorites: only
  review:
    review: all
  home:
    route: /welcome
    landing:
      hero:
        button: catalog
        secondButton: myTools
      features:
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  markLent:
    on: Tool
    when:
      available: true
    set:
      available: false
    intent: The owner marks a tool as lent out, so neighbors see it is away.
  markReturned:
    on: Tool
    when:
      available: false
    set:
      available: true
    intent: The owner marks a tool as back and ready to borrow again.
