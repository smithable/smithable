smithable: 0.1
app:
  name: Toolshare
  description: Neighbors lend each other the tools they own, from drills to ladders.
  currency: EUR
  timezone: Europe/Helsinki
models:
  Tool:
    fields:
      title: string!
      photos: pictures
      description: text!
      category: power | hand | garden | ladders | cleaning | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
  Loan:
    fields:
      tool: Tool!
      borrowerName: string!
      borrowerEmail: email
      lentOn: date!
      dueOn: date
      status: out | returned
      returnedOn:
        type: date
        by: app
      note: text
pages:
  tools:
    route: /
    crud: Tool
    search: [title, description, place]
    filters: [category, condition, available]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  loans:
    crud: Loan
    filters: [status, dueOn]
    defaultFilter:
      status: out
    actions: [markReturned]
  home:
    route: /welcome
    landing:
      hero:
        button: tools
        secondButton: myTools
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  markReturned:
    on: Loan
    when:
      status: out
    set:
      status: returned
      returnedOn: TODAY()
    intent: Record that the borrowed tool came back.
navigation: [tools, myTools, loans]
