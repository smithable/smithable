smithable: 0.1
app:
  name: Tool Shed
  description: Neighbors lend each other the tools they own instead of everyone buying their own.
models:
  Tool:
    fields:
      title: string!
      photos: pictures!
      description: text!
      category: power | garden | hand | ladders | cleaning | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
    review: [photos]
pages:
  tools:
    route: /
    crud: Tool
    search: [title, description, place]
    filters: [category, condition, available]
    sortable: [title, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  saved:
    crud: Tool
    favorites: only
  review:
    review: all
  home:
    route: /welcome
    landing:
      hero:
        button: tools
        secondButton: myTools
      latest:
        records: Tool
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
navigation: [tools, myTools, saved, review]
