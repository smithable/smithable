smithable: 0.1
app:
  name: Neighbor Tools
  description: A tool library where neighbors lend each other tools.
  currency: EUR
models:
  Tool:
    fields:
      title: string!
      photos: pictures!
      description: text!
      category: garden | power | hand | ladders | cleaning | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
    review: [photos]
  Loan:
    fields:
      tool: Tool!
      borrower: User!
      lentOn: date!
      dueOn: date
      status: out | returned
      returnedOn:
        type: date
        by: app
      note: text
pages:
  tools:
    route: /
    crud: Tool
    search: [title, description, place]
    filters: [category, condition, available]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  saved:
    crud: Tool
    favorites: only
  loans:
    crud: Loan
    filters: [status, tool]
    actions: [markReturned]
  review:
    review: all
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latest:
        records: Tool
        where:
          available: true
  privacy:
    route: /privacy
    legal: privacy
actions:
  markReturned:
    on: Loan
    when:
      status: out
    set:
      status: returned
      returnedOn: TODAY()
    intent: Record that the borrowed tool has come back.
navigation: [tools, myTools, loans, saved, review]
