smithable: 0.1
app:
  name: Neighbor Toolshed
  description: Neighbors lend each other tools instead of each buying their own.
models:
  Tool:
    fields:
      name: string!
      photos: pictures
      description: text!
      category: powerTools | handTools | garden | ladders | cleaning | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
pages:
  catalog:
    route: /
    crud: Tool
    search: [name, description, place]
    filters: [category, condition, available]
    sortable: [name, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  saved:
    crud: Tool
    favorites: only
  home:
    route: /welcome
    landing:
      hero:
      latest:
        records: Tool
        where:
          available: true
      footer:
  privacy:
    route: /privacy
    legal: privacy
navigation: [catalog, myTools, saved]
