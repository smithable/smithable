smithable: 0.1
app:
  name: Shed Share
  description: Neighbors lend each other tools instead of each buying their own.
  currency: EUR
models:
  Tool:
    fields:
      title: string!
      photos: pictures!
      description: text!
      category: power | garden | hand | ladders | cleaning | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
    review: [photos]
pages:
  tools:
    route: /
    crud: Tool
    search: [title, description, place]
    filters: [category, condition, available]
    sortable: [title, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  saved:
    crud: Tool
    favorites: only
  review:
    review: all
  home:
    route: /welcome
    landing:
      hero:
        shortcuts: [tools]
      latest:
        records: Tool
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  lendOut:
    on: Tool
    when:
      available: true
    set:
      available: false
    intent: Mark a tool as lent to a neighbor.
  markReturned:
    on: Tool
    when:
      available: false
    set:
      available: true
    intent: Mark a lent tool as back and available again.
navigation: [tools, myTools, saved, review]
