smithable: 0.1
app:
  name: Shared Shed
  description: Neighbors lend each other tools instead of each buying their own.
models:
  Tool:
    fields:
      name: string!
      photos: pictures!
      description: text!
      category: power | hand | garden | ladders | cleaning | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
    review: [photos]
  Loan:
    fields:
      tool: Tool!
      borrower: User!
      lentOn: date!
      dueOn: date
      status: out | returned
      returnedOn: date
      notes: text
pages:
  tools:
    route: /
    crud: Tool
    search: [name, description, place]
    filters: [category, condition, available]
    sortable: [name, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  saved:
    crud: Tool
    favorites: only
  loans:
    crud: Loan
    filters: [status, tool]
    actions: [markReturned]
  review:
    review: all
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latest:
        records: Tool
        where:
          available: true
  privacy:
    route: /privacy
    legal: privacy
actions:
  markReturned:
    on: Loan
    when:
      status: out
    set:
      status: returned
      returnedOn: TODAY()
    intent: Record that the borrowed tool has come back.
navigation: [tools, myTools, saved, loans, review]
