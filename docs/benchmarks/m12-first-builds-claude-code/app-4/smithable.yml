smithable: 0.1
app:
  name: Shed Share
  description: Neighbors lend each other tools instead of buying their own.
  currency: EUR
models:
  Tool:
    fields:
      name: string!
      photos: pictures!
      description: text!
      category: garden | power | hand | ladders | cleaning | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
    review: [photos]
  Loan:
    fields:
      tool: Tool!
      startDate: date!
      dueDate: date
      status: borrowed | returned
      returnedOn: date
      notes: text
pages:
  tools:
    route: /
    crud: Tool
    search: [name, description, place]
    filters: [category, condition, available]
    sortable: [name, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  saved:
    crud: Tool
    favorites: only
  myLoans:
    crud: Loan
    mine: true
    actions: [markReturned]
  review:
    review: all
  home:
    route: /welcome
    landing:
      hero:
      latest:
        records: Tool
        where:
          available: true
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  markReturned:
    on: Loan
    when:
      status: borrowed
    set:
      status: returned
      returnedOn: TODAY()
    intent: Record that the borrowed tool has been brought back.
navigation: [tools, myTools, myLoans, saved, review]
