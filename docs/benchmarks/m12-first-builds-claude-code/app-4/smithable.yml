smithable: 0.1
app:
  name: Toolshed
  description: Neighbors lend each other tools instead of buying their own.
  currency: EUR
models:
  Tool:
    fields:
      title: string!
      photos: pictures
      description: text!
      category: power | garden | hand | ladders | cleaning | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
pages:
  catalog:
    route: /
    crud: Tool
    search: [title, description, place]
    filters: [category, condition, available]
    sortable: [title, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  saved:
    crud: Tool
    favorites: only
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latest:
        records: Tool
        where:
          available: true
navigation: [catalog, myTools, saved]
actions:
  markLent:
    on: Tool
    when:
      available: true
    set:
      available: false
    intent: Mark the tool as lent out to a neighbor.
  markReturned:
    on: Tool
    when:
      available: false
    set:
      available: true
    intent: Mark the tool as back and ready to lend again.
