smithable: 0.1
app:
  name: Toolshed
  description: Neighbors lend each other tools instead of each buying their own.
models:
  Tool:
    fields:
      name: string!
      photos: pictures
      description: text!
      category: power | hand | garden | ladders | cleaning | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
pages:
  catalog:
    route: /
    crud: Tool
    search: [name, description, place]
    filters: [category, condition, available]
    sortable: [name, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  saved:
    crud: Tool
    favorites: only
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latest:
        records: Tool
        where:
          available: true
actions:
  markLent:
    on: Tool
    when:
      available: true
    set:
      available: false
    intent: Mark a tool as lent out to a neighbor.
  markReturned:
    on: Tool
    when:
      available: false
    set:
      available: true
    intent: Mark a tool as returned and available again.
