smithable: 0.1
app:
  name: Toolshare
  description: Neighbors lend each other tools instead of each buying their own.
  currency: EUR
  timezone: Europe/Helsinki
models:
  Tool:
    fields:
      title: string!
      photos: pictures
      description: text!
      category: power | garden | hand | ladders | cleaning | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
  Loan:
    fields:
      tool: Tool!
      from: date!
      until: date!
      status: borrowed | returned
      note: text
pages:
  catalog:
    route: /
    crud: Tool
    search: [title, description, place]
    filters: [category, condition, available]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  loans:
    crud: Loan
    filters: [status, until]
    defaultFilter:
      status: borrowed
    actions: [markReturned]
  saved:
    crud: Tool
    favorites: only
  home:
    route: /welcome
    landing:
      hero:
        button: catalog
        secondButton: myTools
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  markReturned:
    on: Loan
    when:
      status: borrowed
    set:
      status: returned
    intent: Mark a borrowed tool as given back to its owner.
navigation: [catalog, myTools, loans, saved]
