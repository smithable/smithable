smithable: 0.1
app:
  name: Neighbor Toolshed
  description: A tool library where neighbors lend each other the tools they own.
  timezone: Europe/Helsinki
models:
  Tool:
    fields:
      name: string!
      photos: pictures
      description: text
      category: powerTools | handTools | garden | ladders | cleaning | other
      condition: likeNew | good | worn
      area: string
      loans: Loan[]
  Loan:
    fields:
      tool: Tool!
      borrower:
        type: User
        by: app
        default: ME()
      status:
        type: requested | lent | returned | declined
        by: app
      neededFrom: date!
      returnBy: date!
      note: text
      returnedOn:
        type: date
        by: app
    namedBy: [tool, neededFrom]
    capacity:
      per: tool
      max: 1
      where:
        status: [requested, lent]
pages:
  catalog:
    route: /
    crud: Tool
    search: [name, description, area]
    filters: [category, condition]
    sortable: [name, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  borrowed:
    crud: Loan
    filters: [borrower, status]
    defaultFilter:
      borrower: me
  lending:
    crud: Loan
    mine: true
    filters: [status]
    defaultFilter:
      status: [requested, lent]
  home:
    route: /welcome
    landing:
      hero:
        button: catalog
        secondButton: myTools
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  lend:
    on: Loan
    when:
      status: requested
    set:
      status: lent
    intent: The tool's owner agrees and hands the tool over.
  decline:
    on: Loan
    when:
      status: requested
    set:
      status: declined
    intent: The tool's owner cannot lend it this time, which frees the tool for others.
  markReturned:
    on: Loan
    when:
      status: lent
    set:
      status: returned
      returnedOn: TODAY()
    intent: The tool is back with its owner and can be borrowed again.
