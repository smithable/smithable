smithable: 0.1
app:
  name: Toolshare
  description: Neighbors lend each other tools instead of each buying their own.
  currency: EUR
models:
  Tool:
    fields:
      title: string!
      photos: pictures!
      description: text!
      category: powerTools | handTools | garden | ladders | cleaning | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
pages:
  catalog:
    route: /
    crud: Tool
    search: [title, description, place]
    filters: [category, condition, available]
    sortable: [title, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  saved:
    crud: Tool
    favorites: only
  home:
    route: /welcome
    landing:
      hero:
        button: catalog
      latest:
        records: Tool
        where:
          available: true
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
navigation: [catalog, myTools, saved]
