smithable: 0.1
app:
  name: Toolshare
  description: Neighbors lend each other the tools they have and borrow the ones they need.
  currency: EUR
models:
  Tool:
    fields:
      name: string!
      photos: pictures!
      description: text!
      category: handTools | powerTools | garden | ladders | cleaning | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
    review: [photos]
pages:
  catalog:
    route: /
    crud: Tool
    search: [name, description, place]
    filters: [category, condition, available]
    sortable: [name, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  saved:
    crud: Tool
    favorites: only
  review:
    review: all
  home:
    route: /welcome
    landing:
      hero:
        button: catalog
        secondButton: myTools
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
navigation: [catalog, myTools, saved, review]
