smithable: 0.1
app:
  name: Toolshed Commons
  description: Neighbors list the tools they own and lend them to each other.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Tool:
    fields:
      name: string!
      photos: pictures
      description: text
      category: powerTools | handTools | garden | ladders | cleaning | other
      condition: good | worn | needsCare
      place: string
      available: bool = true
  Loan:
    fields:
      tool: Tool!
      borrower:
        type: User
        by: app
        default: ME()
      from: date!
      until: date!
      note: text
      status: requested | lent | returned | declined
pages:
  tools:
    route: /
    crud: Tool
    search: [name, description, place]
    filters: [category, condition, available]
    favorites: true
  myTools:
    crud: Tool
    mine: true
  loans:
    crud: Loan
    filters: [status, tool, from]
    actions: [lend, decline, markReturned]
  home:
    route: /welcome
    landing:
      hero:
        button: tools
        secondButton: loans
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  lend:
    on: Loan
    when:
      status: requested
    set:
      status: lent
    intent: The tool's owner agrees to the request and hands the tool over.
  decline:
    on: Loan
    when:
      status: requested
    set:
      status: declined
    intent: The tool's owner turns the request down.
  markReturned:
    on: Loan
    when:
      status: lent
    set:
      status: returned
    intent: The tool's owner confirms the tool came back.
navigation: [tools, myTools, loans, team]
