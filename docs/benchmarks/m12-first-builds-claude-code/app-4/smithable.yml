smithable: 0.1
app:
  name: Toolshare
  description: Neighbors lend each other tools instead of each buying their own.
models:
  Tool:
    fields:
      title: string!
      photos: pictures!
      description: text!
      category: powerTools | handTools | garden | ladders | cleaning | kitchen | camping | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
    review: [photos]
  Loan:
    fields:
      tool: Tool!
      borrower: User!
      lentOn: date!
      dueOn: date
      status: out | returned
      returnedOn: date
      notes: text
pages:
  tools:
    route: /
    crud: Tool
    search: [title, description, place]
    filters: [category, condition, available]
    sortable: [title, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  loans:
    crud: Loan
    filters: [status, dueOn]
    actions: [markReturned]
  saved:
    crud: Tool
    favorites: only
  home:
    route: /welcome
    landing:
      hero:
      footer:
      features:
      latestTools:
        records: Tool
        where:
          available: true
  privacy:
    route: /privacy
    legal: privacy
  review:
    review: all
actions:
  markReturned:
    on: Loan
    when:
      status: out
    set:
      status: returned
      returnedOn: TODAY()
    intent: Record that a lent tool has come back.
navigation: [tools, myTools, loans, saved, review]
