smithable: 0.1
app:
  name: Toolshed
  description: Neighbors lend each other tools instead of each buying their own.
  currency: EUR
models:
  Tool:
    fields:
      title: string!
      photos: pictures!
      description: text!
      category: powerTools | handTools | garden | ladders | cleaning | painting | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
    review: [photos]
pages:
  catalog:
    route: /
    crud: Tool
    search: [title, description, place]
    filters: [category, condition, available]
    sortable: [title, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  saved:
    crud: Tool
    favorites: only
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latest:
        records: Tool
        where:
          available: true
  privacy:
    route: /privacy
    legal: privacy
  review:
    review: all
actions:
  lendOut:
    on: Tool
    when:
      available: true
    set:
      available: false
    intent: Mark the tool as lent to a neighbor.
  markReturned:
    on: Tool
    when:
      available: false
    set:
      available: true
    intent: Mark the tool as back and available to borrow.
navigation: [catalog, myTools, saved, review]
