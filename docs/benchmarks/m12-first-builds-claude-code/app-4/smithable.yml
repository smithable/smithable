smithable: 0.1
app:
  name: Toolshed
  description: Neighbors lend each other tools instead of each buying their own.
  currency: EUR
models:
  Tool:
    fields:
      name: string!
      photos: pictures
      description: text!
      category: power | hand | garden | ladders | cleaning | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
  Loan:
    fields:
      tool: Tool!
      borrower: string!
      lentOn: date!
      dueOn: date
      status: out | returned
      returnedOn: date
      notes: text
pages:
  catalog:
    route: /
    crud: Tool
    search: [name, description, place]
    filters: [category, condition, available]
    sortable: [name, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  saved:
    crud: Tool
    favorites: only
  loans:
    crud: Loan
    filters: [status, tool]
    actions: [markReturned]
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latest:
        records: Tool
        where:
          available: true
  privacy:
    route: /privacy
    legal: privacy
actions:
  markReturned:
    on: Loan
    when:
      status: out
    set:
      status: returned
      returnedOn: TODAY()
    intent: Record that the borrowed tool has come back.
navigation: [catalog, myTools, loans, saved]
