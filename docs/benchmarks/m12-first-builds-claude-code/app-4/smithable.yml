smithable: 0.1
app:
  name: Toolshare
  description: Neighbors lend each other tools instead of everyone buying their own.
models:
  Tool:
    fields:
      name: string!
      photos: pictures!
      description: text!
      category: powerTools | handTools | garden | ladders | cleaning | camping | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
    review: [photos]
  Loan:
    fields:
      tool: Tool!
      borrower: string!
      borrowerContact: string
      lentOn: date!
      dueOn: date
      status: out | returned
      returnedOn: date
      notes: text
pages:
  tools:
    route: /
    crud: Tool
    search: [name, description, place]
    filters: [category, condition, available]
    sortable: [name, createdAt]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  loans:
    crud: Loan
    filters: [status, tool]
    actions: [markReturned]
  review:
    review: all
  home:
    route: /welcome
    landing:
      hero:
      latest:
        records: Tool
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  markReturned:
    on: Loan
    when:
      status: out
    set:
      status: returned
      returnedOn: TODAY()
    intent: Record that the borrowed tool came back.
navigation: [tools, myTools, loans, review]
