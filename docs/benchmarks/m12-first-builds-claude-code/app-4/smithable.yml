smithable: 0.1
app:
  name: Toolshed
  description: "Neighbors share their tools: list what you own, find what you need, and keep track of what is lent out."
  currency: EUR
  timezone: Europe/Helsinki
models:
  Tool:
    fields:
      name: string!
      photos: pictures
      description: text
      category: powerTools | handTools | garden | ladders | cleaning | camping | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
  Loan:
    fields:
      tool: Tool!
      borrower: User!
      lentOn: date!
      dueOn: date
      status: lent | returned
      note: text
pages:
  tools:
    route: /
    crud: Tool
    search: [name, description, place]
    filters: [category, condition, available]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  loans:
    crud: Loan
    filters: [status, tool]
    defaultFilter:
      status: lent
    actions: [markReturned]
  home:
    route: /welcome
    landing:
      hero:
        button: tools
        secondButton: myTools
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  markReturned:
    on: Loan
    when:
      status: lent
    set:
      status: returned
    intent: The lender records that the tool came back.
