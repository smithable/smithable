smithable: 0.1
app:
  name: Toolshed Commons
  description: Neighbors list the tools they own and lend them to each other.
  currency: EUR
models:
  Tool:
    fields:
      title: string!
      photos: pictures!
      description: text!
      category: power | garden | hand | ladders | cleaning | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
    review: [photos]
  Loan:
    fields:
      tool: Tool!
      borrower: string!
      borrowedOn: date!
      dueOn: date
      status: out | returned
      note: text
pages:
  tools:
    route: /
    crud: Tool
    search: [title, description, place]
    filters: [category, condition, available]
    favorites: true
    contact: owner
  myTools:
    crud: Tool
    mine: true
  loans:
    crud: Loan
    mine: true
    filters: [status, tool, dueOn]
    defaultFilter:
      status: out
    actions: [markReturned]
  saved:
    crud: Tool
    favorites: only
  review:
    review: all
  home:
    route: /welcome
    landing:
      hero:
        button: tools
        secondButton: myTools
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  markReturned:
    on: Loan
    when:
      status: out
    set:
      status: returned
    intent: Record that the borrowed tool has come back.
navigation: [tools, myTools, loans, saved, review]
