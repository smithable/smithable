smithable: 0.1
app:
  name: Shop Status
  description: Is the shop working? The state of our services, outages and their updates, live.
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      summary: markdown
      updates: IncidentUpdate[]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
pages:
  incidents:
    crud: Incident
    actions: [identified, monitoring, resolve]
  updates:
    crud: IncidentUpdate
  components:
    crud: Component
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Component
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
      recent:
        records: Incident
        where:
          status: resolved
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  identified:
    on: Incident
    when:
      status: investigating
    set:
      status: identified
    add:
      IncidentUpdate:
        at: NOW()
        status: identified
        message: The cause is found and a fix is being worked on.
    intent: The cause is found; the incident moves to identified, with an update saying so.
  monitoring:
    on: Incident
    when:
      status: [investigating, identified]
    set:
      status: monitoring
    add:
      IncidentUpdate:
        at: NOW()
        status: monitoring
        message: A fix is out. We are watching before we close this.
    intent: A fix is out; the incident is watched before it is closed, with an update saying so.
  resolve:
    on: Incident
    when:
      status: [investigating, identified, monitoring]
    set:
      status: resolved
      resolvedAt: NOW()
    add:
      IncidentUpdate:
        at: NOW()
        status: resolved
        message: This incident is resolved.
    intent: The incident is over, with an update saying so.
navigation: [incidents, updates, components, team]
