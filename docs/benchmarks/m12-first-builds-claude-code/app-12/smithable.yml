smithable: 0.1
app:
  name: Shop Status
  description: Is the web shop working? The live state of its services, its outages and their updates.
  timezone: Etc/UTC
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      summary: markdown
      updates: IncidentUpdate[]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
pages:
  home:
    route: /
    landing:
      hero:
      services:
        records: Component
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
      recent:
        records: Incident
        where:
          status: resolved
      footer:
  privacy:
    route: /privacy
    legal: privacy
  incidents:
    crud: Incident
    actions: [identified, monitoring, resolve]
    filters: [status]
  updates:
    crud: IncidentUpdate
  components:
    crud: Component
  overview:
    dashboard:
      open:
        count: Incident
        where:
          status: [investigating, identified, monitoring]
      perMonth:
        count: Incident
        by: detectedAt
      latest:
        list: Incident
        limit: 5
  team:
    users: manage
actions:
  identified:
    on: Incident
    when:
      status: investigating
    set:
      status: identified
    add:
      IncidentUpdate:
        at: NOW()
        status: identified
        message: We have found the cause and are working on a fix.
    intent: The cause is known; the incident moves to identified, with an update saying so.
  monitoring:
    on: Incident
    when:
      status: [investigating, identified]
    set:
      status: monitoring
    add:
      IncidentUpdate:
        at: NOW()
        status: monitoring
        message: A fix has been released and we are keeping an eye on it.
    intent: A fix is out; the incident is watched before it is closed, with an update saying so.
  resolve:
    on: Incident
    when:
      status: [investigating, identified, monitoring]
    set:
      status: resolved
      resolvedAt: NOW()
    add:
      IncidentUpdate:
        at: NOW()
        status: resolved
        message: This outage is over and everything is back to normal.
    intent: The incident is over, with an update saying so. The service's state stays what the team sets.
navigation: [overview, incidents, updates, components, team]
