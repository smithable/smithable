smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  staff:
    description: Writes incidents and their updates.
    pages: [incidents, updates]
    create: all
    write: all
assistant:
  for: signed-in
public:
  pages: [home, privacy]
  read: [Component, { Incident: { where: { status: [investigating, identified, monitoring, resolved] } } }, IncidentUpdate]
defaultRole: staff
api:
  models: [Component, Incident]
  actions: [resolve]
  assistants: true
admins: [johan@smithable.ai]
