smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
public:
  pages: [home]
  read: [Component, { Incident: { where: { status: [investigating, identified, monitoring, resolved] } } }, IncidentUpdate]
roles:
  admin:
    description: Runs the status page and the team.
  staff:
    description: Writes incidents and their updates.
defaultRole: staff
admins: [johan@smithable.ai]
