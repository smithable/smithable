smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  staff:
    description: Reports outages and posts their updates.
    pages: [overview, incidents, updates]
    create: [Incident, IncidentUpdate]
    write: [Incident, IncidentUpdate]
assistant:
  for: signed-in
public:
  pages: [home]
  read: [Component, Incident, IncidentUpdate]
defaultRole: staff
admins: [johan@smithable.ai]
