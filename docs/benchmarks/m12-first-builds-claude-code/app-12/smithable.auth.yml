smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  staff:
    description: Writes outages and their updates.
    pages: [overview, incidents, updates]
    create: all
    write: all
assistant:
  for: signed-in
public:
  pages: [home, privacy]
  read: [Component, Incident, IncidentUpdate]
defaultRole: staff
admins: [johan@smithable.ai]
