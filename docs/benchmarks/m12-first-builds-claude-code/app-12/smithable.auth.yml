smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  staff:
    description: Reports outages and posts their updates.
    pages: [incidents]
    create: [Incident, IncidentUpdate]
    write: [Incident, IncidentUpdate]
assistant:
  for: signed-in
public:
  pages: [home]
  read: [Component, { Incident: { where: { status: [investigating, identified, monitoring, resolved] } } }, IncidentUpdate]
defaultRole: staff
admins: [johan@smithable.ai]
