smithable: 0.1
app:
  name: API Status
  description: The live state of our API, with its incidents and planned maintenance.
  timezone: UTC
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
      maintenances: Maintenance[]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      summary: markdown
      updates: IncidentUpdate[]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
  Maintenance:
    fields:
      title: string!
      status: scheduled | inProgress | completed
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
pages:
  home:
    route: /
    landing:
      hero:
      services:
        records: Component
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
      planned:
        records: Maintenance
        where:
          status: [scheduled, inProgress]
      footer:
  privacy:
    route: /privacy
    legal: privacy
  incidents:
    crud: Incident
    filters: [status]
    actions: [identified, monitoring, resolve]
  updates:
    crud: IncidentUpdate
  components:
    crud: Component
  maintenance:
    crud: Maintenance
    actions: [startMaintenance, completeMaintenance]
  overview:
    dashboard:
      open:
        count: Incident
        where:
          status: [investigating, identified, monitoring]
      perMonth:
        count: Incident
        by: detectedAt
      latest:
        list: Incident
        limit: 5
  team:
    users: manage
actions:
  identified:
    on: Incident
    when:
      status: investigating
    set:
      status: identified
    add:
      IncidentUpdate:
        at: NOW()
        status: identified
        message: We have found the cause and are working on a fix.
    intent: The cause is found; the incident moves to identified, with an update saying so.
  monitoring:
    on: Incident
    when:
      status: [investigating, identified]
    set:
      status: monitoring
    add:
      IncidentUpdate:
        at: NOW()
        status: monitoring
        message: A fix has been released. We are watching the API before closing this incident.
    intent: A fix is out; the incident is watched before it is closed, with an update saying so.
  resolve:
    on: Incident
    when:
      status: [investigating, identified, monitoring]
    set:
      status: resolved
      resolvedAt: NOW()
    add:
      IncidentUpdate:
        at: NOW()
        status: resolved
        message: This incident has been resolved.
    intent: The incident is over, with an update saying so. The component's state stays what the team sets.
  startMaintenance:
    on: Maintenance
    when:
      status: scheduled
    set:
      status: inProgress
    intent: The planned work has begun.
  completeMaintenance:
    on: Maintenance
    when:
      status: [scheduled, inProgress]
    set:
      status: completed
    intent: The planned work is over, so it leaves the status page.
navigation: [overview, incidents, updates, maintenance, components, team]
