smithable: 0.1
app:
  name: Pipeline CRM
  description: A lightweight CRM where a small sales team keeps its companies, contacts, deals and follow-ups in one place.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Company:
    fields:
      name: string!
      website: url
      phone: phone
      segment: smb | enterprise | government
      notes: text
      accountManager: User
      contacts: Contact[]
      deals: Deal[]
      followUps: FollowUp[]
    ownedBy: accountManager
    trash: true
  Contact:
    fields:
      name: string!
      company: Company!
      jobTitle: string
      email: email
      phone: phone
      notes: text
  Deal:
    fields:
      title: string!
      company: Company!
      contact: Contact
      stage: lead | qualified | proposal | won | lost
      value:
        type: money
        min: 0
      expectedClose: date
      closedOn: date
      notes: text
    trash: true
  FollowUp:
    fields:
      company: Company!
      deal: Deal
      dueOn: date! = TODAY()
      done: bool
      note: text
pages:
  start:
    dashboard:
      openDeals:
        count: Deal
        where:
          stage: [lead, qualified, proposal]
      pipelineValue:
        sum: Deal.value
        where:
          stage: [lead, qualified, proposal]
      followUpsDue:
        list: FollowUp
        where:
          done: false
        limit: 10
  companies:
    crud: Company
    search: [name]
    filters: [segment, accountManager]
  contacts:
    crud: Contact
    search: [name, email, jobTitle]
    filters: [company]
  deals:
    crud: Deal
    search: [title]
    filters: [stage, company, expectedClose]
    sortable: [value, expectedClose, title]
    actions: [markWon, markLost]
  followUps:
    crud: FollowUp
    filters: [done, dueOn, company]
    defaultFilter:
      done: false
    actions: [markDone]
  team:
    users: manage
actions:
  markWon:
    on: Deal
    when:
      stage: [lead, qualified, proposal]
    set:
      stage: won
      closedOn: TODAY()
    intent: Close a deal as won.
  markLost:
    on: Deal
    when:
      stage: [lead, qualified, proposal]
    set:
      stage: lost
      closedOn: TODAY()
    intent: Close a deal as lost.
  markDone:
    on: FollowUp
    when:
      done: false
    set:
      done: true
    intent: Tick off a follow-up once it is handled.
