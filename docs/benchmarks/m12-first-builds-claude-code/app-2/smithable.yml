smithable: 0.1
app:
  name: Sales CRM
  description: A CRM where a small sales team keeps its companies, contacts, deals and follow-ups in one place.
  currency: EUR
  timezone: Europe/Helsinki
models:
  Company:
    fields:
      name: string!
      website: url
      phone: phone
      industry: string
      notes: text
      accountManager: User
      contacts: Contact[]
      deals: Deal[]
      followUps: FollowUp[]
    ownedBy: accountManager
    trash: true
  Contact:
    fields:
      name: string!
      company: Company!
      jobTitle: string
      email: email unique
      phone: phone
      notes: text
      deals: Deal[]
    trash: true
  Deal:
    fields:
      title: string!
      company: Company!
      contact: Contact
      stage: lead | qualified | proposal | negotiation | won | lost
      value: money!
      expectedClose: date
      closedOn: date
      lostReason: string
      notes: text
      salesperson: User
      followUps: FollowUp[]
    ownedBy: salesperson
    trash: true
  FollowUp:
    fields:
      company: Company!
      contact: Contact
      deal: Deal
      dueOn: date! = TODAY()
      done: bool
      note: text
    trash: true
pages:
  start:
    dashboard:
      openDeals:
        count: Deal
        where:
          stage: [lead, qualified, proposal, negotiation]
      pipelineValue:
        sum: Deal.value
        where:
          stage: [lead, qualified, proposal, negotiation]
      dealsByStage:
        count: Deal
        by: stage
      openFollowUps:
        list: FollowUp
        where:
          done: false
        limit: 10
  companies:
    crud: Company
    search: [name, industry]
    filters: [accountManager]
    sortable: [name, createdAt]
  contacts:
    crud: Contact
    search: [name, email, jobTitle]
    filters: [company]
    sortable: [name, createdAt]
  deals:
    crud: Deal
    search: [title]
    filters: [stage, company, salesperson]
    sortable: [expectedClose, value, title]
    actions: [markWon, markLost]
  followUps:
    crud: FollowUp
    search: [note]
    filters: [done, company]
    defaultFilter:
      done: false
    sortable: [dueOn]
    actions: [markDone]
  team:
    users: manage
actions:
  markWon:
    on: Deal
    when:
      stage: [lead, qualified, proposal, negotiation]
    set:
      stage: won
      closedOn: TODAY()
  markLost:
    on: Deal
    when:
      stage: [lead, qualified, proposal, negotiation]
    set:
      stage: lost
      closedOn: TODAY()
      lostReason:
  markDone:
    on: FollowUp
    when:
      done: false
    set:
      done: true
