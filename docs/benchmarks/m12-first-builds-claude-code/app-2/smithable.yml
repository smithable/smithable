smithable: 0.1
app:
  name: Sales CRM
  description: A CRM where a small sales team keeps track of companies, contacts, deals and follow-ups.
  currency: EUR
  timezone: Europe/Helsinki
models:
  Company:
    fields:
      name: string!
      website: url
      phone: phone
      notes: text
      accountManager: User
      contacts: Contact[]
      deals: Deal[]
      followUps: FollowUp[]
    ownedBy: accountManager
    trash: true
  Contact:
    fields:
      name: string!
      company: Company!
      jobTitle: string
      email: email
      phone: phone
      notes: text
      deals: Deal[]
      followUps: FollowUp[]
    trash: true
  Deal:
    fields:
      name: string!
      company: Company!
      contact: Contact
      stage: lead | qualified | proposal | won | lost
      value: money
      expectedClose: date
      closedOn:
        type: date
        by: app
      lostReason: text
      notes: text
      followUps: FollowUp[]
    trash: true
  FollowUp:
    fields:
      note: text!
      dueOn: date! = TODAY()
      done: bool
      company: Company!
      contact: Contact
      deal: Deal
    trash: true
pages:
  start:
    dashboard:
      followUpsDue:
        list: FollowUp
        where:
          done: false
        limit: 10
      openDeals:
        count: Deal
        where:
          stage: [lead, qualified, proposal]
      openValue:
        sum: Deal.value
        where:
          stage: [lead, qualified, proposal]
      dealsByStage:
        count: Deal
        by: stage
  companies:
    crud: Company
    search: [name, phone]
    sortable: [name, createdAt]
  contacts:
    crud: Contact
    search: [name, email, phone]
    filters: [company]
    sortable: [name, createdAt]
  deals:
    crud: Deal
    search: [name]
    filters: [stage, company]
    sortable: [name, value, expectedClose]
    actions: [winDeal, loseDeal]
  followUps:
    crud: FollowUp
    search: [note]
    filters: [done, company]
    defaultFilter:
      done: false
    sortable: [dueOn]
    actions: [markDone]
  team:
    users: manage
actions:
  winDeal:
    on: Deal
    when:
      stage: [lead, qualified, proposal]
    set:
      stage: won
      closedOn: TODAY()
    intent: Mark an open deal as won.
  loseDeal:
    on: Deal
    when:
      stage: [lead, qualified, proposal]
    set:
      stage: lost
      closedOn: TODAY()
      lostReason:
    intent: Mark an open deal as lost and record why.
  markDone:
    on: FollowUp
    when:
      done: false
    set:
      done: true
    intent: Tick off a follow-up that has been handled.
navigation: [start, companies, contacts, deals, followUps, team]
