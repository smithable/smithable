smithable: 0.1
app:
  name: Pipeline CRM
  description: A CRM for a small sales team to track companies, contacts, deals and follow-ups.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Company:
    fields:
      name: string!
      website: url
      phone: phone
      industry: string
      notes: text
      accountManager: User
      contacts: Contact[]
      deals: Deal[]
      followUps: FollowUp[]
    ownedBy: accountManager
    trash: true
  Contact:
    fields:
      name: string!
      company: Company!
      jobTitle: string
      email: email
      phone: phone
      notes: text
    trash: true
  Deal:
    fields:
      title: string!
      company: Company!
      contact: Contact
      stage: lead | qualified | proposal | negotiation | won | lost
      value:
        type: money
        min: 0
      expectedClose: date
      closedOn:
        type: date
        by: app
      notes: text
      followUps: FollowUp[]
    trash: true
  FollowUp:
    fields:
      company: Company!
      deal: Deal
      dueOn: date! = TODAY()
      done: bool
      note: text
    trash: true
pages:
  start:
    dashboard:
      openDeals:
        count: Deal
        where:
          stage: [lead, qualified, proposal, negotiation]
      pipelineValue:
        sum: Deal.value
        where:
          stage: [lead, qualified, proposal, negotiation]
      dealsByStage:
        count: Deal
        by: stage
      followUpsDue:
        list: FollowUp
        where:
          done: false
        limit: 10
  companies:
    crud: Company
    search: [name, industry]
    sortable: [name, createdAt]
  contacts:
    crud: Contact
    search: [name, email, jobTitle]
    filters: [company]
  deals:
    crud: Deal
    search: [title]
    filters: [stage, company, expectedClose]
    sortable: [expectedClose, value, title]
    actions: [markWon, markLost]
  followUps:
    crud: FollowUp
    filters: [done, company, dueOn]
    defaultFilter:
      done: false
    actions: [markDone]
  team:
    users: manage
actions:
  markWon:
    on: Deal
    when:
      stage: [lead, qualified, proposal, negotiation]
    set:
      stage: won
      closedOn: TODAY()
    intent: Close a deal as won.
  markLost:
    on: Deal
    when:
      stage: [lead, qualified, proposal, negotiation]
    set:
      stage: lost
      closedOn: TODAY()
    intent: Close a deal as lost.
  markDone:
    on: FollowUp
    when:
      done: false
    set:
      done: true
    intent: Tick off a follow-up once it is done.
navigation: [start, companies, contacts, deals, followUps, team]
