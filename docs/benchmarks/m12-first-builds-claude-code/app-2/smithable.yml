smithable: 0.1
app:
  name: Pipeline CRM
  description: A lightweight CRM for a small sales team to track companies, contacts, deals and follow-ups.
  currency: EUR
models:
  Company:
    fields:
      name: string!
      website: url
      phone: phone
      industry: string
      notes: text
      accountManager: User
      contacts: Contact[]
      deals: Deal[]
    ownedBy: accountManager
    access:
      delete: [admin]
  Contact:
    fields:
      name: string!
      company: Company
      jobTitle: string
      email: email unique
      phone: phone
      notes: text
    access:
      delete: [admin]
  Deal:
    fields:
      title: string!
      company: Company!
      contact: Contact
      stage: lead | qualified | proposal | negotiation | won | lost
      value: money
      expectedClose: date
      closedOn: date
      salesperson: User
      notes: text
      followUps: FollowUp[]
    ownedBy: salesperson
    access:
      delete: [admin]
  FollowUp:
    fields:
      deal: Deal!
      due: date!
      kind: call | email | meeting | task
      note: text
      status: open | done
      doneOn: date
      assignee: User
    ownedBy: assignee
    access:
      delete: [admin, owner]
pages:
  companies:
    crud: Company
    search: [name, industry]
  contacts:
    crud: Contact
    search: [name, email, phone]
    filters: [company]
  deals:
    crud: Deal
    actions: [markWon, markLost]
    search: [title]
  follow-ups:
    crud: FollowUp
    actions: [complete]
  team:
    users: manage
actions:
  markWon:
    on: Deal
    when:
      stage: [lead, qualified, proposal, negotiation]
    set:
      stage: won
      closedOn: TODAY()
    intent: Mark a deal as won.
  markLost:
    on: Deal
    when:
      stage: [lead, qualified, proposal, negotiation]
    set:
      stage: lost
      closedOn: TODAY()
    intent: Mark a deal as lost.
  complete:
    on: FollowUp
    when:
      status: open
    set:
      status: done
      doneOn: TODAY()
    intent: Mark a follow-up as done.
