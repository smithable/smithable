smithable: 0.1
app:
  name: Pipeline CRM
  description: A simple CRM where a small sales team tracks companies, contacts, deals and follow-ups.
  currency: EUR
models:
  Company:
    fields:
      name: string!
      website: url
      phone: phone
      industry: string
      notes: text
      accountManager: User
      contacts: Contact[]
      deals: Deal[]
      followUps: FollowUp[]
    ownedBy: accountManager
    trash: true
  Contact:
    fields:
      name: string!
      company: Company
      jobTitle: string
      email: email
      phone: phone
      notes: text
    trash: true
  Deal:
    fields:
      title: string!
      company: Company!
      contact: Contact
      stage: lead | qualified | proposal | negotiation | won | lost
      value:
        type: money
        min: 0
      expectedClose: date
      closedOn:
        type: date
        by: app
      notes: text
    trash: true
  FollowUp:
    fields:
      company: Company!
      deal: Deal
      contact: Contact
      dueOn: date! = TODAY()
      assignee: User = ME()
      done: bool
      note: text
    trash: true
pages:
  companies:
    crud: Company
    search: [name, industry]
    actions: [mergeCompanies]
  contacts:
    crud: Contact
    search: [name, email, jobTitle]
    filters: [company]
  deals:
    crud: Deal
    search: [title]
    filters: [stage, company, expectedClose]
    actions: [markWon, markLost]
  team:
    users: manage
  followUps:
    crud: FollowUp
    search: [note]
    filters: [done, dueOn, assignee]
    defaultFilter:
      done: false
    actions: [completeFollowUp]
actions:
  markWon:
    on: Deal
    when:
      stage: [lead, qualified, proposal, negotiation]
    set:
      stage: won
      closedOn: TODAY()
  markLost:
    on: Deal
    when:
      stage: [lead, qualified, proposal, negotiation]
    set:
      stage: lost
      closedOn: TODAY()
  mergeCompanies:
    merge: Company
  completeFollowUp:
    on: FollowUp
    when:
      done: false
    set:
      done: true
