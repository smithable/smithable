smithable: 0.1
app:
  name: Pipeline CRM
  description: A simple CRM for a small sales team to track companies, contacts, deals and follow-ups.
  currency: EUR
models:
  Company:
    fields:
      name: string!
      website: url
      phone: phone
      industry: string
      notes: text
      accountManager: User
      contacts: Contact[]
      deals: Deal[]
      followUps: FollowUp[]
    ownedBy: accountManager
    trash: true
  Contact:
    fields:
      name: string!
      company: Company
      jobTitle: string
      email: email
      phone: phone
      notes: text
  Deal:
    fields:
      title: string!
      company: Company!
      contact: Contact
      stage: lead | qualified | proposal | negotiation | won | lost
      value:
        type: money
        min: 0
      expectedClose: date
      closedOn: date
      notes: text
    trash: true
  FollowUp:
    fields:
      company: Company!
      contact: Contact
      dueOn: date! = TODAY()
      note: text
      done: bool
pages:
  start:
    dashboard:
      openDeals:
        count: Deal
        where:
          stage: [lead, qualified, proposal, negotiation]
      pipelineValue:
        sum: Deal.value
        where:
          stage: [lead, qualified, proposal, negotiation]
      dealsByStage:
        count: Deal
        by: stage
      followUpsDue:
        list: FollowUp
        where:
          done: false
        limit: 10
  companies:
    crud: Company
    search: [name, industry]
  contacts:
    crud: Contact
    search: [name, email, jobTitle]
  deals:
    crud: Deal
    search: [title]
    filters: [stage, company, expectedClose]
    actions: [markWon, markLost]
  followUps:
    crud: FollowUp
    filters: [done, dueOn, company]
    defaultFilter:
      done: false
    actions: [completeFollowUp]
  team:
    users: manage
actions:
  markWon:
    on: Deal
    when:
      stage: [lead, qualified, proposal, negotiation]
    set:
      stage: won
      closedOn: TODAY()
    intent: Close a deal as won.
  markLost:
    on: Deal
    when:
      stage: [lead, qualified, proposal, negotiation]
    set:
      stage: lost
      closedOn: TODAY()
    intent: Close a deal as lost.
  completeFollowUp:
    on: FollowUp
    when:
      done: false
    set:
      done: true
    intent: Mark a follow-up as done.
