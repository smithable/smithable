smithable: 0.1
app:
  name: Pipeline CRM
  description: A simple CRM for a small sales team to track companies, contacts, deals and follow-ups.
  currency: EUR
models:
  Company:
    fields:
      name: string! unique
      website: url
      phone: phone
      industry: string
      notes: text
      accountManager: User
      contacts: Contact[]
      deals: Deal[]
      followUps: FollowUp[]
    ownedBy: accountManager
    trash: true
  Contact:
    fields:
      name: string!
      company: Company!
      jobTitle: string
      email: email
      phone: phone
      notes: text
    trash: true
  Deal:
    fields:
      title: string!
      company: Company!
      contact: Contact
      value:
        type: money
        min: 0
      stage: lead | qualified | proposal | negotiation | won | lost
      expectedClose: date
      closedOn:
        type: date
        by: app
      notes: text
    trash: true
  FollowUp:
    fields:
      company: Company!
      dueOn: date! = TODAY()
      done: bool
      note: text
    trash: true
pages:
  companies:
    crud: Company
    search: [name, industry]
    filters: [accountManager]
    actions: [mergeCompanies]
  contacts:
    crud: Contact
    search: [name, email, jobTitle]
    filters: [company]
  deals:
    crud: Deal
    search: [title]
    filters: [stage, company, expectedClose]
    actions: [markWon, markLost]
  followUps:
    crud: FollowUp
    search: [note]
    filters: [done, dueOn, company]
    defaultFilter:
      done: false
    actions: [markDone]
  team:
    users: manage
actions:
  markWon:
    on: Deal
    when:
      stage: [lead, qualified, proposal, negotiation]
    set:
      stage: won
      closedOn: TODAY()
    intent: Close a deal as won.
  markLost:
    on: Deal
    when:
      stage: [lead, qualified, proposal, negotiation]
    set:
      stage: lost
      closedOn: TODAY()
    intent: Close a deal as lost.
  markDone:
    on: FollowUp
    when:
      done: false
    set:
      done: true
    intent: Tick off a follow-up once it is handled.
  mergeCompanies:
    merge: Company
    intent: Combine duplicate companies; their contacts, deals and follow-ups move to the one kept.
