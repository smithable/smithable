smithable: 0.1
app:
  name: Billfold
  description: "Invoicing for freelancers: keep your clients, send invoices and record the payments you receive."
  currency: EUR
models:
  BusinessProfile:
    fields:
      businessName: string!
      vatNumber: string
      iban: string
      paymentTermDays: int! = 30
      invoiceFooter: text
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      invoices: Invoice[]
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      dueOn: date! = DATEADD(issuedOn, 30, "day")
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      payments: Payment[]
      total:
        type: money
        formula: SUM(lines.amount)
      paid:
        type: money
        formula: SUM(payments.amount)
      balance:
        type: money
        formula: total - paid
  InvoiceLine:
    fields:
      invoice: Invoice!
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
  Payment:
    fields:
      invoice: Invoice!
      paidOn: date! = TODAY()
      amount: money!
      method: bankTransfer | card | cash | other
      note: string
pages:
  overview:
    dashboard:
      latest:
        list: Invoice
        limit: 5
      outstanding:
        sum: Invoice.balance
        where:
          status: sent
      overdue:
        sum: Invoice.balance
        where:
          status: overdue
      received:
        sum: Payment.amount
        by: paidOn
      invoiced:
        sum: Invoice.total
        by: issuedOn
  invoices:
    crud: Invoice
    search: [number]
    filters: [status, client, issuedOn]
    actions: [markSent, markOverdue, recordPayment]
  clients:
    crud: Client
    search: [name, email]
  invoice-lines:
    crud: InvoiceLine
  settings:
    crud: BusinessProfile
  home:
    route: /
    landing:
      hero:
      footer:
      features:
      faq:
      callToAction:
        button: overview
  payments:
    crud: Payment
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markOverdue:
    on: Invoice
    when:
      status: sent
    set:
      status: overdue
    intent: The invoice is past its due date and not yet paid.
  recordPayment:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    add:
      Payment:
        paidOn: TODAY()
        amount:
        method:
    intent: The client paid the invoice; record the payment and mark it paid.
