smithable: 0.1
app:
  name: Billfold
  description: "Invoicing for freelancers: keep track of clients, send invoices and record the payments that come in."
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      invoices: Invoice[]
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      invoice: Invoice!
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      dueOn: date! = DATEADD(issuedOn, 30, "day")
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      payments: Payment[]
      total:
        type: money
        formula: SUM(lines.amount)
      paid:
        type: money
        formula: SUM(payments.amount)
      balance:
        type: money
        formula: total - paid
  Payment:
    fields:
      invoice: Invoice!
      paidOn: date! = TODAY()
      amount: money!
      method: bankTransfer | card | cash | other
      note: string
pages:
  clients:
    crud: Client
    search: [name, email]
  invoice-lines:
    crud: InvoiceLine
  home:
    route: /
    landing:
      hero:
      footer:
      features:
      faq:
      callToAction:
        button: invoices
  privacy:
    route: /privacy
    legal: privacy
  invoices:
    crud: Invoice
    filters: [client, status]
    actions: [markSent, markPaid]
  payments:
    crud: Payment
    filters: [invoice, method, paidOn]
  overview:
    dashboard:
      outstanding:
        sum: Invoice.total
        where:
          status: sent
      overdue:
        sum: Invoice.total
        where:
          status: overdue
      received:
        sum: Payment.amount
        by: paidOn
      latest:
        list: Invoice
        limit: 5
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    add:
      Payment:
        paidOn: TODAY()
        amount:
        method:
    intent: The client paid the invoice; the payment is recorded with it.
outgoing:
  invoiceSent:
    when: markSent
    to: mail
    recipient: client.email
