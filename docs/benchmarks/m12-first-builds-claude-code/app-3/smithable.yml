smithable: 0.1
app:
  name: Billfold
  description: "Invoicing for freelancers: keep your clients, send invoices and track the payments that come in."
  currency: EUR
  timezone: Europe/Stockholm
models:
  BusinessProfile:
    fields:
      businessName: string!
      vatNumber: string
      iban: string
      paymentTermDays: int! = 30
      invoiceFooter: text
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      invoices: Invoice[]
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      dueOn: date! = DATEADD(issuedOn, 30, "day")
      status: draft | sent | paid | overdue
      contract: file
      lines: InvoiceLine[]
      payments: Payment[]
      total:
        type: money
        formula: SUM(lines.amount)
      paid:
        type: money
        formula: SUM(payments.amount)
      balance:
        type: money
        formula: total - paid
  InvoiceLine:
    fields:
      invoice: Invoice!
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
  Payment:
    fields:
      invoice: Invoice!
      amount: money!
      paidOn: date! = TODAY()
      method: bankTransfer | card | cash | other
      reference: string
      note: text
pages:
  overview:
    dashboard:
      outstanding:
        sum: Invoice.balance
        where:
          status: sent
      overdue:
        sum: Invoice.balance
        where:
          status: overdue
      received:
        sum: Payment.amount
        by: paidOn
      invoiced:
        sum: Invoice.total
        by: issuedOn
      latest:
        list: Invoice
        limit: 5
  invoices:
    crud: Invoice
    filters: [client, status, issuedOn]
    actions: [markSent, recordPayment, markPaid, markOverdue]
  clients:
    crud: Client
    search: [name, email]
  payments:
    crud: Payment
    filters: [invoice, method, paidOn]
  invoice-lines:
    crud: InvoiceLine
  settings:
    crud: BusinessProfile
  home:
    route: /
    landing:
      hero:
        button: overview
      features:
      faq:
      callToAction:
        button: overview
      footer:
  privacy:
    route: /privacy
    legal: privacy
navigation: [overview, invoices, clients, payments, settings]
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  recordPayment:
    on: Invoice
    when:
      status: [sent, overdue]
    add:
      Payment:
        amount:
        paidOn: TODAY()
        method:
    intent: Record a payment received from the client for this invoice.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice in full.
  markOverdue:
    on: Invoice
    when:
      status: sent
    set:
      status: overdue
    intent: The invoice is late.
timers:
  markOverdue:
    on: Invoice
    at: 7 days after dueOn
    where:
      status: sent
    run: markOverdue
outgoing:
  invoiceSent:
    when: markSent
    to: mail
    recipient: client.email
