smithable: 0.1
app:
  name: Duly
  description: "Invoicing for freelancers: keep your clients, send invoices and track the payments that come in."
  currency: EUR
  timezone: Europe/Helsinki
models:
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      invoices: Invoice[]
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      invoice: Invoice!
  Payment:
    fields:
      paidOn: date! = TODAY()
      amount: money!
      method: bankTransfer | card | cash | other
      note: text
      invoice: Invoice!
    namedBy: [invoice, paidOn]
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      dueOn: date! = DATEADD(issuedOn, 30, "day")
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      payments: Payment[]
      total:
        type: money
        formula: SUM(lines.amount)
      amountPaid:
        type: money
        formula: SUM(payments.amount)
      balanceDue:
        type: money
        formula: total - amountPaid
pages:
  home:
    route: /
    landing:
      hero:
        button: overview
      features:
      faq:
      callToAction:
        button: overview
      footer:
  privacy:
    route: /privacy
    legal: privacy
  overview:
    dashboard:
      received:
        sum: Payment.amount
      outstanding:
        sum: Invoice.balanceDue
        where:
          status: sent
      overdue:
        sum: Invoice.balanceDue
        where:
          status: overdue
      invoiced:
        sum: Invoice.total
        by: issuedOn
      latest:
        list: Invoice
        limit: 5
    period:
      Invoice: issuedOn
      Payment: paidOn
  clients:
    crud: Client
    search: [name, email]
    sortable: [name, createdAt]
  payments:
    crud: Payment
    sortable: [paidOn, amount]
    filters: [invoice, method]
  invoices:
    crud: Invoice
    search: [number]
    filters: [client, status]
    sortable: [issuedOn, dueOn, number]
    actions: [markSent, markPaid, markOverdue]
navigation: [overview, invoices, clients, payments]
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    add:
      Payment:
        paidOn: TODAY()
        amount:
    intent: The client paid the invoice; the final payment is recorded with it.
  markOverdue:
    on: Invoice
    when:
      status: sent
    set:
      status: overdue
    intent: The invoice is late.
timers:
  markOverdue:
    on: Invoice
    at: 7 days after dueOn
    where:
      status: sent
    run: markOverdue
