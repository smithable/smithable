smithable: 0.1
app:
  name: Billfold
  description: "Invoicing for freelancers: keep your clients, send invoices and record the payments you receive."
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      invoices: Invoice[]
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      invoice: Invoice!
  Payment:
    fields:
      amount: money!
      paidOn: date! = TODAY()
      method: bankTransfer | card | cash | other
      note: string
      invoice: Invoice!
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid | overdue
      contract: file
      lines: InvoiceLine[]
      payments: Payment[]
      total:
        type: money
        formula: SUM(lines.amount)
      paidAmount:
        type: money
        formula: SUM(payments.amount)
      balance:
        type: money
        formula: total - paidAmount
pages:
  clients:
    crud: Client
  payments:
    crud: Payment
    filters: [invoice, method, paidOn]
  overview:
    dashboard:
      received:
        sum: Payment.amount
        by: paidOn
      outstanding:
        sum: Invoice.balance
        where:
          status: sent
      overdue:
        sum: Invoice.balance
        where:
          status: overdue
      latest:
        list: Invoice
        limit: 5
  home:
    route: /
    landing:
      hero:
      footer:
      features:
      faq:
      callToAction:
        button: invoices
  privacy:
    route: /privacy
    legal: privacy
  invoices:
    crud: Invoice
    filters: [client, status]
    actions: [markSent, markPaid, markOverdue]
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice in full.
  markOverdue:
    on: Invoice
    when:
      status: sent
    set:
      status: overdue
    intent: The invoice is late.
timers:
  markOverdue:
    on: Invoice
    at: 1 day after dueOn
    where:
      status: sent
    run: markOverdue
outgoing:
  invoiceSent:
    when: markSent
    to: mail
    recipient: client.email
