smithableUx: 0.1
pages:
  clients:
    table:
      columns: [name, email, vatNumber]
    icon: users
  payments:
    table:
      sort: -paidOn
      columns: [paidOn, invoice, amount, method, reference]
    icon: chart
  invoice-lines:
    icon: list
  invoices:
    table:
      columns: [number, client, issuedOn, dueOn, total, balance, status]
      sort: -issuedOn
    icon: receipt
theme:
  preset: modern
  brand:
    primary: "#2563eb"
tones:
  Invoice.status:
    paid: success
    sent: warning
    overdue: danger
