pages:
  home:
    hero:
      title: Get paid for your work, without the paperwork
      subtitle: Billfold keeps your clients, invoices and incoming payments in one tidy place, made for freelancers.
      button: Start invoicing
      image:
        src: images/hero.webp
        alt: A quiet open-plan office with long wooden desks, plants and large windows over a small town
        generated: true
    callToAction:
      title: Your next invoice takes two minutes
      text: Add a client, list your hours and send it off.
      button: Get started
    features:
      items: [{ title: Clients at hand, text: Keep each client's contact and VAT details once and reuse them on every invoice. }, { title: Invoices in minutes, text: Add lines with quantities and prices; totals add themselves up. }, { title: Payments tracked, text: Record full or partial payments and always see what is still owed. }, { title: Late invoices flagged, text: Invoices left unpaid past their due date are marked overdue for you. }]
    faq:
      items: [{ question: Who can see my clients and invoices?, answer: Only you. Every freelancer's records are private to their own account. }, { question: Can a client pay in instalments?, answer: Yes. Record each payment as it arrives and the remaining balance updates on the invoice. }, { question: Does the client get the invoice by mail?, answer: "When you mark an invoice as sent, your client is notified at the address you saved for them." }, { question: Can I attach a contract?, answer: "Yes, each invoice can carry the agreement it is based on as a PDF or document." }]
