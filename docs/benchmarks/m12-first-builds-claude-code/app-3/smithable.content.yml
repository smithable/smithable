pages:
  business:
    title: Business details
  home:
    hero:
      title: Get paid for your work, without the paperwork
      subtitle: Ledgerly keeps your clients, invoices and incoming payments in one tidy place, so you always know who owes you what.
      button: Start invoicing
      image:
        src: images/hero.webp
        alt: A quiet open-plan office with long wooden desks, plants and large windows over a small town
        generated: true
    callToAction:
      title: Your next invoice is two minutes away
      text: Sign in with your email address and send your first invoice today.
      button: Sign in
    features:
      items: [{ title: Clients at hand, text: "Store each client's contact details and VAT number once, and see every invoice you have sent them." }, { title: Invoices with lines, text: Add lines with quantity and price; the total adds itself up as you go. }, { title: Payments tracked, text: Record full or partial payments against an invoice and see the remaining balance at a glance. }, { title: Overdue spotted for you, text: A sent invoice that stays unpaid past its due date is flagged as overdue automatically. }]
    faq:
      items: [{ question: Can other people see my clients?, answer: "No. Every freelancer sees only their own clients, invoices and payments." }, { question: Does the client get the invoice by email?, answer: "Yes. When you mark an invoice as sent, your client is notified at the address you saved for them." }, { question: What if a client pays in parts?, answer: Add each payment as it arrives; the invoice shows how much is still open. }, { question: Can I attach the contract?, answer: "Yes, each invoice can carry a PDF or document of the agreement it is for." }]
