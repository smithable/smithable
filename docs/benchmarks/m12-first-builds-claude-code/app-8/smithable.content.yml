      items: [{ question: Do I need an account to see the schedule?, answer: No. Anyone can browse the talks and speakers. You only sign in when you want to save a place. }, { question: How do I register for a talk?, answer: "Open the talk on the schedule, sign in with your email address and press the button to book your place." }, { question: What happens when a talk is full?, answer: "Each room has a limited number of seats, so registration stops once they are taken. The schedule shows how many places are left." }, { question: Can I change my mind?, answer: "Yes. You can cancel a registration under My registrations at any time before the talk starts, which frees the place for someone else." }]
