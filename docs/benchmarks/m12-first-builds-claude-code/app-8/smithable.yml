smithable: 0.1
app:
  name: Summit Days
  description: Programme, speakers and registration for a conference.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      title: string
      company: string
      bio: markdown
      portrait: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      summary: text
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      track: keynote | talk | workshop | panel
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
    capacity:
      per: talk
      max: talk.capacity
  Message:
    fields:
      name: string!
      email: email!
      message: text!
pages:
  talks:
    crud: Talk
    filters: [track, speaker]
  speakers:
    crud: Speaker
  my-registrations:
    crud: Registration
  messages:
    crud: Message
  schedule:
    calendar: Talk
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule, speakers]
      footer:
      lineup:
        records: Speaker
      faq:
      callToAction:
        button: schedule
      contact:
        form: Message
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
outgoing:
  registrationMade:
    when: Registration created
    to: mail
    recipient: owner
  registrationCancelled:
    when: Registration deleted
    to: mail
    recipient: owner
