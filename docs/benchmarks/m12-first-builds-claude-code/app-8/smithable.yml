smithable: 0.1
app:
  name: Conference Registration
  description: Browse the conference programme and speakers, and register for the talks you want to attend.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: markdown
      portrait: picture
  Talk:
    fields:
      title: string!
      summary: text
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
    capacity:
      per: talk
      max: talk.capacity
pages:
  schedule:
    calendar: Talk
  talks:
    crud: Talk
    search: [title, room]
    filters: [speaker, startsAt]
  speakers:
    crud: Speaker
  my-registrations:
    crud: Registration
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule, speakers]
      footer:
      lineup:
        records: Speaker
      faq:
      callToAction:
        button: schedule
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
