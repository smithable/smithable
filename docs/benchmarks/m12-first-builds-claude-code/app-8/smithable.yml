smithable: 0.1
app:
  name: Summit Registration
  description: The programme of a conference, its speakers, and registration for talks for attendees.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: markdown
      portrait: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      abstract: markdown
      speaker: Speaker!
      room: string
      startsAt: datetime!
      durationMinutes: int! = 45
      track: general | technical | business | workshop
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
      attendee: User
    namedBy: talk
    ownedBy: attendee
    capacity:
      per: talk
      max: talk.capacity
      closes: talk.startsAt
      cancelUntil: talk.startsAt
pages:
  talks:
    crud: Talk
    filters: [speaker, track, startsAt]
  speakers:
    crud: Speaker
  schedule:
    calendar:
      model: Talk
      starts: startsAt
  my-registrations:
    crud: Registration
  home:
    route: /
    landing:
      hero:
        button: talks
        secondButton: speakers
      features:
      lineup:
        records: Speaker
      faq:
      callToAction:
        button: talks
      footer:
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
navigation:
  main: [talks, speakers, schedule, my-registrations, home, privacy, admin]
  programme: [talks, schedule, speakers, my-registrations]
  website: [home]
  admin: [admin]
