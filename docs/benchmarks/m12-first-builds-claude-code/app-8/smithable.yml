smithable: 0.1
app:
  name: Talkline Conference
  description: Programme, speakers and talk registration for a conference.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: markdown
      portrait: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      summary: text
      speaker: Speaker!
      format: talk | keynote | workshop | panel
      room: string
      startsAt: datetime!
      durationMinutes: int! = 45
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
      attendee: User
    namedBy: talk
    ownedBy: attendee
    capacity:
      per: talk
      max: talk.capacity
      closes: talk.startsAt
      cancelUntil: talk.startsAt
pages:
  home:
    route: /
    landing:
      hero:
        button: schedule
        secondButton: speakers
      features:
      lineup:
        records: Speaker
      faq:
      callToAction:
        button: schedule
      footer:
  schedule:
    calendar:
      model: Talk
      starts: startsAt
    filters: [format, speaker]
  talks:
    crud: Talk
    filters: [format, speaker, startsAt]
  speakers:
    crud: Speaker
  my-registrations:
    crud: Registration
  registrations:
    crud: Registration
    filters: [talk]
  privacy:
    route: /privacy
    legal: privacy
navigation:
  main: [home, schedule, talks, speakers, my-registrations, registrations, privacy]
  programme: [schedule, speakers, my-registrations, talks, registrations]
  website: [home]
