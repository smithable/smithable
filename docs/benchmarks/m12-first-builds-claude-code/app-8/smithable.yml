smithable: 0.1
app:
  name: Conference Hub
  description: Schedule, speakers and talk registration for a conference.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: markdown
      portrait: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      abstract: text
      speaker: Speaker!
      track: keynote | talk | workshop
      room: string
      startsAt: datetime!
      durationMinutes: int! = 45
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
    capacity:
      per: talk
      max: talk.capacity
pages:
  home:
    route: /
    landing:
      hero:
      footer:
      program:
        records: Talk
      lineup:
        records: Speaker
      faq:
      callToAction:
        button: schedule
  schedule:
    calendar: Talk
  talks:
    crud: Talk
    filters: [track, speaker]
  speakers:
    crud: Speaker
  my-registrations:
    crud: Registration
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
outgoing:
  registrationMade:
    when: Registration created
    to: mail
    recipient: owner
