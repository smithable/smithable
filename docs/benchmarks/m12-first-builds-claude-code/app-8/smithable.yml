smithable: 0.1
app:
  name: Conference Hub
  description: The conference program with its talks and speakers, where attendees register for the talks they want to attend.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: markdown
      photo: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      summary: text
      speaker: Speaker!
      room: string
      startsAt: datetime!
      durationMinutes: int! = 45
      capacity: int! = 50
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
      attendee: User
    namedBy: talk
    ownedBy: attendee
    capacity:
      per: talk
      max: talk.capacity
      closes: talk.startsAt
      cancelUntil: talk.startsAt
pages:
  program:
    calendar:
      model: Talk
      starts: startsAt
  my-registrations:
    crud: Registration
  talks:
    crud: Talk
    filters: [speaker, startsAt]
    defaultFilter:
      startsAt: upcoming
  speakers:
    crud: Speaker
  home:
    route: /
    landing:
      hero:
        button: program
        secondButton: speakers
      features:
      speakersList:
        records: Speaker
      faq:
      callToAction:
        button: program
      footer:
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
navigation:
  main: [program, my-registrations, talks, speakers, home, privacy, admin]
  program: [program, my-registrations, talks, speakers]
