smithable: 0.1
app:
  name: Conference Hub
  description: Talk schedule, speakers and attendee registration for a conference.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: markdown
      portrait: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      abstract: markdown
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
      attendee: User
    ownedBy: attendee
    capacity:
      per: talk
      max: talk.capacity
pages:
  schedule:
    calendar:
      model: Talk
      starts: startsAt
  talks:
    crud: Talk
    filters: [speaker, startsAt]
    defaultFilter:
      startsAt: upcoming
    sortable: [startsAt, capacity]
  speakers:
    crud: Speaker
  my-registrations:
    crud: Registration
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule, speakers]
      footer:
      lineup:
        records: Speaker
      faq:
      callToAction:
        button: schedule
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
navigation:
  main: [schedule, talks, speakers, my-registrations, home, privacy, admin]
  conference: [schedule, my-registrations, talks, speakers]
  website: [home]
  admin: [admin]
