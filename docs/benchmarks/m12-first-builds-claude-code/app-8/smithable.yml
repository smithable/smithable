smithable: 0.1
app:
  name: Conference Registration
  description: Talks, speakers and registration for attendees of a conference.
models:
  Speaker:
    fields:
      name: string!
      title: string
      bio: markdown
      portrait: picture
    access:
      create: [admin]
  Talk:
    fields:
      title: string!
      summary: text
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
    access:
      create: [admin]
  Registration:
    fields:
      talk: Talk! unique
    capacity:
      per: talk
      max: talk.capacity
pages:
  schedule:
    calendar: Talk
  my-registrations:
    crud: Registration
  talks:
    crud: Talk
    access: [admin]
  speakers:
    crud: Speaker
    access: [admin]
  home:
    route: /
    landing:
      hero:
      footer:
      speakerCards:
        records: Speaker
      faq:
      callToAction:
        button: schedule
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
