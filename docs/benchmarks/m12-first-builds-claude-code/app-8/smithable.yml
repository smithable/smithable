smithable: 0.1
app:
  name: Confer
  description: "Talks, speakers and registration for a conference: attendees sign up and reserve their seat at the talks they want to hear."
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: markdown
      photo: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      summary: text
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
      attendee: User
    namedBy: talk
    ownedBy: attendee
    capacity:
      per: talk
      max: talk.capacity
      closes: talk.startsAt
      cancelUntil: talk.startsAt
pages:
  talks:
    crud: Talk
    filters: [speaker, startsAt]
    defaultFilter:
      startsAt: upcoming
    search: [title, room]
  speakers:
    crud: Speaker
  my-registrations:
    crud: Registration
  schedule:
    calendar:
      model: Talk
      starts: startsAt
  home:
    route: /
    landing:
      hero:
      footer:
      programme:
        records: Talk
      speakerList:
        records: Speaker
      faq:
      callToAction:
        button: schedule
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
navigation:
  main: [talks, speakers, my-registrations, schedule, home, privacy, admin]
  programme: [schedule, talks, speakers, my-registrations]
  website: [home]
  admin: [admin]
