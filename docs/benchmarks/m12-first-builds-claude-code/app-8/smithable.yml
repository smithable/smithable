smithable: 0.1
app:
  name: Conference Hub
  description: The conference programme of talks and speakers, where attendees register for the talks they want to attend.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: markdown
      portrait: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      summary: text
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      track: general | technical | business | workshop
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
    capacity:
      per: talk
      max: talk.capacity
pages:
  schedule:
    calendar: Talk
  talks:
    crud: Talk
    filters: [track, speaker]
  speakers:
    crud: Speaker
  my-registrations:
    crud: Registration
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule, speakers]
      footer:
      speakersList:
        records: Speaker
      faq:
      callToAction:
        button: schedule
  privacy:
    route: /privacy
    legal: privacy
outgoing:
  registrationMade:
    when: Registration created
    to: mail
    recipient: owner
  registrationCancelled:
    when: Registration deleted
    to: mail
    recipient: owner
