smithable: 0.1
app:
  name: Confera
  description: Talks, speakers and attendee registration for a conference.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: markdown
      photo: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      summary: text
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
      attendee: User
    namedBy: talk
    ownedBy: attendee
    capacity:
      per: talk
      max: talk.capacity
      closes: talk.startsAt
      cancelUntil: talk.startsAt
pages:
  talks:
    crud: Talk
    filters: [speaker, startsAt]
    defaultFilter:
      startsAt: upcoming
  speakers:
    crud: Speaker
  my-registrations:
    crud: Registration
  schedule:
    calendar:
      model: Talk
      starts: startsAt
  home:
    route: /
    landing:
      hero:
      footer:
      programme:
        records: Talk
      lineup:
        records: Speaker
      faq:
      callToAction:
        button: talks
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
