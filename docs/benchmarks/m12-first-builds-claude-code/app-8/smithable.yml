smithable: 0.1
app:
  name: Conference Registration
  description: The programme of a conference, its speakers, and registration for its talks.
  timezone: Europe/Helsinki
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: markdown
      portrait: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      summary: text
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
      attendee: User
    namedBy: talk
    ownedBy: attendee
    capacity:
      per: talk
      max: talk.capacity
      closes: talk.startsAt
      cancelUntil: talk.startsAt
pages:
  home:
    route: /
    landing:
      hero:
        button: schedule
        secondButton: speakers
      features:
      speakers:
        records: Speaker
      faq:
      callToAction:
        button: schedule
      footer:
  schedule:
    calendar:
      model: Talk
      starts: startsAt
    filters: [speaker]
  my-registrations:
    crud: Registration
    mine: true
  talks:
    crud: Talk
    filters: [speaker, startsAt]
  speakers:
    crud: Speaker
  attendees:
    crud: Registration
    filters: [talk]
  team:
    users: manage
  privacy:
    route: /privacy
    legal: privacy
