smithable: 0.1
app:
  name: Conference Hub
  description: "Registration for a conference: browse the talks and speakers, and save your seat at the talks you want to attend."
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: markdown
      portrait: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      abstract: markdown
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      track: general | technical | business | workshop
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
      attendee: User
    ownedBy: attendee
    capacity:
      per: talk
      max: talk.capacity
pages:
  talks:
    crud: Talk
    filters: [track, speaker, startsAt]
    sortable: [startsAt, title]
  schedule:
    calendar:
      model: Talk
      starts: startsAt
  speakers:
    crud: Speaker
    search: [name, company]
  my-registrations:
    crud: Registration
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule, talks, speakers]
      footer:
      talks:
        records: Talk
      speakers:
        records: Speaker
      faq:
      callToAction:
        button: schedule
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
navigation:
  main: [talks, schedule, speakers, my-registrations, home, privacy, admin]
  program: [schedule, talks, speakers, my-registrations]
  website: [home]
  admin: [admin]
