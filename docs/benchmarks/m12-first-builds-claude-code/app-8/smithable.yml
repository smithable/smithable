smithable: 0.1
app:
  name: Talkfront
  description: "Programme and registration for a conference: browse the talks and speakers, and reserve a seat in the talks you want to attend."
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: markdown
      portrait: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      abstract: markdown
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      track: keynote | technical | business | workshop
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
      attendee: User
    ownedBy: attendee
    namedBy: talk
    capacity:
      per: talk
      max: talk.capacity
      closes: talk.startsAt
      cancelUntil: talk.startsAt
pages:
  talks:
    crud: Talk
    filters: [track, speaker, startsAt]
    defaultFilter:
      startsAt: upcoming
  speakers:
    crud: Speaker
  my-registrations:
    crud: Registration
  schedule:
    calendar:
      model: Talk
      starts: startsAt
  home:
    route: /
    landing:
      hero:
        button: talks
        secondButton: speakers
      features:
      speakerList:
        records: Speaker
      faq:
      callToAction:
        button: talks
      footer:
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
navigation:
  main: [talks, speakers, my-registrations, schedule, home, privacy, admin]
  programme: [schedule, talks, speakers, my-registrations]
  website: [home]
  admin: [admin]
