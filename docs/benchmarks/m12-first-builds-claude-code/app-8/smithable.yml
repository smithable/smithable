smithable: 0.1
app:
  name: Conference Hub
  description: "Registration for a conference: browse the talks and speakers, and sign up for the talks you want to attend."
models:
  Speaker:
    fields:
      name: string!
      title: string
      company: string
      bio: markdown
      portrait: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      abstract: markdown
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      track: general | technical | business | workshop
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
    capacity:
      per: talk
      max: talk.capacity
  Message:
    fields:
      name: string!
      email: email!
      message: text!
pages:
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule, speakers]
      footer:
      programme:
        records: Talk
      lineup:
        records: Speaker
      faq:
      callToAction:
        button: schedule
      contact:
        form: Message
  schedule:
    calendar:
      model: Talk
      starts: startsAt
  talks:
    crud: Talk
    filters: [track, speaker]
  speakers:
    crud: Speaker
  my-registrations:
    crud: Registration
  messages:
    crud: Message
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
outgoing:
  registrationMade:
    when: Registration created
    to: mail
    recipient: owner
  registrationCancelled:
    when: Registration deleted
    to: mail
    recipient: owner
