smithable: 0.1
app:
  name: Conference Hub
  description: Talks, speakers and attendee registration for a conference.
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: markdown
      portrait: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      summary: text
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
      attendee: User
    namedBy: talk
    ownedBy: attendee
    capacity:
      per: talk
      max: talk.capacity
      closes: talk.startsAt
      cancelUntil: talk.startsAt
pages:
  schedule:
    calendar:
      model: Talk
      starts: startsAt
  talks:
    crud: Talk
    filters: [speaker, startsAt]
    defaultFilter:
      startsAt: upcoming
  speakers:
    crud: Speaker
  my-registrations:
    crud: Registration
  home:
    route: /
    landing:
      hero:
        button: schedule
      features:
      speakers:
        records: Speaker
      faq:
      callToAction:
        button: schedule
      footer:
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
navigation:
  main: [schedule, talks, speakers, my-registrations, home, privacy, admin]
  schedule: [schedule, my-registrations, talks]
  programme: [speakers, home]
  admin: [admin]
