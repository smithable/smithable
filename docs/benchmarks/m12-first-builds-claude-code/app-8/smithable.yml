smithable: 0.1
app:
  name: Confluence Conference
  description: Programme, speakers and attendee registration for a conference.
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: markdown
      portrait: picture
  Talk:
    fields:
      title: string!
      abstract: text
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 30
      room: string
      level: introductory | intermediate | advanced
  Registration:
    fields:
      name: string!
      email: email!
      company: string
      ticketType: fullConference | singleDay | student
      dietaryNeeds: text
      status: confirmed | cancelled
pages:
  my-registration:
    crud: Registration
    actions: [cancelRegistration]
  program:
    calendar: Talk
  talks:
    crud: Talk
  speakers:
    crud: Speaker
  home:
    route: /
    landing:
      hero:
      footer:
      speakerCards:
        records: Speaker
      faq:
      callToAction:
        button: my-registration
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
actions:
  cancelRegistration:
    on: Registration
    when:
      status: confirmed
    set:
      status: cancelled
    intent: Cancel a registration for the conference.
