smithable: 0.1
app:
  name: Confhub
  description: "Programme and registration for a conference: browse the talks and speakers, and sign up for the talks you want to attend."
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      title: string
      company: string
      bio: markdown
      portrait: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      abstract: text
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      track: keynote | technical | business | workshop
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
      attendee: User
    namedBy: talk
    ownedBy: attendee
    capacity:
      per: talk
      max: talk.capacity
      closes: talk.startsAt
      cancelUntil: talk.startsAt
pages:
  schedule:
    calendar:
      model: Talk
      starts: startsAt
  my-registrations:
    crud: Registration
  talks:
    crud: Talk
    filters: [speaker, track, startsAt]
    defaultFilter:
      startsAt: upcoming
  speakers:
    crud: Speaker
  home:
    route: /
    landing:
      hero:
        button: schedule
        secondButton: speakers
      programme:
        records: Talk
      lineup:
        records: Speaker
      faq:
      callToAction:
        button: schedule
      footer:
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
navigation: [schedule, my-registrations, talks, speakers, home, admin]
