smithable: 0.1
app:
  name: Confhub
  description: Programme, speakers and attendee registration for a conference.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      jobTitle: string
      company: string
      bio: markdown
      portrait: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      summary: text
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      track: keynote | technical | business | workshop
      level: beginner | intermediate | advanced
  Registration:
    fields:
      fullName: string!
      email: email!
      company: string
      jobTitle: string
      ticket: standard | student | vip
      dietaryNeeds: string
      status: confirmed | cancelled
      attendee: User
    ownedBy: attendee
    namedBy: fullName
pages:
  home:
    route: /
    landing:
      hero:
        button: schedule
        secondButton: speakers
      features:
      lineup:
        records: Speaker
      faq:
      callToAction:
        button: my-registration
      footer:
  schedule:
    calendar:
      model: Talk
      starts: startsAt
    filters: [speaker, track]
  my-registration:
    crud: Registration
    mine: true
  talks:
    crud: Talk
    filters: [speaker, track, level, startsAt]
  speakers:
    crud: Speaker
  registrations:
    crud: Registration
    filters: [ticket, status]
    search: [fullName, email, company]
  privacy:
    route: /privacy
    legal: privacy
actions:
  cancelRegistration:
    on: Registration
    when:
      status: confirmed
    set:
      status: cancelled
    intent: The attendee no longer comes to the conference.
navigation: [schedule, speakers, my-registration, talks, registrations]
