smithable: 0.1
app:
  name: Conference Hub
  description: Programme, speakers and talk registration for a conference.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: markdown
      portrait: picture
  Talk:
    fields:
      title: string!
      summary: text
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      level: beginner | intermediate | advanced
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
    capacity:
      per: talk
      max: talk.capacity
pages:
  schedule:
    calendar: Talk
  talks:
    crud: Talk
  speakers:
    crud: Speaker
  my-registrations:
    crud: Registration
  home:
    route: /
    landing:
      hero:
      footer:
      speakerCards:
        records: Speaker
      talkCards:
        records: Talk
      faq:
      callToAction:
        button: schedule
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
