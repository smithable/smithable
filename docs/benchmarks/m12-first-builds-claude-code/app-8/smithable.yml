smithable: 0.1
app:
  name: Conference Hub
  description: "Programme and registration for a conference: browse the talks and speakers, and register for the talks you want to attend."
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: text
    access:
      create: [admin]
  Talk:
    fields:
      title: string!
      summary: text
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      level: beginner | intermediate | advanced
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
    access:
      create: [admin]
  Registration:
    fields:
      talk: Talk! unique
    capacity:
      per: talk
      max: talk.capacity
pages:
  schedule:
    calendar:
      model: Talk
      starts: startsAt
  talks:
    crud: Talk
    access: [admin]
    search: [title, room]
    filters: [speaker, level]
  speakers:
    crud: Speaker
  my-registrations:
    crud: Registration
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule, speakers]
      footer:
      programme:
        records: Talk
      lineup:
        records: Speaker
      faq:
      callToAction:
        button: schedule
  admin:
    data: all
