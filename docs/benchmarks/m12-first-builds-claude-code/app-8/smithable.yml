smithable: 0.1
app:
  name: Northlight Conference
  description: Talks, speakers and attendee registration for a one-track conference.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      title: string
      company: string
      bio: markdown
      portrait: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      abstract: markdown
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      track: general | technical | workshop
      capacity: int! = 100
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
  Registration:
    fields:
      talk: Talk! unique
      attendee: User
    namedBy: talk
    ownedBy: attendee
    capacity:
      per: talk
      max: talk.capacity
      closes: talk.startsAt
      cancelUntil: talk.startsAt
  Message:
    fields:
      name: string!
      email: email!
      message: text!
pages:
  home:
    route: /
    landing:
      hero:
        button: schedule
      features:
      lineup:
        records: Speaker
      program:
        records: Talk
      faq:
      callToAction:
        button: schedule
      contact:
        form: Message
      footer:
  schedule:
    calendar:
      model: Talk
      starts: startsAt
  my-registrations:
    crud: Registration
  talks:
    crud: Talk
    filters: [speaker, track, startsAt]
    defaultFilter:
      startsAt: upcoming
  speakers:
    crud: Speaker
    search: [name, company]
  messages:
    crud: Message
  admin:
    data: all
  privacy:
    route: /privacy
    legal: privacy
navigation:
  main: [home, schedule, my-registrations, talks, speakers, messages, admin, privacy]
  program: [schedule, my-registrations, talks, speakers]
  messages: [messages]
  website: [home]
  admin: [admin]
