smithable: 0.1
app:
  name: Podium Conference
  description: Programme, speakers and attendee registration for a conference.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Speaker:
    fields:
      name: string!
      company: string
      bio: markdown
      portrait: picture
      talks: Talk[]
  Talk:
    fields:
      title: string!
      abstract: markdown
      speaker: Speaker!
      startsAt: datetime!
      durationMinutes: int! = 45
      room: string
      track: keynote | technical | business | workshop
  Registration:
    fields:
      fullName: string!
      email: email! unique
      company: string
      ticket: standard | student | speaker
      dietaryNeeds: text
      status: confirmed | cancelled
    namedBy: fullName
pages:
  home:
    route: /
    landing:
      hero:
        button: my-registration
        secondButton: programme
      speakersShown:
        records: Speaker
      features:
      faq:
      callToAction:
        button: my-registration
      footer:
  programme:
    calendar:
      model: Talk
      starts: startsAt
  talks:
    crud: Talk
    filters: [speaker, track, startsAt]
  speakers:
    crud: Speaker
  my-registration:
    crud: Registration
    mine: true
  registrations:
    crud: Registration
    filters: [ticket, status]
    search: [fullName, email, company]
  privacy:
    route: /privacy
    legal: privacy
actions:
  cancelRegistration:
    on: Registration
    when:
      status: confirmed
    set:
      status: cancelled
    intent: The attendee no longer comes to the conference.
navigation:
  main: [home, programme, talks, speakers, my-registration, registrations, privacy]
  conference: [programme, talks, speakers]
  registration: [my-registration, registrations]
  website: [home]
