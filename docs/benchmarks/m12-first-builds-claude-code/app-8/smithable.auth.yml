smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  staff:
    description: The conference team. Runs the programme, the speakers and who attends.
    pages: [schedule, talks, speakers, attendees]
    read: [Talk, Speaker, Registration]
    create: [Talk, Speaker, Registration]
    write: [Talk, Speaker, Registration]
    delete: [Registration]
  member:
    description: An attendee who registers for talks.
    pages: [my-registrations]
    create: [Registration]
assistant:
  for: signed-in
public:
  pages: [home, schedule, speakers, privacy]
  read: [Talk, Speaker]
defaultRole: member
admins: [johan@smithable.ai]
