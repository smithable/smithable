smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  staff:
    description: An organizer. Runs the talks and the speakers, and sees who is registered for each talk.
    pages: [talks, speakers, registrations]
    read: [Talk, Speaker, Registration]
    create: [Talk, Speaker, Registration]
    write: [Talk, Speaker, Registration]
    delete: [Registration]
  attendee:
    description: Someone coming to the conference, who registers for talks.
    pages: [my-registrations]
    create: [Registration]
assistant:
  for: signed-in
public:
  pages: [home, schedule, privacy]
  read: [Talk, Speaker]
defaultRole: attendee
admins: [johan@smithable.ai]
