smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  organizer:
    description: "Runs the conference: the programme, the speakers and the attendee list."
    pages: [talks, speakers, registrations, schedule, my-registration]
    read: [Talk, Speaker, Registration]
    create: [Talk, Speaker, Registration]
    write: [Talk, Speaker, Registration]
    delete: [Talk, Speaker, Registration]
  attendee:
    description: Registers to attend the conference.
    pages: [my-registration]
    create: [Registration]
assistant:
  for: signed-in
public:
  pages: [home, schedule, speakers, privacy]
  read: [Talk, Speaker]
defaultRole: attendee
admins: [johan@smithable.ai]
