smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  organizer:
    description: Runs the programme, the speakers and the list of attendees.
    pages: [programme, talks, speakers, registrations]
    read: [Talk, Speaker, Registration]
    create: [Talk, Speaker, Registration]
    write: [Talk, Speaker, Registration]
    delete: [Talk, Speaker, Registration]
  attendee:
    description: Registers for the conference and keeps their registration up to date.
    pages: [my-registration]
    create: [Registration]
assistant:
  for: signed-in
public:
  pages: [home, programme, talks, speakers, privacy]
  read: [Talk, Speaker]
defaultRole: attendee
admins: [johan@smithable.ai]
