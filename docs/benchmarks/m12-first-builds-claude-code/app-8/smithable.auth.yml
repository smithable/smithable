smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  organizer:
    description: "Runs the programme: talks, speakers and who attends."
    pages: [talks, speakers, registrations, my-registrations]
    read: [Talk, Speaker, Registration]
    create: [Talk, Speaker, Registration]
    write: [Talk, Speaker, Registration]
    delete: [Talk, Speaker, Registration]
  attendee:
    description: Comes to the conference and registers for talks.
    pages: [my-registrations]
    create: [Registration]
assistant:
  for: signed-in
public:
  pages: [home, schedule, speakers, privacy]
  read: [Talk, Speaker]
defaultRole: attendee
admins: [johan@smithable.ai]
