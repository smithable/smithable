smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  attendee:
    description: A conference attendee who registers for talks.
    pages: [my-registrations]
    create: [Registration]
assistant:
  for: signed-in
public:
  pages: [home, schedule, speakers, privacy]
  read: [Speaker, Talk]
defaultRole: attendee
admins: [johan@smithable.ai]
