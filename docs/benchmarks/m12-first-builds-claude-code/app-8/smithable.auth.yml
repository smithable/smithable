smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin:
    description: Organizers. Manage the program, talks and speakers.
  member:
    description: An attendee who registers for talks.
    pages: [my-registrations, program, speakers]
    create: [Registration]
assistant:
  for: signed-in
public:
  pages: [home, program, speakers, privacy]
  read: [Talk, Speaker]
defaultRole: member
admins: [johan@smithable.ai]
