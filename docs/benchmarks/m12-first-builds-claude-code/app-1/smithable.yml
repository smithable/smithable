smithable: 0.1
app:
  name: Open Sky Yoga
  description: Class schedule, teachers and online booking for a yoga studio.
  currency: EUR
  timezone: Europe/Stockholm
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: allLevels | beginner | advanced
      durationMinutes: int! = 60
      sessions: Session[]
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      sessions: Session[]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
    namedBy: [classType, startsAt]
  Booking:
    fields:
      session: Session! unique
      attendee: User
    namedBy: session
    ownedBy: attendee
    capacity:
      per: session
      max: session.capacity
      closes: session.startsAt
      cancelUntil: 2 hours before session.startsAt
pages:
  schedule:
    calendar:
      model: Session
      starts: startsAt
    filters: [classType, instructor]
  my-bookings:
    crud: Booking
    mine: true
  sessions:
    crud: Session
    filters: [classType, instructor, startsAt]
    defaultFilter:
      startsAt: upcoming
    sortable: [startsAt, capacity]
  bookings:
    crud: Booking
  class-types:
    crud: ClassType
    filters: [level]
  instructors:
    crud: Instructor
  home:
    route: /
    landing:
      hero:
        button: schedule
      classes:
        records: ClassType
      teachers:
        records: Instructor
      faq:
      callToAction:
        button: schedule
      footer:
  privacy:
    route: /privacy
    legal: privacy
