smithable: 0.1
app:
  name: Lotus Grove Yoga
  description: Class schedule, teachers and online booking for a yoga studio.
  currency: EUR
models:
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      sessions: Session[]
  Session:
    fields:
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
      classType: ClassType!
    namedBy: [classType, startsAt]
  Booking:
    fields:
      session: Session! unique
      attendee: User
    namedBy: session
    ownedBy: attendee
    capacity:
      per: session
      max: session.capacity
      closes: session.startsAt
      cancelUntil: session.startsAt
  Message:
    fields:
      name: string!
      email: email!
      message: text!
  ClassType:
    fields:
      name: string!
      summary: text
      level: allLevels | beginner | advanced
      durationMinutes: int! = 60
      sessions: Session[]
pages:
  schedule:
    calendar:
      model: Session
      starts: startsAt
  my-bookings:
    crud: Booking
  sessions:
    crud: Session
    sortable: [startsAt, capacity]
    filters: [classType, instructor, startsAt]
    defaultFilter:
      startsAt: upcoming
  instructors:
    crud: Instructor
  messages:
    crud: Message
  home:
    route: /
    landing:
      hero:
      classes:
        records: ClassType
      teachers:
        records: Instructor
      callToAction:
        button: schedule
      contact:
        form: Message
      footer:
  privacy:
    route: /privacy
    legal: privacy
  class-types:
    crud: ClassType
    filters: [level]
navigation:
  main: [schedule, my-bookings, sessions, instructors, messages, home, privacy, class-types]
  schedule: [schedule, my-bookings, sessions]
  messages: [messages]
  website: [home]
  studioSetup: [class-types, instructors]
