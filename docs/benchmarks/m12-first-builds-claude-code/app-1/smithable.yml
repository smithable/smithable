smithable: 0.1
app:
  name: Open Sky Yoga
  description: Class schedule, teachers and online booking for a yoga studio.
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: allLevels | beginner | advanced
      durationMinutes: int! = 60
    access:
      create: [admin]
  Instructor:
    fields:
      name: string!
      bio: text
    access:
      create: [admin]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
    access:
      create: [admin]
  Booking:
    fields:
      session: Session! unique
    capacity:
      per: session
      max: session.capacity
  Message:
    fields:
      name: string!
      email: email!
      message: text!
    access:
      read: [admin]
      write: [admin]
      delete: [admin]
pages:
  my-bookings:
    crud: Booking
  schedule:
    calendar:
      model: Session
      starts: startsAt
  sessions:
    crud: Session
    access: [admin]
  class-types:
    crud: ClassType
    access: [admin]
  instructors:
    crud: Instructor
    access: [admin]
  messages:
    crud: Message
    access: [admin]
  home:
    route: /
    landing:
      hero:
      footer:
      classes:
        records: ClassType
      teachers:
        records: Instructor
      callToAction:
        button: schedule
      contact:
        form: Message
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
outgoing:
  bookingMade:
    when: Booking created
    to: mail
    recipient: owner
  bookingCancelled:
    when: Booking deleted
    to: mail
    recipient: owner
