smithable: 0.1
app:
  name: Open Sky Yoga
  description: Class schedule, teachers and online booking for a yoga studio.
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: allLevels | beginner | advanced
      durationMinutes: int! = 60
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
  Booking:
    fields:
      session: Session! unique
    capacity:
      per: session
      max: session.capacity
pages:
  sessions:
    crud: Session
  class-types:
    crud: ClassType
  teachers:
    crud: Instructor
  my-bookings:
    crud: Booking
  schedule:
    calendar:
      model: Session
      starts: startsAt
  home:
    route: /
    landing:
      hero:
      footer:
      classes:
        records: ClassType
      ourTeachers:
        records: Instructor
      callToAction:
        button: schedule
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
