smithable: 0.1
app:
  name: Juniper Yoga Studio
  description: Class schedule, teachers and online booking for a yoga studio.
  currency: EUR
  timezone: Europe/Stockholm
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: allLevels | beginner | advanced
      durationMinutes: int! = 60
      sessions: Session[]
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      sessions: Session[]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
  Booking:
    fields:
      session: Session! unique
      attendee: User
    ownedBy: attendee
    capacity:
      per: session
      max: session.capacity
  Message:
    fields:
      name: string!
      email: email!
      message: text!
pages:
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule, instructors]
      footer:
      classes:
        records: ClassType
      teachers:
        records: Instructor
      faq:
      callToAction:
        button: schedule
      contact:
        form: Message
  schedule:
    calendar:
      model: Session
      starts: startsAt
  my-bookings:
    crud: Booking
  sessions:
    crud: Session
    filters: [classType, instructor, startsAt]
    sortable: [startsAt, capacity]
  class-types:
    crud: ClassType
    filters: [level]
  instructors:
    crud: Instructor
  messages:
    crud: Message
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
navigation:
  main: [home, schedule, my-bookings, sessions, class-types, instructors, messages, privacy, admin]
  schedule: [schedule, my-bookings, sessions]
  messages: [messages]
  studioSetup: [class-types, instructors]
  website: [home]
  admin: [admin]
