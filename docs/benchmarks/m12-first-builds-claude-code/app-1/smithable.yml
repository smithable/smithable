smithable: 0.1
app:
  name: Lotus Flow Yoga
  description: Class schedule, teachers and online booking for a yoga studio.
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: allLevels | beginner | advanced
      durationMinutes: int! = 60
  Instructor:
    fields:
      name: string!
      bio: text
      portrait: picture
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
  Booking:
    fields:
      session: Session! unique
    capacity:
      per: session
      max: session.capacity
  Message:
    fields:
      name: string!
      email: email!
      message: text!
pages:
  sessions:
    crud: Session
  schedule:
    calendar:
      model: Session
      starts: startsAt
  class-types:
    crud: ClassType
  teachers:
    crud: Instructor
  my-bookings:
    crud: Booking
  messages:
    crud: Message
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule]
      footer:
      classes:
        records: ClassType
      teachers:
        records: Instructor
      faq:
      callToAction:
        button: schedule
      contact:
        form: Message
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
outgoing:
  bookingMade:
    when: Booking created
    to: mail
    recipient: owner
  bookingCancelled:
    when: Booking deleted
    to: mail
    recipient: owner
