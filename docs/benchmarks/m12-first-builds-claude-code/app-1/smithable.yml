smithable: 0.1
app:
  name: Lotus Room Yoga
  description: Class schedule, teachers and online booking for a yoga studio.
  currency: EUR
  timezone: Europe/Stockholm
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: allLevels | beginner | advanced
      durationMinutes: int! = 60
      sessions: Session[]
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      sessions: Session[]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
  Booking:
    fields:
      session: Session! unique
    capacity:
      per: session
      max: session.capacity
pages:
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule, instructors]
      footer:
      classes:
        records: ClassType
      teachers:
        records: Instructor
      faq:
      callToAction:
        button: schedule
  schedule:
    calendar: Session
  sessions:
    crud: Session
  class-types:
    crud: ClassType
    filters: [level]
  instructors:
    crud: Instructor
  my-bookings:
    crud: Booking
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
outgoing:
  bookingMade:
    when: Booking created
    to: mail
    recipient: owner
  bookingChanged:
    when: Booking changed
    to: mail
    recipient: owner
  bookingCancelled:
    when: Booking deleted
    to: mail
    recipient: owner
