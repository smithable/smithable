smithable: 0.1
app:
  name: Juniper Yoga Studio
  description: Class schedule, teachers and online booking for a yoga studio.
  currency: EUR
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: allLevels | beginner | advanced
      durationMinutes: int! = 60
      sessions: Session[]
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      sessions: Session[]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
  Booking:
    fields:
      session: Session! unique
    capacity:
      per: session
      max: session.capacity
  Message:
    fields:
      name: string!
      email: email!
      message: text!
pages:
  sessions:
    crud: Session
  class-types:
    crud: ClassType
    filters: [level]
  instructors:
    crud: Instructor
  my-bookings:
    crud: Booking
  messages:
    crud: Message
  schedule:
    calendar:
      model: Session
      starts: startsAt
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule, instructors]
      footer:
      classes:
        records: ClassType
      teachers:
        records: Instructor
      faq:
      callToAction:
        button: schedule
      contact:
        form: Message
  privacy:
    route: /privacy
    legal: privacy
outgoing:
  bookingMade:
    when: Booking created
    to: mail
    recipient: owner
  bookingCancelled:
    when: Booking deleted
    to: mail
    recipient: owner
