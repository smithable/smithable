smithable: 0.1
app:
  name: Willow Flow Yoga
  description: Class schedule, teachers and online booking for a yoga studio.
models:
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      sessions: Session[]
  Session:
    fields:
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
      classType: ClassType!
  Booking:
    fields:
      session: Session! unique
      attendee: User
    ownedBy: attendee
    capacity:
      per: session
      max: session.capacity
  ClassType:
    fields:
      name: string!
      summary: text
      level: allLevels | beginner | advanced
      durationMinutes: int! = 60
      sessions: Session[]
pages:
  home:
    route: /
    landing:
      hero:
      footer:
      teachers:
        records: Instructor
      faq:
      classes:
        records: ClassType
      callToAction:
        button: schedule
  schedule:
    calendar:
      model: Session
      starts: startsAt
  my-bookings:
    crud: Booking
  sessions:
    crud: Session
    sortable: [startsAt, capacity]
    filters: [classType, instructor, startsAt]
    defaultFilter:
      startsAt: upcoming
  instructors:
    crud: Instructor
  privacy:
    route: /privacy
    legal: privacy
  class-types:
    crud: ClassType
    filters: [level]
outgoing:
  bookingMade:
    when: Booking created
    to: mail
    recipient: owner
  bookingCancelled:
    when: Booking deleted
    to: mail
    recipient: owner
  reminder:
    when: remind
    to: mail
    recipient: owner
timers:
  remind:
    on: Booking
    at: 1 day before session.startsAt
navigation:
  main: [home, schedule, my-bookings, sessions, instructors, privacy, class-types]
  schedule: [schedule, my-bookings, sessions]
  website: [home]
  studioSetup: [class-types, instructors]
