smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  staff:
    description: Reception. Runs the sessions and who comes to them.
    pages: [sessions, bookings]
    read: [Session, Booking]
    create: [Session, Booking]
    write: [Session, Booking]
    delete: [Booking]
  member:
    description: A student who books classes.
    pages: [my-bookings]
    create: [Booking]
assistant:
  for: signed-in
public:
  pages: [home, schedule, privacy]
  read: [ClassType, Instructor, Session]
defaultRole: member
admins: [johan@smithable.ai]
