smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  member:
    description: A student who books classes.
    pages: [my-bookings, schedule]
    create: [Booking]
assistant:
  for: signed-in
public:
  pages: [home, schedule, privacy]
  read: [Instructor, Session, ClassType]
  create: [Message]
defaultRole: member
admins: [johan@smithable.ai]
