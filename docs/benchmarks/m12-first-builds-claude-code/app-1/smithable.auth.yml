smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin:
    description: Studio staff. Manage the schedule, classes and teachers.
  member:
    description: A student who books classes.
    pages: [my-bookings, schedule]
    create: [Booking]
public:
  pages: [home, schedule, privacy]
  read: [ClassType, Instructor, Session]
defaultRole: member
admins: [johan@smithable.ai]
