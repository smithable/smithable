smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  member: { pages: [schedule, my-bookings], create: [Booking] }
assistant:
  for: signed-in
public:
  pages: [home, schedule, privacy]
  read: [ClassType, Instructor, Session]
  create: [Message]
admins: [johan@smithable.ai]
