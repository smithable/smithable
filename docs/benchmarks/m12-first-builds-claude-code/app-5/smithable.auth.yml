smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  member:
    description: Works in the bakery and keeps the stock up to date.
    pages: [ingredients, suppliers]
    create: [Ingredient, Supplier]
    write: [Ingredient, Supplier]
assistant:
  for: signed-in
defaultRole: member
admins: [johan@smithable.ai]
