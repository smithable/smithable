smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  member:
    description: "Works in the bakery: keeps ingredients, suppliers and stock levels up to date."
    pages: all
    create: all
    write: [Ingredient, Supplier]
assistant:
  for: signed-in
defaultRole: member
admins: [johan@smithable.ai]
