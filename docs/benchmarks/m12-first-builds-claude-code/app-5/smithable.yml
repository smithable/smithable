smithable: 0.1
app:
  name: Bakery Stock
  description: Keep track of the bakery's ingredients, their suppliers and how much is in stock.
models:
  Supplier:
    fields:
      name: string!
      contactName: string
      email: email
      phone: phone
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string! unique
      supplier: Supplier
      unit: kg | g | l | ml | pieces
      quantityInStock: decimal! = 0
      reorderLevel: decimal = 0
      lowStock:
        type: bool
        formula: quantityInStock <= reorderLevel
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  team:
    users: manage
