smithable: 0.1
app:
  name: Bakery Stock
  description: Keeps track of a small bakery's ingredients, their suppliers and how much is in stock.
models:
  Supplier:
    fields:
      name: string!
      contactName: string
      email: email
      phone: phone
      website: url
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string!
      category: flour | sugar | dairy | eggs | fats | leavening | flavoring | fruitAndNuts | packaging | other
      unit: kg | g | l | ml | pieces | packs
      inStock: decimal! = 0
      reorderLevel: decimal = 0
      lowStock:
        type: bool
        formula: inStock <= reorderLevel
      costPerUnit: money
      supplier: Supplier
      lastCounted: date = TODAY()
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
    filters: [category, supplier]
    sortable: [name, inStock, lastCounted]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  team:
    users: manage
