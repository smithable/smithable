smithable: 0.1
app:
  name: Bakery Stock
  description: Keeps track of a small bakery's ingredients, their suppliers and how much of each is in stock.
  timezone: Europe/Helsinki
models:
  Supplier:
    fields:
      name: string! unique
      contactName: string
      email: email
      phone: phone
      website: url
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string! unique
      category: other | flour | sugar | dairy | eggs | fats | leavening | flavoring | packaging
      unit: kg | g | l | ml | pieces
      inStock: decimal! = 0
      reorderLevel: decimal! = 0
      aboveReorder:
        type: decimal
        formula: inStock - reorderLevel
        description: How much is in stock beyond the reorder level; below zero means the ingredient should be reordered.
      supplier: Supplier
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
    filters: [category, supplier]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  team:
    users: manage
