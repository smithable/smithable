smithable: 0.1
app:
  name: Bakery Stock
  description: Keep track of the bakery's ingredients, their suppliers and how much is in stock.
models:
  Supplier:
    fields:
      name: string!
      contactName: string
      email: email
      phone: phone
      website: url
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string! unique
      category: flour | sugar | dairy | eggs | fats | yeast | fruit | nuts | chocolate | spices | packaging | other
      unit: kg | g | l | ml | pieces | packs
      inStock: decimal! = 0
      reorderLevel: decimal
      storage: dry | chilled | frozen
      supplier: Supplier
      notes: text
      stockChanges: StockChange[]
  StockChange:
    fields:
      ingredient: Ingredient!
      kind: delivery | used | wasted | count
      quantity: decimal!
      on: date! = TODAY()
      note: string
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
    filters: [category, storage, supplier]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  stockChanges:
    crud: StockChange
    filters: [ingredient, kind, on]
  team:
    users: manage
