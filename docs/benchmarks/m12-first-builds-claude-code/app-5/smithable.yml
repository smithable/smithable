smithable: 0.1
app:
  name: Bakery Stock
  description: Keeps track of the bakery's ingredients, their suppliers and how much is in stock.
  currency: EUR
  timezone: Europe/Mariehamn
models:
  Supplier:
    fields:
      name: string!
      contactPerson: string
      email: email
      phone: phone
      website: url
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string! unique
      category: flour | sugar | dairy | eggs | fats | yeast | flavorings | fruitAndNuts | packaging | other
      unit: kg | g | l | ml | pieces | packs
      inStock: decimal! = 0
      reorderLevel: decimal = 0
      supplier: Supplier
      pricePerUnit: money
      storage: dry | fridge | freezer
      lastCounted: date = TODAY()
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
    filters: [category, supplier, storage]
  suppliers:
    crud: Supplier
    search: [name, contactPerson, email]
  team:
    users: manage
