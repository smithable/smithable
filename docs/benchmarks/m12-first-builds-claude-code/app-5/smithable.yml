smithable: 0.1
app:
  name: Bakery Stock
  description: Keeps track of the bakery's ingredients, who supplies them and how much is in stock.
  timezone: Europe/Helsinki
models:
  Supplier:
    fields:
      name: string!
      contactName: string
      email: email
      phone: phone
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string! unique
      category: flour | sugar | dairy | eggs | fats | yeast | flavorings | other
      supplier: Supplier
      unit: kg | g | l | ml | pieces
      inStock: decimal! = 0
      reorderAt: decimal
      costPerUnit: money
      storage: dry | chilled | frozen
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
    filters: [category, supplier, storage]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  team:
    users: manage
