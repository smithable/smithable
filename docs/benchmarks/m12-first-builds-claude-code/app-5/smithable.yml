smithable: 0.1
app:
  name: Bakery Stock
  description: Keeps track of a bakery's ingredients, their suppliers and how much is in stock.
models:
  Supplier:
    fields:
      name: string!
      contactName: string
      email: email
      phone: phone
      website: url
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string!
      category: flour | sugar | dairy | eggs | fats | leavening | flavoring | fruit | nuts | packaging | other
      unit: kg | g | l | ml | pieces
      inStock: decimal! = 0
      reorderLevel: decimal
      costPerUnit: money
      supplier: Supplier
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
    filters: [category, supplier]
    sortable: [name, inStock, category]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  team:
    users: manage
