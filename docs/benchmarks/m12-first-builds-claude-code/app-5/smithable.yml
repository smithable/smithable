smithable: 0.1
app:
  name: Bakery Stock
  description: Keeps track of the bakery's ingredients, their suppliers and how much is in stock.
  currency: EUR
models:
  Supplier:
    fields:
      name: string!
      contactName: string
      email: email
      phone: phone
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string! unique
      unit: kg | g | l | ml | pieces | packs
      supplier: Supplier
      inStock: decimal! = 0
      reorderLevel: decimal = 0
      costPerUnit: money
      lowStock:
        type: bool
        formula: inStock <= reorderLevel
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  team:
    users: manage
