smithable: 0.1
app:
  name: Bakery Stock
  description: Keeps track of a bakery's ingredients, their suppliers and how much of each is in stock.
  timezone: Europe/Helsinki
models:
  Supplier:
    fields:
      name: string! unique
      contactName: string
      email: email
      phone: phone
      website: url
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string! unique
      category: flour | sugar | dairy | eggs | fats | fruitAndNuts | spices | other
      supplier: Supplier
      unit: kg | g | l | ml | pieces
      inStock: decimal! = 0
      reorderLevel: decimal! = 0
      aboveReorderLevel:
        type: decimal
        formula: inStock - reorderLevel
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
    filters: [category, supplier]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  team:
    users: manage
