smithable: 0.1
app:
  name: Crumb & Count
  description: Keeps track of the bakery's ingredients, their suppliers and how much of each is in stock.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Supplier:
    fields:
      name: string! unique
      contactPerson: string
      email: email
      phone: phone
      website: url
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string! unique
      unit: kg | g | l | ml | pieces
      inStock: decimal! = 0
      reorderAt: decimal
      storage: dry | chilled | frozen
      supplier: Supplier
      costPerUnit: money
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
    filters: [storage, supplier, inStock]
  suppliers:
    crud: Supplier
    search: [name, contactPerson, email]
  team:
    users: manage
