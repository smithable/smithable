smithable: 0.1
app:
  name: Bakery Stock
  description: Keeps track of the bakery's ingredients, their suppliers and how much is in stock.
  currency: EUR
models:
  Supplier:
    fields:
      name: string!
      contactName: string
      email: email
      phone: phone
      website: url
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string! unique
      category: flour | sugar | dairy | eggs | fats | yeast | flavorings | fruitAndNuts | packaging | other
      unit: kg | g | l | ml | pieces
      supplier: Supplier
      quantityInStock: decimal! = 0
      reorderLevel: decimal = 0
      costPerUnit: money
      needsReorder:
        type: bool
        formula: quantityInStock <= reorderLevel
      lastCountedOn: date = TODAY()
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
    sortable: [name, quantityInStock, lastCountedOn]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  team:
    users: manage
