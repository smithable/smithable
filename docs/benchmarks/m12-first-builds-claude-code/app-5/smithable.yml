smithable: 0.1
app:
  name: Bakery Stock
  description: Keep track of the bakery's ingredients, their suppliers and how much is in stock.
models:
  Supplier:
    fields:
      name: string!
      contactPerson: string
      email: email
      phone: phone
      website: url
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string!
      category: flour | sugar | dairy | eggs | fats | yeast | fruit | nuts | chocolate | spices | packaging | other
      unit: kg | g | l | ml | pieces | packs
      inStock: decimal! = 0
      reorderLevel: decimal = 0
      lowStock:
        type: bool
        formula: inStock <= reorderLevel
      supplier: Supplier
      storage: dry | fridge | freezer
      lastCounted: date = TODAY()
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
  suppliers:
    crud: Supplier
    search: [name, contactPerson, email]
  team:
    users: manage
