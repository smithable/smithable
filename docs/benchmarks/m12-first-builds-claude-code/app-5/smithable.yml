smithable: 0.1
app:
  name: Bakery Stock
  description: Keeps track of the bakery's ingredients, their suppliers and how much of each is in stock.
  currency: EUR
models:
  Supplier:
    fields:
      name: string!
      contactName: string
      email: email
      phone: phone
      website: url
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string!
      category: flour | dairy | sugar | fats | eggs | flavorings | packaging | other
      unit: kg | g | l | ml | pieces
      inStock: decimal! = 0
      reorderAt:
        type: decimal
        description: When the stock in hand falls to this amount or below, the ingredient should be reordered from its supplier.
      costPerUnit: money
      supplier: Supplier
      lastCounted: date = TODAY()
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
    filters: [category, supplier]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  team:
    users: manage
