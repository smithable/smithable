smithable: 0.1
app:
  name: Bakery Stock
  description: Keeps track of a small bakery's ingredients, their suppliers and how much of each is in stock.
  currency: EUR
  timezone: Europe/Helsinki
models:
  Supplier:
    fields:
      name: string!
      contactPerson: string
      email: email
      phone: phone
      website: url
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string! unique
      category: flour | sugar | dairy | eggs | fats | yeast | flavorings | fruitAndNuts | packaging | other
      supplier: Supplier
      unit: kg | g | l | ml | pieces | packs
      inStock:
        type: decimal!
        min: 0
        default: 0
      reorderLevel:
        type: decimal
        min: 0
      unitPrice: money
      storage: dry | fridge | freezer
      lastCountedOn: date = TODAY()
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
    filters: [category, supplier, storage, inStock]
  suppliers:
    crud: Supplier
    search: [name, contactPerson, email]
  team:
    users: manage
