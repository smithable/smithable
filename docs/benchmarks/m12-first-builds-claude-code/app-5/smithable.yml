smithable: 0.1
app:
  name: Bakery Stock
  description: Keeps track of the bakery's ingredients, who supplies them and how much is on the shelf.
  currency: EUR
models:
  Supplier:
    fields:
      name: string!
      contactName: string
      email: email
      phone: phone
      website: url
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string! unique
      supplier: Supplier
      unit: kg | g | l | ml | pieces
      inStock: decimal! = 0
      reorderAt: decimal
      costPerUnit: money
      storage: dry | chilled | frozen
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
    filters: [supplier, storage, unit]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  team:
    users: manage
navigation: [ingredients, suppliers, team]
