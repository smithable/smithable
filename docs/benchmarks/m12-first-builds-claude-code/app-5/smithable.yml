smithable: 0.1
app:
  name: Bakery Stock
  description: Keeps track of the bakery's ingredients, their suppliers and how much of each is in stock.
models:
  Supplier:
    fields:
      name: string!
      contactName: string
      email: email
      phone: phone
      website: url
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string! unique
      supplier: Supplier
      unit: kg | g | l | ml | pieces
      inStock: decimal! = 0
      reorderLevel: decimal
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
    filters: [supplier, unit]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  team:
    users: manage
