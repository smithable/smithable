smithable: 0.1
app:
  name: Bakery Stock
  description: Keep track of the bakery's ingredients, their suppliers and how much is in stock.
models:
  Supplier:
    fields:
      name: string!
      contactName: string
      email: email
      phone: phone
      website: url
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string!
      category: dry | dairy | eggs | fats | sweeteners | fruit | other
      unit: kg | g | l | ml | pieces | packs
      inStock: decimal! = 0
      reorderLevel: decimal = 0
      supplier: Supplier
      storage: pantry | fridge | freezer
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
    filters: [category, supplier, storage]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  team:
    users: manage
navigation: [ingredients, suppliers, team]
