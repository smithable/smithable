smithable: 0.1
app:
  name: Bakery Stock
  description: Keep track of the bakery's ingredients, their suppliers and how much is in stock.
models:
  Supplier:
    fields:
      name: string!
      contactName: string
      email: email
      phone: phone
      website: url
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string!
      category: flour | dairy | sugar | fats | eggs | fruit | other
      supplier: Supplier
      unit: kg | g | l | ml | pieces
      inStock: decimal! = 0
      reorderLevel: decimal = 0
      storage: dry | chilled | frozen
      lastCounted: date = TODAY()
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
    filters: [category, supplier, storage]
    sortable: [name, inStock, lastCounted]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  team:
    users: manage
