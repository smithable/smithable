smithable: 0.1
app:
  name: Bakery Pantry
  description: Keeps track of the bakery's ingredients, their suppliers and how much of each is in stock.
  currency: EUR
  timezone: Europe/Helsinki
models:
  Supplier:
    fields:
      name: string! unique
      contactName: string
      email: email
      phone: phone
      website: url
      notes: text
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string! unique
      category: other | flour | sugar | dairy | eggs | fats | yeast | spices | fruitAndNuts | chocolate
      unit: kg | g | l | ml | pieces
      inStock: decimal! = 0
      reorderLevel: decimal
      unitCost: money
      supplier: Supplier
      lowStock:
        type: bool
        formula: inStock <= reorderLevel
      notes: text
pages:
  ingredients:
    crud: Ingredient
    search: [name, notes]
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
  team:
    users: manage
