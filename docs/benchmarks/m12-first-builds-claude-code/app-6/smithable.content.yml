pages:
  home:
    hero:
      title: Union jobs, posted by your local
      subtitle: See the openings our employers send us, and apply in a few minutes.
      button: See open jobs
      image:
        src: images/hero.webp
        alt: A shared workspace with people working at long tables, seen from a distance
        generated: true
    openJobs:
      title: Open right now
    features:
      title: How it works
      items: [{ title: Openings from union employers, text: "Every post comes through the local, so you know the work is covered by our agreements." }, { title: Apply online, text: "Sign in, pick a job, add a short note and your résumé, and send it." }, { title: Follow your applications, text: "See whether each application is being reviewed, accepted or declined, and get an email when it is decided." }]
    faq:
      title: Questions
      items: [{ question: Who can apply?, answer: Anyone with an account can apply; the local checks membership when it reviews applications. }, { question: Can I see jobs without signing in?, answer: Yes. The open jobs are on the site for everyone; you sign in only to apply. }, { question: How will I hear back?, answer: "Your application's status changes in the app, and you get an email once it is accepted or declined." }, { question: Can an employer post a job here?, answer: Contact the union office; staff put each opening on the board. }]
