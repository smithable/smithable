pages:
  home:
    features:
      items: [{ title: Work posted by your union, text: "Every opening is checked and posted by union staff, so you know the job meets the agreement." }, { title: Apply in minutes, text: "Sign in, add a short note and your resume, and your application goes straight to the staff." }, { title: Follow every application, text: "See whether you have been shortlisted, hired or passed over, all in one place." }]
      title: How it works
    faq:
      items: [{ question: Who can apply?, answer: Anyone with an account can apply; staff may ask for your member number when they review it. }, { question: Can I see jobs without signing in?, answer: "Yes, all open jobs are listed for everyone. You only sign in to apply." }, { question: Who sees my application?, answer: Only you and the union staff who handle job placements. }, { question: Can I apply to the same job twice?, answer: "No, one application per job. You can change yours while it is under review." }]
      title: Questions
    hero:
      title: Find your next job through the union
      subtitle: Openings from employers we work with, posted by union staff and open to members to apply.
      button: See open jobs
      secondButton: My applications
