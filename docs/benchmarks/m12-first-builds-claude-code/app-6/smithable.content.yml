pages:
  home:
    hero:
      title: Good jobs for our members
      subtitle: Browse the openings the union has gathered from fair employers, and apply in a few minutes.
      button: See open jobs
      image:
        src: images/hero.webp
        alt: A shared workspace with people working at long tables, seen from a distance
        generated: true
    features:
      title: How it works
      items: [{ title: Vetted openings, text: "Every job is posted by union staff, with employers who respect our agreements." }, { title: Apply online, text: "Sign in, add a short note and your resume, and send your application straight to the union." }, { title: Follow your applications, text: "See whether each application is submitted, shortlisted or settled, all in one place." }]
    faq:
      items: [{ question: Who can apply?, answer: Anyone who signs in can apply; most jobs are meant for members of our local. }, { question: Do I need a resume?, answer: "It helps, but a short message about your experience is enough to get started." }, { question: Who sees my application?, answer: Only you and union staff. Your details are never shown on the public job board. }, { question: How do I hear back?, answer: "Union staff update the status of your application, which you can check any time after signing in." }]
