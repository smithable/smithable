smithable: 0.1
app:
  name: Local 214 Jobs
  description: "The union's job board: staff post openings and members apply for them."
  currency: USD
  timezone: America/Chicago
models:
  Job:
    fields:
      title: string!
      employer: string!
      trade: carpentry | electrical | plumbing | laborer | operator | other
      type: fullTime | partTime | temporary | apprenticeship
      location: string
      pay: string
      description: text!
      startsOn: date
      closesOn: date
      open: bool = true
      applications: Application[]
  Application:
    fields:
      job:
        type: Job!
        unique: owner
      name: string!
      phone: phone!
      memberNumber: string
      message: text
      resume: file
      status:
        type: submitted | shortlisted | accepted | declined
        by: app
pages:
  jobs:
    crud: Job
    search: [title, employer, location, description]
    filters: [trade, type, open, closesOn]
    defaultFilter:
      open: true
    actions: [closeJob]
  myApplications:
    crud: Application
    mine: true
  applications:
    crud: Application
    search: [name, memberNumber]
    filters: [job, status]
  home:
    route: /
    landing:
      hero:
        button: jobs
        secondButton: myApplications
      openJobs:
        records: Job
        where:
          open: true
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
  accept:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: accepted
  decline:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: declined
  closeJob:
    on: Job
    when:
      open: true
    set:
      open: false
