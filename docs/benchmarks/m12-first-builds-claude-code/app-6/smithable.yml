smithable: 0.1
app:
  name: Union Job Board
  description: Job posts for members of the local union, and the applications they send.
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      location: string
      trade: string
      jobType: fullTime | partTime | temporary | apprenticeship
      pay: string
      deadline: date
      open: bool = true
  Application:
    fields:
      job: Job! unique
      fullName: string!
      email: email!
      phone: phone
      coverLetter: text
      status: submitted | reviewing | accepted | declined
pages:
  jobs:
    crud: Job
    search: [title, employer, description, location, trade]
    filters: [jobType, open, deadline]
    sortable: [deadline, createdAt]
    favorites: true
    actions: [closeJob]
  applications:
    crud: Application
    filters: [job, status]
    actions: [startReview, accept, decline]
  home:
    route: /
    landing:
      hero:
      footer:
      latestJobs:
        records: Job
        where:
          open: true
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  closeJob:
    on: Job
    when:
      open: true
    set:
      open: false
    intent: Close a job post so it no longer takes applications.
  startReview:
    on: Application
    when:
      status: submitted
    set:
      status: reviewing
    intent: Mark an application as being reviewed.
  accept:
    on: Application
    when:
      status: [submitted, reviewing]
    set:
      status: accepted
    intent: Accept an application.
  decline:
    on: Application
    when:
      status: [submitted, reviewing]
    set:
      status: declined
    intent: Decline an application.
