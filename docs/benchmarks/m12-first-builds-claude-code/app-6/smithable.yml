smithable: 0.1
app:
  name: Union Jobs
  description: Job openings for our local union's members, and a simple way to apply.
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      location: string
      type: fullTime | partTime | temporary | contract
      wage: string
      closesOn: date
      status: open | filled | closed
      applications: Application[]
  Application:
    fields:
      job:
        type: Job!
        unique: owner
      name: string!
      email: email!
      phone: phone
      memberNumber: string
      message: text!
      resume: file
      status:
        type: submitted | shortlisted | rejected | hired
        by: app
pages:
  jobs:
    route: /jobs
    crud: Job
    search: [title, employer, description, location]
    filters: [type, status, closesOn]
    defaultFilter:
      status: open
    sortable: [closesOn, createdAt]
    actions: [markFilled, closeJob]
  myApplications:
    crud: Application
    mine: true
  applications:
    crud: Application
    filters: [job, status]
    search: [name, email, memberNumber]
  home:
    route: /
    landing:
      hero:
        button: jobs
      openJobs:
        records: Job
        where:
          status: open
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
    intent: Mark a job as filled once someone is hired.
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
    intent: Stop taking applications for a job.
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
  reject:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: rejected
  hire:
    on: Application
    when:
      status: shortlisted
    set:
      status: hired
navigation: [jobs, myApplications, applications]
