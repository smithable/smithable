smithable: 0.1
app:
  name: Union Jobs
  description: A job board where the local union posts jobs and members apply for them.
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      trade: construction | electrical | plumbing | carpentry | transport | healthcare | other
      jobType: fullTime | partTime | temporary
      location: string
      pay: string
      closesOn: date
      status: open | filled | closed
      applications: Application[]
    access:
      create: [staff, admin]
      delete: [staff, admin]
  Application:
    fields:
      job: Job! unique
      name: string!
      email: email!
      phone: phone
      memberNumber: string
      message: text
      status: submitted | reviewed | accepted | rejected
    access:
      read: [owner, staff, admin]
pages:
  jobs:
    route: /
    crud: Job
    search: [title, employer, description, location]
    filters: [trade, jobType, status, closesOn]
    sortable: [closesOn, createdAt]
    favorites: true
    actions: [markFilled, closeJob]
  myApplications:
    crud: Application
    mine: true
  applications:
    crud: Application
    search: [name, email, memberNumber]
    filters: [job, status]
    access: [staff, admin]
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latest:
        records: Job
        where:
          status: open
  privacy:
    route: /privacy
    legal: privacy
actions:
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
    allow: [staff, admin]
    intent: Mark a job as filled once someone has been hired.
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
    allow: [staff, admin]
    intent: Close a job post without filling it.
  accept:
    on: Application
    when:
      status: [submitted, reviewed]
    set:
      status: accepted
    allow: [staff, admin]
    intent: Accept an application.
  reject:
    on: Application
    when:
      status: [submitted, reviewed]
    set:
      status: rejected
    allow: [staff, admin]
    intent: Turn down an application.
navigation: [jobs, myApplications, applications]
