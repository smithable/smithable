smithable: 0.1
app:
  name: Union Hall Jobs
  description: "The local union's job board: open positions posted by the hall, and members' applications to them."
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      trade: electrical | carpentry | plumbing | laborer | operator | office | other
      location: string
      type: fullTime | partTime | temporary | apprenticeship
      pay: string
      description: text!
      startsOn: date
      closesOn: date
      status: open | filled | closed
  Application:
    fields:
      job: Job!
      name: string!
      memberNumber: string
      phone: phone
      coverLetter: text
      resume: file
      status: submitted | shortlisted | hired | declined
pages:
  jobs:
    route: /
    crud: Job
    search: [title, employer, location, description]
    filters: [trade, type, status, closesOn]
    defaultFilter:
      status: open
    sortable: [closesOn, startsOn, createdAt]
    actions: [markFilled, closeJob, reopenJob]
  applications:
    crud: Application
    filters: [job, status]
    actions: [shortlist, hire, decline]
  home:
    route: /welcome
    landing:
      hero:
        button: jobs
      openJobs:
        records: Job
        where:
          status: open
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
    intent: Mark a job as filled once someone is hired.
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
    intent: Stop taking applications for a job.
  reopenJob:
    on: Job
    when:
      status: [filled, closed]
    set:
      status: open
    intent: Open a job for applications again.
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
    intent: Put an application on the shortlist.
  hire:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: hired
    intent: Record that the applicant got the job.
  decline:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: declined
    intent: Decline an application.
