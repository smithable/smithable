smithable: 0.1
app:
  name: Union Jobs
  description: A job board where the union posts jobs and members apply for them.
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      location: string
      pay: string
      type: fullTime | partTime | temporary | apprenticeship
      closesOn: date
      status: open | filled | closed
      applications: Application[]
  Application:
    fields:
      job: Job! unique
      name: string!
      email: email!
      phone: phone
      message: text
      resume: file
      status: submitted | reviewing | accepted | rejected
pages:
  jobs:
    route: /
    crud: Job
    search: [title, employer, description, location]
    filters: [type, status, closesOn]
    defaultFilter:
      status: open
    sortable: [closesOn, createdAt]
    favorites: true
    actions: [markFilled, closeJob]
  myApplications:
    crud: Application
    mine: true
  applications:
    crud: Application
    search: [name, email]
    filters: [job, status]
  home:
    route: /welcome
    landing:
      hero:
      latest:
        records: Job
        where:
          status: open
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
    intent: Mark a job as filled.
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
    intent: Close a job to new applications.
  startReview:
    on: Application
    when:
      status: submitted
    set:
      status: reviewing
  accept:
    on: Application
    when:
      status: [submitted, reviewing]
    set:
      status: accepted
  reject:
    on: Application
    when:
      status: [submitted, reviewing]
    set:
      status: rejected
navigation: [jobs, myApplications, applications, team]
