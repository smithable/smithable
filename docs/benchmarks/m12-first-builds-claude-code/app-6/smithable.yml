smithable: 0.1
app:
  name: Union Jobs
  description: Job posts from our local union, where members find work and apply.
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      location: string
      trade: string
      jobType: fullTime | partTime | temporary | apprenticeship
      pay: string
      startDate: date
      deadline: date
      status: open | filled | closed
      applications: Application[]
  Application:
    fields:
      job: Job!
      fullName: string!
      phone: phone
      memberNumber: string
      coverLetter: text
      resume: file
      status:
        type: submitted | reviewing | accepted | rejected
        by: app
      staffNotes: text
pages:
  jobs:
    route: /
    crud: Job
    search: [title, employer, description, location, trade]
    filters: [jobType, status, deadline]
    sortable: [deadline, startDate, createdAt]
    actions: [markFilled, closeJob]
  applications:
    crud: Application
    filters: [job, status]
    search: [fullName, memberNumber]
    actions: [startReview, accept, reject]
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latestJobs:
        records: Job
        where:
          status: open
      faq:
  privacy:
    route: /privacy
    legal: privacy
actions:
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
    intent: Mark a job as filled once someone has been hired.
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
    intent: Close a job post without filling it.
  startReview:
    on: Application
    when:
      status: submitted
    set:
      status: reviewing
    intent: Start reviewing an application.
  accept:
    on: Application
    when:
      status: [submitted, reviewing]
    set:
      status: accepted
    intent: Accept an application.
  reject:
    on: Application
    when:
      status: [submitted, reviewing]
    set:
      status: rejected
    intent: Reject an application.
