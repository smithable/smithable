smithable: 0.1
app:
  name: Union Jobs
  description: A job board where the union posts openings and members apply for them.
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      location: string
      trade: string
      jobType: fullTime | partTime | temporary | apprenticeship
      pay: string
      closesOn: date
      status: open | filled | closed
      applications: Application[]
  Application:
    fields:
      job: Job! unique
      name: string!
      email: email!
      phone: phone
      memberNumber: string
      message: text
      resume: file
      status: submitted | shortlisted | rejected | hired
    namedBy: [name, job]
pages:
  jobs:
    crud: Job
    search: [title, employer, description, location, trade]
    filters: [jobType, status, closesOn]
    defaultFilter:
      status: open
    sortable: [closesOn, createdAt]
    favorites: true
    actions: [markFilled, closeJob]
  myApplications:
    crud: Application
    mine: true
  applications:
    crud: Application
    filters: [job, status]
    search: [name, email, memberNumber]
  home:
    route: /welcome
    landing:
      hero:
        button: jobs
        secondButton: myApplications
      features:
      latest:
        records: Job
        where:
          status: open
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
  reject:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: rejected
  hire:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: hired
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
navigation: [jobs, myApplications, applications, team]
