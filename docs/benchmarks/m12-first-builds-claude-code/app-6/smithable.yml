smithable: 0.1
app:
  name: Union Jobs
  description: Job posts from our local union, and a simple way for members to apply.
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      location: string
      trade: string
      pay: string
      jobType: fullTime | partTime | temporary | apprenticeship
      deadline: date
      status: open | closed
      applications: Application[]
  Application:
    fields:
      job: Job! unique
      name: string!
      email: email!
      phone: phone
      coverLetter: text
      resume: file
      status:
        type: submitted | reviewing | accepted | rejected
        by: app
pages:
  jobs:
    route: /
    crud: Job
    search: [title, employer, description, location, trade]
    filters: [jobType, status, deadline]
    sortable: [deadline, createdAt]
    actions: [closeJob, reopenJob]
  myApplications:
    crud: Application
    mine: true
  applications:
    crud: Application
    filters: [job, status]
    search: [name, email]
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latestJobs:
        records: Job
        where:
          status: open
  privacy:
    route: /privacy
    legal: privacy
actions:
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
    intent: Stop taking applications for a job.
  reopenJob:
    on: Job
    when:
      status: closed
    set:
      status: open
    intent: Take applications for a job again.
  startReview:
    on: Application
    when:
      status: submitted
    set:
      status: reviewing
    intent: Mark an application as being reviewed.
  accept:
    on: Application
    when:
      status: [submitted, reviewing]
    set:
      status: accepted
    intent: Accept an application.
  reject:
    on: Application
    when:
      status: [submitted, reviewing]
    set:
      status: rejected
    intent: Turn down an application.
navigation: [jobs, myApplications, applications]
