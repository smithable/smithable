smithable: 0.1
app:
  name: Union Job Board
  description: A job board where a local union posts jobs and people apply for them.
  timezone: Europe/Helsinki
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      category: construction | manufacturing | transport | healthcare | education | publicService | other
      jobType: fullTime | partTime | temporary | apprenticeship
      location: string
      pay: string
      closesOn: date
      status: open | filled | closed
      applications: Application[]
  Application:
    fields:
      job:
        type: Job!
        unique: owner
      name: string!
      email: email!
      phone: phone
      coverLetter: text!
      resume: file
      status:
        type: submitted | shortlisted | hired | declined | withdrawn
        by: app
    namedBy: [name, job]
pages:
  jobs:
    crud: Job
    search: [title, employer, location, description]
    filters: [status, category, jobType]
    defaultFilter:
      status: open
    sortable: [closesOn, createdAt]
    actions: [markFilled, closePost]
  myApplications:
    crud: Application
    mine: true
  applications:
    crud: Application
    search: [name, email]
    filters: [status, job]
  team:
    users: manage
  home:
    route: /
    landing:
      hero:
        button: jobs
        secondButton: myApplications
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
  closePost:
    on: Job
    when:
      status: open
    set:
      status: closed
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
  hire:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: hired
  decline:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: declined
  withdraw:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: withdrawn
