smithable: 0.1
app:
  name: Union Job Board
  description: Job posts for union members, and a simple way to apply.
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      location: string
      trade: electrical | carpentry | plumbing | construction | warehouse | office | other
      jobType: fullTime | partTime | temporary | apprenticeship
      payRate: string
      description: text!
      closesOn: date
      status: open | filled | closed
      applications: Application[]
  Application:
    fields:
      job: Job! unique
      name: string!
      email: email!
      phone: phone
      memberNumber: string
      message: text
      resume: file
      status: submitted | shortlisted | accepted | declined
pages:
  jobs:
    route: /
    crud: Job
    search: [title, employer, location, description]
    filters: [trade, jobType, status, closesOn]
    defaultFilter:
      status: open
    sortable: [closesOn, createdAt]
    actions: [markFilled, closeJob]
  applications:
    crud: Application
    filters: [job, status]
    actions: [shortlist, accept, decline]
  team:
    users: manage
  home:
    route: /welcome
    landing:
      hero:
        button: jobs
      features:
      latest:
        records: Job
        where:
          status: open
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
    intent: Mark a job as filled once someone is hired.
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
    intent: Close a job post to new applications.
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
  accept:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: accepted
  decline:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: declined
navigation: [jobs, applications, team]
