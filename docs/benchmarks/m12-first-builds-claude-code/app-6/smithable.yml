smithable: 0.1
app:
  name: Local Union Job Board
  description: A job board where the union posts jobs and its members apply for them.
  currency: USD
  timezone: Europe/Helsinki
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      location: string
      jobType: fullTime | partTime | temporary | apprenticeship
      hourlyWage: money
      closesOn: date
      status: open | filled | closed
      applications: Application[]
  Application:
    fields:
      job: Job! unique
      applicantName: string!
      email: email!
      phone: phone
      memberNumber: string
      coverNote: text
      resume: file
      status:
        type: submitted | shortlisted | hired | declined
        by: app
    namedBy: [job, applicantName]
pages:
  jobs:
    route: /
    crud: Job
    search: [title, employer, location, description]
    filters: [jobType, status]
    defaultFilter:
      status: open
    sortable: [hourlyWage, closesOn, createdAt]
    actions: [markFilled, closeJob]
  myApplications:
    crud: Application
    mine: true
  applications:
    crud: Application
    search: [applicantName, email, memberNumber]
    filters: [job, status]
  home:
    route: /welcome
    landing:
      hero:
        button: jobs
        secondButton: myApplications
      openJobs:
        records: Job
        where:
          status: open
      features:
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
  hire:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: hired
  decline:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: declined
navigation: [jobs, myApplications, applications, team]
