smithable: 0.1
app:
  name: Union Job Board
  description: Job posts for union members to browse and apply to, managed by the local union.
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      location: string
      pay: string
      jobType: fullTime | partTime | temporary | apprenticeship
      trade: construction | electrical | plumbing | transport | healthcare | education | other
      closesOn: date
      status: open | closed
      applications: Application[]
    access:
      create: [staff, admin]
      delete: [staff, admin]
  Application:
    fields:
      job: Job! unique
      name: string!
      email: email!
      phone: phone
      memberNumber: string
      message: text
      resume: url
      status: submitted | shortlisted | accepted | declined
    access:
      read: [owner, staff, admin]
pages:
  jobs:
    route: /
    crud: Job
    search: [title, employer, description, location]
    filters: [trade, jobType, status, closesOn]
    sortable: [closesOn, createdAt]
    favorites: true
    actions: [closeJob, reopenJob]
  applications:
    crud: Application
    filters: [job, status]
    search: [name, email, memberNumber]
    actions: [shortlist, accept, decline]
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latestJobs:
        records: Job
        where:
          status: open
  team:
    users: manage
actions:
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
    allow: [staff, admin]
    intent: Stop taking applications for a job.
  reopenJob:
    on: Job
    when:
      status: closed
    set:
      status: open
    allow: [staff, admin]
    intent: Take applications for a job again.
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
    allow: [staff, admin]
    intent: Put an application on the shortlist.
  accept:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: accepted
    allow: [staff, admin]
    intent: Accept an application.
  decline:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: declined
    allow: [staff, admin]
    intent: Decline an application.
navigation: [jobs, applications, team]
