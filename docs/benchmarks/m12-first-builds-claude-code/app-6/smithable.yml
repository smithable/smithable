smithable: 0.1
app:
  name: Union Jobs
  description: Job posts from the local union, and members' applications to them.
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      location: string
      trade: construction | electrical | plumbing | transport | healthcare | education | office | other
      jobType: fullTime | partTime | temporary | apprenticeship
      pay: string
      closesOn: date
      status: open | filled | closed
      applications: Application[]
  Application:
    fields:
      job: Job!
      fullName: string!
      phone: phone
      memberNumber: string
      message: text!
      status: submitted | shortlisted | rejected | hired
      notes: text
pages:
  jobs:
    route: /
    crud: Job
    search: [title, employer, description, location]
    filters: [trade, jobType, status, closesOn]
    sortable: [closesOn, createdAt]
    actions: [markFilled, closeJob]
  myApplications:
    crud: Application
    mine: true
  applications:
    crud: Application
    filters: [job, status]
    search: [fullName, memberNumber]
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latestJobs:
        records: Job
        where:
          status: open
  privacy:
    route: /privacy
    legal: privacy
actions:
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
    intent: Mark a job as filled once someone is hired.
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
    intent: Close a job to new applications.
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
    intent: Put an application on the shortlist.
  reject:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: rejected
    intent: Turn down an application.
  hire:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: hired
    intent: Mark the applicant as hired.
navigation: [jobs, myApplications, applications]
