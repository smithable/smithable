smithable: 0.1
app:
  name: Union Jobs
  description: "The local union's job board: staff post openings and members apply."
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      location: string
      trade: electrical | plumbing | carpentry | construction | general | other
      type: fullTime | partTime | temporary | apprenticeship
      pay: string
      closes: date
      status: open | filled | closed
      applications: Application[]
  Application:
    fields:
      job: Job! unique
      phone: phone
      coverLetter: text
      resume: file
      status:
        type: submitted | shortlisted | hired | declined
        by: app
pages:
  jobs:
    crud: Job
    search: [title, employer, description, location]
    filters: [trade, type, status, closes]
    defaultFilter:
      status: open
    actions: [markFilled, closeJob]
  applications:
    crud: Application
    filters: [job, status]
    actions: [shortlist, hire, decline]
  home:
    route: /
    landing:
      hero:
        button: jobs
      openJobs:
        records: Job
        where:
          status: open
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
  hire:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: hired
  decline:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: declined
