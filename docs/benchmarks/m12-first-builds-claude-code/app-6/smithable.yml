smithable: 0.1
app:
  name: Union Jobs
  description: A job board where the local union posts jobs and members apply for them.
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      location: string
      trade: construction | electrical | plumbing | transport | healthcare | education | manufacturing | other
      type: fullTime | partTime | temporary | apprenticeship
      pay: string
      closesOn: date
      status: open | closed
      applications: Application[]
  Application:
    fields:
      job: Job!
      fullName: string!
      phone: phone
      memberNumber: string
      message: text
      resume: file
      status: received | shortlisted | rejected | hired
pages:
  jobs:
    route: /
    crud: Job
    search: [title, employer, description, location]
    filters: [trade, type, status, closesOn]
    sortable: [closesOn, createdAt]
    favorites: true
    actions: [closeJob]
  myApplications:
    crud: Application
    mine: true
  applications:
    crud: Application
    filters: [job, status]
    search: [fullName, memberNumber]
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latest:
        records: Job
        where:
          status: open
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
    intent: Close a job post so no more applications come in.
  shortlist:
    on: Application
    when:
      status: received
    set:
      status: shortlisted
    intent: Move an application to the shortlist.
  reject:
    on: Application
    when:
      status: [received, shortlisted]
    set:
      status: rejected
    intent: Turn down an application.
  hire:
    on: Application
    when:
      status: shortlisted
    set:
      status: hired
    intent: Mark the applicant as hired.
navigation: [jobs, myApplications, applications, team]
