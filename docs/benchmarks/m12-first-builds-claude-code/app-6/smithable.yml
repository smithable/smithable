smithable: 0.1
app:
  name: Union Jobs
  description: A job board where the local union posts jobs and members apply for them.
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      trade: electrical | carpentry | plumbing | construction | warehouse | transport | healthcare | other
      jobType: fullTime | partTime | temporary | apprenticeship
      location: string
      pay: string
      description: text!
      closesOn: date
      status: open | filled | closed
      applications: Application[]
  Application:
    fields:
      job: Job!
      name: string!
      email: email!
      phone: phone
      message: text
      resume: file
      status: submitted | shortlisted | hired | declined
pages:
  jobs:
    crud: Job
    search: [title, employer, location, description]
    filters: [trade, jobType, status, closesOn]
    defaultFilter:
      status: open
    actions: [markFilled, closeJob]
  applications:
    crud: Application
    filters: [job, status]
    actions: [shortlist, hire, decline]
  team:
    users: manage
  home:
    route: /
    landing:
      hero:
        button: jobs
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
    intent: Mark a job as filled once someone is hired.
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
    intent: Close a job to new applications.
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
  hire:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: hired
  decline:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: declined
