smithable: 0.1
app:
  name: Union Jobs
  description: Job posts from the local union, where members find work and apply.
  currency: USD
  timezone: America/New_York
models:
  Job:
    fields:
      title: string!
      employer: string!
      location: string
      trade: string
      jobType: fullTime | partTime | temporary | apprenticeship
      pay: string
      description: text!
      closesOn: date
      status: open | closed
      applications: Application[]
  Application:
    fields:
      job:
        type: Job!
        unique: owner
      name: string!
      email: email!
      phone: phone
      memberNumber: string
      message: text
      resume: file
      status:
        type: submitted | shortlisted | hired | declined
        by: app
pages:
  jobs:
    route: /
    crud: Job
    search: [title, employer, location, trade, description]
    filters: [jobType, status, closesOn]
    defaultFilter:
      status: open
    sortable: [closesOn, createdAt]
    actions: [closeJob, reopenJob]
  myApplications:
    crud: Application
    mine: true
  applications:
    crud: Application
    filters: [job, status]
  home:
    route: /welcome
    landing:
      hero:
        button: jobs
        secondButton: myApplications
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
  reopenJob:
    on: Job
    when:
      status: closed
    set:
      status: open
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
  hire:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: hired
  decline:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: declined
