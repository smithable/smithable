smithable: 0.1
app:
  name: Union Jobs
  description: A job board where the local union posts jobs and members apply.
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      location: string
      type: fullTime | partTime | temporary | contract
      pay: string
      deadline: date
      status: open | closed
      applications: Application[]
  Application:
    fields:
      job: Job!
      name: string!
      phone: phone
      coverLetter: text!
      cv: file
      status: submitted | shortlisted | rejected | hired
pages:
  jobs:
    crud: Job
    search: [title, employer, description, location]
    filters: [type, status, deadline]
    sortable: [deadline, createdAt]
    actions: [closeJob]
  applications:
    crud: Application
    filters: [job, status]
    actions: [shortlist, reject, hire]
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latestJobs:
        records: Job
        where:
          status: open
  privacy:
    route: /privacy
    legal: privacy
actions:
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
    intent: Stop taking applications for a job.
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
    intent: Put an applicant on the shortlist.
  reject:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: rejected
    intent: Turn down an application.
  hire:
    on: Application
    when:
      status: shortlisted
    set:
      status: hired
    intent: Mark the applicant as hired.
