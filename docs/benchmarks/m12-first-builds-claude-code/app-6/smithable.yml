smithable: 0.1
app:
  name: Union Jobs
  description: A job board where the union posts openings and members apply for them.
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      location: string
      trade: string
      employment: fullTime | partTime | temporary | apprenticeship
      pay: string
      closesOn: date
      status: open | filled | closed
      applications: Application[]
  Application:
    fields:
      job: Job! unique
      name: string!
      email: email!
      phone: phone
      memberNumber: string
      message: text
      resume: file
      status: submitted | reviewing | accepted | declined
pages:
  jobs:
    crud: Job
    search: [title, employer, description, location, trade]
    filters: [employment, status, closesOn]
    defaultFilter:
      status: open
    favorites: true
    actions: [markFilled, closeJob]
  myApplications:
    crud: Application
    mine: true
  applications:
    crud: Application
    filters: [job, status]
    search: [name, email, memberNumber]
  home:
    route: /welcome
    landing:
      hero:
      latest:
        records: Job
        where:
          status: open
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
    intent: Mark a job as filled.
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
    intent: Close a job to new applications.
  startReview:
    on: Application
    when:
      status: submitted
    set:
      status: reviewing
  accept:
    on: Application
    when:
      status: [submitted, reviewing]
    set:
      status: accepted
  decline:
    on: Application
    when:
      status: [submitted, reviewing]
    set:
      status: declined
