smithable: 0.1
app:
  name: Union Job Board
  description: Job openings shared by the local union, where members find work and apply.
  currency: USD
  timezone: America/New_York
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      location: string
      trade: construction | electrical | plumbing | manufacturing | transport | healthcare | office | other
      type: fullTime | partTime | temporary | apprenticeship
      pay: string
      closesOn: date
      open: bool = true
      applications: Application[]
  Application:
    fields:
      job: Job! unique
      name: string!
      phone: phone
      memberNumber: string
      coverLetter: text
      cv: file
      status: submitted | shortlisted | rejected | hired
pages:
  jobs:
    route: /
    crud: Job
    search: [title, employer, description, location]
    filters: [trade, type, open, closesOn]
    sortable: [closesOn, createdAt]
    favorites: true
    actions: [closeJob]
  applications:
    crud: Application
    filters: [job, status]
  myApplications:
    crud: Application
    mine: true
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latestJobs:
        records: Job
        where:
          open: true
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  closeJob:
    on: Job
    when:
      open: true
    set:
      open: false
    intent: Stop taking applications for a job.
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
  hire:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: hired
  reject:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: rejected
navigation: [jobs, myApplications, applications, team]
