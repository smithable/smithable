smithable: 0.1
app:
  name: Union Job Board
  description: Job posts for union members, and the applications they send.
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      trade: construction | electrical | plumbing | transport | healthcare | education | hospitality | manufacturing | other
      type: fullTime | partTime | temporary | apprenticeship
      location: string
      pay: string
      description: markdown!
      closesOn: date
      status: open | filled | closed
      applications: Application[]
  Application:
    fields:
      job: Job! unique
      name: string!
      phone: phone
      message: text!
      resume: file
      status: submitted | shortlisted | hired | declined
pages:
  jobs:
    route: /
    crud: Job
    search: [title, employer, location, description]
    filters: [trade, type, status, closesOn]
    defaultFilter:
      status: open
    actions: [markFilled, closeJob]
  applications:
    crud: Application
    filters: [job, status]
    actions: [shortlist, hire, decline]
  home:
    route: /welcome
    landing:
      hero:
        button: jobs
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
    intent: Mark a job as filled once someone has been hired.
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
    intent: Close a job to new applications without filling it.
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
  hire:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: hired
  decline:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: declined
