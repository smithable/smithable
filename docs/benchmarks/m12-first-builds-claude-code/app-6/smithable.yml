smithable: 0.1
app:
  name: Union Jobs
  description: The local union's job board, where members find open jobs and apply.
  currency: USD
  timezone: America/New_York
models:
  Job:
    fields:
      title: string!
      employer: string!
      location: string
      jobType: fullTime | partTime | temporary | apprenticeship
      wage: string
      description: text!
      closesOn: date
      status: open | filled | closed
      applications: Application[]
  Application:
    fields:
      job: Job! unique
      name: string!
      phone: phone
      coverLetter: text!
      resume: file
      status:
        type: submitted | shortlisted | rejected | hired
        by: app
    namedBy: [job, name]
pages:
  jobs:
    crud: Job
    search: [title, employer, location, description]
    filters: [jobType, status, closesOn]
    defaultFilter:
      status: open
    actions: [markFilled, closeJob]
  myApplications:
    crud: Application
    mine: true
  applications:
    crud: Application
    filters: [job, status]
  home:
    route: /
    landing:
      hero:
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
  reject:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: rejected
  hire:
    on: Application
    when:
      status: shortlisted
    set:
      status: hired
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
navigation: [jobs, myApplications, applications, team]
