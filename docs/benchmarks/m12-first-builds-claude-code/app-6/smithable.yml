smithable: 0.1
app:
  name: Local Union Job Board
  description: Job openings shared with union members, who apply online and follow their applications.
  currency: USD
  timezone: America/New_York
models:
  Job:
    fields:
      title: string!
      employer: string!
      trade: construction | electrical | plumbing | manufacturing | transport | healthcare | office | other
      jobType: fullTime | partTime | temporary | apprenticeship
      location: string
      pay: string
      description: text!
      startsOn: date
      closesOn: date
      status: open | filled | closed
      applications: Application[]
  Application:
    fields:
      job: Job! unique
      name: string!
      email: email!
      phone: phone
      message: text
      resume: file
      status: submitted | reviewing | accepted | declined
pages:
  jobs:
    crud: Job
    search: [title, employer, location, description]
    filters: [trade, jobType, status, closesOn]
    defaultFilter:
      status: open
    favorites: true
    actions: [markFilled, closeJob]
  myApplications:
    crud: Application
    mine: true
  applications:
    crud: Application
    filters: [job, status]
  home:
    route: /
    landing:
      hero:
        button: jobs
      openJobs:
        records: Job
        where:
          status: open
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
  startReview:
    on: Application
    when:
      status: submitted
    set:
      status: reviewing
  accept:
    on: Application
    when:
      status: [submitted, reviewing]
    set:
      status: accepted
  decline:
    on: Application
    when:
      status: [submitted, reviewing]
    set:
      status: declined
outgoing:
  applicationReceived:
    when: Application created
    to: mail
    recipient: admin
  applicationAnswered:
    when: Application changed
    where:
      status: [accepted, declined]
    to: mail
    recipient: email
