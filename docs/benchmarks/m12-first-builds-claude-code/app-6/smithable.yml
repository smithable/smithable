smithable: 0.1
app:
  name: Union Jobs
  description: Job openings shared by the union, where members find work and apply.
  currency: USD
models:
  Job:
    fields:
      title: string!
      employer: string!
      description: text!
      location: string
      jobType: fullTime | partTime | temporary | apprenticeship
      pay: string
      closesOn: date
      status: open | closed
      applications: Application[]
    access:
      create: [staff, admin]
      delete: [staff, admin]
  Application:
    fields:
      job: Job!
      name: string!
      email: email!
      phone: phone
      message: text
      status: submitted | reviewing | accepted | declined
    access:
      read: [owner, staff, admin]
pages:
  jobs:
    route: /
    crud: Job
    search: [title, employer, description, location]
    filters: [jobType, status, closesOn]
    sortable: [closesOn, createdAt]
    favorites: true
    actions: [closeJob]
  myApplications:
    crud: Application
    mine: true
  applications:
    crud: Application
    filters: [job, status]
    search: [name, email]
    access: [staff, admin]
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latest:
        records: Job
        where:
          status: open
  team:
    users: manage
actions:
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
    allow: [staff, admin]
    intent: Close a job post so no more people apply.
  startReview:
    on: Application
    when:
      status: submitted
    set:
      status: reviewing
    allow: [staff, admin]
    intent: Mark an application as being reviewed.
  accept:
    on: Application
    when:
      status: [submitted, reviewing]
    set:
      status: accepted
    allow: [staff, admin]
    intent: Accept an application.
  decline:
    on: Application
    when:
      status: [submitted, reviewing]
    set:
      status: declined
    allow: [staff, admin]
    intent: Decline an application.
navigation: [jobs, myApplications, applications, team]
