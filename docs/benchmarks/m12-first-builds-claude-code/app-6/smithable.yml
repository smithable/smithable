smithable: 0.1
app:
  name: Union Job Board
  description: Job posts from our local union, and members' applications for them.
  currency: USD
  timezone: America/Chicago
models:
  Job:
    fields:
      title: string!
      employer: string!
      trade: electrical | plumbing | carpentry | construction | manufacturing | transport | healthcare | other
      jobType: fullTime | partTime | temporary | apprenticeship
      location: string
      payRate: string
      description: text!
      closesOn: date
      status: open | filled | closed
      applications: Application[]
  Application:
    fields:
      job: Job!
      name: string!
      email: email!
      phone: phone
      memberNumber: string
      message: text
      resume: file
      status:
        type: submitted | shortlisted | accepted | declined
        by: app
pages:
  jobs:
    route: /
    crud: Job
    search: [title, employer, location, description]
    filters: [trade, jobType, status, closesOn]
    sortable: [createdAt, closesOn]
    favorites: true
    actions: [markFilled, closeJob]
  myApplications:
    crud: Application
    mine: true
  applications:
    crud: Application
    filters: [job, status]
    search: [name, email, memberNumber]
  home:
    route: /welcome
    landing:
      hero:
      latestJobs:
        records: Job
        where:
          status: open
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  markFilled:
    on: Job
    when:
      status: open
    set:
      status: filled
    intent: Mark a job as filled once someone is hired.
  closeJob:
    on: Job
    when:
      status: open
    set:
      status: closed
    intent: Close a job post to new applications.
  shortlist:
    on: Application
    when:
      status: submitted
    set:
      status: shortlisted
    intent: Put an application on the shortlist.
  accept:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: accepted
    intent: Accept an application.
  decline:
    on: Application
    when:
      status: [submitted, shortlisted]
    set:
      status: declined
    intent: Decline an application.
