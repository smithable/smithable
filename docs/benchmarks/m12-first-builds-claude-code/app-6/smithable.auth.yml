smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  member:
    description: A union member who browses jobs and applies.
    pages: [jobs, applications]
    create: [Application]
  staff:
    description: Union staff who post jobs and handle applications.
    pages: all
    create: all
    read: [Job, Application]
    write: [Job, Application]
    delete: [Job]
assistant:
  for: signed-in
public:
  pages: [home, jobs, privacy]
  read: [{ Job: { where: { status: open } } }]
defaultRole: member
admins: [johan@smithable.ai]
