smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  member:
    description: A union member who browses jobs and applies for them.
    pages: [home, jobs, myApplications, privacy]
    create: [Application]
    read: [Job]
    actions: none
  steward:
    description: Union staff who post jobs and handle the applications.
    pages: [home, jobs, applications, privacy]
    create: [Job]
    read: [Job, Application]
    write: [Job, Application]
    delete: [Job]
    actions: all
assistant:
  for: signed-in
public:
  pages: [home, jobs, privacy]
  read: [{ Job: { where: { status: open } } }]
defaultRole: member
admins: [johan@smithable.ai]
