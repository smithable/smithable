smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: private
public:
  pages: [home, jobs]
  read: [{ Job: { where: { status: open } } }]
roles:
  admin:
    description: Runs the job board and manages members.
  staff:
    description: Union staff who post jobs and review applications.
  member:
    description: Union members who browse jobs and apply.
defaultRole: member
admins: [johan@smithable.ai]
