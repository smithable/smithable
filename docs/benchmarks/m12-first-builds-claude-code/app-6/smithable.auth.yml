smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  member:
    description: Union member who browses job posts and applies for them.
    pages: [jobs, myApplications]
    create: [Application]
    read: [Job]
assistant:
  for: signed-in
defaultRole: member
public:
  pages: [home, jobs, privacy]
  read: [{ Job: { where: { status: open } } }]
admins: [johan@smithable.ai]
