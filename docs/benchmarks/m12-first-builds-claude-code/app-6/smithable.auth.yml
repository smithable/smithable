smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  staff:
    description: Union staff who post jobs and handle applications.
    pages: all
    create: [Job]
    read: [Job, Application]
    write: [Job, Application]
    delete: [Job]
  member:
    description: Union members who browse jobs and apply.
    pages: [home, jobs, myApplications]
    create: [Application]
    read: [Job]
public:
  pages: [home, jobs, privacy]
  read: [{ Job: { where: { status: open } } }]
defaultRole: member
admins: [johan@smithable.ai]
