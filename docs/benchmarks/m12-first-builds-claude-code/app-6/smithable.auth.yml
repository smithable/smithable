smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  staff:
    description: Union staff who post jobs and handle applications.
    pages: [home, jobs, applications]
    create: [Job]
    read: [Job, Application]
    write: [Job, Application]
    delete: [Job, Application]
  member:
    description: Union members who browse jobs and apply.
    pages: [home, jobs, myApplications]
    create: [Application]
assistant:
  for: signed-in
public:
  pages: [home, jobs]
  read: [{ Job: { where: { status: [open, filled] } } }]
defaultRole: member
admins: [johan@smithable.ai]
