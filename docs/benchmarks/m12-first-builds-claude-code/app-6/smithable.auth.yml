smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  member:
    description: A union member who browses jobs and applies.
    pages: [jobs, myApplications]
    create: [Application]
  staff:
    description: A union officer who posts jobs and handles applications.
    pages: [jobs, applications]
    create: [Job]
    read: [Job, Application]
    write: [Job, Application]
    delete: [Job]
assistant:
  for: signed-in
public:
  pages: [home, jobs]
  read: [{ Job: { where: { open: true } } }]
defaultRole: member
admins: [johan@smithable.ai]
