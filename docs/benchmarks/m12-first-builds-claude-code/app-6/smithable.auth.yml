smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  staff:
    description: Union staff who post jobs and review applications.
    pages: all
    create: [Job]
    read: all
    write: all
    delete: [Job]
  member:
    description: Union members who browse jobs and apply.
    pages: [jobs, applications]
    create: [Application]
    read: [Job]
assistant:
  for: signed-in
defaultRole: member
public:
  pages: [home, jobs, privacy]
  read: [{ Job: { where: { status: open } } }]
admins: [johan@smithable.ai]
