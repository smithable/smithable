smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  member:
    description: A union member who browses jobs and applies to them.
    pages: [home, jobs, applications]
    create: [Application]
    read: [Job]
  staff:
    description: Hall staff who post jobs and handle the applications.
    pages: all
    create: all
    read: [Job, Application]
    write: [Job, Application]
    delete: [Job]
assistant:
  for: signed-in
public:
  pages: [home, jobs]
  read: [{ Job: { where: { status: open } } }]
defaultRole: member
admins: [johan@smithable.ai]
