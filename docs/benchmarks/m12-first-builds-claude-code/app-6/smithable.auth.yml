smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  staff:
    description: Union staff who post jobs and handle applications.
    pages: all
    create: [Job]
    read: all
    write: [Job, Application]
    delete: [Job]
  member:
    description: Browses jobs and applies to them.
    pages: [home, jobs, myApplications, privacy]
    create: [Application]
    read: [Job]
assistant:
  for: signed-in
public:
  pages: [home, jobs, privacy]
  read: [{ Job: { where: { status: open } } }]
defaultRole: member
admins: [johan@smithable.ai]
