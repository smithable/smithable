smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  staff:
    description: "Union job desk: posts jobs and handles applications."
    pages: all
    create: all
    read: [Application]
    write: [Job, Application]
    delete: [Job]
  member:
    description: "Union member: browses jobs and applies."
    pages: [home, jobs, myApplications, privacy]
    create: [Application]
assistant:
  for: signed-in
public:
  pages: [home, jobs, privacy]
  read: [{ Job: { where: { status: open } } }]
defaultRole: member
admins: [johan@smithable.ai]
