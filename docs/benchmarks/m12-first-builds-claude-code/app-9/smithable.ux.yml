      columns: [title, requester, category, priority, status, assignee, dueOn]
    form:
      sections: [{ name: request, fields: [title, description, requester, requesterEmail, category] }, { name: handling, fields: [priority, status, assignee, dueOn] }, { name: resolution, fields: [resolution, resolvedAt] }]
