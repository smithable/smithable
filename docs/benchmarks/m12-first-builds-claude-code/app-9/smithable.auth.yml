smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  agent:
    description: "Works the tickets: logs them, takes them, passes them on and closes them."
    pages: [cases]
    create: all
    write: all
    actions: all
assistant:
  for: signed-in
defaultRole: agent
admins: [johan@smithable.ai]
