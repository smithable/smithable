smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  agent:
    description: "A member of the IT team: logs tickets, takes them, works on them and passes them on."
    pages: [tickets]
    create: all
    write: all
    actions: all
assistant:
  for: signed-in
defaultRole: agent
admins: [johan@smithable.ai]
