smithable: 0.1
app:
  name: IT Help Desk
  description: "The IT team's tickets: what is wrong, how urgent it is and who is handling it."
models:
  Ticket:
    fields:
      subject: string!
      requesterEmail: email!
      status: open | inProgress | closed | reopened
      priority:
        type: int!
        min: 1
        max: 5
        default: 3
      assignee:
        type: User
        required:
          status: [inProgress, closed]
      body: text
      attachments: files
      messages: Message[]
  Message:
    fields:
      content: text!
      agent:
        type: User
        by: app
        default: ME()
      attachments: files
      ticket: Ticket!
pages:
  tickets:
    crud: Ticket
    search: [subject, requesterEmail]
    filters: [status, priority, assignee]
    sortable: [priority, createdAt]
    defaultFilter:
      status: [open, inProgress, reopened]
    actions: [assignToMe, assignTo, startWork, close, reopen]
  team:
    users: manage
actions:
  assignToMe:
    on: Ticket
    set:
      assignee: ME()
    intent: "Take the ticket: you become its assignee."
  assignTo:
    on: Ticket
    set:
      assignee:
    intent: Give the ticket to someone on the team.
  startWork:
    on: Ticket
    when:
      status: [open, reopened]
    set:
      status: inProgress
    intent: Someone is working on the ticket now; it needs an assignee.
  close:
    on: Ticket
    when:
      status: [open, inProgress, reopened]
    set:
      status: closed
    intent: The problem is solved.
  reopen:
    on: Ticket
    when:
      status: closed
    set:
      status: reopened
    intent: The ticket needs more work after all.
