smithable: 0.1
app:
  name: IT Help Desk
  description: A help desk where the IT team tracks tickets, their priorities and who handles them.
  timezone: Europe/Mariehamn
models:
  Ticket:
    fields:
      title: string!
      description: text
      requester: string
      priority: normal | low | high | urgent
      status: open | inProgress | waiting | resolved
      assignee: User
      resolvedAt: datetime
pages:
  tickets:
    crud: Ticket
    search: [title, description, requester]
    sortable: [title, priority, status, createdAt]
    actions: [take, resolve, reopen]
  team:
    users: manage
actions:
  take:
    on: Ticket
    when:
      status: [open, waiting]
    set:
      assignee: ME()
      status: inProgress
    intent: Take the ticket and start working on it.
  resolve:
    on: Ticket
    when:
      status: [open, inProgress, waiting]
    set:
      status: resolved
      resolvedAt: NOW()
    intent: Mark the ticket as resolved.
  reopen:
    on: Ticket
    when:
      status: resolved
    set:
      status: open
      resolvedAt:
    intent: Reopen a resolved ticket.
