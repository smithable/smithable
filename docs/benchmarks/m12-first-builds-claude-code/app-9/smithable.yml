smithable: 0.1
app:
  name: IT Help Desk
  description: Where an IT team tracks its tickets, their priorities and who handles them.
  timezone: Europe/Helsinki
models:
  SupportCase:
    fields:
      subject: string!
      customerEmail:
        type: email!
        locked: true
      status: open | inProgress | closed | reopened
      priority:
        type: int!
        min: 1
        max: 5
        default: 3
        description: 1 is the most urgent, 5 the least.
      assignee:
        type: User
        required:
          status: [inProgress, closed]
      body: text
      attachments: files
      messages: Message[]
  Message:
    fields:
      content: text!
      agent:
        type: User
        by: app
        default: ME()
      attachments: files
      supportCase: SupportCase!
pages:
  cases:
    crud: SupportCase
    search: [subject, customerEmail]
    filters: [status, priority, assignee]
    sortable: [priority, createdAt]
    actions: [assignToMe, assignTo, startWork, close, reopen]
  team:
    users: manage
actions:
  assignToMe:
    on: SupportCase
    when:
      assignee: not ME()
    set:
      assignee: ME()
    intent: "Take the ticket: you become its assignee."
  assignTo:
    on: SupportCase
    set:
      assignee:
    intent: Give the ticket to someone on the team.
  startWork:
    on: SupportCase
    when:
      status: [open, reopened]
    set:
      status: inProgress
    intent: Someone is working on the ticket now; it needs an assignee.
  close:
    on: SupportCase
    when:
      status: [open, inProgress, reopened]
    set:
      status: closed
    intent: The problem is solved.
  reopen:
    on: SupportCase
    when:
      status: closed
    set:
      status: reopened
    intent: The ticket needs more work after all.
