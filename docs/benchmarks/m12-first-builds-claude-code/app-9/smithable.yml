smithable: 0.1
app:
  name: IT Help Desk
  description: "Tickets for the IT team: their priorities and who handles them."
  timezone: Europe/Stockholm
models:
  Ticket:
    fields:
      title: string!
      description: text
      status: open | inProgress | closed | reopened
      priority: normal | low | high | urgent
      assignee:
        type: User
        required:
          status: [inProgress, closed]
      attachments: files
      comments: Comment[]
  Comment:
    fields:
      content: text!
      author:
        type: User
        by: app
        default: ME()
      attachments: files
      ticket: Ticket!
pages:
  tickets:
    crud: Ticket
    search: [title]
    filters: [status, priority, assignee]
    sortable: [priority, createdAt]
    actions: [assignToMe, assignTo, startWork, close, reopen]
  team:
    users: manage
actions:
  assignToMe:
    on: Ticket
    set:
      assignee: ME()
    intent: "Take the ticket: you become its assignee."
  assignTo:
    on: Ticket
    set:
      assignee:
    intent: Give the ticket to someone on the team.
  startWork:
    on: Ticket
    when:
      status: [open, reopened]
    set:
      status: inProgress
    intent: Someone is working on the ticket now; it needs an assignee.
  close:
    on: Ticket
    when:
      status: [open, inProgress, reopened]
    set:
      status: closed
    intent: The problem is solved.
  reopen:
    on: Ticket
    when:
      status: closed
    set:
      status: reopened
    intent: The ticket needs more work after all.
