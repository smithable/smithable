smithable: 0.1
app:
  name: IT Help Desk
  description: "The IT team's tickets: what is wrong, how urgent it is and who is handling it."
models:
  Ticket:
    fields:
      title: string!
      requesterEmail:
        type: email!
        locked: true
      category: hardware | software | network | access | other
      status: open | inProgress | resolved | reopened
      priority:
        type: int!
        min: 1
        max: 5
        default: 3
      assignee:
        type: User
        required:
          status: [inProgress, resolved]
      description: text
      attachments: files
      resolvedAt:
        type: datetime
        by: app
      comments: Comment[]
  Comment:
    fields:
      content: text!
      author:
        type: User
        by: app
        default: ME()
      attachments: files
      ticket: Ticket!
pages:
  tickets:
    crud: Ticket
    search: [title, requesterEmail]
    filters: [status, priority, category, assignee]
    sortable: [priority, createdAt]
    defaultFilter:
      status: [open, inProgress, reopened]
    actions: [assignToMe, assignTo, startWork, resolve, reopen]
  team:
    users: manage
actions:
  assignToMe:
    on: Ticket
    set:
      assignee: ME()
    intent: "Take the ticket: you become the one handling it."
  assignTo:
    on: Ticket
    set:
      assignee:
    intent: Give the ticket to someone on the IT team.
  startWork:
    on: Ticket
    when:
      status: [open, reopened]
    set:
      status: inProgress
    intent: Someone is working on the ticket now; it needs an assignee.
  resolve:
    on: Ticket
    when:
      status: [open, inProgress, reopened]
    set:
      status: resolved
      resolvedAt: NOW()
    intent: The problem is fixed.
  reopen:
    on: Ticket
    when:
      status: resolved
    set:
      status: reopened
    intent: The problem came back or was not fully fixed.
