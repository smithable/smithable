smithable: 0.1
app:
  name: Family Recipes
  description: A family's recipe collection, with each recipe's ingredients and shared shopping lists.
  timezone: Europe/Mariehamn
models:
  Recipe:
    fields:
      name: string!
      category: main | starter | side | dessert | baking | breakfast | drink | other
      summary: text
      servings: int = 4
      minutes: int
      instructions: text
      link: url
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      quantity: string
  ShoppingList:
    fields:
      name: string!
      shopOn: date = TODAY()
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      quantity: string
      recipe: Recipe
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary, category]
    filters: [category, favorite]
  shopping-lists:
    crud: ShoppingList
    filters: [status]
    actions: [finishShopping, reuseList]
  team:
    users: manage
actions:
  markBought:
    on: ShoppingItem
    when:
      bought: false
    set:
      bought: true
    intent: Tick off an item once it is in the basket.
  finishShopping:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Close a shopping list after the trip to the shop.
  reuseList:
    on: ShoppingList
    copy:
      status: open
      shopOn: TODAY()
    with: [items]
    intent: Start a new shopping list from an earlier one.
