smithable: 0.1
app:
  name: Family Recipes
  description: A family's shared recipe collection, with each recipe's ingredients and shopping lists for the trips to the store.
  timezone: Europe/Helsinki
models:
  Recipe:
    fields:
      name: string!
      summary: text
      picture: picture
      category: dinner | breakfast | lunch | dessert | baking | snack | drink
      servings: int = 4
      totalMinutes: int
      instructions: markdown
      link: url
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string!
      amount: string
      recipe: Recipe!
  ShoppingList:
    fields:
      name: string!
      neededBy: date
      status: active | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      name: string!
      quantity: string
      bought: bool = false
      shoppingList: ShoppingList!
pages:
  recipes:
    crud: Recipe
    search: [name, summary]
    filters: [category]
    favorites: true
  shoppingLists:
    route: /shopping-lists
    crud: ShoppingList
    filters: [status]
    defaultFilter:
      status: active
    actions: [finish]
  team:
    users: manage
actions:
  finish:
    on: ShoppingList
    when:
      status: active
    set:
      status: done
    intent: Mark a shopping list as done after the shopping trip.
