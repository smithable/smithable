smithable: 0.1
app:
  name: Family Kitchen
  description: A family's shared recipe collection, with each recipe's ingredients and the shopping lists for the week.
  timezone: Europe/Mariehamn
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | dessert | baking | breakfast | side
      servings:
        type: int
        min: 1
        max: 50
        default: 4
      minutes: int
      picture: picture
      instructions: markdown
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      amount: string
  ShoppingList:
    fields:
      name: string!
      shopOn: date
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      amount: string
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary]
    filters: [category, favorite]
  shopping-lists:
    crud: ShoppingList
    filters: [status]
    defaultFilter:
      status: open
    actions: [markDone]
  family:
    users: manage
actions:
  markDone:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Mark a shopping list as done once the shopping is finished.
