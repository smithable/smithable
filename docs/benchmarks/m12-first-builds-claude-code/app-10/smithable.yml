smithable: 0.1
app:
  name: Family Recipes
  description: A family's shared recipe collection, with each recipe's ingredients and shopping lists for the next trip to the store.
  timezone: Europe/Helsinki
models:
  Recipe:
    fields:
      name: string!
      photo: picture
      category: dinner | breakfast | lunch | dessert | baking | other
      summary: text
      servings: int = 4
      minutes: int
      instructions: markdown
      ingredients: Ingredient[]
  Ingredient:
    fields:
      name: string!
      amount: string
      recipe: Recipe!
  ShoppingList:
    fields:
      name: string!
      status: active | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      name: string!
      amount: string
      bought: bool = false
      shoppingList: ShoppingList!
      recipe: Recipe
pages:
  recipes:
    crud: Recipe
    search: [name, summary]
    filters: [category]
  shopping-lists:
    crud: ShoppingList
    filters: [status]
    defaultFilter:
      status: active
    actions: [markDone]
  team:
    users: manage
actions:
  markDone:
    on: ShoppingList
    when:
      status: active
    set:
      status: done
    intent: Close a shopping list once the shopping is finished.
