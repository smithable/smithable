smithable: 0.1
app:
  name: Family Kitchen
  description: The family's recipes with their ingredients, and the shopping lists for cooking them.
  timezone: Europe/Stockholm
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | dessert | baking | breakfast | drink | other
      servings: int = 4
      minutes: int
      instructions: markdown
      photo: picture
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      quantity: string
  ShoppingList:
    fields:
      name: string!
      shopOn: date = TODAY()
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      quantity: string
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary]
    filters: [category, favorite]
  shoppingLists:
    route: /shopping
    crud: ShoppingList
    filters: [status]
    actions: [finishShopping]
  family:
    users: manage
actions:
  markBought:
    on: ShoppingItem
    when:
      bought: false
    set:
      bought: true
    intent: Tick off an item once it is in the basket.
  finishShopping:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Mark a shopping trip as done.
