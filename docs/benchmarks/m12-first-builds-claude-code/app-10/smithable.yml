smithable: 0.1
app:
  name: Family Recipes
  description: A family's shared recipe collection, with ingredients and shopping lists.
  timezone: Europe/Mariehamn
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | dessert | baking | breakfast | drink
      servings: int = 4
      minutes: int
      instructions: text
      link: url
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      quantity: string
  ShoppingList:
    fields:
      name: string!
      forDate: date = TODAY()
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      quantity: string
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary, category]
    filters: [category, favorite]
  shoppingLists:
    crud: ShoppingList
    actions: [finishShopping]
  team:
    users: manage
actions:
  markBought:
    on: ShoppingItem
    when:
      bought: false
    set:
      bought: true
    intent: Tick off an item once it is in the basket.
  finishShopping:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Mark a shopping list as done.
