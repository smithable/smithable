smithable: 0.1
app:
  name: Family Recipes
  description: A family's shared recipe collection, with each recipe's ingredients and the shopping lists for the week.
  timezone: Europe/Mariehamn
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | dessert | baking | breakfast | drink
      servings:
        type: int
        min: 1
        max: 50
        default: 4
      minutes: int
      picture: picture
      instructions: markdown
      favorite: bool
      link: url
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      quantity: string
  ShoppingList:
    fields:
      name: string!
      forDate: date = TODAY()
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      quantity: string
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary]
    filters: [category, favorite]
  shoppingLists:
    route: /shopping-lists
    crud: ShoppingList
    filters: [status, forDate]
    defaultFilter:
      status: open
    actions: [markDone]
  family:
    users: manage
actions:
  markDone:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Close a shopping list once everything is bought.
