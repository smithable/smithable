smithable: 0.1
app:
  name: Family Kitchen
  description: The family's recipes with their ingredients, and the shopping lists for cooking them.
  timezone: Europe/Mariehamn
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | dessert | baking | breakfast | drink
      servings: int = 4
      prepMinutes: int
      instructions: text
      link: url
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      quantity: string
  ShoppingList:
    fields:
      name: string!
      forDate: date
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      quantity: string
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary, category]
    filters: [category, favorite]
  shoppingLists:
    crud: ShoppingList
    filters: [status]
    actions: [finishList]
  team:
    users: manage
actions:
  markBought:
    on: ShoppingItem
    when:
      bought: false
    set:
      bought: true
    intent: Tick an item off the shopping list once it is in the basket.
  finishList:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Mark a shopping list as done after the shopping trip.
