smithable: 0.1
app:
  name: Family Kitchen
  description: The family's recipes with their ingredients, and the shopping lists for what to cook next.
  timezone: Europe/Mariehamn
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | dessert | baking | breakfast | drink
      servings:
        type: int
        min: 1
        max: 50
        default: 4
      minutes: int
      photo: picture
      instructions: markdown
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      quantity: string
  ShoppingList:
    fields:
      name: string!
      shopOn: date
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      quantity: string
      forRecipe: Recipe
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary]
    filters: [category, favorite]
  shoppingLists:
    crud: ShoppingList
    filters: [status]
    defaultFilter:
      status: open
    actions: [finishList]
  family:
    users: manage
actions:
  markBought:
    on: ShoppingItem
    when:
      bought: false
    set:
      bought: true
    intent: Tick off an item once it is in the basket.
  finishList:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Close a shopping list when the shopping is done.
