smithable: 0.1
app:
  name: Family Kitchen
  description: A family's shared recipe collection, with each recipe's ingredients and a shopping list.
  timezone: Europe/Mariehamn
models:
  Recipe:
    fields:
      name: string!
      summary: text
      kind: main | starter | dessert | baking | drink | other
      servings: int = 4
      minutes: int
      instructions: text
      link: url
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      quantity: string
  ShoppingItem:
    fields:
      name: string!
      quantity: string
      recipe: Recipe
      status: needed | bought
pages:
  recipes:
    crud: Recipe
    search: [name, summary, kind]
    filters: [kind, favorite]
  shopping:
    crud: ShoppingItem
    filters: [status, recipe]
    actions: [markBought]
  team:
    users: manage
actions:
  markBought:
    on: ShoppingItem
    when:
      status: needed
    set:
      status: bought
