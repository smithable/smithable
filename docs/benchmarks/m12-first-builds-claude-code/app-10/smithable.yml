smithable: 0.1
app:
  name: Family Kitchen
  description: The family's recipes with their ingredients, and the shopping lists we take to the store.
  timezone: Europe/Stockholm
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | dessert | baking | breakfast | drink
      servings: int = 4
      minutes: int
      picture: picture
      instructions: markdown
      source: url
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      amount: string
      note: string
  ShoppingList:
    fields:
      name: string!
      shopOn: date = TODAY()
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      amount: string
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary]
    filters: [category, favorite]
  shopping-lists:
    crud: ShoppingList
    filters: [status]
    defaultFilter:
      status: open
    actions: [markDone]
  team:
    users: manage
actions:
  markDone:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
