smithable: 0.1
app:
  name: Family Cookbook
  description: The family's recipes with their ingredients, and the shopping lists made from them.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Recipe:
    fields:
      name: string!
      picture: picture
      summary: text
      category: main | starter | side | dessert | baking | breakfast | drink
      servings: int = 4
      minutes: int
      instructions: markdown
      source: url
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      quantity: string
      note: string
  ShoppingList:
    fields:
      name: string!
      shopOn: date = TODAY()
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      quantity: string
      recipe: Recipe
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary]
    filters: [category, favorite]
  shoppingLists:
    crud: ShoppingList
    filters: [status, shopOn]
    defaultFilter:
      status: open
    actions: [markDone]
  family:
    users: manage
actions:
  markDone:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Close a shopping list once everything on it is bought.
