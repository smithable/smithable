smithable: 0.1
app:
  name: Family Kitchen
  description: A family's shared recipe collection, with ingredients and shopping lists.
  timezone: Europe/Stockholm
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | dessert | baking | breakfast | drink
      servings: int = 4
      minutes: int
      picture: picture
      instructions: markdown
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      quantity: string
  ShoppingList:
    fields:
      name: string!
      shopOn: date
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      quantity: string
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary]
    filters: [category, favorite]
  shoppingLists:
    crud: ShoppingList
    filters: [status]
    defaultFilter:
      status: open
    actions: [finishShopping]
  team:
    users: manage
actions:
  markBought:
    on: ShoppingItem
    when:
      bought: false
    set:
      bought: true
    intent: Tick an item off the shopping list.
  finishShopping:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Mark a shopping list as done.
