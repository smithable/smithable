smithable: 0.1
app:
  name: Family Kitchen
  description: Our family's recipes, their ingredients and the shopping lists for what we cook.
  timezone: Europe/Mariehamn
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | dessert | baking | breakfast | drink
      servings: int = 4
      minutes: int
      picture: picture
      instructions: markdown
      link: url
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      quantity: string
  ShoppingList:
    fields:
      name: string!
      shopOn: date = TODAY()
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      quantity: string
      bought: bool = false
pages:
  recipes:
    crud: Recipe
    search: [name, summary]
    filters: [category]
  shoppingLists:
    crud: ShoppingList
    actions: [finishList]
  team:
    users: manage
actions:
  markBought:
    on: ShoppingItem
    when:
      bought: false
    set:
      bought: true
    intent: Tick off an item once it is in the basket.
  finishList:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Mark a shopping list as done after shopping.
navigation: [recipes, shoppingLists, team]
