smithable: 0.1
app:
  name: Family Recipes
  description: A family's shared recipe collection, with each recipe's ingredients and the shopping lists for the week.
  timezone: Europe/Mariehamn
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | side | dessert | baking | breakfast | drink
      servings: int = 4
      minutes: int
      photo: picture
      instructions: markdown
      favorite: bool
      source: url
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      amount: string
      note: string
  ShoppingList:
    fields:
      name: string!
      shopOn: date = TODAY()
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      amount: string
      recipe: Recipe
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary, category]
    filters: [category, favorite]
  shoppingLists:
    crud: ShoppingList
    filters: [status, shopOn]
    defaultFilter:
      status: open
    actions: [markDone, reopen]
  team:
    users: manage
actions:
  markDone:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Mark a shopping list as done once the shopping is finished.
  reopen:
    on: ShoppingList
    when:
      status: done
    set:
      status: open
    intent: Open a finished shopping list again.
  markBought:
    on: ShoppingItem
    when:
      bought: false
    set:
      bought: true
    intent: Tick off an item once it is in the basket.
