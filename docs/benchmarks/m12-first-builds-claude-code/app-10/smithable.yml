smithable: 0.1
app:
  name: Family Kitchen
  description: The family's recipe collection, with each recipe's ingredients and shared shopping lists.
  timezone: Europe/Stockholm
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | side | dessert | baking | breakfast | drink
      servings: int = 4
      prepMinutes: int
      instructions: text
      link: url
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      quantity: decimal
      unit: string
      note: string
  ShoppingList:
    fields:
      name: string!
      forDate: date
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      quantity: string
      recipe: Recipe
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary, category]
    filters: [category, favorite]
    favorites: true
  shopping-lists:
    crud: ShoppingList
    filters: [status, forDate]
    actions: [finishList]
  team:
    users: manage
actions:
  markBought:
    on: ShoppingItem
    when:
      bought: false
    set:
      bought: true
    intent: Tick off an item once it is in the basket.
  finishList:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Mark a shopping list as done after the shopping trip.
