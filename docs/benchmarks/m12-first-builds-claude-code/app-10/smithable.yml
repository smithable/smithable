smithable: 0.1
app:
  name: Family Cookbook
  description: Our family's recipes with their ingredients, and the shopping lists we cook from.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | dessert | baking | breakfast | side
      servings:
        type: int
        min: 1
        max: 50
        default: 4
      minutes: int
      picture: picture
      instructions: markdown
      source: url
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      quantity: string
      note: string
  ShoppingList:
    fields:
      name: string!
      shopOn: date
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      quantity: string
      forRecipe: Recipe
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary]
    filters: [category, favorite]
  shopping-lists:
    crud: ShoppingList
    filters: [status, shopOn]
    defaultFilter:
      status: open
    actions: [markDone]
  family:
    users: manage
actions:
  markDone:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Close a shopping list once the shopping is done.
