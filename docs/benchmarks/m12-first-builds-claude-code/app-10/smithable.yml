smithable: 0.1
app:
  name: Family Kitchen
  description: The family's recipes in one place, with their ingredients and the shopping lists for the week.
  timezone: Europe/Stockholm
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | side | dessert | baking | breakfast | drink
      servings:
        type: int
        min: 1
        max: 50
        default: 4
      minutes: int
      picture: picture
      instructions: markdown
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      amount: string
      note: string
  ShoppingList:
    fields:
      name: string!
      neededBy: date
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      amount: string
      forRecipe: Recipe
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary]
    filters: [category, favorite]
  shoppingLists:
    route: /shopping-lists
    crud: ShoppingList
    filters: [status]
    defaultFilter:
      status: open
    actions: [markDone]
  family:
    users: manage
actions:
  markDone:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Close a shopping list once the shopping is done.
