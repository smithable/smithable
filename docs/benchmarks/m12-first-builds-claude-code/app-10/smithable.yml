smithable: 0.1
app:
  name: Family Recipes
  description: A family's shared recipe collection, with each recipe's ingredients and the shopping lists for the week.
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | dessert | baking | breakfast | side | drink
      servings: int = 4
      prepMinutes: int
      photo: picture
      instructions: markdown
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      quantity: string
  ShoppingList:
    fields:
      name: string!
      shopOn: date = TODAY()
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      quantity: string
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary]
    filters: [category, favorite]
  shoppingLists:
    crud: ShoppingList
    filters: [status]
    actions: [markDone]
  team:
    users: manage
actions:
  markDone:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Mark a shopping list as done once the shopping is finished.
  markBought:
    on: ShoppingItem
    when:
      bought: false
    set:
      bought: true
    intent: Tick off an item once it is in the basket.
