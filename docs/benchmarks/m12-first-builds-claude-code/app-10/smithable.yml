smithable: 0.1
app:
  name: Family Kitchen
  description: A family's shared recipe collection with ingredients and shopping lists.
  timezone: Europe/Mariehamn
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | dessert | baking | breakfast | drink
      servings: int = 4
      minutes: int
      picture: picture
      instructions: markdown
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      quantity: string
  ShoppingList:
    fields:
      name: string!
      shopOn: date = TODAY()
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      quantity: string
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary, category]
    filters: [category, favorite]
  shoppingLists:
    crud: ShoppingList
    filters: [status, shopOn]
    defaultFilter:
      status: open
    actions: [markDone]
  team:
    users: manage
navigation: [recipes, shoppingLists, team]
actions:
  markDone:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Close a shopping list once the shopping is done.
  markBought:
    on: ShoppingItem
    when:
      bought: false
    set:
      bought: true
    intent: Tick off an item once it is in the basket.
