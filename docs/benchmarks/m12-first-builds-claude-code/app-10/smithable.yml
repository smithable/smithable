smithable: 0.1
app:
  name: Family Cookbook
  description: A shared place for the family to keep its recipes and plan shopping lists.
  timezone: Europe/Mariehamn
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | dessert | baking | breakfast | drink
      servings: int = 4
      minutes: int
      instructions: markdown
      picture: picture
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      amount: string
  ShoppingList:
    fields:
      name: string!
      shopOn: date
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      quantity: string
      recipe: Recipe
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary]
    filters: [category, favorite]
  shoppingLists:
    crud: ShoppingList
    filters: [status]
    defaultFilter:
      status: open
    actions: [markDone]
  team:
    users: manage
actions:
  markDone:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Close a shopping list once the shopping is done.
