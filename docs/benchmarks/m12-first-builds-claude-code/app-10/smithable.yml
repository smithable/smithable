smithable: 0.1
app:
  name: Family Cookbook
  description: The family's recipes with their ingredients, and the shopping lists for cooking them.
  timezone: Europe/Stockholm
models:
  Recipe:
    fields:
      name: string!
      summary: text
      category: main | starter | side | dessert | baking | breakfast | drink
      servings: int = 4
      minutes: int
      picture: picture
      instructions: markdown
      source: url
      favorite: bool
      ingredients: Ingredient[]
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      amount: string
      note: string
  ShoppingList:
    fields:
      name: string!
      shopOn: date
      status: open | done
      items: ShoppingItem[]
  ShoppingItem:
    fields:
      list: ShoppingList!
      name: string!
      amount: string
      bought: bool
pages:
  recipes:
    crud: Recipe
    search: [name, summary]
    filters: [category, favorite]
  shoppingLists:
    crud: ShoppingList
    filters: [status, shopOn]
    defaultFilter:
      status: open
    actions: [finishShopping]
  family:
    users: manage
actions:
  finishShopping:
    on: ShoppingList
    when:
      status: open
    set:
      status: done
    intent: Mark a shopping list as done once everything is bought.
