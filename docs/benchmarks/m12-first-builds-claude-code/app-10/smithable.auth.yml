smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  member:
    description: A family member who cooks, adds recipes and shops.
    pages: all
    create: all
    write: [Recipe, Ingredient, ShoppingList, ShoppingItem]
assistant:
  for: signed-in
defaultRole: member
admins: [johan@smithable.ai]
