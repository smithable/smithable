smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  member:
    description: "A family member: adds and edits recipes and shopping lists."
    pages: [recipes, shoppingLists]
    create: all
    write: [Recipe, Ingredient, ShoppingList, ShoppingItem]
    actions: [markDone]
assistant:
  for: signed-in
defaultRole: member
admins: [johan@smithable.ai]
