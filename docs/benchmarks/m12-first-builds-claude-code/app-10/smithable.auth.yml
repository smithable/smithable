smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  member:
    description: A family member who adds and cooks recipes and keeps the shopping list.
    pages: all
    create: all
    write: all
    delete: [ShoppingItem, Ingredient]
defaultRole: member
admins: [johan@smithable.ai]
