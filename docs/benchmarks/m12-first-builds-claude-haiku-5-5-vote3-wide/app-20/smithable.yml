smithable: 0.1
app:
  name: Joogastudio
  description: Tuntien aikataulu ja verkkovaraukset pienelle joogastudiolle.
  currency: EUR
  timezone: Europe/Helsinki
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: allLevels | beginner | advanced
      durationMinutes:
        type: int!
        min: 15
        max: 180
        default: 60
      sessions: Session[]
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      sessions: Session[]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
    namedBy: [classType, startsAt]
  Booking:
    fields:
      session: Session! unique
      attendee: User
    ownedBy: attendee
    capacity:
      per: session
      max: session.capacity
      closes: session.startsAt
      cancelUntil: 2 hours before session.startsAt
    namedBy: session
  Post:
    fields:
      title: string!
      address: string unique
      summary: text
      cover: picture
      body: markdown!
      publishedOn: date
      status: draft | published
  Message:
    fields:
      name: string!
      email: email!
      message: text!
actions:
  publish:
    on: Post
    when:
      status: draft
    set:
      status: published
    intent: The post is out for everyone to read.
timers:
  remind:
    on: Booking
    at: 1 day before session.startsAt
  publish:
    on: Post
    at: publishedOn
    where:
      status: draft
    run: publish
outgoing:
  reminder:
    when: remind
    to: mail
    recipient: owner
  bookingMade:
    when: Booking created
    to: mail
    recipient: owner
  bookingChanged:
    when: Booking changed
    to: mail
    recipient: owner
  bookingCancelled:
    when: Booking deleted
    to: mail
    recipient: owner
pages:
  home:
    route: /
    landing:
      hero:
      classes:
        records: ClassType
      news:
        records: Post
      gallery:
      faq:
      contact:
        form: Message
      footer:
  schedule:
    calendar:
      model: Session
      starts: startsAt
  sessions:
    crud: Session
    filters: [classType, instructor, startsAt]
    defaultFilter:
      startsAt: upcoming
    sortable: [startsAt, capacity]
  class-types:
    crud: ClassType
    filters: [level]
  instructors:
    crud: Instructor
  messages:
    crud: Message
  blog:
    articles: Post
  about:
    sections:
      intro:
        text:
      story:
        text:
      team:
        records: Instructor
      faq:
  privacy:
    route: /privacy
    legal: privacy
  posts:
    crud: Post
    filters: [status]
  my-bookings:
    crud: Booking
    mine: true
  admin:
    data: all
  team:
    users: manage
