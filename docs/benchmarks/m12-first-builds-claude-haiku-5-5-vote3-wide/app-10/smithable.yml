smithable: 0.1
app:
  name: Local Museum Collection
  description: An online collection where visitors browse the museum's objects and read their stories.
models:
  Artifact:
    fields:
      name: string!
      period: string
      origin: string
      story: markdown
      category: painting | textile | tool | photograph | other
      image: picture
      onDisplay: bool
pages:
  home:
    route: /
    landing:
      hero:
        button: collection
      featured:
        records: Artifact
        where:
          onDisplay: true
      footer:
  collection:
    route: /collection
    crud: Artifact
    search: [name, origin]
    filters: [category]
  team:
    users: manage
