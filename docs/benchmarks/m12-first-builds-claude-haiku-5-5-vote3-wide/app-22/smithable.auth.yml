smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  staff:
    description: Nimmt Vorbestellungen an und pflegt Produkte und Abholzeiten.
    pages: [orders, products, pickups]
    create: [Order, OrderLine, Product, PickupTime]
    write: all
    actions: all
assistant:
  for: signed-in
public:
  pages: [home, privacy]
  read: [{ Product: { where: { available: true } } }, PickupTime]
  create: [Order]
defaultRole: staff
admins: [johan@smithable.ai]
