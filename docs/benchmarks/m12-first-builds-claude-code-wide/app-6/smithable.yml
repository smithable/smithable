smithable: 0.1
app:
  name: Sparkle Ledger
  description: "Monthly invoicing for a small cleaning company: its households, their invoices and what has been paid."
  currency: EUR
  timezone: Europe/Stockholm
models:
  Client:
    fields:
      name: string!
      email: email!
      phone: phone
      address: text
      invoices: Invoice[]
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      invoice: Invoice!
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
pages:
  households:
    crud: Client
    search: [name, email, phone]
    sortable: [name]
  invoices:
    crud: Invoice
    search: [number]
    filters: [client, status, issuedOn]
    sortable: [issuedOn, dueOn, number]
    actions: [markSent, markPaid, markOverdue, nextMonth]
  overview:
    dashboard:
      outstanding:
        sum: Invoice.total
        where:
          status: sent
      overdue:
        sum: Invoice.total
        where:
          status: overdue
      paid:
        sum: Invoice.total
        where:
          status: paid
      invoiced:
        sum: Invoice.total
        by: issuedOn
      latest:
        list: Invoice
        limit: 5
    period: issuedOn
  team:
    users: manage
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the household.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The household paid the invoice.
  markOverdue:
    on: Invoice
    when:
      status: sent
    set:
      status: overdue
    intent: The invoice is late.
  nextMonth:
    on: Invoice
    copy:
      number:
      status: draft
      issuedOn: TODAY()
      dueOn:
    with: [lines]
    intent: Start next month's invoice for the same household from this one.
timers:
  overdueCheck:
    on: Invoice
    at: 7 days after dueOn
    where:
      status: sent
    run: markOverdue
outgoing:
  invoiceSent:
    when: markSent
    to: mail
    recipient: client.email
