smithable: 0.1
app:
  name: Tidy Ledger
  description: One place for our cleaning company to send monthly invoices to the households we clean for.
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      phone: phone
      address: text
      invoices: Invoice[]
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      dueOn: date! = DATEADD(issuedOn, 30, "day")
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
  InvoiceLine:
    fields:
      invoice: Invoice!
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
pages:
  invoices:
    crud: Invoice
    filters: [client, status]
    actions: [markSent, markPaid, nextMonth]
  clients:
    crud: Client
    search: [name, email, phone]
  invoice-lines:
    crud: InvoiceLine
  overview:
    dashboard:
      latest:
        list: Invoice
        limit: 5
      outstanding:
        sum: Invoice.total
        where:
          status: sent
      overdue:
        sum: Invoice.total
        where:
          status: overdue
      invoiced:
        sum: Invoice.total
        by: issuedOn
  team:
    users: manage
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the household.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The household paid the invoice.
  nextMonth:
    on: Invoice
    copy:
      status: draft
      number:
      issuedOn: TODAY()
      dueOn: DATEADD(TODAY(), 30, "day")
    with: [lines]
    intent: Start next month's invoice for the same household from this one.
outgoing:
  invoiceSent:
    when: markSent
    to: mail
    recipient: client.email
