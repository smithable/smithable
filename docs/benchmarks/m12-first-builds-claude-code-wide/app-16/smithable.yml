smithable: 0.1
app:
  name: Allotment Society
  description: Keeps track of who has which plot, the waiting list and the yearly fees of our allotment society.
  currency: EUR
  timezone: Europe/Mariehamn
models:
  Plot:
    fields:
      number: string! unique
      size: decimal
      status: available | let | reserved
      description: text
  Member:
    fields:
      name: string!
      email: email
      phone: phone
      address: string
      plot: Plot
      memberSince: date = TODAY()
      fees: Fee[]
  Fee:
    fields:
      member: Member!
      year: int!
      amount: money!
      status: unpaid | paid
      paidOn: date
  WaitingListEntry:
    fields:
      name: string!
      email: email!
      phone: phone
      message: text
      addedOn: date = TODAY()
      status: waiting | offered | allocated | withdrawn
pages:
  plots:
    crud: Plot
    search: [number, description]
    filters: [status]
  members:
    crud: Member
    search: [name, email, phone]
  fees:
    crud: Fee
    filters: [year, status]
    actions: [markPaid]
  waiting-list:
    crud: WaitingListEntry
    filters: [status]
    actions: [offerPlot, allocate, withdraw]
  overview:
    dashboard:
      availablePlots:
        count: Plot
        where:
          status: available
      waiting:
        count: WaitingListEntry
        where:
          status: waiting
      unpaidFees:
        sum: Fee.amount
        where:
          status: unpaid
  home:
    route: /
    landing:
      hero:
      footer:
      availablePlots:
        records: Plot
        where:
          status: available
      contact:
        form: WaitingListEntry
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  markPaid:
    on: Fee
    when:
      status: unpaid
    set:
      status: paid
      paidOn: TODAY()
    intent: Record that the yearly fee has been paid.
  offerPlot:
    on: WaitingListEntry
    when:
      status: waiting
    set:
      status: offered
    intent: Mark that a plot has been offered to this person.
  allocate:
    on: WaitingListEntry
    when:
      status: offered
    set:
      status: allocated
    intent: Mark that the person accepted a plot and leaves the waiting list.
  withdraw:
    on: WaitingListEntry
    when:
      status: [waiting, offered]
    set:
      status: withdrawn
    intent: Take the person off the waiting list.
