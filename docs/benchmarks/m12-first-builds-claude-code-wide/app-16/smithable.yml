smithable: 0.1
app:
  name: Allotment Society
  description: Keeps track of who has which plot, the waiting list for a plot and each member's yearly fee.
  currency: EUR
  timezone: Europe/Helsinki
models:
  Member:
    fields:
      name: string!
      email: email
      phone: phone
      address: string
      joinedOn: date! = TODAY()
      status: active | former
      notes: text
      plots: Plot[]
      fees: Fee[]
  Plot:
    fields:
      number: string! unique
      size: int
      location: string
      status: vacant | let | reserved
      member:
        type: Member
        required:
          status: let
      letSince: date
      notes: text
    namedBy: number
  WaitingListEntry:
    fields:
      name: string!
      email: email
      phone: phone
      appliedOn: date! = TODAY()
      wish: text
      status: waiting | offered | accepted | withdrawn
  Fee:
    fields:
      member: Member!
      year: int!
      amount: money!
      status: unpaid | paid
      paidOn: date
    namedBy: [member, year]
    unique: [{ fields: [member, year], scope: app }]
pages:
  plots:
    crud: Plot
    search: [number, location]
    filters: [status, member]
  members:
    crud: Member
    search: [name, email, phone]
    filters: [status]
  waiting-list:
    crud: WaitingListEntry
    search: [name, email]
    filters: [status]
    defaultFilter:
      status: [waiting, offered]
    actions: [offerPlot, accept, withdraw]
  fees:
    crud: Fee
    filters: [year, status, member]
    actions: [markPaid]
  team:
    users: manage
actions:
  markPaid:
    on: Fee
    when:
      status: unpaid
    set:
      status: paid
      paidOn: TODAY()
  offerPlot:
    on: WaitingListEntry
    when:
      status: waiting
    set:
      status: offered
  accept:
    on: WaitingListEntry
    when:
      status: offered
    set:
      status: accepted
  withdraw:
    on: WaitingListEntry
    when:
      status: [waiting, offered]
    set:
      status: withdrawn
