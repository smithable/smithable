smithable: 0.1
app:
  name: Allotment Society
  description: Keeps track of who has which plot, the waiting list for plots and each member's yearly fee.
  currency: EUR
  timezone: Europe/Mariehamn
models:
  Member:
    fields:
      name: string!
      email: email
      phone: phone
      address: string
      joinedOn: date! = TODAY()
      status: active | left
      notes: text
      plots: Plot[]
      fees: Fee[]
  Plot:
    fields:
      number: string! unique
      area: string
      sizeSqm: int
      status: let | vacant
      member: Member
      since: date
      notes: text
    namedBy: number
  WaitingEntry:
    fields:
      name: string!
      email: email
      phone: phone
      appliedOn: date! = TODAY()
      wish: text
      status: waiting | offered | allotted | withdrawn
  Fee:
    fields:
      member: Member!
      year: int!
      amount: money!
      status: due | paid
      paidOn: date
    namedBy: [member, year]
pages:
  plots:
    crud: Plot
    search: [number, area, notes]
    filters: [status, member]
  members:
    crud: Member
    search: [name, email, phone]
    filters: [status]
    defaultFilter:
      status: active
  waitingList:
    crud: WaitingEntry
    filters: [status, appliedOn]
    defaultFilter:
      status: [waiting, offered]
    actions: [offerPlot, markAllotted, withdraw]
  fees:
    crud: Fee
    filters: [status, year, member]
    actions: [markPaid]
  team:
    users: manage
actions:
  markPaid:
    on: Fee
    when:
      status: due
    set:
      status: paid
      paidOn: TODAY()
    intent: Record that the yearly fee has been paid.
  offerPlot:
    on: WaitingEntry
    when:
      status: waiting
    set:
      status: offered
    intent: Mark that a plot has been offered to this applicant.
  markAllotted:
    on: WaitingEntry
    when:
      status: [waiting, offered]
    set:
      status: allotted
    intent: Mark that the applicant has been given a plot.
  withdraw:
    on: WaitingEntry
    when:
      status: [waiting, offered]
    set:
      status: withdrawn
    intent: Take the applicant off the waiting list.
