smithable: 0.1
app:
  name: Allotment Society
  description: Keeps track of who has which plot, the waiting list and the yearly fees of our allotment society.
  currency: EUR
models:
  Member:
    fields:
      name: string!
      email: email
      phone: phone
      address: text
      joinedOn: date = TODAY()
      notes: text
      plots: Plot[]
      fees: Fee[]
  Plot:
    fields:
      number: string! unique
      size: decimal
      status: vacant | let | reserved
      holder: Member
      since: date
      notes: text
  WaitingListEntry:
    fields:
      name: string!
      email: email
      phone: phone
      addedOn: date! = TODAY()
      wishes: text
      status: waiting | offered | allocated | withdrawn
  Fee:
    fields:
      member: Member!
      year: int!
      amount: money!
      status: unpaid | paid
      paidOn: date
pages:
  plots:
    crud: Plot
    search: [number, notes]
    filters: [status, holder]
  members:
    crud: Member
    search: [name, email, phone]
  waitingList:
    crud: WaitingListEntry
    search: [name, email]
    filters: [status]
    actions: [offerPlot, allocate, withdraw]
  fees:
    crud: Fee
    filters: [status, year, member]
    actions: [markPaid]
  overview:
    dashboard:
      vacantPlots:
        count: Plot
        where:
          status: vacant
      waiting:
        count: WaitingListEntry
        where:
          status: waiting
      unpaidFees:
        sum: Fee.amount
        where:
          status: unpaid
  team:
    users: manage
actions:
  markPaid:
    on: Fee
    when:
      status: unpaid
    set:
      status: paid
      paidOn: TODAY()
    intent: Record that a member has paid the yearly fee.
  offerPlot:
    on: WaitingListEntry
    when:
      status: waiting
    set:
      status: offered
    intent: Mark that a plot has been offered to this person.
  allocate:
    on: WaitingListEntry
    when:
      status: offered
    set:
      status: allocated
    intent: Mark that the person accepted a plot.
  withdraw:
    on: WaitingListEntry
    when:
      status: [waiting, offered]
    set:
      status: withdrawn
    intent: Take the person off the waiting list.
