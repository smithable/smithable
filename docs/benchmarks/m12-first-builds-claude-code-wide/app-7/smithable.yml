smithable: 0.1
app:
  name: Town Flea Market
  description: Post the things you want to sell, with photos and a price, and browse what your neighbors are selling.
  currency: EUR
  timezone: Europe/Helsinki
models:
  Item:
    fields:
      title: string!
      photos: pictures!
      description: text!
      price: money
      category: furniture | clothing | books | toys | electronics | kitchen | garden | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
    review: [photos]
pages:
  catalog:
    route: /
    crud: Item
    search: [title, description, place]
    filters: [category, price, condition, available]
    defaultFilter:
      available: true
    sortable: [price, createdAt]
    favorites: true
    contact: owner
  myItems:
    crud: Item
    mine: true
  saved:
    crud: Item
    favorites: only
  review:
    review: all
  home:
    route: /welcome
    landing:
      hero:
        button: catalog
        secondButton: myItems
      latest:
        records: Item
        where:
          available: true
      features:
      footer:
  privacy:
    route: /privacy
    legal: privacy
