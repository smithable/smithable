smithable: 0.1
app:
  name: Shear Studio
  description: "Online booking for a hair salon: customers pick a stylist and a free time themselves."
  currency: EUR
  timezone: Europe/Stockholm
models:
  Service:
    fields:
      name: string!
      summary: text
      durationMinutes: int! = 45
      price: money
  Stylist:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      slots: Slot[]
  Slot:
    fields:
      stylist: Stylist!
      startsAt: datetime!
      durationMinutes: int! = 45
      bookings: Booking[]
      placesLeft:
        type: int
        formula: 1 - COUNT(bookings)
  Booking:
    fields:
      slot: Slot! unique
      service: Service!
      phone: phone
      note: text
    capacity:
      per: slot
      max: 1
  Message:
    fields:
      name: string!
      email: email!
      message: text!
pages:
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule, stylists]
      footer:
      stylists:
        records: Stylist
      services:
        records: Service
      faq:
      callToAction:
        button: schedule
      contact:
        form: Message
  schedule:
    calendar: Slot
  my-bookings:
    crud: Booking
  slots:
    crud: Slot
    filters: [stylist, startsAt]
  stylists:
    crud: Stylist
  services:
    crud: Service
  messages:
    crud: Message
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
