smithable: 0.1
app:
  name: Shear Studio
  description: "Online booking for a hair salon: customers pick a stylist and a free time themselves."
  currency: EUR
models:
  Service:
    fields:
      name: string!
      summary: text
      minutes: int! = 30
      price: money
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
      timeOffs: TimeOff[]
    schedule:
      hours:
        tue-fri: 09:00-18:00
        sat: 09:00-15:00
      breaks: 12:00-12:30
      gap: 10
      away: TimeOff
  TimeOff:
    fields:
      stylist: Stylist!
      from: datetime!
      until: datetime!
      note: string
  Appointment:
    fields:
      service: Service!
      stylist: Stylist!
      startsAt: datetime!
      name: string!
      phone: phone
      note: text
      status:
        type: requested | confirmed | cancelled
        by: app
    occupies:
      resource: stylist
      starts: startsAt
      duration: service.minutes
      while:
        status: [requested, confirmed]
      cancelUntil: 12h
pages:
  appointments:
    crud: Appointment
    filters: [status]
    actions: [confirm, cancel]
  day:
    calendar:
      model: Appointment
      starts: startsAt
  services:
    crud: Service
  stylists:
    crud: Stylist
  time-off:
    crud: TimeOff
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Service
      stylists:
        records: Stylist
  privacy:
    route: /privacy
    legal: privacy
actions:
  confirm:
    on: Appointment
    when:
      status: requested
    set:
      status: confirmed
  cancel:
    on: Appointment
    when:
      status: [requested, confirmed]
    set:
      status: cancelled
outgoing:
  appointmentRequested:
    when: Appointment created
    to: mail
    recipient: admin
  appointmentMade:
    when: Appointment created
    to: mail
    recipient: owner
  appointmentConfirmed:
    when: confirm
    to: mail
    recipient: owner
