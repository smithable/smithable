smithable: 0.1
app:
  name: Cut & Comb
  description: Online booking for a hair salon, where customers pick a stylist and a free time themselves.
  currency: EUR
models:
  Service:
    fields:
      name: string!
      summary: text
      durationMinutes: int! = 45
      price: money
  Stylist:
    fields:
      name: string!
      bio: markdown
      portrait: picture
  Slot:
    fields:
      stylist: Stylist!
      startsAt: datetime!
      durationMinutes: int! = 45
      capacity: int! = 1
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
  Booking:
    fields:
      slot: Slot! unique
      service: Service
      note: text
    capacity:
      per: slot
      max: slot.capacity
pages:
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule]
      ourServices:
        records: Service
      ourStylists:
        records: Stylist
      faq:
      callToAction:
        button: schedule
      footer:
  schedule:
    calendar:
      model: Slot
      starts: startsAt
  my-bookings:
    crud: Booking
  slots:
    crud: Slot
    filters: [stylist, startsAt]
  stylists:
    crud: Stylist
  services:
    crud: Service
  admin:
    data: all
  privacy:
    route: /privacy
    legal: privacy
