smithable: 0.1
app:
  name: Salon Booking
  description: Customers book a hair salon appointment online, choosing a stylist and a free time themselves.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Service:
    fields:
      name: string!
      summary: text
      minutes: int! = 30
      price: money
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
      timeOffs: TimeOff[]
    schedule:
      hours:
        mon-fri: 09:00-18:00
        sat: 10:00-15:00
      breaks: 12:00-12:30
      gap: 10
      away: TimeOff
  TimeOff:
    fields:
      stylist: Stylist!
      from: datetime!
      until: datetime!
      note: string
  Appointment:
    fields:
      service: Service!
      stylist: Stylist!
      startsAt: datetime!
      name: string!
      phone: phone
      note: text
      status:
        type: requested | confirmed | cancelled
        by: app
    occupies:
      resource: stylist
      starts: startsAt
      duration: service.minutes
      while:
        status: [requested, confirmed]
      cancelUntil: 12h
actions:
  confirm:
    on: Appointment
    when:
      status: requested
    set:
      status: confirmed
  cancel:
    on: Appointment
    when:
      status: [requested, confirmed]
    set:
      status: cancelled
pages:
  appointments:
    crud: Appointment
    filters: [status, stylist]
  day:
    calendar:
      model: Appointment
      starts: startsAt
  services:
    crud: Service
  stylists:
    crud: Stylist
  time-off:
    crud: TimeOff
  home:
    route: /
    landing:
      hero:
        button: appointments
      services:
        records: Service
      stylists:
        records: Stylist
      footer:
  privacy:
    route: /privacy
    legal: privacy
outgoing:
  appointmentRequested:
    when: Appointment created
    to: mail
    recipient: admin
  appointmentMade:
    when: Appointment created
    to: mail
    recipient: owner
  appointmentConfirmed:
    when: confirm
    to: mail
    recipient: owner
