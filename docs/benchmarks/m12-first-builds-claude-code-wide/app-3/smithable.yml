smithable: 0.1
app:
  name: Salon Booking
  description: Online booking for a hair salon where customers pick a stylist and a free time themselves.
models:
  Service:
    fields:
      name: string!
      summary: text
      durationMinutes: int! = 45
    access:
      create: [admin]
  Stylist:
    fields:
      name: string!
      bio: text
    access:
      create: [admin]
  Slot:
    fields:
      stylist: Stylist!
      startsAt: datetime!
      bookings: Booking[]
      placesLeft:
        type: int
        formula: 1 - COUNT(bookings)
    access:
      create: [admin]
  Booking:
    fields:
      slot: Slot! unique
      service: Service!
      note: text
    capacity:
      per: slot
      max: 1
pages:
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule, my-bookings]
      footer:
      services:
        records: Service
      stylists:
        records: Stylist
      faq:
      callToAction:
        button: schedule
  schedule:
    calendar:
      model: Slot
      starts: startsAt
  my-bookings:
    crud: Booking
  slots:
    crud: Slot
    access: [admin]
    filters: [stylist, startsAt]
  stylists:
    crud: Stylist
    access: [admin]
  services:
    crud: Service
    access: [admin]
  admin:
    data: all
