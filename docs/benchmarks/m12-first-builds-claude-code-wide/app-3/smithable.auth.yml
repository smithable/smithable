smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  staff:
    description: A stylist. Runs the day, confirms and cancels appointments, and enters time off.
    pages: [day, appointments, time-off]
    read: [Appointment, TimeOff]
    create: [Appointment, TimeOff]
    write: [Appointment, TimeOff]
    delete: [TimeOff]
    actions: [confirm, cancel]
  member:
    description: A customer who books appointments.
    pages: [appointments]
    create: [Appointment]
assistant:
  for: signed-in
public:
  pages: [home, privacy]
  read: [Service, Stylist]
defaultRole: member
admins: [johan@smithable.ai]
