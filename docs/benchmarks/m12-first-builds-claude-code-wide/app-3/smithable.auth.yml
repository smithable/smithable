smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  member:
    description: A customer who books appointments.
    pages: [my-bookings]
    create: [Booking]
assistant:
  for: signed-in
public:
  pages: [home, schedule, stylists, privacy]
  read: [Service, Stylist, Slot]
  create: [Message]
defaultRole: member
admins: [johan@smithable.ai]
