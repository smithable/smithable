smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  staff:
    description: Nimmt Bestellungen an und pflegt Produkte und Abholzeiten.
    pages: [bestellungen, produkte, abholzeiten]
    create: all
    write: all
    actions: all
assistant:
  for: signed-in
public:
  pages: [abholung, datenschutz]
  read: [Product, PickupSlot]
  create: [Order]
defaultRole: staff
admins: [johan@smithable.ai]
