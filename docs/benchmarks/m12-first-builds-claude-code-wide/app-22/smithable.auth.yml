smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  staff:
    description: "Hilft im Hofladen: nimmt Vorbestellungen an, pflegt Sortiment und Abholzeiten."
    pages: [bestellungen, produkte, abholzeiten]
    create: all
    write: all
    actions: all
assistant:
  for: signed-in
public:
  pages: [hofladen, abholzeiten, privacy]
  read: [Product, PickupTime]
  create: [Order]
defaultRole: staff
admins: [johan@smithable.ai]
