smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
public:
  pages: [home, produkte]
  read: [{ Product: { where: { available: true } } }]
roles:
  admin:
    description: Betreiber des Hofladens. Pflegt Produkte, Abholzeiten und bearbeitet Vorbestellungen.
  customer:
    description: Kunde, der Produkte vorbestellt und abholt.
defaultRole: customer
admins: [johan@smithable.ai]
