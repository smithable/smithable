smithable: 0.1
app:
  name: Hofladen
  description: Produkte, Vorbestellungen der Kunden und Abholzeiten für einen kleinen Hofladen.
  currency: EUR
  timezone: Europe/Berlin
models:
  Product:
    fields:
      name: string!
      description: text
      unit: piece | kg | bunch | liter
      price: money!
      available: bool = true
  Customer:
    fields:
      name: string!
      email: email
      phone: phone
      notes: text
      preorders: Preorder[]
  PickupSlot:
    fields:
      startsAt: datetime!
      endsAt: datetime
      capacity: int! = 10
      notes: text
      preorders: Preorder[]
  Preorder:
    fields:
      customer: Customer!
      pickupSlot: PickupSlot!
      status: open | ready | collected | canceled
      notes: text
      lines: PreorderLine[]
    capacity:
      per: pickupSlot
      max: pickupSlot.capacity
      where:
        status: [open, ready, collected]
  PreorderLine:
    fields:
      preorder: Preorder!
      product: Product!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
pages:
  vorbestellungen:
    crud: Preorder
    filters: [status, pickupSlot, customer]
    actions: [markReady, markCollected, cancel]
  abholzeiten:
    crud: PickupSlot
  produkte:
    crud: Product
    search: [name]
  kunden:
    crud: Customer
    search: [name, email, phone]
  team:
    users: manage
actions:
  markReady:
    on: Preorder
    when:
      status: open
    set:
      status: ready
    intent: Die Vorbestellung ist gepackt und liegt zur Abholung bereit.
  markCollected:
    on: Preorder
    when:
      status: [open, ready]
    set:
      status: collected
    intent: Der Kunde hat die Vorbestellung abgeholt.
  cancel:
    on: Preorder
    when:
      status: [open, ready]
    set:
      status: canceled
    intent: Die Vorbestellung wird storniert.
