smithable: 0.1
app:
  name: Hofladen
  description: "Unser kleiner Hofladen: Produkte vorbestellen und zur passenden Abholzeit am Hof abholen."
  currency: EUR
  timezone: Europe/Berlin
models:
  Product:
    fields:
      name: string!
      description: text
      price: money!
      unit: string
      category: vegetables | fruit | eggs | dairy | meat | bakery | other
      picture: picture
      available: bool = true
  PickupTime:
    fields:
      day: date!
      hours: string!
      note: text
  Order:
    fields:
      name: string!
      phone: phone!
      email: email
      pickup: PickupTime
      note: text
      status: new | accepted | ready | collected | declined
      reason: text
      lines: OrderLine[]
      total:
        type: money
        formula: SUM(lines.amount)
  OrderLine:
    fields:
      order: Order!
      product: Product!
      quantity: int! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
pages:
  bestellungen:
    crud: Order
    filters: [status, pickup]
    sortable: [createdAt]
    defaultFilter:
      status: [new, accepted, ready]
    actions: [accept, ready, collected, decline]
  produkte:
    crud: Product
    filters: [category, available]
    actions: [soldOut, backOn]
  abholzeiten:
    crud: PickupTime
  abholung:
    route: /abholung
    landing:
      hero:
      zeiten:
        records: PickupTime
        view: table
      footer:
  datenschutz:
    route: /datenschutz
    legal: privacy
  team:
    users: manage
actions:
  soldOut:
    on: Product
    when:
      available: true
    set:
      available: false
    intent: Heute nicht mehr vorrätig.
  backOn:
    on: Product
    when:
      available: false
    set:
      available: true
    intent: Kann wieder bestellt werden.
  accept:
    on: Order
    when:
      status: new
    set:
      status: accepted
    intent: Die Vorbestellung wird angenommen.
  ready:
    on: Order
    when:
      status: accepted
    set:
      status: ready
    intent: Die Bestellung liegt zur Abholung bereit.
  collected:
    on: Order
    when:
      status: ready
    set:
      status: collected
    intent: Der Kunde hat die Bestellung abgeholt.
  decline:
    on: Order
    when:
      status: [new, accepted]
    set:
      status: declined
      reason:
    intent: "Die Bestellung kann nicht erfüllt werden: Grund angeben."
outgoing:
  orderPlaced:
    when: Order created
    to: mail
    recipient: admin
  orderAccepted:
    when: accept
    to: mail
    recipient: email
  orderReady:
    when: ready
    to: mail
    recipient: email
