smithable: 0.1
app:
  name: Hofladen
  description: Der Hofladen zeigt sein Sortiment und seine Abholzeiten, Kunden bestellen vor und holen ab.
  currency: EUR
  timezone: Europe/Berlin
  clock: 24h
  date: day-month
  week: monday
  numbers: comma
models:
  Product:
    fields:
      name: string!
      description: text
      price: money!
      unit: string
      category: vegetables | fruit | eggs | dairy | meat | bakery | other
      picture: picture
      available: bool = true
  Order:
    fields:
      name: string!
      phone: phone!
      email: email
      wanted: datetime
      note: text
      status: new | accepted | ready | collected | declined
      reason: text
      lines: OrderLine[]
      total:
        type: money
        formula: SUM(lines.amount)
  OrderLine:
    fields:
      order: Order!
      product: Product!
      quantity: int! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
  PickupTime:
    fields:
      day: date!
      hours: string!
      note: text
pages:
  bestellungen:
    crud: Order
    filters: [status]
    sortable: [createdAt, wanted]
    actions: [accept, ready, collected, decline]
  produkte:
    crud: Product
    filters: [category, available]
    actions: [soldOut, backOn]
  abholzeiten:
    crud: PickupTime
  hofladen:
    route: /hofladen
    landing:
      hero:
      features:
      abholung:
        records: PickupTime
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  soldOut:
    on: Product
    when:
      available: true
    set:
      available: false
    intent: Heute ist nichts mehr davon da.
  backOn:
    on: Product
    when:
      available: false
    set:
      available: true
    intent: Das Produkt kann wieder bestellt werden.
  accept:
    on: Order
    when:
      status: new
    set:
      status: accepted
    intent: Der Hofladen nimmt die Vorbestellung an.
  ready:
    on: Order
    when:
      status: accepted
    set:
      status: ready
    intent: Die Bestellung ist gepackt und liegt zur Abholung bereit.
  collected:
    on: Order
    when:
      status: ready
    set:
      status: collected
    intent: Der Kunde hat die Bestellung abgeholt.
  decline:
    on: Order
    when:
      status: [new, accepted]
    set:
      status: declined
      reason:
    intent: "Die Bestellung kann nicht erfüllt werden: Grund angeben."
navigation: [bestellungen, produkte, abholzeiten, team]
