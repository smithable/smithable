smithable: 0.1
app:
  name: Hofladen
  description: Unsere Produkte, Vorbestellungen der Kunden und die Abholzeiten des Hofladens.
  currency: EUR
  timezone: Europe/Berlin
models:
  Product:
    fields:
      name: string!
      description: text
      price: money!
      unit: string
      category: vegetables | fruit | eggs | dairy | meat | bakery | preserves
      picture: picture
      available: bool = true
  PickupSlot:
    fields:
      day: date!
      hours: string!
      note: text
  Order:
    fields:
      name: string!
      phone: phone!
      email: email
      pickup: PickupSlot
      note: text
      status: new | accepted | ready | collected | declined
      reason: text
      lines: OrderLine[]
      total:
        type: money
        formula: SUM(lines.amount)
  OrderLine:
    fields:
      order: Order!
      product: Product!
      quantity: int! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
pages:
  bestellungen:
    crud: Order
    filters: [status, pickup]
    sortable: [createdAt]
    actions: [accept, ready, collected, decline]
  produkte:
    crud: Product
    filters: [category, available]
    actions: [soldOut, backOn]
  abholzeiten:
    crud: PickupSlot
  abholung:
    route: /abholung
    landing:
      hero:
      footer:
      slots:
        records: PickupSlot
  datenschutz:
    route: /datenschutz
    legal: privacy
  team:
    users: manage
actions:
  soldOut:
    on: Product
    when:
      available: true
    set:
      available: false
    intent: Heute nichts mehr davon.
  backOn:
    on: Product
    when:
      available: false
    set:
      available: true
    intent: Kann wieder bestellt werden.
  accept:
    on: Order
    when:
      status: new
    set:
      status: accepted
    intent: Wir nehmen die Bestellung an.
  ready:
    on: Order
    when:
      status: accepted
    set:
      status: ready
    intent: Die Bestellung liegt zur Abholung bereit.
  collected:
    on: Order
    when:
      status: ready
    set:
      status: collected
    intent: Der Kunde hat sie abgeholt.
  decline:
    on: Order
    when:
      status: [new, accepted]
    set:
      status: declined
      reason:
    intent: "Die Bestellung geht nicht: sag warum."
navigation: [bestellungen, produkte, abholzeiten, team]
