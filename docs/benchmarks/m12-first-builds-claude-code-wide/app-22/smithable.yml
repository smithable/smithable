smithable: 0.1
app:
  name: Hofladen
  description: Produkte, Vorbestellungen der Kunden und Abholzeiten für einen kleinen Hofladen.
  currency: EUR
  timezone: Europe/Berlin
models:
  Product:
    fields:
      name: string!
      description: text
      price: money!
      unit: string
      available: bool = true
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  PickupSlot:
    fields:
      startsAt: datetime!
      endsAt: datetime
      capacity: int! = 10
      preorders: Preorder[]
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Preorder:
    fields:
      pickupSlot: PickupSlot!
      note: text
      status: open | ready | pickedUp | canceled
      lines: OrderLine[]
    capacity:
      per: pickupSlot
      max: pickupSlot.capacity
      where:
        status: [open, ready]
  OrderLine:
    fields:
      preorder: Preorder!
      product: Product!
      quantity: int! = 1
pages:
  vorbestellungen:
    crud: Preorder
    actions: [markReady, markPickedUp, cancel]
    filters: [status, pickupSlot]
  produkte:
    crud: Product
    search: [name, description]
  abholzeiten:
    crud: PickupSlot
  home:
    route: /
    landing:
      hero:
      footer:
      angebot:
        records: Product
        where:
          available: true
      faq:
      callToAction:
        button: vorbestellungen
  admin:
    data: all
actions:
  markReady:
    on: Preorder
    when:
      status: open
    set:
      status: ready
    allow: [admin]
    intent: Die Vorbestellung ist gepackt und liegt zur Abholung bereit.
  markPickedUp:
    on: Preorder
    when:
      status: ready
    set:
      status: pickedUp
    allow: [admin]
    intent: Der Kunde hat die Vorbestellung abgeholt.
  cancel:
    on: Preorder
    when:
      status: [open, ready]
    set:
      status: canceled
    intent: Die Vorbestellung wird storniert.
