smithable: 0.1
app:
  name: Vinyl Shelf
  description: "A personal catalogue of my vinyl records: the albums, their artists, their condition and what I paid."
  currency: EUR
models:
  Artist:
    fields:
      name: string! unique
      country: string
      genre: string
      notes: text
      albums: Album[]
  Album:
    fields:
      title: string!
      artist: Artist!
      year: int
      label: string
      genre: string
      format: lp | ep | single | doubleLp | boxSet
      condition: nearMint | mint | veryGoodPlus | veryGood | good | fair | poor
      pricePaid: money
      purchasedOn: date
      purchasedFrom: string
      notes: text
pages:
  albums:
    crud: Album
    search: [title, label, genre, notes]
    filters: [artist, format, condition, year]
    sortable: [title, year, pricePaid, purchasedOn]
  artists:
    crud: Artist
    search: [name, country, genre]
