smithable: 0.1
app:
  name: Vinyl Shelf
  description: "A personal catalog of my vinyl records: albums, artists, condition and what I paid."
models:
  Artist:
    fields:
      name: string!
      country: string
      notes: text
      albums: Album[]
  Album:
    fields:
      title: string!
      artist: Artist!
      year: int
      recordLabel: string
      condition: mint | nearMint | veryGoodPlus | veryGood | good | poor
      pricePaid: money
      boughtOn: date
      notes: text
pages:
  albums:
    crud: Album
    search: [title, recordLabel, notes]
    filters: [artist, condition, year]
    sortable: [title, year, pricePaid, boughtOn]
  artists:
    crud: Artist
    search: [name, country]
  overview:
    dashboard:
      albums:
        count: Album
      totalPaid:
        sum: Album.pricePaid
        by: boughtOn
      latest:
        list: Album
        limit: 5
