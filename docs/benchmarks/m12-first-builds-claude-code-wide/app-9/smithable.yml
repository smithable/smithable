smithable: 0.1
app:
  name: Vinyl Shelf
  description: "A private catalogue of my vinyl records: albums, artists, condition and what I paid."
  currency: EUR
  timezone: Europe/Mariehamn
models:
  Artist:
    fields:
      name: string! unique
      country: string
      notes: text
      albums: Album[]
  Album:
    fields:
      title: string!
      artist: Artist!
      year: int
      label: string
      genre: string
      cover: picture
      condition: mint | nearMint | veryGoodPlus | veryGood | good | fair | poor
      sleeveCondition: mint | nearMint | veryGoodPlus | veryGood | good | fair | poor
      pricePaid: money
      boughtOn: date
      boughtFrom: string
      notes: text
pages:
  albums:
    crud: Album
    search: [title, label, genre, notes]
    filters: [artist, condition, year]
    sortable: [title, year, pricePaid, boughtOn]
  artists:
    crud: Artist
    search: [name, country]
