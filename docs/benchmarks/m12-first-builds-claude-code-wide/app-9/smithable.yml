smithable: 0.1
app:
  name: Crate
  description: "A private catalogue of my vinyl records: albums, artists, condition and what I paid."
  currency: EUR
  timezone: Europe/Stockholm
models:
  Artist:
    fields:
      name: string!
      country: string
      notes: text
      albums: Album[]
  Album:
    fields:
      title: string!
      artist: Artist!
      year:
        type: int
        min: 1900
        max: 2100
      label: string
      format: lp | doubleLp | ep | single
      condition: veryGoodPlus | mint | nearMint | veryGood | good | poor
      pricePaid: money
      boughtOn: date
      cover: picture
      notes: text
    namedBy: [title, artist]
pages:
  artists:
    crud: Artist
    search: [name, country]
  albums:
    crud: Album
    search: [title, label, notes]
    filters: [artist, format, condition, year]
    sortable: [title, year, pricePaid, boughtOn]
