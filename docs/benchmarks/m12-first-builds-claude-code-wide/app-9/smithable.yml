smithable: 0.1
app:
  name: Crate Digger
  description: "A personal catalogue of my vinyl records: the albums, their artists, their condition and what I paid."
  currency: EUR
  timezone: Europe/Stockholm
models:
  Artist:
    fields:
      name: string!
      country: string
      notes: text
      albums: Album[]
  Album:
    fields:
      title: string!
      artist: Artist!
      year:
        type: int
        min: 1900
        max: 2100
      label: string
      genre: string
      cover: picture
      condition: mint | nearMint | veryGoodPlus | veryGood | good | fair | poor
      pricePaid: money
      boughtOn: date
      boughtFrom: string
      notes: text
pages:
  albums:
    crud: Album
    search: [title, label, genre, notes]
    filters: [artist, condition, year, pricePaid]
    sortable: [title, year, pricePaid, boughtOn]
  artists:
    crud: Artist
    search: [name, country]
