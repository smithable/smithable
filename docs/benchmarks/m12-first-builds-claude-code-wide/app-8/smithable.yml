smithable: 0.1
app:
  name: Swap Shelf
  description: Colleagues offer things they no longer need and others claim them.
models:
  Item:
    fields:
      title: string!
      photos: pictures
      description: text
      category: furniture | electronics | books | kitchen | stationery | clothing | other
      condition: likeNew | good | worn
      place: string
      status: available | claimed | gone
      claimedBy:
        type: User
        by: app
pages:
  shelf:
    route: /
    crud: Item
    search: [title, description, place]
    filters: [category, condition, status]
    sortable: [title, createdAt]
  myItems:
    crud: Item
    mine: true
  team:
    users: manage
actions:
  claim:
    on: Item
    when:
      status: available
    set:
      status: claimed
      claimedBy: ME()
    intent: Claim an available item for yourself.
  markGone:
    on: Item
    when:
      status: claimed
    set:
      status: gone
    intent: Mark a claimed item as handed over.
  release:
    on: Item
    when:
      status: claimed
    set:
      status: available
      claimedBy:
    intent: Put a claimed item back on the shelf.
