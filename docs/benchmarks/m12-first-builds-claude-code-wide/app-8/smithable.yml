smithable: 0.1
app:
  name: Swap Shelf
  description: Colleagues offer things they no longer need and others claim them.
  timezone: Europe/Stockholm
models:
  Item:
    fields:
      title: string!
      photos: pictures
      description: text
      category: furniture | electronics | books | kitchen | stationery | clothing | other
      condition: likeNew | good | worn
      pickupSpot: string
      status: available | given
      claims: Claim[]
  Claim:
    fields:
      item: Item!
      note: text
    capacity:
      per: item
      max: 1
pages:
  shelf:
    route: /
    crud: Item
    search: [title, description, pickupSpot]
    filters: [category, condition, status]
    defaultFilter:
      status: available
    favorites: true
  myItems:
    crud: Item
    mine: true
  myClaims:
    crud: Claim
    mine: true
  team:
    users: manage
actions:
  markGiven:
    on: Item
    when:
      status: available
    set:
      status: given
    intent: Mark an item as handed over to the colleague who claimed it.
navigation: [shelf, myItems, myClaims, team]
