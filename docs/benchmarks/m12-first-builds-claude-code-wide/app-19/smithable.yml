smithable: 0.1
app:
  name: Loppisen
  description: Lägg upp saker du vill sälja på vår loppis, med bilder och pris, och hitta fynd från andra.
  currency: SEK
  timezone: Europe/Stockholm
  clock: 24h
  date: day-month
  week: monday
  numbers: comma
models:
  Item:
    fields:
      title: string!
      photos: pictures!
      description: text!
      price: money
      category: furniture | clothes | books | kitchen | toys | electronics | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
    review: [photos]
pages:
  catalog:
    route: /
    crud: Item
    search: [title, description, place]
    filters: [category, price, condition, available]
    defaultFilter:
      available: true
    sortable: [price, createdAt]
    favorites: true
    contact: owner
  myItems:
    crud: Item
    mine: true
  saved:
    crud: Item
    favorites: only
  review:
    review: all
  home:
    route: /valkommen
    landing:
      hero:
        button: catalog
        secondButton: myItems
      features:
      footer:
  privacy:
    route: /privacy
    legal: privacy
actions:
  markSold:
    on: Item
    when:
      available: true
    set:
      available: false
    intent: Säljaren markerar att saken är såld så att den inte längre visas som till salu.
navigation: [catalog, myItems, saved, review]
