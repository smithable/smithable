smithableUx: 0.1
pages:
  components:
    table:
      columns: [name, status, description]
  incidents:
    table:
      columns: [title, status, component, detectedAt, expectedBackAt, resolvedAt]
      sort: -detectedAt
  maintenance:
    table:
      sort: startsAt
tones:
  Component.status:
    operational: success
    degraded: warning
    down: danger
  Incident.status:
    investigating: danger
    identified: warning
    monitoring: warning
    resolved: success
theme:
  preset: corporate
