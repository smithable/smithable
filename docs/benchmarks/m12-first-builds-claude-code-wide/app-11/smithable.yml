smithable: 0.1
app:
  name: IT Status Board
  description: See which of our IT systems are down, what is being done, and when they will be back.
  timezone: Europe/Stockholm
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
    access:
      write: [admin, it]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      expectedBackAt: datetime
      resolvedAt: datetime
      summary: text
      updates: IncidentUpdate[]
    access:
      write: [admin, it]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
    access:
      write: [admin, it]
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
    access:
      write: [admin, it]
pages:
  components:
    crud: Component
  incidents:
    crud: Incident
    actions: [identified, monitoring, resolve]
    filters: [status, component]
  updates:
    crud: IncidentUpdate
  maintenance:
    crud: Maintenance
  overview:
    dashboard:
      open:
        count: Incident
        where:
          status: [investigating, identified, monitoring]
      down:
        count: Component
        where:
          status: [down, degraded]
      latest:
        list: Incident
        limit: 5
  team:
    users: manage
actions:
  identified:
    on: Incident
    when:
      status: investigating
    set:
      status: identified
      expectedBackAt:
    add:
      IncidentUpdate:
        at: NOW()
        status: identified
        message: The cause is found and a fix is being worked on.
    allow: [admin, it]
    intent: The cause is found; the incident moves to identified with an expected time back, and an update saying so.
  monitoring:
    on: Incident
    when:
      status: [investigating, identified]
    set:
      status: monitoring
    add:
      IncidentUpdate:
        at: NOW()
        status: monitoring
        message: A fix is out. We are watching before we close this.
    allow: [admin, it]
    intent: A fix is out; the incident is watched before it is closed, with an update saying so.
  resolve:
    on: Incident
    when:
      status: [investigating, identified, monitoring]
    set:
      status: resolved
      resolvedAt: NOW()
    add:
      IncidentUpdate:
        at: NOW()
        status: resolved
        message: This incident is resolved. The system is back.
    allow: [admin, it]
    intent: The incident is over and the system is back, with an update saying so.
navigation: [components, incidents, maintenance, updates, overview, team]
