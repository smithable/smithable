smithable: 0.1
app:
  name: IT Status
  description: An internal board showing which of our IT systems are down, what is being fixed, and when they are back.
  timezone: Europe/Helsinki
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
      maintenances: Maintenance[]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      expectedBackAt: datetime
      resolvedAt: datetime
      summary: markdown
      updates: IncidentUpdate[]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
pages:
  home:
    route: /
    landing:
      hero:
        button: incidents
      systems:
        records: Component
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
      planned:
        records: Maintenance
      footer:
  incidents:
    crud: Incident
    filters: [status, component]
    defaultFilter:
      status: [investigating, identified, monitoring]
    actions: [identified, monitoring, resolve]
  maintenance:
    crud: Maintenance
  components:
    crud: Component
    filters: [status]
  team:
    users: manage
actions:
  identified:
    on: Incident
    when:
      status: investigating
    set:
      status: identified
    add:
      IncidentUpdate:
        at: NOW()
        status: identified
        message: The cause is found and a fix is being worked on.
    intent: The cause is found; the incident moves to identified with an update.
  monitoring:
    on: Incident
    when:
      status: [investigating, identified]
    set:
      status: monitoring
    add:
      IncidentUpdate:
        at: NOW()
        status: monitoring
        message: A fix is out. We are watching before we close this.
    intent: A fix is out and being watched, with an update saying so.
  resolve:
    on: Incident
    when:
      status: [investigating, identified, monitoring]
    set:
      status: resolved
      resolvedAt: NOW()
    add:
      IncidentUpdate:
        at: NOW()
        status: resolved
        message: This is resolved and the system is back.
    intent: The incident is over and the system is back, with an update saying so.
