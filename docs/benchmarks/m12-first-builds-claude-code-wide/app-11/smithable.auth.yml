smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  it:
    description: "The IT team: writes incidents, their updates and planned maintenance, and keeps the systems' status."
    pages: [components, incidents, maintenance, overview]
    create: all
    write: all
  staff:
    description: Sees what is down and when it is back.
    pages: [components, incidents, maintenance, overview]
assistant:
  for: signed-in
defaultRole: staff
admins: [johan@smithable.ai]
