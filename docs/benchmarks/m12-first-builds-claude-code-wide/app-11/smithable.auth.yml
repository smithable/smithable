smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  it:
    description: "The IT team: keeps the systems and writes incidents, updates and planned maintenance."
    pages: [home, incidents, maintenance, components]
    create: all
    write: all
  staff:
    description: "Everyone else: sees what is down and when it is back."
    pages: [home, incidents, maintenance]
assistant:
  for: signed-in
defaultRole: staff
admins: [johan@smithable.ai]
