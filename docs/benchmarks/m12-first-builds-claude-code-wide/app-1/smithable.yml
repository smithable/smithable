smithable: 0.1
app:
  name: Wordwise Clients
  description: A freelance translator's clients, the quotes sent to them and the payments received.
  currency: EUR
  timezone: Europe/Stockholm
models:
  Client:
    fields:
      name: string!
      company: string
      email: email
      phone: phone
      languages: string
      notes: text
      quotes: Quote[]
      payments: Payment[]
  Quote:
    fields:
      title: string!
      client: Client!
      languagePair: string
      words: int
      amount: money!
      quotedOn: date! = TODAY()
      dueOn: date
      status: draft | sent | accepted | declined | done
      notes: text
      payments: Payment[]
      paid:
        type: money
        formula: SUM(payments.amount)
  Payment:
    fields:
      client: Client!
      quote: Quote
      amount: money!
      paidOn: date! = TODAY()
      method: bankTransfer | card | paypal | other
      note: string
pages:
  clients:
    crud: Client
    search: [name, company, email]
  quotes:
    crud: Quote
    search: [title, languagePair]
    filters: [client, status, quotedOn]
    sortable: [quotedOn, dueOn, amount]
    actions: [markSent, markAccepted, markDeclined, markDone]
  overview:
    dashboard:
      quoted:
        sum: Quote.amount
        where:
          status: sent
      accepted:
        sum: Quote.amount
        where:
          status: [accepted, done]
      received:
        sum: Payment.amount
        by: paidOn
      latestPayments:
        list: Payment
        limit: 5
    period:
      Quote: quotedOn
      Payment: paidOn
  payments:
    crud: Payment
    filters: [client, method, paidOn]
actions:
  markSent:
    on: Quote
    when:
      status: draft
    set:
      status: sent
    intent: The quote went to the client.
  markAccepted:
    on: Quote
    when:
      status: sent
    set:
      status: accepted
    intent: The client accepted the quote.
  markDeclined:
    on: Quote
    when:
      status: sent
    set:
      status: declined
    intent: The client turned the quote down.
  markDone:
    on: Quote
    when:
      status: accepted
    set:
      status: done
    intent: The translation was delivered.
