smithable: 0.1
app:
  name: Translator's Ledger
  description: Keep track of my translation clients, the quotes I send them and the payments they make.
  currency: EUR
models:
  Client:
    fields:
      name: string!
      company: string
      email: email
      phone: phone
      address: text
      notes: text
      quotes: Quote[]
      payments: Payment[]
  Quote:
    fields:
      number: string! unique
      client: Client!
      title: string!
      sourceLanguage: string
      targetLanguage: string
      wordCount: int
      quotedOn: date! = TODAY()
      deadline: date
      amount: money!
      status: draft | sent | accepted | declined
      notes: text
      payments: Payment[]
      paid:
        type: money
        formula: SUM(payments.amount)
  Payment:
    fields:
      client: Client!
      quote: Quote
      amount: money!
      paidOn: date! = TODAY()
      method: bankTransfer | card | cash | other
      note: string
pages:
  clients:
    crud: Client
    search: [name, company, email]
  quotes:
    crud: Quote
    filters: [client, status]
    actions: [markSent, accept, decline]
  overview:
    dashboard:
      quotedOpen:
        sum: Quote.amount
        where:
          status: sent
      accepted:
        sum: Quote.amount
        where:
          status: accepted
      latestQuotes:
        list: Quote
        limit: 5
      received:
        sum: Payment.amount
        by: paidOn
  payments:
    crud: Payment
    filters: [client, method, paidOn]
actions:
  markSent:
    on: Quote
    when:
      status: draft
    set:
      status: sent
    intent: The quote went to the client.
  accept:
    on: Quote
    when:
      status: sent
    set:
      status: accepted
    intent: The client accepted the quote.
  decline:
    on: Quote
    when:
      status: sent
    set:
      status: declined
    intent: The client turned the quote down.
