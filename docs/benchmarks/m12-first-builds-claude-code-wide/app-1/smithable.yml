smithable: 0.1
app:
  name: Lingua Ledger
  description: A freelance translator's record of clients, the quotes sent to them and the payments received.
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email
      phone: phone
      company: string
      address: text
      notes: text
      quotes: Quote[]
      payments: Payment[]
  Quote:
    fields:
      title: string!
      client: Client!
      sourceLanguage: string
      targetLanguage: string
      wordCount: int
      amount: money!
      quotedOn: date! = TODAY()
      deadline: date
      status: draft | sent | accepted | declined
      notes: text
      payments: Payment[]
      paid:
        type: money
        formula: SUM(payments.amount)
  Payment:
    fields:
      client: Client!
      quote: Quote
      amount: money!
      paidOn: date! = TODAY()
      method: bankTransfer | card | paypal | cash | other
      note: string
pages:
  clients:
    crud: Client
    search: [name, email, company]
  quotes:
    crud: Quote
    filters: [client, status, quotedOn]
    actions: [markSent, markAccepted, markDeclined]
  overview:
    dashboard:
      awaitingAnswer:
        sum: Quote.amount
        where:
          status: sent
      accepted:
        sum: Quote.amount
        where:
          status: accepted
      latestQuotes:
        list: Quote
        limit: 5
      received:
        sum: Payment.amount
        by: paidOn
  payments:
    crud: Payment
    filters: [client, quote, paidOn]
actions:
  markSent:
    on: Quote
    when:
      status: draft
    set:
      status: sent
    intent: The quote went to the client.
  markAccepted:
    on: Quote
    when:
      status: sent
    set:
      status: accepted
    intent: The client accepted the quote.
  markDeclined:
    on: Quote
    when:
      status: sent
    set:
      status: declined
    intent: The client turned the quote down.
