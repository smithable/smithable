smithable: 0.1
app:
  name: Wordfolio
  description: A freelance translator's record of clients, the quotes sent to them and the payments received.
  currency: EUR
models:
  Client:
    fields:
      name: string!
      company: string
      email: email
      phone: phone
      languages: string
      notes: text
      quotes: Quote[]
  Quote:
    fields:
      title: string!
      client: Client!
      sourceLanguage: string
      targetLanguage: string
      words: int
      amount: money!
      quotedOn: date! = TODAY()
      deadline: date
      status: draft | sent | accepted | declined
      document: file
      payments: Payment[]
      paid:
        type: money
        formula: SUM(payments.amount)
      balance:
        type: money
        formula: amount - paid
  Payment:
    fields:
      quote: Quote!
      amount: money!
      paidOn: date! = TODAY()
      method: bankTransfer | card | paypal | cash | other
      note: string
pages:
  clients:
    crud: Client
    search: [name, company, email]
  quotes:
    crud: Quote
    filters: [client, status, quotedOn]
    actions: [markSent, markAccepted, markDeclined]
  payments:
    crud: Payment
    filters: [quote, paidOn, method]
  overview:
    dashboard:
      quoted:
        sum: Quote.amount
        where:
          status: sent
      accepted:
        sum: Quote.amount
        where:
          status: accepted
      received:
        sum: Payment.amount
        by: paidOn
      latestPayments:
        list: Payment
        limit: 5
actions:
  markSent:
    on: Quote
    when:
      status: draft
    set:
      status: sent
    intent: The quote went to the client.
  markAccepted:
    on: Quote
    when:
      status: [draft, sent]
    set:
      status: accepted
    intent: The client accepted the quote.
  markDeclined:
    on: Quote
    when:
      status: [draft, sent]
    set:
      status: declined
    intent: The client turned the quote down.
