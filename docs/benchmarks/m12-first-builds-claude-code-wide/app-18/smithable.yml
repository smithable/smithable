smithable: 0.1
app:
  name: Byggkollen
  description: Håll ordning på kunder, offerter och fakturor i en liten byggfirma.
  currency: SEK
  timezone: Europe/Stockholm
  clock: 24h
  date: day-month
  week: monday
  numbers: comma
models:
  Customer:
    fields:
      name: string!
      email: email
      phone: phone
      address: text
      orgNumber: string
      quotes: Quote[]
      invoices: Invoice[]
  QuoteLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      quote: Quote!
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      invoice: Invoice!
  Quote:
    fields:
      number: string! unique
      customer: Customer!
      title: string!
      issuedOn: date! = TODAY()
      validUntil: date
      status: draft | sent | accepted | declined
      notes: text
      lines: QuoteLine[]
      total:
        type: money
        formula: SUM(lines.amount)
  Invoice:
    fields:
      number: string! unique
      customer: Customer!
      quote: Quote
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
pages:
  kunder:
    crud: Customer
    search: [name, email, phone]
    sortable: [name, createdAt]
  oversikt:
    dashboard:
      openQuotes:
        sum: Quote.total
        where:
          status: sent
      outstanding:
        sum: Invoice.total
        where:
          status: sent
      overdue:
        sum: Invoice.total
        where:
          status: overdue
      invoiced:
        sum: Invoice.total
        by: issuedOn
      latest:
        list: Invoice
        limit: 5
  offerter:
    crud: Quote
    search: [number, title]
    filters: [customer, status]
    sortable: [issuedOn, validUntil, number]
    actions: [sendQuote, acceptQuote, declineQuote]
  fakturor:
    crud: Invoice
    search: [number]
    filters: [customer, status]
    sortable: [issuedOn, dueOn, number]
    actions: [markSent, markPaid, markOverdue]
  team:
    users: manage
navigation: [oversikt, offerter, fakturor, kunder, team]
actions:
  sendQuote:
    on: Quote
    when:
      status: draft
    set:
      status: sent
    intent: Offerten har skickats till kunden.
  acceptQuote:
    on: Quote
    when:
      status: sent
    set:
      status: accepted
    intent: Kunden har godkänt offerten.
  declineQuote:
    on: Quote
    when:
      status: sent
    set:
      status: declined
    intent: Kunden har tackat nej till offerten.
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: Fakturan har skickats till kunden.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: Kunden har betalat fakturan.
  markOverdue:
    on: Invoice
    when:
      status: sent
    set:
      status: overdue
    intent: Fakturan är förfallen.
timers:
  markOverdue:
    on: Invoice
    at: dueOn
    where:
      status: sent
    run: markOverdue
