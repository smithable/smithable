smithable: 0.1
app:
  name: Byggkollen
  description: Offerter, kunder och fakturor för en liten byggfirma.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Customer:
    fields:
      name: string!
      email: email
      phone: phone
      address: text
      quotes: Quote[]
      invoices: Invoice[]
  QuoteLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      quote: Quote!
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      invoice: Invoice!
  Quote:
    fields:
      number: string! unique
      customer: Customer!
      title: string!
      issuedOn: date! = TODAY()
      validUntil: date
      status: draft | sent | accepted | declined
      lines: QuoteLine[]
      total:
        type: money
        formula: SUM(lines.amount)
  Invoice:
    fields:
      number: string! unique
      customer: Customer!
      quote: Quote
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
pages:
  kunder:
    crud: Customer
    search: [name, email, phone]
  offerter:
    crud: Quote
    filters: [customer, status]
    actions: [sendQuote, acceptQuote, declineQuote]
  fakturor:
    crud: Invoice
    filters: [customer, status]
    actions: [markSent, markPaid, markOverdue]
  oversikt:
    dashboard:
      outstanding:
        sum: Invoice.total
        where:
          status: sent
      overdue:
        sum: Invoice.total
        where:
          status: overdue
      openQuotes:
        sum: Quote.total
        where:
          status: sent
      latestQuotes:
        list: Quote
        limit: 5
  team:
    users: manage
actions:
  sendQuote:
    on: Quote
    when:
      status: draft
    set:
      status: sent
    intent: Offerten har skickats till kunden.
  acceptQuote:
    on: Quote
    when:
      status: sent
    set:
      status: accepted
    intent: Kunden har godkänt offerten.
  declineQuote:
    on: Quote
    when:
      status: sent
    set:
      status: declined
    intent: Kunden har tackat nej till offerten.
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: Fakturan har skickats till kunden.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: Kunden har betalat fakturan.
  markOverdue:
    on: Invoice
    when:
      status: sent
    set:
      status: overdue
    intent: Fakturan är försenad.
timers:
  markOverdue:
    on: Invoice
    at: 1 day after dueOn
    where:
      status: sent
    run: markOverdue
