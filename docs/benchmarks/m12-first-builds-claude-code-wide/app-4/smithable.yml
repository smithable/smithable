smithable: 0.1
app:
  name: Piano Lessons
  description: A piano teacher's pupils, their weekly lesson times and the pieces each one practises.
models:
  Pupil:
    fields:
      name: string!
      lessonDay: monday | tuesday | wednesday | thursday | friday | saturday | sunday
      lessonTime: string
      lessonMinutes: int = 30
      level: beginner | intermediate | advanced
      status: active | paused | left
      email: email
      phone: phone
      notes: text
      pieces: Piece[]
  Piece:
    fields:
      pupil: Pupil!
      title: string!
      composer: string
      status: learning | polishing | done
      startedOn: date = TODAY()
      practiceNotes: text
pages:
  pupils:
    crud: Pupil
    search: [name, notes]
    filters: [lessonDay, level, status]
  pieces:
    crud: Piece
    search: [title, composer]
    filters: [pupil, status]
    actions: [startPolishing, markDone]
actions:
  startPolishing:
    on: Piece
    when:
      status: learning
    set:
      status: polishing
    intent: Mark that the pupil knows the notes and is now polishing the piece.
  markDone:
    on: Piece
    when:
      status: [learning, polishing]
    set:
      status: done
    intent: Mark a piece as finished.
