smithable: 0.1
app:
  name: Piano Lessons
  description: A piano teacher's pupils, their weekly lesson times and what each one practises.
  timezone: Europe/Stockholm
models:
  Pupil:
    fields:
      name: string!
      email: email
      phone: phone
      level: beginner | intermediate | advanced
      lessonDay: monday | tuesday | wednesday | thursday | friday | saturday | sunday
      lessonTime: string
      minutes:
        type: int!
        min: 15
        max: 120
        default: 30
      active: bool = true
      notes: text
      pieces: Piece[]
  Piece:
    fields:
      pupil: Pupil!
      title: string!
      composer: string
      status: learning | polishing | learned
      focus: text
      startedOn: date = TODAY()
pages:
  pupils:
    crud: Pupil
    search: [name, email]
    filters: [lessonDay, level, active]
  pieces:
    crud: Piece
    search: [title, composer]
    filters: [pupil, status]
    actions: [markLearned]
actions:
  markLearned:
    on: Piece
    when:
      status: [learning, polishing]
    set:
      status: learned
    intent: Mark a piece as learned.
