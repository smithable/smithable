smithable: 0.1
app:
  name: Piano Lessons
  description: Keep track of my piano pupils, their weekly lesson times and what each one practises.
  timezone: Europe/Mariehamn
models:
  Pupil:
    fields:
      name: string!
      weekday: monday | tuesday | wednesday | thursday | friday | saturday | sunday
      startTime: string
      minutes: int = 30
      level: beginner | intermediate | advanced
      email: email
      phone: phone
      notes: text
      active: bool = true
      pieces: Piece[]
  Piece:
    fields:
      title: string!
      composer: string
      pupil: Pupil!
      status: learning | polishing | done
      focus: text
      startedOn: date = TODAY()
pages:
  pupils:
    crud: Pupil
    search: [name, notes]
    filters: [weekday, level, active]
    defaultFilter:
      active: true
  practice:
    crud: Piece
    search: [title, composer]
    filters: [pupil, status]
    defaultFilter:
      status: [learning, polishing]
    actions: [startPolishing, markDone]
actions:
  startPolishing:
    on: Piece
    when:
      status: learning
    set:
      status: polishing
  markDone:
    on: Piece
    when:
      status: [learning, polishing]
    set:
      status: done
