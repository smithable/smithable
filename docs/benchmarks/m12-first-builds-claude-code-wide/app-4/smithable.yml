smithable: 0.1
app:
  name: Piano Lessons
  description: Keep track of my piano pupils, their weekly lesson times and the pieces each one practises.
  timezone: Europe/Mariehamn
models:
  Pupil:
    fields:
      name: string!
      lessonDay: monday | tuesday | wednesday | thursday | friday | saturday | sunday
      lessonTime: string
      minutes: int = 30
      level: beginner | intermediate | advanced
      email: email
      phone: phone
      notes: text
      pieces: Piece[]
  Piece:
    fields:
      pupil: Pupil!
      title: string!
      composer: string
      status: learning | polishing | learned
      startedOn: date = TODAY()
      practiceNotes: text
pages:
  pupils:
    crud: Pupil
    search: [name, notes]
    filters: [lessonDay, level]
  pieces:
    crud: Piece
    search: [title, composer]
    filters: [pupil, status]
    actions: [markLearned]
actions:
  markLearned:
    on: Piece
    when:
      status: [learning, polishing]
    set:
      status: learned
    intent: Mark a piece the pupil has learned.
navigation: [pupils, pieces]
