smithable: 0.1
app:
  name: Piano Studio
  description: A piano teacher's record of pupils, their weekly lesson times and what each one practises.
  currency: EUR
  timezone: Europe/Mariehamn
models:
  Pupil:
    fields:
      name: string!
      lessonDay: monday | tuesday | wednesday | thursday | friday | saturday | sunday
      lessonTime: string
      minutes: int = 45
      level: beginner | intermediate | advanced
      phone: phone
      email: email
      active: bool = true
      notes: text
      pieces: Piece[]
  Piece:
    fields:
      pupil: Pupil!
      title: string!
      composer: string
      status: learning | polishing | done
      startedOn: date = TODAY()
      notes: text
pages:
  pupils:
    crud: Pupil
    search: [name, notes]
    filters: [lessonDay, level, active]
    defaultFilter:
      active: true
  pieces:
    crud: Piece
    search: [title, composer]
    filters: [pupil, status]
    defaultFilter:
      status: [learning, polishing]
    actions: [markDone]
actions:
  markDone:
    on: Piece
    when:
      status: [learning, polishing]
    set:
      status: done
