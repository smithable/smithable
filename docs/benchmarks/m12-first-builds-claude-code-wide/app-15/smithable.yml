smithable: 0.1
app:
  name: Club Sightings
  description: "The birdwatching club's shared log of bird sightings: which species, where, when and who saw it."
  timezone: Europe/Helsinki
models:
  Species:
    fields:
      name: string! unique
      scientificName: string
      family: string
      notes: text
      sightings: Sighting[]
  Sighting:
    fields:
      species: Species!
      place: string!
      seenOn: date! = TODAY()
      observer: User! = ME()
      count:
        type: int!
        min: 1
        default: 1
      notes: text
      photo: picture
    namedBy: [species, seenOn]
pages:
  species:
    crud: Species
    search: [name, scientificName, family]
  sightings:
    crud: Sighting
    search: [place, notes]
    filters: [species, observer, seenOn]
  team:
    users: manage
