smithable: 0.1
app:
  name: Bird Log
  description: "The birdwatching club's shared record of bird sightings: species, place, date and who saw it."
  timezone: Europe/Mariehamn
models:
  Species:
    fields:
      name: string! unique
      scientificName: string
      family: string
      picture: picture
      notes: text
      sightings: Sighting[]
  Sighting:
    fields:
      species: Species!
      place: string!
      seenOn: date! = TODAY()
      count:
        type: int!
        min: 1
        default: 1
      observer: User! = ME()
      photo: picture
      notes: text
    ownedBy: observer
    namedBy: [species, seenOn]
pages:
  species:
    crud: Species
    search: [name, scientificName, family]
  sightings:
    crud: Sighting
    search: [place, notes]
    filters: [species, seenOn, observer]
  team:
    users: manage
