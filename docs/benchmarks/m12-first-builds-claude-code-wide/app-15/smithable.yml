smithable: 0.1
app:
  name: Birding Log
  description: "The club's shared record of bird sightings: which species, where, when and who saw it."
  timezone: Europe/Mariehamn
models:
  Species:
    fields:
      name: string! unique
      scientificName: string
      notes: text
      sightings: Sighting[]
  Sighting:
    fields:
      species: Species!
      place: string!
      seenOn: date! = TODAY()
      observer: User
      count: int = 1
      notes: text
pages:
  sightings:
    crud: Sighting
    search: [place, notes]
  species:
    crud: Species
    search: [name, scientificName]
  team:
    users: manage
