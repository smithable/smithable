smithable: 0.1
app:
  name: Club Sightings
  description: "Bird sightings logged by the members of our birdwatching club: species, place, date and who saw it."
models:
  Sighting:
    fields:
      species: string!
      place: string!
      seenOn: date! = TODAY()
      observer: User
      count: int
      notes: text
    ownedBy: observer
pages:
  sightings:
    crud: Sighting
    search: [species, place]
  team:
    users: manage
