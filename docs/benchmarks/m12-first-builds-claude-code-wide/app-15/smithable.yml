smithable: 0.1
app:
  name: Club Sightings
  description: "The bird sightings of our birdwatching club: species, place, date and who saw it."
models:
  Species:
    fields:
      name: string! unique
      scientificName: string
      sightings: Sighting[]
  Sighting:
    fields:
      species: Species!
      place: string!
      seenOn: date! = TODAY()
      observer: User! = ME()
      count:
        type: int
        min: 1
        default: 1
      notes: text
    ownedBy: observer
pages:
  species:
    crud: Species
    search: [name, scientificName]
  sightings:
    crud: Sighting
    search: [place, notes]
    filters: [species, observer, seenOn]
  team:
    users: manage
