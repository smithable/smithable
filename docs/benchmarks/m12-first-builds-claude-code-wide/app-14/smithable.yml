smithable: 0.1
app:
  name: Our Wedding
  description: The guest list and seating plan for our wedding, with who has answered and their meal choices.
models:
  Table:
    fields:
      name: string!
      seats:
        type: int!
        min: 1
        max: 30
        default: 8
      notes: text
      guests: Guest[]
  Guest:
    fields:
      name: string!
      household: string
      email: email
      phone: phone
      rsvp: waiting | attending | declined
      meal: undecided | meat | fish | vegetarian | vegan | kids
      dietaryNotes: text
      table: Table
pages:
  guests:
    crud: Guest
    search: [name, household, email]
    filters: [rsvp, meal, table]
    actions: [markAttending, markDeclined]
  tables:
    crud: Table
  team:
    users: manage
actions:
  markAttending:
    on: Guest
    when:
      rsvp: [waiting, declined]
    set:
      rsvp: attending
      meal:
    intent: Record that the guest is coming, with their meal choice.
  markDeclined:
    on: Guest
    when:
      rsvp: [waiting, attending]
    set:
      rsvp: declined
    intent: Record that the guest cannot come.
