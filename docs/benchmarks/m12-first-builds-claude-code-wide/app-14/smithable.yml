smithable: 0.1
app:
  name: Wedding Guests
  description: The guest list and seating plan for our wedding, with who has answered and their meal choices.
  timezone: Europe/Mariehamn
models:
  Table:
    fields:
      name: string!
      seats: int! = 8
      notes: text
      guests: Guest[]
  Guest:
    fields:
      name: string!
      group: family | friends | colleagues | other
      email: email
      phone: phone
      rsvp: waiting | attending | declined
      meal: undecided | meat | fish | vegetarian | vegan | children
      dietaryNotes: text
      table: Table
      notes: text
pages:
  guests:
    crud: Guest
    search: [name, email, phone]
    filters: [rsvp, meal, group, table]
    actions: [attending, declined]
  tables:
    crud: Table
  overview:
    dashboard:
      attending:
        count: Guest
        where:
          rsvp: attending
      waiting:
        count: Guest
        where:
          rsvp: waiting
      declined:
        count: Guest
        where:
          rsvp: declined
      vegetarianMeals:
        count: Guest
        where:
          rsvp: attending
          meal: [vegetarian, vegan]
  team:
    users: manage
actions:
  attending:
    on: Guest
    when:
      rsvp: [waiting, declined]
    set:
      rsvp: attending
      meal:
    intent: Record that the guest is coming and their meal choice.
  declined:
    on: Guest
    when:
      rsvp: [waiting, attending]
    set:
      rsvp: declined
    intent: Record that the guest cannot come.
