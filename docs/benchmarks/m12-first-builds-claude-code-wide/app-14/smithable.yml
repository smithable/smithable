smithable: 0.1
app:
  name: Our Wedding
  description: The guest list and seating plan for our wedding, with who has answered and what each guest will eat.
  timezone: Europe/Helsinki
models:
  Table:
    fields:
      name: string!
      seats: int! = 8
      note: text
      guests: Guest[]
  Guest:
    fields:
      name: string!
      party: string
      email: email
      phone: phone
      side: both | bride | groom
      answer: waiting | attending | declined
      meal: undecided | meat | fish | vegetarian | vegan | child
      dietaryNotes: text
      table: Table
      note: text
pages:
  guests:
    crud: Guest
    search: [name, party, email]
    filters: [answer, meal, table, side]
    actions: [markAttending, markDeclined]
  tables:
    crud: Table
  overview:
    dashboard:
      answers:
        count: Guest
        by: answer
      meals:
        count: Guest
        where:
          answer: attending
        by: meal
  team:
    users: manage
actions:
  markAttending:
    on: Guest
    when:
      answer: [waiting, declined]
    set:
      answer: attending
      meal:
    intent: Record that the guest is coming and which meal they chose.
  markDeclined:
    on: Guest
    when:
      answer: [waiting, attending]
    set:
      answer: declined
    intent: Record that the guest cannot come.
