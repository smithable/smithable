smithable: 0.1
app:
  name: Car Log
  description: A log of my car's fuel, service visits and costs.
  currency: EUR
models:
  FuelUp:
    fields:
      date: date! = TODAY()
      odometer: int!
      liters: decimal!
      total: money!
      pricePerLiter:
        type: money
        formula: total / liters
      fullTank: bool = true
      station: string
      note: text
  ServiceVisit:
    fields:
      date: date! = TODAY()
      kind: regular | repair | tires | inspection | other
      workshop: string
      odometer: int
      work: text
      cost: money
      receipt: file
  Expense:
    fields:
      date: date! = TODAY()
      category: insurance | tax | parking | tolls | washing | other
      amount: money!
      note: string
pages:
  fuel:
    crud: FuelUp
    filters: [date]
  services:
    crud: ServiceVisit
    filters: [kind, date]
    search: [workshop, work]
  expenses:
    crud: Expense
    filters: [category, date]
  overview:
    dashboard:
      fuelCosts:
        sum: FuelUp.total
        by: date
      serviceCosts:
        sum: ServiceVisit.cost
        by: date
      otherCosts:
        sum: Expense.amount
        by: date
      latestFuel:
        list: FuelUp
        limit: 5
