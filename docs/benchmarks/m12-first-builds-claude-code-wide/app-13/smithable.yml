smithable: 0.1
app:
  name: Car Log
  description: A log of my car's fuel fill-ups, service visits and other costs.
  currency: EUR
models:
  FuelFill:
    fields:
      date: date! = TODAY()
      odometer: int
      liters: decimal!
      pricePerLiter: money!
      total:
        type: money
        formula: liters * pricePerLiter
      fullTank: bool = true
      station: string
      notes: text
  ServiceVisit:
    fields:
      date: date! = TODAY()
      odometer: int
      kind: maintenance | repair | inspection | tires | other
      workshop: string
      work: text
      cost: money
  Cost:
    fields:
      date: date! = TODAY()
      category: insurance | tax | parking | tolls | washing | parts | other
      description: string
      amount: money!
pages:
  fuel:
    crud: FuelFill
    filters: [date]
  services:
    crud: ServiceVisit
    filters: [kind, date]
  costs:
    crud: Cost
    filters: [category, date]
  overview:
    dashboard:
      fuelSpend:
        sum: FuelFill.total
        by: date
      serviceSpend:
        sum: ServiceVisit.cost
        by: date
      otherCosts:
        sum: Cost.amount
        by: date
      latestServices:
        list: ServiceVisit
        limit: 5
navigation: [fuel, services, costs, overview]
