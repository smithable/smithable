smithable: 0.1
app:
  name: Car Log
  description: A personal log of a car's fuel fill-ups, service visits and other running costs.
  currency: EUR
  timezone: Europe/Stockholm
models:
  FuelFill:
    fields:
      filledOn: date! = TODAY()
      station: string
      odometer: int
      liters: decimal!
      total: money!
      fullTank: bool = true
      note: text
    namedBy: [filledOn, station]
  ServiceVisit:
    fields:
      visitedOn: date! = TODAY()
      workshop: string!
      kind: service | repair | inspection | tires | other
      odometer: int
      work: text
      cost: money!
      receipt: file
    namedBy: [visitedOn, workshop]
  Expense:
    fields:
      paidOn: date! = TODAY()
      description: string!
      category: insurance | tax | parking | toll | washing | accessories | other
      amount: money!
      receipt: file
pages:
  fuel:
    crud: FuelFill
    filters: [filledOn]
  services:
    crud: ServiceVisit
    filters: [kind, visitedOn]
    search: [workshop, work]
  costs:
    crud: Expense
    filters: [category, paidOn]
    search: [description]
  overview:
    dashboard:
      fuelSpent:
        sum: FuelFill.total
        by: filledOn
        period: month
      serviceSpent:
        sum: ServiceVisit.cost
      otherSpent:
        sum: Expense.amount
        by: category
      recentServices:
        list: ServiceVisit
        limit: 5
    period:
      FuelFill: filledOn
      ServiceVisit: visitedOn
      Expense: paidOn
navigation: [fuel, services, costs, overview]
