smithable: 0.1
app:
  name: Car Log
  description: A log of my car's fuel, service visits and costs.
models:
  FuelEntry:
    fields:
      date: date! = TODAY()
      odometer: int
      liters: decimal!
      cost: money!
      pricePerLiter:
        type: money
        formula: cost / liters
      fullTank: bool = true
      station: string
      note: text
  ServiceVisit:
    fields:
      date: date! = TODAY()
      odometer: int
      workshop: string
      kind: regular | repair | tires | inspection | other
      work: text
      cost: money
      receipt: file
      nextServiceDue: date
  Expense:
    fields:
      date: date! = TODAY()
      category: insurance | tax | parking | toll | washing | accessories | other
      amount: money!
      note: text
      receipt: file
pages:
  fuel:
    crud: FuelEntry
    filters: [date]
  services:
    crud: ServiceVisit
    filters: [kind, date]
    search: [workshop, work]
  expenses:
    crud: Expense
    filters: [category, date]
  overview:
    dashboard:
      fuelCosts:
        sum: FuelEntry.cost
        by: date
      serviceCosts:
        sum: ServiceVisit.cost
        by: date
      otherCosts:
        sum: Expense.amount
        by: date
      latestFillUps:
        list: FuelEntry
        limit: 5
navigation: [fuel, services, expenses, overview]
