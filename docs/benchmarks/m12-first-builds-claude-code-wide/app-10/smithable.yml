smithable: 0.1
app:
  name: Museum Collection
  description: Our local museum's collection online, where visitors browse the objects and their stories.
  timezone: Europe/Mariehamn
models:
  Item:
    fields:
      name: string!
      accessionNumber: string unique
      summary: text
      story: markdown
      pictures: pictures
      category: history | art | archaeology | naturalHistory | textiles | tools | other
      period: string
      origin: string
      material: string
      onDisplay: bool
      addedOn: date! = TODAY()
pages:
  home:
    route: /
    landing:
      hero:
      footer:
      items:
        records: Item
        where:
          onDisplay: true
  items:
    crud: Item
    search: [name, summary, period, origin, material]
    filters: [category, onDisplay]
  privacy:
    route: /privacy
    legal: privacy
