smithable: 0.1
app:
  name: Museum Collection
  description: Our local museum's collection online, where visitors browse the objects and the stories behind them.
  timezone: Europe/Mariehamn
pages:
  home:
    route: /
    landing:
      hero:
      footer:
      items:
        records: Item
        where:
          onDisplay: true
  privacy:
    route: /privacy
    legal: privacy
  items:
    crud: Item
    search: [name, summary, story, origin]
    filters: [category, onDisplay]
models:
  Item:
    fields:
      name: string!
      summary: text
      story: text
      category: everydayLife | toolsAndCrafts | art | maritime | documentsAndPhotographs | other
      dateMade: string
      origin: string
      onDisplay: bool
      addedOn: date! = TODAY()
