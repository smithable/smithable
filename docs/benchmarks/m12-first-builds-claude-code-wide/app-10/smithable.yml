smithable: 0.1
app:
  name: Museum Collection
  description: Our local museum's collection online, so visitors can browse the objects and their stories.
  timezone: Europe/Mariehamn
models:
  Item:
    fields:
      name: string!
      picture: picture
      pictures: pictures
      summary: text
      story: markdown
      category: tools | textiles | furniture | art | photographs | documents | other
      period: string
      maker: string
      origin: string
      onDisplay: bool
      addedOn: date! = TODAY()
pages:
  items:
    crud: Item
    search: [name, summary, maker, origin, period]
    filters: [category, onDisplay]
  home:
    route: /
    landing:
      hero:
      onDisplay:
        records: Item
        where:
          onDisplay: true
      footer:
  privacy:
    route: /privacy
    legal: privacy
