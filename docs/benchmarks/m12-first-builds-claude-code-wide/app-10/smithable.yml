smithable: 0.1
app:
  name: Museum Collection
  description: Our local museum's collection online, where visitors browse the objects and the stories behind them.
  timezone: Europe/Mariehamn
models:
  Category:
    fields:
      name: string!
      description: text
      items: Item[]
  Item:
    fields:
      name: string!
      pictures: pictures
      summary: text
      story: markdown
      category: Category
      period: string
      maker: string
      material: string
      origin: string
      accessionNumber: string unique
      onDisplay: bool
      addedOn: date! = TODAY()
pages:
  objects:
    crud: Item
    search: [name, summary, maker, origin, accessionNumber]
    filters: [category, onDisplay]
    sortable: [name, period, addedOn]
  categories:
    crud: Category
  home:
    route: /
    landing:
      hero:
      highlights:
        records: Item
        where:
          onDisplay: true
      themes:
        records: Category
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
navigation: [objects, categories, team]
