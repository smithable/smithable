smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  member:
    description: Looks at the collection; only administrators add to it.
    pages: all
    create: all
assistant:
  for: signed-in
public:
  pages: [home, items, privacy]
  read: [Item]
defaultRole: member
admins: [johan@smithable.ai]
