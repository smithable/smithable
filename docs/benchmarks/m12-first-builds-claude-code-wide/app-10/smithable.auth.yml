smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  curator:
    description: Catalogues the objects and writes their stories.
    pages: all
    create: [Item, Category]
    write: [Item, Category]
    delete: [Item, Category]
  member:
    description: Looks at the collection.
    pages: [home, objects, categories]
assistant:
  for: signed-in
public:
  pages: [home, objects, categories, privacy]
  read: [Item, Category]
defaultRole: member
admins: [johan@smithable.ai]
