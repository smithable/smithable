smithable: 0.1
app:
  name: Joogavaraus
  description: Joogastudion tuntien aikataulu, ohjaajat ja varaukset verkossa.
  currency: EUR
  timezone: Europe/Helsinki
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: allLevels | beginner | advanced
      durationMinutes: int! = 60
  Instructor:
    fields:
      name: string!
      bio: text
      portrait: picture
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
  Booking:
    fields:
      session: Session! unique
    capacity:
      per: session
      max: session.capacity
pages:
  tunnit:
    crud: Session
  tuntityypit:
    crud: ClassType
  ohjaajat:
    crud: Instructor
  omat-varaukset:
    crud: Booking
  aikataulu:
    calendar:
      model: Session
      starts: startsAt
  home:
    route: /
    landing:
      hero:
      footer:
      classes:
        records: ClassType
      instructors:
        records: Instructor
      callToAction:
        button: aikataulu
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
