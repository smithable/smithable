smithable: 0.1
app:
  name: Joogastudion varaukset
  description: Joogastudion tunnit, ohjaajat ja varaukset verkossa.
  currency: EUR
  timezone: Europe/Helsinki
  clock: 24h
  date: day-month
  week: monday
  numbers: comma
models:
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      sessions: Session[]
  Session:
    fields:
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
      classType: ClassType!
    namedBy: [classType, startsAt]
  Booking:
    fields:
      session: Session! unique
      attendee: User
    namedBy: session
    ownedBy: attendee
    capacity:
      per: session
      max: session.capacity
      closes: session.startsAt
      cancelUntil: session.startsAt
  ClassType:
    fields:
      name: string!
      summary: text
      level: allLevels | beginner | advanced
      durationMinutes: int! = 60
      sessions: Session[]
pages:
  lukujarjestys:
    calendar:
      model: Session
      starts: startsAt
  omat-varaukset:
    crud: Booking
  tunnit:
    crud: Session
    sortable: [startsAt, capacity]
    filters: [classType, instructor, startsAt]
    defaultFilter:
      startsAt: upcoming
  varaukset:
    crud: Booking
    filters: [session]
  ohjaajat:
    crud: Instructor
  home:
    route: /
    landing:
      hero:
        button: lukujarjestys
      features:
      classes:
        records: ClassType
      footer:
  privacy:
    route: /privacy
    legal: privacy
  tuntityypit:
    crud: ClassType
    filters: [level]
