smithable: 0.1
app:
  name: Joogastudion varaukset
  description: Joogastudion tunnit, ohjaajat ja varaukset verkossa.
  currency: EUR
  timezone: Europe/Helsinki
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: allLevels | beginner | advanced
      durationMinutes: int! = 60
      sessions: Session[]
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      sessions: Session[]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
  Booking:
    fields:
      session: Session! unique
    capacity:
      per: session
      max: session.capacity
pages:
  tunnit:
    crud: Session
  tuntityypit:
    crud: ClassType
    filters: [level]
  ohjaajat:
    crud: Instructor
  omat-varaukset:
    crud: Booking
  lukujarjestys:
    calendar: Session
  etusivu:
    route: /
    landing:
      hero:
        shortcuts: [lukujarjestys, ohjaajat]
      footer:
      classes:
        records: ClassType
      callToAction:
        button: lukujarjestys
  tietosuoja:
    route: /tietosuoja
    legal: privacy
  hallinta:
    data: all
