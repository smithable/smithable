smithable: 0.1
app:
  name: Pipeline
  description: "A sales pipeline for a six-person web agency: leads, deals and who follows up when."
  currency: EUR
  timezone: Europe/Berlin
models:
  Lead:
    fields:
      name: string!
      company: string
      email: email
      phone: phone
      website: url
      source: referral | website | event | outbound | other
      status: new | contacted | qualified | lost
      assignee: User
      notes: text
      deals: Deal[]
      followUps: FollowUp[]
    ownedBy: assignee
    trash: true
  Deal:
    fields:
      title: string!
      lead: Lead!
      stage: discovery | proposal | negotiation | won | lost
      value:
        type: money
        min: 0
      expectedClose: date
      closedOn:
        type: date
        by: app
      assignee: User
      notes: text
    ownedBy: assignee
    trash: true
  FollowUp:
    fields:
      lead: Lead!
      dueOn: date! = TODAY()
      assignee: User
      kind: call | email | meeting | other
      note: text
      done: bool
    ownedBy: assignee
    trash: true
pages:
  start:
    dashboard:
      followUpsDue:
        list: FollowUp
        where:
          done: false
        limit: 10
      openDeals:
        count: Deal
        where:
          stage: [discovery, proposal, negotiation]
      pipelineValue:
        sum: Deal.value
        where:
          stage: [discovery, proposal, negotiation]
      dealsByStage:
        count: Deal
        by: stage
  leads:
    crud: Lead
    search: [name, company, email]
    filters: [status, source, assignee]
    sortable: [name, company, createdAt]
  deals:
    crud: Deal
    search: [title]
    filters: [stage, assignee, expectedClose]
    sortable: [expectedClose, value, title]
    actions: [winDeal, loseDeal]
  followUps:
    crud: FollowUp
    search: [note]
    filters: [done, assignee, dueOn, kind]
    defaultFilter:
      done: false
    sortable: [dueOn]
    actions: [markDone]
  team:
    users: manage
actions:
  winDeal:
    on: Deal
    when:
      stage: [discovery, proposal, negotiation]
    set:
      stage: won
      closedOn: TODAY()
  loseDeal:
    on: Deal
    when:
      stage: [discovery, proposal, negotiation]
    set:
      stage: lost
      closedOn: TODAY()
  markDone:
    on: FollowUp
    when:
      done: false
    set:
      done: true
navigation: [start, leads, deals, followUps, team]
