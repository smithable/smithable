smithable: 0.1
app:
  name: Agency Pipeline
  description: "A sales pipeline for a small web agency: leads, deals and who follows up when."
  currency: EUR
models:
  Lead:
    fields:
      company: string!
      contactName: string
      email: email
      phone: phone
      website: url
      source: referral | website | event | outreach | other
      status: new | contacted | qualified | disqualified
      notes: text
      accountManager: User
      deals: Deal[]
      followUps: FollowUp[]
    ownedBy: accountManager
    trash: true
  Deal:
    fields:
      title: string!
      lead: Lead!
      stage: proposal | negotiation | won | lost
      value: money
      expectedClose: date
      notes: text
      accountManager: User
    ownedBy: accountManager
    trash: true
  FollowUp:
    fields:
      lead: Lead!
      dueOn: date!
      assignee: User!
      note: string!
      status: open | done
    ownedBy: assignee
pages:
  leads:
    crud: Lead
    search: [company, contactName, email]
  deals:
    crud: Deal
    search: [title]
    actions: [markWon, markLost]
  follow-ups:
    crud: FollowUp
    actions: [markDone]
  schedule:
    calendar: FollowUp
  team:
    users: manage
actions:
  markWon:
    on: Deal
    when:
      stage: [proposal, negotiation]
    set:
      stage: won
    intent: Mark a deal as won.
  markLost:
    on: Deal
    when:
      stage: [proposal, negotiation]
    set:
      stage: lost
    intent: Mark a deal as lost.
  markDone:
    on: FollowUp
    when:
      status: open
    set:
      status: done
    intent: Mark a follow-up as done.
