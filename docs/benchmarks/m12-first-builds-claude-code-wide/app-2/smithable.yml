smithable: 0.1
app:
  name: Agency Pipeline
  description: "A sales pipeline for our web agency: leads, deals and who follows up when."
  currency: EUR
models:
  Lead:
    fields:
      name: string!
      company: string
      email: email
      phone: phone
      source: referral | website | event | outreach | other
      status: new | contacted | qualified | lost
      assignedTo: User
      nextFollowUp: date
      notes: text
      deals: Deal[]
    ownedBy: assignedTo
    trash: true
  Deal:
    fields:
      title: string!
      lead: Lead!
      stage: discovery | proposal | negotiation | won | lost
      value:
        type: money
        min: 0
      expectedClose: date
      assignedTo: User
      nextFollowUp: date
      followUpNote: string
      notes: text
    ownedBy: assignedTo
    trash: true
pages:
  deals:
    crud: Deal
    search: [title, lead]
    filters: [stage, assignedTo, nextFollowUp, expectedClose]
    actions: [markWon, markLost]
  leads:
    crud: Lead
    search: [name, company, email]
    filters: [status, source, assignedTo, nextFollowUp]
  followUps:
    calendar:
      model: Deal
      starts: nextFollowUp
  team:
    users: manage
actions:
  markWon:
    on: Deal
    when:
      stage: [discovery, proposal, negotiation]
    set:
      stage: won
    intent: Mark the deal as won.
  markLost:
    on: Deal
    when:
      stage: [discovery, proposal, negotiation]
    set:
      stage: lost
    intent: Mark the deal as lost.
navigation: [deals, leads, followUps, team]
