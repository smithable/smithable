smithable: 0.1
app:
  name: Agency Pipeline
  description: "A sales pipeline for our web agency: leads, deals and who follows up when."
pages:
  team:
    users: manage
  deals:
    crud: Deal
    search: [title]
    filters: [stage, accountManager, expectedClose]
    actions: [markWon, markLost]
  leads:
    crud: Lead
    search: [company, contactName, email]
    filters: [status, source, accountManager]
  followUps:
    route: /follow-ups
    crud: FollowUp
    filters: [done, assignee, dueOn]
    defaultFilter:
      done: false
    actions: [complete, take]
models:
  Lead:
    fields:
      company: string!
      contactName: string
      email: email
      phone: phone
      website: url
      source: referral | website | event | outbound | other
      status: new | contacted | qualified | disqualified
      notes: text
      accountManager: User = ME()
      deals: Deal[]
      followUps: FollowUp[]
    ownedBy: accountManager
    trash: true
  Deal:
    fields:
      title: string!
      lead: Lead!
      stage: proposal | negotiation | won | lost
      value:
        type: money
        min: 0
      expectedClose: date
      closedOn: date
      accountManager: User = ME()
      notes: text
    ownedBy: accountManager
    trash: true
  FollowUp:
    fields:
      subject: string!
      lead: Lead!
      dueOn: date!
      assignee: User = ME()
      done: bool = false
      note: text
    ownedBy: assignee
actions:
  markWon:
    on: Deal
    when:
      stage: [proposal, negotiation]
    set:
      stage: won
      closedOn: TODAY()
  markLost:
    on: Deal
    when:
      stage: [proposal, negotiation]
    set:
      stage: lost
      closedOn: TODAY()
  complete:
    on: FollowUp
    when:
      done: false
    set:
      done: true
  take:
    on: FollowUp
    when:
      done: false
    set:
      assignee: ME()
navigation: [deals, leads, followUps, team]
