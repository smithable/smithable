smithable: 0.1
app:
  name: Agency Pipeline
  description: "A sales pipeline for a small web agency: leads, deals and who follows up when."
  currency: EUR
models:
  Lead:
    fields:
      company: string!
      contactName: string
      email: email
      phone: phone
      website: url
      source: referral | website | outreach | event | other
      status: new | contacted | qualified | disqualified
      notes: text
      accountManager: User
      deals: Deal[]
      followUps: FollowUp[]
    ownedBy: accountManager
    trash: true
  Deal:
    fields:
      title: string!
      lead: Lead!
      stage: proposal | negotiation | won | lost
      value:
        type: money
        min: 0
      expectedClose: date
      closedOn:
        type: date
        by: app
      notes: text
      accountManager: User
    ownedBy: accountManager
    trash: true
  FollowUp:
    fields:
      lead: Lead!
      deal: Deal
      due: date!
      assignee: User!
      note: string
      status: open | done
      doneOn:
        type: date
        by: app
    ownedBy: assignee
pages:
  deals:
    crud: Deal
    search: [title]
    filters: [stage, lead, accountManager]
    actions: [markWon, markLost]
  leads:
    crud: Lead
    search: [company, contactName, email]
    filters: [status, source, accountManager]
  followUps:
    crud: FollowUp
    filters: [status, assignee, due]
    actions: [markDone]
  schedule:
    calendar:
      model: FollowUp
      starts: due
  team:
    users: manage
actions:
  markWon:
    on: Deal
    when:
      stage: [proposal, negotiation]
    set:
      stage: won
      closedOn: TODAY()
  markLost:
    on: Deal
    when:
      stage: [proposal, negotiation]
    set:
      stage: lost
      closedOn: TODAY()
  markDone:
    on: FollowUp
    when:
      status: open
    set:
      status: done
      doneOn: TODAY()
