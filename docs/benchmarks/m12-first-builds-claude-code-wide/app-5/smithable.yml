smithable: 0.1
app:
  name: Shutter Ledger
  description: "Invoices for photography work: clients, shoots and what is still unpaid."
  currency: EUR
  timezone: Europe/Helsinki
models:
  Client:
    fields:
      name: string!
      email: email!
      phone: phone
      address: text
      vatNumber: string
      shoots: Shoot[]
      invoices: Invoice[]
  Shoot:
    fields:
      title: string!
      client: Client!
      shotOn: date!
      location: string
      kind: portrait | wedding | event | product | commercial | other
      status: planned | shot | delivered
      fee: money
      notes: text
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      invoice: Invoice!
  Invoice:
    fields:
      number: string! unique
      client: Client!
      shoot: Shoot
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
pages:
  shoots:
    crud: Shoot
    search: [title, location]
    filters: [client, kind, status, shotOn]
  clients:
    crud: Client
    search: [name, email]
  invoices:
    crud: Invoice
    search: [number]
    filters: [client, status]
    sortable: [issuedOn, dueOn, number]
    actions: [markSent, markPaid, markOverdue]
  overview:
    dashboard:
      unpaid:
        sum: Invoice.total
        where:
          status: [sent, overdue]
      overdue:
        sum: Invoice.total
        where:
          status: overdue
      paid:
        sum: Invoice.total
        where:
          status: paid
      invoiced:
        sum: Invoice.total
        by: issuedOn
      unpaidInvoices:
        list: Invoice
        where:
          status: [sent, overdue]
        limit: 5
    period: issuedOn
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice.
  markOverdue:
    on: Invoice
    when:
      status: sent
    set:
      status: overdue
    intent: The invoice is late.
timers:
  markOverdue:
    on: Invoice
    at: 1 day after dueOn
    where:
      status: sent
    run: markOverdue
navigation: [overview, invoices, shoots, clients]
