smithable: 0.1
app:
  name: Shutter Ledger
  description: "Invoices for photography work: clients, shoots and what is still unpaid."
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      phone: phone
      address: text
      vatNumber: string
      shoots: Shoot[]
      invoices: Invoice[]
  Shoot:
    fields:
      title: string!
      client: Client!
      date: date!
      location: string
      kind: portrait | wedding | event | commercial | product | other
      status: booked | done | canceled
      fee: money
      notes: text
      invoices: Invoice[]
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      invoice: Invoice!
  Invoice:
    fields:
      number: string! unique
      client: Client!
      shoot: Shoot
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
pages:
  overview:
    dashboard:
      upcomingShoots:
        list: Shoot
        where:
          status: booked
        limit: 5
      outstanding:
        sum: Invoice.total
        where:
          status: sent
      overdue:
        sum: Invoice.total
        where:
          status: overdue
      paid:
        sum: Invoice.total
        where:
          status: paid
      invoiced:
        sum: Invoice.total
        by: issuedOn
      unpaid:
        list: Invoice
        where:
          status: [sent, overdue]
        limit: 10
  shoots:
    crud: Shoot
    filters: [client, status, kind, date]
    actions: [markDone]
  clients:
    crud: Client
  invoice-lines:
    crud: InvoiceLine
  invoices:
    crud: Invoice
    filters: [client, status]
    actions: [markSent, markPaid]
actions:
  markDone:
    on: Shoot
    when:
      status: booked
    set:
      status: done
    intent: The shoot has taken place.
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice.
