smithable: 0.1
app:
  name: Shutter Ledger
  description: "Invoicing for a photographer: clients, shoots and what is still unpaid."
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      phone: phone
      address: text
      vatNumber: string
      shoots: Shoot[]
      invoices: Invoice[]
  Shoot:
    fields:
      title: string!
      client: Client!
      date: date!
      location: string
      kind: portrait | wedding | event | commercial | product | other
      status: planned | done | invoiced | canceled
      fee: money
      notes: text
  Invoice:
    fields:
      number: string! unique
      client: Client!
      shoot: Shoot
      issuedOn: date! = TODAY()
      dueOn: date! = DATEADD(issuedOn, 30, "day")
      status: draft | sent | paid | overdue
      paidOn: date
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
  InvoiceLine:
    fields:
      invoice: Invoice!
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
pages:
  overview:
    dashboard:
      latest:
        list: Invoice
        limit: 5
  invoices:
    crud: Invoice
    filters: [client, status]
    actions: [markSent, markPaid]
  shoots:
    crud: Shoot
    filters: [client, kind, status, date]
    actions: [markDone]
  clients:
    crud: Client
    search: [name, email]
  invoice-lines:
    crud: InvoiceLine
  calendar:
    calendar:
      model: Shoot
      starts: date
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
      paidOn: TODAY()
    intent: The client paid the invoice.
  markDone:
    on: Shoot
    when:
      status: planned
    set:
      status: done
    intent: The shoot took place.
