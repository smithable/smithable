smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  assistant:
    description: "The AI assistant's key: reads everything, adds and changes tasks and notes, never deletes."
    create: [Task, Note]
    write: [Task, Note]
assistant:
  for: signed-in
defaultRole: assistant
api:
  models: all
  actions: all
  assistants: true
admins: [johan@smithable.ai]
