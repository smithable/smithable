smithable: 0.1
app:
  name: Korjaamo
  description: Pienen autokorjaamon asiakkaat, autot, huoltotyöt ja laskut yhdessä paikassa.
  currency: EUR
  timezone: Europe/Helsinki
models:
  Customer:
    fields:
      name: string!
      email: email unique
      phone: phone
      address: string
      notes: text
      cars: Car[]
      invoices: Invoice[]
    trash: true
  Car:
    fields:
      registration: string! unique
      make: string!
      carModel: string
      year: int
      mileage: int
      customer: Customer!
      jobs: ServiceJob[]
  ServiceJob:
    fields:
      car: Car!
      description: text!
      status: booked | inProgress | done | canceled
      date: date!
      mechanic: User
      hours:
        type: decimal
        min: 0
      laborCost:
        type: money
        min: 0
      partsCost:
        type: money
        min: 0
      total:
        type: money
        formula: laborCost + partsCost
  Invoice:
    fields:
      number: string! unique
      customer: Customer!
      job: ServiceJob
      status: draft | sent | paid
      amount: money!
      issuedOn: date = TODAY()
      dueDate: date
      paidOn: date
    trash: true
pages:
  huoltotyot:
    crud: ServiceJob
    filters: [status, mechanic, date]
    actions: [startJob, completeJob]
  asiakkaat:
    crud: Customer
    search: [name, email, phone]
  autot:
    crud: Car
    search: [registration, make, carModel]
  laskut:
    crud: Invoice
    search: [number]
    filters: [status, customer, dueDate]
    actions: [sendInvoice, markPaid]
  tiimi:
    users: manage
actions:
  startJob:
    on: ServiceJob
    when:
      status: booked
    set:
      status: inProgress
      mechanic: ME()
  completeJob:
    on: ServiceJob
    when:
      status: inProgress
    set:
      status: done
  sendInvoice:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
  markPaid:
    on: Invoice
    when:
      status: sent
    set:
      status: paid
      paidOn: TODAY()
