smithable: 0.1
app:
  name: Korjaamo
  description: Pienen autokorjaamon asiakkaat, autot, huoltotyöt ja laskut yhdessä paikassa.
  currency: EUR
  timezone: Europe/Helsinki
models:
  Customer:
    fields:
      name: string!
      email: email
      phone: phone
      address: string
      notes: text
      cars: Car[]
      invoices: Invoice[]
    trash: true
  Car:
    fields:
      registration: string! unique
      make: string!
      carModel: string
      year: int
      vin: string
      mileage: int
      customer: Customer!
      jobs: Job[]
  Job:
    fields:
      title: string!
      car: Car!
      status: booked | inProgress | done
      date: date = TODAY()
      description: text
      mechanic: User
      hours: decimal
      laborCost: money
      partsCost: money
      total:
        type: money
        formula: laborCost + partsCost
  Invoice:
    fields:
      number: string! unique
      customer: Customer!
      job: Job
      status: draft | sent | paid
      amount: money!
      issuedOn: date = TODAY()
      dueDate: date
      paidOn:
        type: date
        by: app
    trash: true
pages:
  tyot:
    crud: Job
    search: [title]
    filters: [status, car, mechanic, date]
    actions: [startJob, completeJob]
  asiakkaat:
    crud: Customer
    search: [name, email, phone]
  autot:
    crud: Car
    search: [registration, make, carModel]
    filters: [customer]
  laskut:
    crud: Invoice
    search: [number]
    filters: [status, customer, dueDate]
    actions: [sendInvoice, markPaid]
  tiimi:
    users: manage
actions:
  startJob:
    on: Job
    when:
      status: booked
    set:
      status: inProgress
      mechanic: ME()
    intent: Aloita työ ja ota se itsellesi.
  completeJob:
    on: Job
    when:
      status: [booked, inProgress]
    set:
      status: done
    intent: Merkitse työ valmiiksi.
  sendInvoice:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: Merkitse lasku lähetetyksi.
  markPaid:
    on: Invoice
    when:
      status: sent
    set:
      status: paid
      paidOn: TODAY()
    intent: Merkitse lasku maksetuksi.
