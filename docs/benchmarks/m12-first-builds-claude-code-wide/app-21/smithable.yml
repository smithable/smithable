smithable: 0.1
app:
  name: Korjaamo
  description: Pienen autokorjaamon asiakkaat, autot, huoltotyöt ja laskut yhdessä paikassa.
  currency: EUR
  timezone: Europe/Helsinki
models:
  Customer:
    fields:
      name: string!
      email: email
      phone: phone
      notes: text
      cars: Car[]
      invoices: Invoice[]
    trash: true
  Car:
    fields:
      registration: string! unique
      make: string
      modelName: string
      year: int
      mileage: int
      customer: Customer!
      jobs: Job[]
    namedBy: [registration, make]
  Job:
    fields:
      car: Car!
      description: text!
      scheduledOn: date
      status: booked | inProgress | done | canceled
      mechanic: User
      laborCost: money
      partsCost: money
      total:
        type: money
        formula: laborCost + partsCost
    namedBy: [car, scheduledOn]
  Invoice:
    fields:
      number: string! unique
      customer: Customer!
      job: Job
      amount: money!
      status: draft | sent | paid
      issuedOn: date = TODAY()
      dueOn: date
      paidOn: date
    trash: true
    namedBy: number
pages:
  huoltotyot:
    crud: Job
    search: [description]
    filters: [status, mechanic, scheduledOn, car]
    actions: [startJob, completeJob, cancelJob]
  asiakkaat:
    crud: Customer
    search: [name, email, phone]
  autot:
    crud: Car
    search: [registration, make, modelName]
    filters: [customer]
  laskut:
    crud: Invoice
    search: [number]
    filters: [status, customer, dueOn]
    actions: [sendInvoice, markPaid]
  tiimi:
    users: manage
actions:
  startJob:
    on: Job
    when:
      status: booked
    set:
      status: inProgress
      mechanic: ME()
  completeJob:
    on: Job
    when:
      status: [booked, inProgress]
    set:
      status: done
  cancelJob:
    on: Job
    when:
      status: [booked, inProgress]
    set:
      status: canceled
  sendInvoice:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
      issuedOn: TODAY()
  markPaid:
    on: Invoice
    when:
      status: sent
    set:
      status: paid
      paidOn: TODAY()
