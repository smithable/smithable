smithable: 0.1
app:
  name: Korjaamo
  description: Pienen autokorjaamon asiakkaat, autot, huoltotyöt ja laskut yhdessä paikassa.
  currency: EUR
  timezone: Europe/Helsinki
  clock: 24h
  date: day-month
  week: monday
  numbers: comma
models:
  Customer:
    fields:
      name: string!
      email: email
      phone: phone
      notes: text
      cars: Car[]
      invoices: Invoice[]
    trash: true
  Car:
    fields:
      registration: string! unique
      make: string
      carModel: string
      year: int
      mileage: int
      customer: Customer!
      notes: text
      jobs: Job[]
  Job:
    fields:
      car: Car!
      description: text!
      status: booked | inProgress | done | canceled
      scheduledOn: date = TODAY()
      mechanic: User
      labourCost: money
      partsCost: money
      total:
        type: money
        formula: labourCost + partsCost
      completedOn: date
  Invoice:
    fields:
      number: string! unique
      customer: Customer!
      job: Job
      status: draft | sent | paid
      issuedOn: date = TODAY()
      dueOn: date
      amount: money!
      paidOn: date
    trash: true
pages:
  tyot:
    crud: Job
    search: [description]
    filters: [status, mechanic, scheduledOn]
    actions: [startJob, completeJob]
  asiakkaat:
    crud: Customer
    search: [name, email, phone]
  autot:
    crud: Car
    search: [registration, make, carModel]
  laskut:
    crud: Invoice
    search: [number]
    filters: [status, customer]
    actions: [sendInvoice, markPaid]
  tiimi:
    users: manage
actions:
  startJob:
    on: Job
    when:
      status: booked
    set:
      status: inProgress
      mechanic: ME()
  completeJob:
    on: Job
    when:
      status: [booked, inProgress]
    set:
      status: done
      completedOn: TODAY()
  sendInvoice:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
      issuedOn: TODAY()
  markPaid:
    on: Invoice
    when:
      status: sent
    set:
      status: paid
      paidOn: TODAY()
