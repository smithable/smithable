smithable: 0.1
app:
  name: Korjaamo
  description: Pienen autokorjaamon asiakkaat, autot, huoltotyöt ja laskut yhdessä paikassa.
  currency: EUR
  timezone: Europe/Helsinki
models:
  Customer:
    fields:
      name: string!
      email: email unique
      phone: phone
      notes: text
      cars: Car[]
  Car:
    fields:
      registration: string! unique
      make: string
      carModel: string
      year: int
      mileage: int
      customer: Customer!
      jobs: Job[]
  Job:
    fields:
      car: Car!
      description: text!
      status: booked | inProgress | done
      scheduledAt: datetime
      mechanic: User
      laborCost: money
      partsCost: money
      total:
        type: money
        formula: laborCost + partsCost
      invoices: Invoice[]
  Invoice:
    fields:
      number: string! unique
      job: Job!
      amount: money!
      status: draft | sent | paid
      dueDate: date
      paidAt: date
pages:
  huoltotyot:
    crud: Job
    actions: [startWork, completeJob]
  asiakkaat:
    crud: Customer
    search: [name, email, phone]
  autot:
    crud: Car
    search: [registration, make, carModel]
  laskut:
    crud: Invoice
    search: [number]
    filters: [status, dueDate]
    actions: [sendInvoice, markPaid]
  team:
    users: manage
actions:
  startWork:
    on: Job
    when:
      status: booked
    set:
      status: inProgress
      mechanic: ME()
    intent: Aloita huoltotyö ja ota se itsellesi.
  completeJob:
    on: Job
    when:
      status: inProgress
    set:
      status: done
    intent: Merkitse huoltotyö valmiiksi.
  sendInvoice:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: Merkitse lasku lähetetyksi.
  markPaid:
    on: Invoice
    when:
      status: sent
    set:
      status: paid
      paidAt: TODAY()
    intent: Merkitse lasku maksetuksi.
