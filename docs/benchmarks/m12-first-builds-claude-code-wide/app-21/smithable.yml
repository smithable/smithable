smithable: 0.1
app:
  name: Korjaamo
  description: Pienen autokorjaamon asiakkaat, autot, huoltotyöt ja laskut yhdessä paikassa.
  currency: EUR
  timezone: Europe/Helsinki
models:
  Customer:
    fields:
      name: string!
      email: email
      phone: phone
      notes: text
      cars: Car[]
    trash: true
  Car:
    fields:
      registration: string! unique
      make: string
      carModel: string
      year: int
      mileage: int
      customer: Customer!
      jobs: Job[]
  Job:
    fields:
      car: Car!
      description: text!
      status: booked | inProgress | done
      scheduledOn: date
      labor: money
      parts: money
      total:
        type: money
        formula: labor + parts
  Invoice:
    fields:
      number: string! unique
      customer: Customer!
      job: Job
      amount: money!
      dueDate: date
      status: unpaid | paid
      paidOn: date
pages:
  huoltotyot:
    crud: Job
    filters: [status, scheduledOn]
    actions: [startJob, completeJob]
  asiakkaat:
    crud: Customer
    search: [name, email, phone]
  autot:
    crud: Car
    search: [registration, make, carModel]
  laskut:
    crud: Invoice
    search: [number]
    filters: [status, dueDate]
    actions: [markPaid]
  kayttajat:
    users: manage
actions:
  startJob:
    on: Job
    when:
      status: booked
    set:
      status: inProgress
    intent: Aloita varattu huoltotyö.
  completeJob:
    on: Job
    when:
      status: [booked, inProgress]
    set:
      status: done
    intent: Merkitse huoltotyö valmiiksi.
  markPaid:
    on: Invoice
    when:
      status: unpaid
    set:
      status: paid
      paidOn: TODAY()
    intent: Merkitse lasku maksetuksi.
