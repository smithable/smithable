smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
roles:
  admin: all
  staff:
    description: "Korjaamon työntekijä: hoitaa asiakkaita, autoja, huoltotöitä ja laskuja."
    pages: [huoltotyot, asiakkaat, autot, laskut]
    create: all
    write: all
assistant:
  for: signed-in
defaultRole: staff
admins: [johan@smithable.ai]
