smithable: 0.1
app:
  name: Habit Tracker
  description: "A backend for a habit app: each person's habits, daily check-ins and streaks."
  timezone: Europe/Mariehamn
models:
  Habit:
    fields:
      name: string!
      description: text
      frequency: daily | weekdays | weekly
      status: active | archived
      startedOn: date! = TODAY()
      currentStreak: int = 0
      longestStreak: int = 0
      checkIns: CheckIn[]
  CheckIn:
    fields:
      habit: Habit!
      date: date! = TODAY()
      note: text
pages:
  habits:
    crud: Habit
    search: [name, description]
    filters: [status, frequency]
    sortable: [name, currentStreak, longestStreak, startedOn]
    actions: [archive, reactivate]
  check-ins:
    crud: CheckIn
    filters: [habit, date]
actions:
  archive:
    on: Habit
    when:
      status: active
    set:
      status: archived
    intent: Stop tracking a habit while keeping its history.
  reactivate:
    on: Habit
    when:
      status: archived
    set:
      status: active
    intent: Start tracking an archived habit again.
