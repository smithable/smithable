smithable: 0.1
app:
  name: Habit Tracker
  description: Keep track of your habits with daily check-ins and streaks.
  timezone: Europe/Stockholm
models:
  Habit:
    fields:
      name: string!
      description: text
      frequency: daily | weekdays | weekly
      active: bool = true
      startedOn: date! = TODAY()
      currentStreak:
        type: int
        by: app
        default: 0
      longestStreak:
        type: int
        by: app
        default: 0
      checkIns: CheckIn[]
  CheckIn:
    fields:
      habit: Habit!
      date: date! = TODAY()
      note: text
pages:
  habits:
    crud: Habit
    search: [name, description]
    filters: [frequency, active]
  checkIns:
    crud: CheckIn
    filters: [habit, date]
  calendar:
    calendar: CheckIn
