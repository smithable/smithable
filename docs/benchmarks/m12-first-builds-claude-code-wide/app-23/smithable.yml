smithable: 0.1
app:
  name: Habit Tracker
  description: Keep track of your habits with daily check-ins and streaks.
  timezone: Europe/Stockholm
models:
  Habit:
    fields:
      name: string!
      description: text
      frequency: daily | weekdays | weekly
      status: active | paused | archived
      startedOn: date! = TODAY()
      currentStreak:
        type: int
        by: app
        default: 0
      lastCheckIn:
        type: date
        by: app
      checkIns: CheckIn[]
  CheckIn:
    fields:
      habit: Habit!
      date: date! = TODAY()
      note: text
    unique: [{ fields: [habit, date], scope: owner }]
pages:
  habits:
    crud: Habit
    actions: [resetStreak, pause, resume, checkIn]
    search: [name, description]
    filters: [status, frequency]
    defaultFilter:
      status: active
  checkIns:
    crud: CheckIn
    filters: [habit, date]
actions:
  resetStreak:
    on: Habit
    set:
      currentStreak: 0
    intent: Start the habit's streak over after a missed day.
  pause:
    on: Habit
    when:
      status: active
    set:
      status: paused
  resume:
    on: Habit
    when:
      status: paused
    set:
      status: active
  checkIn:
    on: Habit
    when:
      status: active
    set:
      lastCheckIn: TODAY()
    add:
      CheckIn:
        date: TODAY()
        note:
    intent: Check in on a habit for today.
