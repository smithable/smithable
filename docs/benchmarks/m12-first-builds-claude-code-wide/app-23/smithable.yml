smithable: 0.1
app:
  name: Habit Tracker
  description: Keeps each person's habits, their daily check-ins and their streaks, for the habit app and its users.
  timezone: Europe/Stockholm
models:
  Habit:
    fields:
      name: string!
      description: text
      frequency: daily | weekdays | weekly
      targetPerDay:
        type: int!
        min: 1
        max: 100
        default: 1
      startedOn: date! = TODAY()
      status: active | paused | archived
      currentStreak:
        type: int
        by: app
        default: 0
        description: The number of consecutive days (or periods, by frequency) up to today with a check-in for this habit; filled by the app from the check-ins.
      longestStreak:
        type: int
        by: app
        default: 0
        description: The longest run of consecutive check-in days this habit has ever had; filled by the app from the check-ins.
      checkIns: CheckIn[]
  CheckIn:
    fields:
      habit: Habit!
      day: date! = TODAY()
      count:
        type: int!
        min: 1
        max: 100
        default: 1
      note: text
    unique: [{ fields: [habit, day], scope: owner }]
pages:
  habits:
    crud: Habit
    search: [name, description]
    filters: [status, frequency]
    defaultFilter:
      status: active
    actions: [pause, resume, archive]
  check-ins:
    crud: CheckIn
    filters: [habit, day]
actions:
  pause:
    on: Habit
    when:
      status: active
    set:
      status: paused
  resume:
    on: Habit
    when:
      status: [paused, archived]
    set:
      status: active
  archive:
    on: Habit
    when:
      status: [active, paused]
    set:
      status: archived
