smithable: 0.1
app:
  name: Salongen
  description: Tidsbokning på nätet för en frisörsalong, där kunderna själva bokar sin tid.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Service:
    fields:
      name: string!
      summary: text
      durationMinutes: int! = 45
      price: money
  Stylist:
    fields:
      name: string!
      bio: markdown
      portrait: picture
  Slot:
    fields:
      stylist: Stylist!
      startsAt: datetime!
      capacity: int! = 1
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
  Booking:
    fields:
      slot: Slot! unique
      service: Service!
      phone: phone
      note: text
    capacity:
      per: slot
      max: slot.capacity
  Message:
    fields:
      name: string!
      email: email!
      message: text!
pages:
  tider:
    calendar:
      model: Slot
      starts: startsAt
  mina-bokningar:
    crud: Booking
  tidsluckor:
    crud: Slot
  behandlingar:
    crud: Service
  frisorer:
    crud: Stylist
  meddelanden:
    crud: Message
  home:
    route: /
    landing:
      hero:
      footer:
      tjanster:
        records: Service
      callToAction:
        button: tider
      contact:
        form: Message
  integritet:
    route: /integritet
    legal: privacy
  admin:
    data: all
