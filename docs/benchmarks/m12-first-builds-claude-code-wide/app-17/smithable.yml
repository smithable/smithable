smithable: 0.1
app:
  name: Frisörsalongen
  description: Onlinebokning för en frisörsalong där kunderna själva bokar tid hos sin frisör.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Service:
    fields:
      name: string!
      description: text
      durationMinutes: int! = 45
      price: money
  Stylist:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      slots: Slot[]
  Slot:
    fields:
      stylist: Stylist!
      startsAt: datetime!
      capacity: int! = 1
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
  Booking:
    fields:
      slot: Slot! unique
      service: Service!
      phone: phone
      note: text
    capacity:
      per: slot
      max: slot.capacity
pages:
  hem:
    route: /
    landing:
      hero:
      behandlingar:
        records: Service
      frisorer:
        records: Stylist
      callToAction:
        button: boka
      footer:
  boka:
    calendar:
      model: Slot
      starts: startsAt
  tider:
    crud: Slot
  behandlingar:
    crud: Service
  frisorer:
    crud: Stylist
  mina-bokningar:
    crud: Booking
  integritet:
    route: /integritet
    legal: privacy
  admin:
    data: all
