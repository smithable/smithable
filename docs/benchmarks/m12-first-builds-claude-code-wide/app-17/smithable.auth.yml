smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  staff:
    description: En frisör. Sköter dagen, bekräftar och avbokar tider och lägger in sin ledighet.
    pages: [day, appointments, time-off]
    read: [Appointment, TimeOff]
    create: [Appointment, TimeOff]
    write: [Appointment, TimeOff]
    delete: [TimeOff]
    actions: [confirm, cancel]
  member:
    description: En kund som bokar tid.
    pages: [appointments]
    create: [Appointment]
assistant:
  for: signed-in
public:
  pages: [home, privacy]
  read: [Service, Barber]
defaultRole: member
admins: [johan@smithable.ai]
