smithable: 0.1
app:
  name: Club Hub
  description: A football club's public site for teams, players, matches and results.
  timezone: Europe/Helsinki
models:
  Team:
    fields:
      name: string!
      ageGroup: string
      description: text
      photo: picture
  Player:
    fields:
      name: string!
      team: Team!
      position: goalkeeper | defender | midfielder | forward
      number: int
      photo: picture
      bio: text
  Match:
    fields:
      team: Team!
      opponent: string!
      matchDate: datetime!
      venue: string
      homeAway: home | away
      homeScore: int
      awayScore: int
      status: scheduled | played | cancelled
pages:
  home:
    route: /
    landing:
      hero:
        button: teams
        secondButton: matches
      features:
      teams:
        records: Team
      upcoming:
        records: Match
        view: table
        where:
          status: scheduled
      results:
        records: Match
        view: table
        where:
          status: played
      footer:
  teams:
    crud: Team
    search: [name, ageGroup]
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
  players:
    crud: Player
    search: [name]
    filters: [team, position]
  matches:
    crud: Match
    search: [opponent, venue]
    filters: [team, status, homeAway, matchDate]
    actions: [recordResult, cancelMatch]
actions:
  recordResult:
    on: Match
    when:
      status: scheduled
    set:
      status: played
      homeScore:
      awayScore:
  cancelMatch:
    on: Match
    when:
      status: scheduled
    set:
      status: cancelled
