smithable: 0.1
app:
  name: Sales CRM
  description: Lightweight CRM for a small sales team to manage companies, contacts, deals and follow-ups.
  currency: USD
  timezone: America/New_York
models:
  Company:
    fields:
      name: string!
      email: email unique
      phone: phone
      website: url
      segment: smb | enterprise | government
      notes: text
      accountManager: User
      contacts: Contact[]
      deals: Deal[]
      followUps: FollowUp[]
    ownedBy: accountManager
    trash: true
  Contact:
    fields:
      name: string!
      email: email
      phone: phone
      company: Company!
      role: string
      notes: text
    trash: true
  Deal:
    fields:
      title: string!
      company: Company!
      contact: Contact
      status: prospecting | qualified | proposal | negotiation | won | lost
      value: money
      expectedCloseOn: date
      notes: text
    trash: true
  FollowUp:
    fields:
      company: Company!
      contact: Contact
      dueOn: date! = TODAY()
      done: bool
      note: text
    trash: true
pages:
  start:
    dashboard:
      companies:
        count: Company
      openDeals:
        count: Deal
        where:
          status: [prospecting, qualified, proposal, negotiation]
      wonDeals:
        sum: Deal.value
        where:
          status: won
      followUpsDue:
        list: FollowUp
        where:
          done: false
        limit: 10
  companies:
    crud: Company
    search: [name, email]
    filters: [segment, accountManager]
    sortable: [name, createdAt]
    actions: [mergeCompanies]
  contacts:
    crud: Contact
    search: [name, email]
    filters: [company]
    sortable: [name, createdAt]
  deals:
    crud: Deal
    search: [title]
    filters: [status, company, contact, expectedCloseOn]
    sortable: [expectedCloseOn, value, createdAt]
    defaultFilter:
      status: [prospecting, qualified, proposal, negotiation]
    actions: [wonDeal, lostDeal]
  followUps:
    crud: FollowUp
    search: [note]
    filters: [done, company, contact, dueOn]
    sortable: [dueOn, createdAt]
    defaultFilter:
      done: false
    actions: [completeFollowUp]
  team:
    users: manage
actions:
  wonDeal:
    on: Deal
    when:
      status: [prospecting, qualified, proposal, negotiation]
    set:
      status: won
    intent: Mark a deal as won.
  lostDeal:
    on: Deal
    when:
      status: [prospecting, qualified, proposal, negotiation]
    set:
      status: lost
    intent: Mark a deal as lost.
  completeFollowUp:
    on: FollowUp
    when:
      done: false
    set:
      done: true
    intent: Mark a follow-up as done.
  mergeCompanies:
    merge: Company
    intent: Merge two duplicate company records into one, moving all contacts, deals and follow-ups to the kept record.
navigation: [start, companies, contacts, deals, followUps, team]
