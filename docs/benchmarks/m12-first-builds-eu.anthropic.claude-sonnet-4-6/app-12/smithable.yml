smithable: 0.1
app:
  name: Shop Status
  description: Live status of our web shop's services, with outages and their updates.
  timezone: UTC
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
      maintenances: Maintenance[]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      summary: markdown
      updates: IncidentUpdate[]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
actions:
  identified:
    on: Incident
    when:
      status: investigating
    set:
      status: identified
    add:
      IncidentUpdate:
        at: NOW()
        status: identified
        message: The cause is found and a fix is being worked on.
    intent: The cause is found; the incident moves to identified, with an update saying so.
  monitoring:
    on: Incident
    when:
      status: [investigating, identified]
    set:
      status: monitoring
    add:
      IncidentUpdate:
        at: NOW()
        status: monitoring
        message: A fix is out. We are watching before we close this.
    intent: A fix is out; the incident is watched before it is closed, with an update saying so.
  resolve:
    on: Incident
    when:
      status: [investigating, identified, monitoring]
    set:
      status: resolved
      resolvedAt: NOW()
    add:
      IncidentUpdate:
        at: NOW()
        status: resolved
        message: This incident is resolved.
    intent: The incident is over, with an update saying so. The component's status stays what the team sets.
pages:
  incidents:
    crud: Incident
    filters: [status, component]
    search: [title]
  updates:
    crud: IncidentUpdate
  components:
    crud: Component
    search: [name]
    filters: [status]
  maintenance:
    crud: Maintenance
    filters: [component, startsAt]
  home:
    route: /
    landing:
      hero:
      services:
        records: Component
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
      recent:
        records: Incident
        where:
          status: resolved
      planned:
        records: Maintenance
      footer:
  privacy:
    route: /privacy
    legal: privacy
  overview:
    dashboard:
      open:
        count: Incident
        where:
          status: [investigating, identified, monitoring]
      perMonth:
        count: Incident
        by: detectedAt
      latest:
        list: Incident
        limit: 5
  team:
    users: manage
navigation: [overview, incidents, updates, maintenance, components, team]
incoming:
  chatCommand:
    create: Incident
    set:
      title: "{text}"
      status: investigating
      detectedAt: NOW()
    signed:
      sha256: v0:{timestamp}:{body}
      prefix: v0=
      timestamp: X-Slack-Request-Timestamp
    header: X-Slack-Signature
    body: form
    challenge: challenge
    as: staff
