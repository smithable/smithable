smithable: 0.1
app:
  name: Union Job Board
  description: A job board for local union members to browse job postings and submit applications.
  timezone: Europe/Helsinki
models:
  JobPost:
    fields:
      title: string!
      employer: string!
      location: string!
      description: text!
      category: construction | manufacturing | transportation | healthcare | education | other
      type: fullTime | partTime | temporary | apprenticeship
      wage: money
      closingDate: date
      status: open | closed
  Application:
    fields:
      jobPost: JobPost!
      fullName: string!
      email: email!
      phone: phone
      coverLetter: text!
      resume: file
      status: submitted | reviewing | shortlisted | rejected | hired
pages:
  jobs:
    route: /
    crud: JobPost
    search: [title, employer, location, description]
    filters: [category, type, status]
    defaultFilter:
      status: open
    sortable: [closingDate, createdAt, wage]
    actions: [closeJob, reopenJob]
  applications:
    crud: Application
    search: [fullName, email]
    filters: [jobPost, status]
    actions: [shortlist, reject, hire]
  home:
    route: /welcome
    landing:
      hero:
        button: jobs
      features:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  closeJob:
    on: JobPost
    when:
      status: open
    set:
      status: closed
    intent: Close a job post so no more applications are accepted.
  reopenJob:
    on: JobPost
    when:
      status: closed
    set:
      status: open
    intent: Reopen a closed job post to accept applications again.
  shortlist:
    on: Application
    when:
      status: [submitted, reviewing]
    set:
      status: shortlisted
    intent: Move an application to the shortlist.
  reject:
    on: Application
    when:
      status: [submitted, reviewing, shortlisted]
    set:
      status: rejected
    intent: Reject an application.
  hire:
    on: Application
    when:
      status: shortlisted
    set:
      status: hired
    intent: Mark an applicant as hired.
outgoing:
  applicationSubmitted:
    when: Application created
    to: mail
    recipient: email
    show: [jobPost, fullName, status]
  applicationStatusChanged:
    when: Application changed
    fields: [status]
    to: mail
    recipient: email
    show: [jobPost, fullName, status]
navigation: [jobs, applications, team, privacy]
