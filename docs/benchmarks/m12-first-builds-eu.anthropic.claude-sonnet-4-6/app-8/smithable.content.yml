    features:
      title: Everything you need for a great conference experience
      items: [{ title: Browse the Full Schedule, text: "Explore all talks by track, speaker or time slot and plan your day before you arrive." }, { title: Register for Talks, text: Secure your seat in the sessions you care about — registration takes seconds. }, { title: Discover the Speakers, text: Read bios and see what each speaker is presenting across the conference tracks. }, { title: Stay Up to Date, text: "Get an email confirmation when you register, and a heads-up if a talk moves rooms or times." }]
    faq:
      items: [{ question: Do I need to register for individual talks?, answer: Yes — each talk has a limited number of seats. Register for the ones you want to attend to guarantee your place. }, { question: Can I cancel a registration?, answer: "Yes, you can cancel any registration from your My Registrations page up until the talk starts." }, { question: What happens if a talk is full?, answer: "Once a talk reaches capacity, registration closes. Check back in case someone cancels their spot." }, { question: Will I receive a confirmation?, answer: "Yes, you will receive an email confirmation as soon as you register for a talk." }, { question: Can I attend talks in multiple tracks?, answer: "Absolutely — you can register for talks across any track, as long as they do not overlap in time." }]
    callToAction:
      title: Ready to plan your conference?
      text: Browse the full schedule and register for the talks you want to attend.
      button: View Schedule
    contact:
      title: Get in Touch
      text: Have a question about the conference? Send us a message and we will get back to you.
    footer:
      text: Bringing speakers and attendees together.
