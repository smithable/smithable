smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
public:
  pages: [home, schedule]
  read: [Talk, Speaker]
  create: [Message]
roles:
  admin:
    description: Conference organiser. Manages talks, speakers and registrations.
  attendee:
    description: A conference participant who registers for talks.
defaultRole: attendee
admins: [johan@smithable.ai]
