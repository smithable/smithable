smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin: all
  organizer: all
  attendee:
    description: A conference participant who registers for talks.
    create: [Registration]
assistant:
  for: signed-in
public:
  pages: [home, schedule, speakers, privacy]
  read: [Talk, Speaker, Track]
  create: [ContactMessage]
defaultRole: attendee
admins: [johan@smithable.ai]
