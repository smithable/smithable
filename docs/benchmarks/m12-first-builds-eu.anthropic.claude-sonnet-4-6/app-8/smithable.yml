smithable: 0.1
app:
  name: ConferenceHub
  description: "Event registration for a conference: browse talks and speakers, and register for sessions."
  currency: USD
  timezone: America/New_York
models:
  Track:
    fields:
      name: string!
      description: text
  Speaker:
    fields:
      name: string!
      bio: markdown
      photo: picture
      company: string
      title: string
      talks: Talk[]
  Talk:
    fields:
      title: string!
      speaker: Speaker!
      track: Track
      room: string
      startsAt: datetime!
      durationMinutes:
        type: int!
        min: 5
        max: 480
        default: 45
      capacity:
        type: int!
        min: 1
        default: 100
      summary: text
      registrations: Registration[]
      placesLeft:
        type: int
        formula: capacity - COUNT(registrations)
    namedBy: [title, startsAt]
  Registration:
    fields:
      talk:
        type: Talk!
        unique: owner
      attendee: User
    namedBy: talk
    ownedBy: attendee
    capacity:
      per: talk
      max: talk.capacity
      closes: talk.startsAt
      cancelUntil: talk.startsAt
  ContactMessage:
    fields:
      name: string!
      email: email!
      message: text!
pages:
  talks:
    crud: Talk
    search: [title, room]
    filters: [track, speaker, startsAt]
    defaultFilter:
      startsAt: upcoming
    sortable: [startsAt, title]
  speakers:
    crud: Speaker
    search: [name, company, title]
  tracks:
    crud: Track
  registrations:
    crud: Registration
    filters: [talk]
  messages:
    crud: ContactMessage
  schedule:
    calendar:
      model: Talk
      starts: startsAt
  home:
    route: /
    landing:
      hero:
      features:
      speakers:
        records: Speaker
      faq:
      callToAction:
        button: schedule
      contact:
        form: ContactMessage
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
  my-registrations:
    crud: Registration
    mine: true
    filters: [talk]
actions:
  cancelRegistration:
    on: Registration
    set:
      talk:
    intent: Attendee cancels their registration for a talk.
outgoing:
  registrationMade:
    when: Registration created
    to: mail
    recipient: owner
  registrationCancelled:
    when: Registration deleted
    to: mail
    recipient: owner
navigation: [home, schedule, talks, speakers, tracks, my-registrations, registrations, messages, team, privacy]
