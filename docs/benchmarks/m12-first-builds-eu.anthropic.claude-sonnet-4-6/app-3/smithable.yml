smithable: 0.1
app:
  name: FreelanceInvoice
  description: Simple invoicing for freelancers, with clients, invoices and payments.
  currency: EUR
models:
  BusinessProfile:
    fields:
      businessName: string!
      vatNumber: string
      iban: string
      paymentTermDays: int! = 30
      invoiceFooter: text
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      invoices: Invoice[]
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
  InvoiceLine:
    fields:
      invoice: Invoice!
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
  Payment:
    fields:
      invoice: Invoice!
      paidOn: date! = TODAY()
      amount: money!
      notes: text
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice.
  markOverdue:
    on: Invoice
    when:
      status: sent
    set:
      status: overdue
    intent: Mark the invoice as overdue when the due date has passed.
pages:
  invoices:
    crud: Invoice
    search: [number, status]
    filters: [status, client, issuedOn, dueOn]
  clients:
    crud: Client
    search: [name, email]
    sortable: [name]
  payments:
    crud: Payment
    filters: [invoice, paidOn]
  invoice-lines:
    crud: InvoiceLine
  overview:
    dashboard:
      latest:
        list: Invoice
        limit: 5
  home:
    route: /
    landing:
      hero:
      footer:
      features:
      pricing:
      faq:
      callToAction:
        button: invoices
  team:
    users: manage
navigation: [overview, invoices, clients, payments, team]
