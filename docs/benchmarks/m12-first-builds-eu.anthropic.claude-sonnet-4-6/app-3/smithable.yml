smithable: 0.1
app:
  name: Invoicely
  description: Simple invoicing for freelancers. Each user manages their own clients and invoices.
  currency: EUR
  timezone: Europe/Helsinki
models:
  BusinessProfile:
    fields:
      businessName: string!
      vatNumber: string
      iban: string
      paymentTermDays: int! = 30
      invoiceFooter: text
    description: The freelancer's own business details, printed on their invoices.
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      invoices: Invoice[]
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      invoice: Invoice!
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid | overdue
      contract: file
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
    description: Invoice numbers are sequential per user, like 2026-001, 2026-002. A sent or paid invoice can no longer be edited, only credited.
pages:
  home:
    route: /
    landing:
      hero:
      features:
      pricing:
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
  clients:
    crud: Client
    search: [name, email]
    sortable: [name, createdAt]
  invoices:
    crud: Invoice
    search: [number]
    filters: [client, status]
    sortable: [issuedOn, dueOn, number]
  overview:
    dashboard:
      latest:
        list: Invoice
        limit: 5
      outstanding:
        sum: Invoice.total
        where:
          status: sent
      overdue:
        sum: Invoice.total
        where:
          status: overdue
      paid:
        sum: Invoice.total
        where:
          status: paid
      invoiced:
        sum: Invoice.total
        by: issuedOn
    period: issuedOn
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice.
  markOverdue:
    on: Invoice
    when:
      status: sent
    set:
      status: overdue
    intent: The invoice is late.
timers:
  autoMarkOverdue:
    on: Invoice
    at: 7 days after dueOn
    where:
      status: sent
    run: markOverdue
outgoing:
  invoiceSent:
    when: markSent
    to: mail
    recipient: client.email
navigation: [overview, invoices, clients]
