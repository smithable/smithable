smithable: 0.1
app:
  name: Bakery Inventory
  description: Track ingredients, suppliers and stock levels for a small bakery.
models:
  Supplier:
    fields:
      name: string!
      contactName: string
      email: email
      phone: phone
      notes: text
  Ingredient:
    fields:
      name: string!
      category: string
      unit: string!
      reorderLevel: decimal
      supplier: Supplier
  StockEntry:
    fields:
      ingredient: Ingredient!
      quantity: decimal!
      date: date! = TODAY()
      notes: text
pages:
  suppliers:
    crud: Supplier
    search: [name, contactName, email]
    sortable: [name]
  ingredients:
    crud: Ingredient
    search: [name, category, unit]
    filters: [supplier]
    sortable: [name, category, unit]
  stock:
    crud: StockEntry
    filters: [ingredient, date]
