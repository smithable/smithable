smithable: 0.1
app:
  name: Family Recipes
  description: A shared recipe collection for the family, with ingredients and shopping lists.
  timezone: Europe/Helsinki
models:
  Recipe:
    fields:
      name: string!
      description: text
      category: breakfast | lunch | dinner | dessert | snack | drink
      servings:
        type: int!
        min: 1
        max: 100
        default: 4
      prepMinutes: int
      cookMinutes: int
      picture: picture
      notes: text
      isFavorite: bool
  Ingredient:
    fields:
      recipe: Recipe!
      name: string!
      quantity: string!
      unit: string
      notes: string
  ShoppingList:
    fields:
      name: string!
      date: date! = TODAY()
      notes: text
  ShoppingItem:
    fields:
      shoppingList: ShoppingList!
      name: string!
      quantity: string
      unit: string
      checked: bool
pages:
  recipes:
    route: /
    crud: Recipe
    search: [name, description]
    filters: [category, isFavorite]
    sortable: [name, category, prepMinutes, cookMinutes]
    actions: [markFavorite, unmarkFavorite]
  shopping-lists:
    crud: ShoppingList
    search: [name]
    filters: [date]
  home:
    route: /home
    landing:
      hero:
        button: recipes
      features:
      callToAction:
        button: recipes
      footer:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
actions:
  markFavorite:
    on: Recipe
    when:
      isFavorite: false
    set:
      isFavorite: true
  unmarkFavorite:
    on: Recipe
    when:
      isFavorite: true
    set:
      isFavorite: false
