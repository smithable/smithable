smithableUx: 0.1
pages:
  recipes:
    table:
      columns: [name, category, servings, prepTime, cookTime, isFavorite]
    icon: book
    form:
      sections: [{ name: details, fields: [name, description, category, isFavorite] }, { name: timing, fields: [servings, prepTime, cookTime] }, { name: media, fields: [imageUrl] }]
      columns: 2
  ingredients:
    table:
      columns: [name, quantity, unit, recipe]
