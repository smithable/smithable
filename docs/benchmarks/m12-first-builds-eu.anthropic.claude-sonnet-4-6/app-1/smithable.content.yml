pages:
  home:
    title: Find Your Flow
    subtitle: Book a yoga class that fits your life — beginners welcome.
    hero:
      button: View Schedule
      secondButton: Read the Blog
      image:
        src: images/hero.webp
        alt: A yoga class stretching on mats in a bright studio
        generated: true
    callToAction:
      title: Ready to step onto the mat?
      text: Browse the week's classes and book your place in seconds.
      button: Book a Class
    features:
      items: [{ title: Classes for every level, text: "From gentle Yin to dynamic Vinyasa, we have a class that meets you where you are — whether you are stepping onto the mat for the first time or deepening a long practice." }, { title: Book in seconds, text: "Browse the live schedule, pick a class and reserve your spot with one tap. No phone calls, no waiting — your place is confirmed straight away." }, { title: Expert teachers, text: "Our instructors bring years of training and a genuine love of teaching. Read their stories, find the style that speaks to you and come to class knowing you are in good hands." }, { title: A reminder before every class, text: We send you a reminder the day before so you never miss a session you have been looking forward to. }, { title: Cancel with ease, text: "Plans change. Cancel your booking any time before the class starts and your place opens up for someone else — no fuss, no fees." }, { title: A welcoming community, text: "Yoga is better together. Our studio is a friendly, non-competitive space where everyone is encouraged to go at their own pace and enjoy the practice." }]
    faq:
      items: [{ question: Do I need to have done yoga before?, answer: "Not at all. Our Foundations and Yin classes are designed for complete beginners, and our teachers are happy to offer modifications so every pose works for your body." }, { question: What should I bring to class?, answer: "Just yourself and comfortable clothes. We provide mats, blocks and straps. If you have your own mat and prefer to use it, you are very welcome to bring it along." }, { question: How do I book a class?, answer: "Create a free account, open the schedule and tap the class you want. Your place is confirmed immediately and you will receive a confirmation by email." }, { question: Can I cancel my booking?, answer: Yes. You can cancel any time before the class starts from the My Bookings page. Your place is released for other members as soon as you cancel. }, { question: How many people are in each class?, answer: "We keep our classes small — usually up to twelve students — so the teacher can give everyone proper attention and the studio stays a calm, focused space." }]
  about:
    faq:
      items: [{ question: What styles of yoga do you teach?, answer: "We offer Vinyasa, Yin, Hatha and Foundations classes. Each style has its own pace and focus, so there is something for every mood and level of experience." }, { question: Are your teachers qualified?, answer: Yes. All of our instructors hold recognised yoga teacher training certificates and continue their own practice and professional development. }, { question: Do you offer classes for complete beginners?, answer: "Absolutely. Our Foundations classes are built from the ground up for people who are new to yoga, and our teachers always offer options so you can work at your own level." }, { question: How do I get in touch?, answer: Use the contact form on our home page and we will get back to you as soon as we can. You are also welcome to drop in during studio hours. }]
