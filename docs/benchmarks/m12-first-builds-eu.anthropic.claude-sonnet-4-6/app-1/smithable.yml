smithable: 0.1
app:
  name: Yoga Studio
  description: Class schedule and online booking for a yoga studio.
  currency: EUR
  timezone: Europe/London
models:
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      sessions: Session[]
  Session:
    fields:
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
      classType: ClassType!
    description: One scheduled occurrence of a class.
    namedBy: [classType, startsAt]
  Booking:
    fields:
      session: Session! unique
      attendee: User
    description: A member's place in a session.
    namedBy: session
    ownedBy: attendee
    capacity:
      per: session
      max: session.capacity
      closes: session.startsAt
      cancelUntil: session.startsAt
  Post:
    fields:
      title: string!
      address: string unique
      summary: text
      cover: picture
      body: markdown!
      publishedOn: date
      status: draft | published
    description: News and articles on the studio's blog.
  Message:
    fields:
      name: string!
      email: email!
      message: text!
    description: A question a visitor sends from the contact form on the home page.
  ClassType:
    fields:
      name: string!
      summary: text
      level: beginner | allLevels | advanced
      durationMinutes: int! = 60
pages:
  sessions:
    crud: Session
    sortable: [startsAt, capacity]
    filters: [classType, instructor, startsAt]
    defaultFilter:
      startsAt: upcoming
  instructors:
    crud: Instructor
    search: [name]
  bookings:
    crud: Booking
    filters: [session, attendee]
  my-bookings:
    crud: Booking
    mine: true
  posts:
    crud: Post
    filters: [status]
    search: [title]
    actions: [publish]
  messages:
    crud: Message
  schedule:
    calendar:
      model: Session
      starts: startsAt
    filters: [classType, instructor]
  blog:
    articles: Post
  home:
    route: /
    landing:
      hero:
        button: schedule
        secondButton: blog
      features:
        features:
      gallery:
        gallery:
      faq:
        faq:
      callToAction:
        button: schedule
      news:
        records: Post
        where:
          status: published
      contact:
        form: Message
        contact:
      footer:
  about:
    sections:
      intro:
        text:
      team:
        records: Instructor
      faq:
        faq:
  privacy:
    route: /privacy
    legal: privacy
  team:
    users: manage
  admin:
    data: all
  class-types:
    crud: ClassType
    filters: [level]
    search: [name]
actions:
  publish:
    on: Post
    when:
      status: draft
    set:
      status: published
    intent: The post is published and visible to everyone.
timers:
  morning:
    every: day
    at: 06:30
  remind:
    on: Booking
    at: 1 day before session.startsAt
  publish:
    on: Post
    at: publishedOn
    where:
      status: draft
    run: publish
outgoing:
  bookingMade:
    when: Booking created
    to: mail
    recipient: owner
  bookingChanged:
    when: Booking changed
    to: mail
    recipient: owner
  bookingCancelled:
    when: Booking deleted
    to: mail
    recipient: owner
  reminder:
    when: remind
    to: mail
    recipient: owner
  todaysBookings:
    when: morning
    to: mail
    recipient: admin
    list:
      model: Booking
      when: session.startsAt
      within: today
      columns: [session, attendee]
  sessionMoved:
    when: Session changed
    fields: [startsAt]
    to: mail
    recipient: bookings.owner
    show: [classType, startsAt, instructor]
    previous: true
navigation:
  main: [sessions, instructors, bookings, my-bookings, posts, messages, schedule, blog, home, about, privacy, team, admin, class-types]
  schedule: [schedule, my-bookings, sessions, bookings]
  messages: [messages]
  website: [blog, about, posts, home]
  admin: [team, admin]
  studioSetup: [class-types, instructors]
