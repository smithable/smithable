smithable: 0.1
app:
  name: Riverside Yoga
  description: Class schedule and online booking for a yoga studio.
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: allLevels | beginner | advanced
      durationMinutes: int! = 60
      sessions: Session[]
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      sessions: Session[]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
    namedBy: [classType, startsAt]
  Booking:
    fields:
      session: Session!  unique
    capacity:
      per: session
      max: session.capacity
      closes: session.startsAt
      cancelUntil: 2 hours before session.startsAt
outgoing:
  bookingMade:
    when: Booking created
    to: mail
    recipient: owner
pages:
  home:
    route: /
    landing:
      hero:
      classes:
        records: ClassType
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
  schedule:
    calendar:
      model: Session
      starts: startsAt
  sessions:
    crud: Session
  class-types:
    crud: ClassType
  instructors:
    crud: Instructor
  my-bookings:
    route: /my-bookings
    crud: Booking
