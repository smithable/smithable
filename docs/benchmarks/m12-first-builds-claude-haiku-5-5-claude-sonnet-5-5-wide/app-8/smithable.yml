smithable: 0.1
app:
  name: Swap Shelf
  description: A shelf for our office where colleagues offer things they no longer need and others claim them.
models:
  Item:
    fields:
      title: string!
      description: text
      photo: picture
      category: furniture | books | electronics | kitchen | clothing | other
      condition: likeNew | good | worn
      pickupSpot: string
      status: available | claimed
      claimedBy:
        type: User
        by: app
pages:
  shelf:
    route: /
    crud: Item
    search: [title, description]
    filters: [category, condition, status]
    defaultFilter:
      status: available
  myItems:
    crud: Item
    mine: true
  team:
    users: manage
actions:
  claim:
    on: Item
    when:
      status: available
    set:
      status: claimed
      claimedBy: ME()
    intent: A colleague claims an offered item.
