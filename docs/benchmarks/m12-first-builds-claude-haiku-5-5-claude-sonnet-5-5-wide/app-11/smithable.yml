smithable: 0.1
app:
  name: IT Status Board
  description: What is down in our IT systems right now, and when it will be back.
  timezone: Europe/Mariehamn
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
      maintenances: Maintenance[]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      expectedBackAt: datetime
      summary: markdown
      updates: IncidentUpdate[]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
pages:
  overview:
    dashboard:
      open:
        count: Incident
        where:
          status: [investigating, identified, monitoring]
      perMonth:
        count: Incident
        by: detectedAt
      latest:
        list: Incident
        limit: 5
  incidents:
    crud: Incident
    actions: [identified, monitoring, resolve]
    filters: [status]
  updates:
    crud: IncidentUpdate
  maintenance:
    crud: Maintenance
  components:
    crud: Component
  team:
    users: manage
actions:
  identified:
    on: Incident
    when:
      status: investigating
    set:
      status: identified
    add:
      IncidentUpdate:
        at: NOW()
        status: identified
        message: The cause is found and a fix is being worked on.
    intent: The cause is found; the incident moves to identified, with an update saying so.
  monitoring:
    on: Incident
    when:
      status: [investigating, identified]
    set:
      status: monitoring
    add:
      IncidentUpdate:
        at: NOW()
        status: monitoring
        message: A fix is out. We are watching before we close this.
    intent: A fix is out; the incident is watched before it is closed, with an update saying so.
  resolve:
    on: Incident
    when:
      status: [investigating, identified, monitoring]
    set:
      status: resolved
      resolvedAt: NOW()
    add:
      IncidentUpdate:
        at: NOW()
        status: resolved
        message: This incident is resolved.
    intent: The incident is over, with an update saying so.
navigation: [overview, incidents, updates, maintenance, components, team]
