smithable: 0.1
app:
  name: Car Log
  description: A log of my car's fuel, service visits and costs.
  currency: EUR
models:
  FuelUp:
    fields:
      filledOn: date! = TODAY()
      odometer: int!
      liters: decimal!
      pricePerLiter: money!
      totalCost:
        type: money
        formula: liters * pricePerLiter
      fullTank: bool = true
      station: string
      note: text
  ServiceVisit:
    fields:
      visitedOn: date! = TODAY()
      odometer: int
      kind: maintenance | repair | inspection | tires | other
      workshop: string
      description: text
      cost: money
  Expense:
    fields:
      spentOn: date! = TODAY()
      category: insurance | tax | parking | tolls | cleaning | other
      amount: money!
      note: string
pages:
  fuel:
    crud: FuelUp
  service:
    crud: ServiceVisit
    search: [workshop, description]
    filters: [kind]
  expenses:
    crud: Expense
    filters: [category]
