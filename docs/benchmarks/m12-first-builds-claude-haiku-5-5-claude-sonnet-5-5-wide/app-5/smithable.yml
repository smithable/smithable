smithable: 0.1
app:
  name: Shutter Invoices
  description: "Invoicing for a photography business: clients, shoots and what is still unpaid."
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      phone: phone
      address: text
  Shoot:
    fields:
      title: string!
      client: Client!
      shotOn: date! = TODAY()
      location: string
      kind: wedding | portrait | family | event | commercial | other
      notes: text
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      invoice: Invoice!
  Invoice:
    fields:
      number: string! unique
      client: Client!
      shoot: Shoot
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
pages:
  clients:
    crud: Client
  shoots:
    crud: Shoot
  invoice-lines:
    crud: InvoiceLine
  invoices:
    crud: Invoice
    actions: [markSent, markPaid, markOverdue]
    filters: [client, status]
  overview:
    dashboard:
      unpaid:
        sum: Invoice.total
        where:
          status: [sent, overdue]
      overdue:
        sum: Invoice.total
        where:
          status: overdue
      paid:
        sum: Invoice.total
        where:
          status: paid
      latest:
        list: Invoice
        limit: 5
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice.
  markOverdue:
    on: Invoice
    when:
      status: sent
    set:
      status: overdue
    intent: The invoice is late.
timers:
  late:
    on: Invoice
    at: 1 day after dueOn
    where:
      status: sent
    run: markOverdue
