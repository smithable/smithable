smithable: 0.1
app:
  name: App
models:
  Client:
    fields:
      name: string!
      email: email
      phone: phone
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date!
      dueOn: date
      status: draft | sent | paid | overdue
      total: money
      contract: file
      lines: text
pages:
  clients:
    crud: Client
  invoices:
    crud: Invoice
    actions: [markSent, markPaid]
    filters: [client, status]
    sortable: [number, issuedOn, dueOn, total]
    search: [number, client]
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice.
