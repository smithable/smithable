smithable: 0.1
app:
  name: App
pages:
  home:
    route: /
    landing:
      hero:
      footer:
  team:
    users: manage
  clients:
    crud: Client
  shoots:
    crud: Shoot
  invoices:
    crud: Invoice
    actions: [markSent, markPaid]
models:
  Client:
    fields:
      name: string!
      email: email!
      phone: phone
  Shoot:
    fields:
      client: Client!
      date: date!
      location: string
      description: text
  Invoice:
    fields:
      client: Client!
      shoot: Shoot
      number: string! unique
      date: date! = TODAY()
      dueDate: date
      status: draft | sent | paid | overdue
      amount: money!
      notes: text
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice.
