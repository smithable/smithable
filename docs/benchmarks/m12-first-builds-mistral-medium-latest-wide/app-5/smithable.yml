smithable: 0.1
app:
  name: App
models:
  Client:
    fields:
      name: string!
      email: email
      phone: phone
      address: text
  Shoot:
    fields:
      name: string!
      client: Client!
      date: date!
      location: string
      description: text
  Invoice:
    fields:
      number: string! unique
      client: Client!
      shoot: Shoot
      issuedOn: date!
      dueOn: date
      status: draft | sent | overdue | paid
      total: money!
      notes: text
pages:
  clients:
    crud: Client
    search: [name, email]
  shoots:
    crud: Shoot
  invoices:
    crud: Invoice
    actions: [markSent, markPaid]
    filters: [status, client]
    search: [number]
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice.
