smithable: 0.1
app:
  name: Photography Invoicing
  description: "Invoices for my photography work: clients, shoots and what is still unpaid."
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      shoots: Shoot[]
  Shoot:
    fields:
      name: string!
      date: date!
      location: string
      client: Client!
      invoices: Invoice[]
  Invoice:
    fields:
      number: string! unique
      shoot: Shoot!
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid | overdue
      total: money
      lines: InvoiceLine[]
  InvoiceLine:
    fields:
      invoice: Invoice!
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount: money
pages:
  clients:
    crud: Client
    search: [name, email]
  shoots:
    crud: Shoot
    filters: [client]
    search: [name, location]
  invoices:
    crud: Invoice
    filters: [status, shoot]
    search: [number]
  home:
    route: /
    landing:
      hero:
      footer:
