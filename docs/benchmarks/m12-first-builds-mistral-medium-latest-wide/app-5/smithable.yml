smithable: 0.1
app:
  name: App
models:
  Client:
    fields:
      name: string!
      email: email!
      phone: phone
  Shoot:
    fields:
      name: string!
      date: date!
      client: Client!
      description: text
  Invoice:
    fields:
      number: string! unique
      client: Client!
      shoot: Shoot
      date: date! = TODAY()
      dueDate: date
      status: draft | sent | paid | overdue
      total: money
      notes: text
pages:
  clients:
    crud: Client
  shoots:
    crud: Shoot
  invoices:
    crud: Invoice
    actions: [markSent, markPaid]
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice.
