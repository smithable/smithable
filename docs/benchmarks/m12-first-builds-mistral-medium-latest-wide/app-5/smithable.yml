smithable: 0.1
app:
  name: Photography Invoices
  description: "Invoices for my photography work: clients, shoots and what is still unpaid."
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      invoices: Invoice[]
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid | overdue
      total: money
      lines: InvoiceLine[]
  InvoiceLine:
    fields:
      invoice: Invoice!
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount: money
pages:
  clients:
    crud: Client
    search: [name, email]
  invoices:
    crud: Invoice
    search: [number, client]
    filters: [status, client]
  invoice-lines:
    crud: InvoiceLine
