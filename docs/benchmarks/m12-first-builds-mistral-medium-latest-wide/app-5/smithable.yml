smithable: 0.1
app:
  name: Photography Invoices
  description: "Invoices for my photography work: clients, shoots and what is still unpaid."
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
  Shoot:
    fields:
      name: string!
      date: date!
      client: Client!
      location: string
      description: text
      invoices: Invoice[]
  Invoice:
    fields:
      number: string! unique
      shoot: Shoot!
      issuedOn: date! = TODAY()
      dueOn: date! = DATEADD(issuedOn, 30, "day")
      status: draft | sent | paid | overdue
      total: money
pages:
  clients:
    crud: Client
  shoots:
    crud: Shoot
  home:
    route: /
    landing:
      hero:
      footer:
  admin:
    data: all
  invoices:
    crud: Invoice
    actions: [markSent, markPaid]
  team:
    users: manage
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice.
