smithable: 0.1
app:
  name: Joogastudio
  description: "Varausjärjestelmä joogastudiolle: tunnit, ohjaajat ja varaukset verkossa."
  currency: EUR
  timezone: Europe/Helsinki
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: beginner | allLevels | advanced
      durationMinutes: int! = 60
    access:
      create: [admin]
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
    access:
      create: [admin]
  Message:
    fields:
      name: string!
      email: email!
      message: text!
    access:
      read: [admin]
      write: [admin]
      delete: [admin]
  Post:
    fields:
      title: string!
      address: string unique
      summary: text
      cover: picture
      body: markdown!
      publishedOn: date
      status: draft | published
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Booking:
    fields:
      session: Session!
      user: User!
    capacity:
      per: session
      max: session.capacity
pages:
  class-types:
    crud: ClassType
    access: [admin]
  instructors:
    crud: Instructor
    access: [admin]
  home:
    route: /
    landing:
      hero:
      footer:
      classes:
        records: ClassType
      contact:
        form: Message
  messages:
    crud: Message
    access: [admin]
  blog:
    articles: Post
  posts:
    crud: Post
    access: [admin]
  team:
    users: manage
  sessions:
    crud: Session
    access: [admin]
  my-bookings:
    crud: Booking
    access: [member, admin]
    mine: true
  schedule:
    calendar:
      model: Session
      starts: startsAt
