smithable: 0.1
app:
  name: Joogastudio
  description: "Varausjärjestelmä joogastudiollemme: tunnit, ohjaajat ja varaukset verkossa."
  currency: EUR
  timezone: Europe/Helsinki
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: beginner | allLevels | advanced
      durationMinutes: int! = 60
    access:
      create: [admin]
  Instructor:
    fields:
      name: string!
      bio: text
      portrait: picture
    access:
      create: [admin]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft: int = capacity - COUNT(bookings)
    access:
      create: [admin]
      delete: [admin]
  Booking:
    fields:
      session: Session!
      user: User!
    capacity:
      per: session
      max: session.capacity
    access:
      create: [member, admin]
      delete: [member, admin]
pages:
  class-types:
    crud: ClassType
    access: [admin]
  instructors:
    crud: Instructor
    access: [admin]
  sessions:
    crud: Session
    access: [admin]
  my-bookings:
    crud: Booking
    access: [member, admin]
    mine: true
    actions: [cancelBooking]
  schedule:
    calendar:
      model: Session
      starts: startsAt
  home:
    route: /
    landing:
      hero:
      footer:
      classes:
        records: ClassType
navigation: [schedule, my-bookings]
actions:
  cancelBooking:
    on: Booking
    copy:
    allow: [member, admin]
    intent: Peru varaus.
