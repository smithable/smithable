smithable: 0.1
app:
  name: Joogastudio
  description: "Varausjärjestelmä joogastudiollemme: tunnit, ohjaajat ja varaukset verkossa."
  currency: EUR
  timezone: Europe/Helsinki
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: beginner | allLevels | advanced
      durationMinutes: int! = 60
    access:
      create: [admin]
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
    access:
      create: [admin]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
    access:
      create: [admin]
  Booking:
    fields:
      session: Session! unique
    capacity:
      per: session
      max: session.capacity
  Message:
    fields:
      name: string!
      email: email!
      message: text!
    access:
      read: [admin]
      write: [admin]
      delete: [admin]
pages:
  class-types:
    crud: ClassType
    access: [admin]
  instructors:
    crud: Instructor
    access: [admin]
  sessions:
    crud: Session
    access: [admin]
  my-bookings:
    crud: Booking
    access: [member]
  home:
    route: /
    landing:
      hero:
      footer:
      classes:
        records: ClassType
      contact:
        form: Message
      callToAction:
        button: schedule
  messages:
    crud: Message
    access: [admin]
  schedule:
    crud: Session
navigation: [home, schedule, my-bookings]
