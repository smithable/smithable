smithable: 0.1
app:
  name: Joogastudio
  description: "Varausjärjestelmä joogastudiollemme: tunnit, ohjaajat ja varaukset verkossa."
  currency: EUR
  timezone: Europe/Helsinki
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: beginner | allLevels | advanced
      durationMinutes: int! = 60
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
  Booking:
    fields:
      session: Session! unique
    capacity:
      per: session
      max: session.capacity
  Message:
    fields:
      name: string!
      email: email!
      message: text!
pages:
  sessions:
    crud: Session
  class-types:
    crud: ClassType
  instructors:
    crud: Instructor
  messages:
    crud: Message
  my-bookings:
    crud: Booking
    mine: true
  home:
    route: /
    landing:
      hero:
      footer:
      classes:
        records: ClassType
      contact:
        form: Message
  schedule:
    calendar:
      model: Session
      starts: startsAt
  privacy:
    route: /privacy
    legal: privacy
  admin:
    data: all
outgoing:
  bookingMade:
    when: Booking created
    to: mail
    recipient: owner
  bookingChanged:
    when: Booking changed
    to: mail
    recipient: owner
  bookingCancelled:
    when: Booking deleted
    to: mail
    recipient: owner
