smithable: 0.1
app:
  name: My AI Assistant
  description: Tasks and notes kept by my AI assistant, grouped by project.
models:
  Project:
    fields:
      name: string!
      description: text
      tasks: Task[]
      notes: Note[]
  Task:
    fields:
      title: string!
      project: Project!
      status: todo | doing | done
      dueDate: date
      assignee: User
      details: text
  Note:
    fields:
      title: string!
      project: Project!
      body: text
      attachment: file
pages:
  admin:
    route: /admin
    crud: Project
  team:
    users: manage
actions:
  complete:
    on: Task
    when:
      status: [todo, doing]
    set:
      status: done
    intent: Mark a task as done.
  reopen:
    on: Task
    when:
      status: done
    set:
      status: todo
    intent: Open a finished task again.
