smithableUx: 0.1
tones:
  Plot.status:
    available: success
    reserved: warning
  WaitingList.status:
    assigned: success
    withdrawn: danger
  Fee.status:
    pending: warning
    paid: success
    overdue: danger
pages:
  plots:
    table:
      sort: number
      columns: [number, size, status, holder]
  waiting-list:
    table:
      sort: dateAdded
      columns: [name, email, phone, dateAdded, status]
  fees:
    table:
      sort: -year
      columns: [year, amount, dueDate, status]
