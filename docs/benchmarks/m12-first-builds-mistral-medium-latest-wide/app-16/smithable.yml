smithable: 0.1
app:
  name: Our Allotment Society
  description: Manage plots, waiting list and yearly fees for the allotment society.
models:
  Plot:
    fields:
      number: string! unique
      size: int
      status: free | assigned | reserved
      holder: User
      notes: text
    access:
      delete: [admin]
  WaitingList:
    fields:
      name: string!
      email: email!
      phone: phone
      dateAdded: date! = TODAY()
      notes: text
    access:
      delete: [admin]
  Fee:
    fields:
      year: int! unique
      amount: money!
      dueDate: date
      notes: text
    access:
      delete: [admin]
      write: [admin]
pages:
  plots:
    crud: Plot
  waiting-list:
    crud: WaitingList
    access: [admin]
  fees:
    crud: Fee
    access: [admin]
  team:
    users: manage
navigation: [plots, waiting-list, fees, team]
