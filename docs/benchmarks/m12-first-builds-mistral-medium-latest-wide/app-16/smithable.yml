smithable: 0.1
app:
  name: Our Allotment Society
  description: Track who has which plot, the waiting list and the yearly fee.
models:
  Plot:
    fields:
      number: string! unique
      size: int
      status: available | assigned | reserved
      holder: User
      notes: text
    ownedBy: holder
  WaitingList:
    fields:
      name: string!
      email: email!
      phone: phone
      dateAdded: date! = TODAY()
      status: active | assigned | withdrawn
      notes: text
  Fee:
    fields:
      year: int! unique
      amount: money!
      dueDate: date!
      status: pending | paid | overdue
      notes: text
pages:
  plots:
    crud: Plot
  waiting-list:
    crud: WaitingList
  fees:
    crud: Fee
  home:
    route: /
    landing:
      hero:
      footer:
      plots:
        records: Plot
  privacy:
    route: /privacy
    legal: privacy
navigation: [plots, waiting-list, fees]
