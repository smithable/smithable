smithable: 0.1
app:
  name: Our Allotment Society
  description: Manage plots, waiting list and yearly fees for the allotment society.
models:
  Plot:
    fields:
      number: string! unique
      size: string
      status: free | assigned | reserved
      holder: User
      yearlyFee: money
      notes: text
    access:
      delete: [admin]
      write: [admin, owner]
  WaitingList:
    fields:
      name: string!
      email: email!
      phone: phone
      dateAdded: date! = TODAY()
      status: active | assigned | withdrawn
      notes: text
    access:
      delete: [admin]
      write: [admin]
  Fee:
    fields:
      year: int! unique
      amount: money!
      dueDate: date!
      notes: text
    access:
      delete: [admin]
      write: [admin]
pages:
  plots:
    crud: Plot
    search: [number, holder]
    filters: [status]
  waiting-list:
    crud: WaitingList
    search: [name, email]
    filters: [status]
  fees:
    crud: Fee
  team:
    users: manage
navigation: [plots, waiting-list, fees, team]
