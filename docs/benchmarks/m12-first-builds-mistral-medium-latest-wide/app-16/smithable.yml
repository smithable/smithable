smithable: 0.1
app:
  name: Allotment Society
  description: Manage plots, waiting list and yearly fees for the allotment society.
models:
  Plot:
    fields:
      number: string! unique
      size: string
      status: available | assigned | reserved
      holder: User
      notes: text
    access:
      delete: [admin]
      write: [admin]
  WaitingList:
    fields:
      name: string!
      email: email!
      phone: phone
      dateAdded: date! = TODAY()
      status: active | assigned | withdrawn
      notes: text
    access:
      delete: [admin]
      write: [admin]
  Fee:
    fields:
      year: int! unique
      amount: money!
      dueDate: date!
      status: pending | paid
      notes: text
    access:
      delete: [admin]
      write: [admin]
pages:
  plots:
    crud: Plot
    access: [admin, member]
    search: [number, notes]
    filters: [status]
    actions: [reservePlot, assignPlot, markAsAvailable]
  waiting-list:
    crud: WaitingList
    access: [admin]
    search: [name, email, notes]
    filters: [status]
    actions: [assignFromWaitingList, withdrawFromWaitingList]
  fees:
    crud: Fee
    access: [admin, member]
    filters: [year, status]
    actions: [markFeePaid]
  team:
    users: manage
actions:
  reservePlot:
    on: Plot
    when:
      status: available
    set:
      status: reserved
    intent: Reserve this plot temporarily.
  markFeePaid:
    on: Fee
    when:
      status: pending
    set:
      status: paid
    intent: Mark this fee as paid.
  assignFromWaitingList:
    on: WaitingList
    when:
      status: active
    set:
      status: assigned
    intent: Assign a plot to this person from the waiting list.
  withdrawFromWaitingList:
    on: WaitingList
    when:
      status: active
    set:
      status: withdrawn
    intent: Withdraw this person from the waiting list.
  assignPlot:
    on: Plot
    when:
      status: [available, reserved]
    set:
      status: assigned
    intent: Assign this plot to a member.
  markAsAvailable:
    on: Plot
    when:
      status: assigned
    set:
      status: available
    intent: Mark this plot as available.
navigation: [plots, waiting-list, fees, team]
