smithable: 0.1
app:
  name: Allotment Society
  description: Manage plots, waiting list and yearly fees for the allotment society.
models:
  Plot:
    fields:
      number: string! unique
      size: int
      status: available | assigned | reserved
      holder: User
      notes: text
    access:
      delete: [admin]
      write: [admin]
      create: [admin]
  WaitingList:
    fields:
      name: string!
      email: email!
      phone: phone
      dateAdded: date! = TODAY()
      status: active | assigned | withdrawn
      notes: text
    access:
      delete: [admin]
      write: [admin]
      create: [admin, member]
  Fee:
    fields:
      year: int! unique
      amount: money!
      dueDate: date!
      status: pending | paid | overdue
      notes: text
    access:
      delete: [admin]
      write: [admin]
      create: [admin]
pages:
  plots:
    crud: Plot
    search: [number, notes]
    filters: [status]
    actions: [markAsAvailable]
  waiting-list:
    crud: WaitingList
    search: [name, email, notes]
    filters: [status]
    actions: [assignFromWaitingList]
  fees:
    crud: Fee
    filters: [year, status]
    actions: [markFeePaid, markFeeOverdue]
  team:
    users: manage
actions:
  assignFromWaitingList:
    on: WaitingList
    when:
      status: active
    set:
      status: assigned
    intent: Assign a plot to this person from the waiting list.
  markFeePaid:
    on: Fee
    when:
      status: [pending, overdue]
    set:
      status: paid
    intent: Mark this fee as paid.
  markFeeOverdue:
    on: Fee
    when:
      status: pending
    set:
      status: overdue
    intent: Mark this fee as overdue.
  markAsAvailable:
    on: Plot
    when:
      status: assigned
    set:
      status: available
    intent: Mark this plot as available.
navigation: [plots, waiting-list, fees, team]
