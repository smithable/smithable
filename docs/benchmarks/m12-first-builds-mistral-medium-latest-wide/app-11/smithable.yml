smithable: 0.1
app:
  name: IT Status Board
  description: Internal status board for IT systems so staff see what is down and when it is back.
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      summary: text
      updates: IncidentUpdate[]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
pages:
  incidents:
    crud: Incident
  updates:
    crud: IncidentUpdate
  components:
    crud: Component
  maintenance:
    crud: Maintenance
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Component
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
      recent:
        records: Incident
        where:
          status: resolved
      planned:
        records: Maintenance
  team:
    users: manage
navigation: [home, incidents, updates, components, maintenance, team]
actions:
  identified:
    custom: true
    input:
      incident: Incident!
    intent: The cause is found; the incident moves to identified.
  monitoring:
    custom: true
    input:
      incident: Incident!
    intent: A fix is out; the incident is watched before it is closed.
  resolve:
    custom: true
    input:
      incident: Incident!
    intent: The incident is over.
