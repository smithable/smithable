smithable: 0.1
app:
  name: IT Status Board
  description: Internal status board for IT systems showing what is down and when it will be back.
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      summary: markdown
      updates: IncidentUpdate[]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
pages:
  incidents:
    crud: Incident
    access: [staff]
  updates:
    crud: IncidentUpdate
    access: [staff]
  components:
    crud: Component
    access: [admin]
  maintenance:
    crud: Maintenance
    access: [staff]
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Component
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
  history:
    crud: Incident
  team:
    users: manage
navigation: [home, incidents, updates, maintenance, components, team]
