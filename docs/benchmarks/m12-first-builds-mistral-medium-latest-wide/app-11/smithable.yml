smithable: 0.1
app:
  name: IT Status Board
  description: Internal status board for IT systems showing what is down and when it will be back.
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      summary: text
      updates: IncidentUpdate[]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
pages:
  incidents:
    crud: Incident
    access: [admin, staff]
  updates:
    crud: IncidentUpdate
    access: [admin, staff]
  components:
    crud: Component
    access: [admin]
  maintenance:
    crud: Maintenance
    access: [admin, staff]
  team:
    users: manage
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Component
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
      recent:
        records: Incident
        where:
          status: resolved
      planned:
        records: Maintenance
  overview:
    dashboard:
      open:
        count: Incident
        where:
          status: investigating
      perMonth:
        count: Incident
        by: detectedAt
      latest:
        list: Incident
        limit: 5
navigation: [overview, incidents, updates, maintenance, components, team]
actions:
  identified:
    custom: true
    input:
      incident: Incident!
    allow: [admin, staff]
    intent: The cause is found; the incident moves to identified.
  monitoring:
    custom: true
    input:
      incident: Incident!
    allow: [admin, staff]
    intent: A fix is out; the incident is watched before it is closed.
  resolve:
    custom: true
    input:
      incident: Incident!
    allow: [admin, staff]
    intent: The incident is over.
