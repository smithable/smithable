smithable: 0.1
app:
  name: Wedding Guest List
  description: Manage the guest list and seating plan for our wedding, with RSVPs and meal choices.
models:
  Guest:
    fields:
      name: string!
      email: email
      phone: phone
      attending: yes | no | maybe
      mealChoice: vegetarian | meat | fish | vegan
      tableNumber: int
      notes: text
      group: string
    access:
      delete: [admin]
pages:
  guests:
    crud: Guest
    search: [name, email, notes]
    filters: [attending, mealChoice, tableNumber]
  team:
    users: manage
navigation: [guests, team]
