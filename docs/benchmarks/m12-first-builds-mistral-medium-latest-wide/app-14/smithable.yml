smithable: 0.1
app:
  name: Wedding Guest List
  description: Manage the guest list and seating plan for our wedding, with RSVPs and meal choices.
models:
  Guest:
    fields:
      name: string!
      email: email
      phone: phone
      attending: yes | no | maybe
      mealChoice: vegetarian | standard | vegan | glutenFree
      tableNumber: int
      notes: text
      group: string
    access:
      delete: [admin]
      write: [admin, owner]
pages:
  guests:
    crud: Guest
    access: [admin]
    search: [name, email, group]
    sortable: [name, tableNumber, attending]
    actions: [confirmAttendance, declineAttendance]
  home:
    route: /
    landing:
      hero:
      footer:
  team:
    users: manage
actions:
  confirmAttendance:
    on: Guest
    when:
      attending: maybe
    set:
      attending: yes
    intent: Confirm the guest's attendance.
  declineAttendance:
    on: Guest
    when:
      attending: maybe
    set:
      attending: no
    intent: Decline the invitation.
navigation: [guests, team]
