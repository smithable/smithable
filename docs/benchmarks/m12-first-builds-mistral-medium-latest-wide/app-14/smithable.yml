smithable: 0.1
app:
  name: Our Wedding
  description: The guest list and seating plan for our wedding, with who has answered and their meal choices.
models:
  Guest:
    fields:
      name: string!
      email: email
      phone: phone
      attending: yes | no | maybe
      mealChoice: vegetarian | meat | fish
      tableNumber: int
      notes: text
    access:
      delete: [admin]
pages:
  guests:
    crud: Guest
    search: [name, email, notes]
    filters: [attending, mealChoice, tableNumber]
    sortable: [name, tableNumber, createdAt]
  team:
    users: manage
navigation: [guests, team]
