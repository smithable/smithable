smithable: 0.1
app:
  name: Our Wedding
  description: Manage the guest list and seating plan for our wedding, with RSVPs and meal choices.
models:
  Guest:
    fields:
      name: string!
      email: email
      phone: phone
      attending: yes | no | maybe
      mealChoice: vegetarian | meat | fish
      tableNumber: int
      notes: text
      seatingGroup: string
    access:
      delete: [admin]
      write: [admin, owner]
pages:
  guests:
    crud: Guest
    access: [admin]
    search: [name, email, seatingGroup]
  team:
    users: manage
