smithable: 0.1
app:
  name: Wedding Guest List
  description: Manage the guest list and seating plan for our wedding, with RSVPs and meal choices.
models:
  Guest:
    fields:
      name: string!
      email: email
      phone: phone
      attending: yes | no | maybe
      mealChoice: standard | vegetarian | vegan | glutenFree
      tableNumber: int
      notes: text
      partySize: int = 1
    access:
      delete: [admin]
      write: [admin]
      create: [admin]
  Table:
    fields:
      number: int! unique
      capacity: int!
      location: string
      notes: text
    access:
      delete: [admin]
      write: [admin]
      create: [admin]
pages:
  guests:
    crud: Guest
    search: [name, email, notes]
    filters: [attending, mealChoice, tableNumber]
  tables:
    crud: Table
navigation: [guests, tables]
