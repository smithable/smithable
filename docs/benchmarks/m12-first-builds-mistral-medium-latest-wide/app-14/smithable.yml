smithable: 0.1
app:
  name: Wedding Guest List
  description: Manage the guest list and seating plan for our wedding, with RSVPs and meal choices.
models:
  Guest:
    fields:
      name: string!
      email: email
      phone: phone
      attending: yes | no | maybe
      mealChoice: chicken | beef | fish | vegetarian
      tableNumber: int
      notes: text
      group: string
    access:
      delete: [admin]
pages:
  guests:
    crud: Guest
    search: [name, email, group]
    access: [admin]
  home:
    route: /
    landing:
      hero:
      footer:
  team:
    users: manage
