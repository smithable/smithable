smithable: 0.1
app:
  name: Wedding Guest List
  description: Manage the guest list and seating plan for our wedding, with RSVPs and meal choices.
models:
  Guest:
    fields:
      name: string!
      email: email
      phone: phone
      attending: yes | no | maybe
      mealChoice: vegetarian | meat | vegan | glutenFree
      tableNumber: int
      notes: text
      group: string
pages:
  guests:
    crud: Guest
    search: [name, email, group]
    sortable: [name, tableNumber, attending]
  team:
    users: manage
