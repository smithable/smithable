smithableUx: 0.1
pages:
  guests:
    table:
      sort: name
      columns: [name, email, phone, attending, mealChoice, partySize, tableNumber, notes]
    form:
      sections: [{ name: details, fields: [name, email, phone, partySize] }, { name: rsvp, fields: [attending, mealChoice, notes] }, { name: seating, fields: [tableNumber] }]
      columns: 2
      control:
        attending: radio
        mealChoice: select
  tables:
    table:
      sort: number
      columns: [number, capacity, location, notes]
tones:
  Guest.attending:
    yes: success
    no: danger
    maybe: warning
