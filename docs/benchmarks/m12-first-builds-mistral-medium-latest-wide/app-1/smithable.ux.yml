smithableUx: 0.1
pages:
  clients:
    table:
      columns: [name, email, phone]
      sort: name
    icon: users
  quotes:
    table:
      columns: [client, description, amount, currency, issuedOn, expiresOn, status]
      sort: -issuedOn
    icon: file
    form:
      sections: [{ name: quote, fields: [client, description, amount, currency] }, { name: timing, fields: [issuedOn, expiresOn] }]
  payments:
    table:
      columns: [quote, amount, currency, paidOn, method]
      sort: -paidOn
    icon: receipt
    form:
      sections: [{ name: payment, fields: [quote, amount, currency] }, { name: details, fields: [paidOn, method, notes] }]
tones:
  Quote.status:
    accepted: success
    rejected: danger
    sent: warning
