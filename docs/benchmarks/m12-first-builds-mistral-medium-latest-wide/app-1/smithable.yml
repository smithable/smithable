smithable: 0.1
app:
  name: Freelance Translator
  description: Track clients, quotes, and payments for a freelance translator.
models:
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      quotes: Quote[]
  Quote:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      amount: money!
      status: draft | sent | paid | overdue
      description: text
pages:
  clients:
    crud: Client
    search: [name, email]
  quotes:
    crud: Quote
    actions: [markSent, markPaid]
    search: [number, description, client]
    filters: [status, client]
  team:
    users: manage
actions:
  markSent:
    on: Quote
    when:
      status: draft
    set:
      status: sent
    intent: The quote was sent to the client.
  markPaid:
    on: Quote
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the quote.
