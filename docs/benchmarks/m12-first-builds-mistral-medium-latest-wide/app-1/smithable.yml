smithable: 0.1
app:
  name: Freelance Translator Clients
  description: Track clients, quotes, and payments for a freelance translator.
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      quotes: Quote[]
  Quote:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      amount: money!
      status: draft | sent | accepted | paid
      description: text
pages:
  clients:
    crud: Client
    search: [name, email]
  quotes:
    crud: Quote
    search: [number, description]
    filters: [client, status]
