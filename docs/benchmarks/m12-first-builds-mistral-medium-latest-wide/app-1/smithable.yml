smithable: 0.1
app:
  name: Freelance Translator
  description: Track clients, quotes, and payments for a freelance translator.
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      address: text
      phone: phone
      notes: text
    access:
      delete: [owner]
  Quote:
    fields:
      client: Client!
      description: text!
      amount: money!
      currency: string = EUR
      issuedOn: date! = TODAY()
      validUntil: date
      status: draft | sent | accepted | rejected
    access:
      delete: [owner]
  Payment:
    fields:
      quote: Quote!
      amount: money!
      currency: string = EUR
      paidOn: date! = TODAY()
      method: bankTransfer | paypal | cash | other
      notes: text
    access:
      delete: [owner]
pages:
  clients:
    crud: Client
  quotes:
    crud: Quote
    actions: [markSent, markAccepted, markRejected]
  team:
    users: manage
  payments:
    crud: Payment
actions:
  markSent:
    on: Quote
    when:
      status: draft
    set:
      status: sent
    intent: The quote was sent to the client.
  markAccepted:
    on: Quote
    when:
      status: sent
    set:
      status: accepted
    intent: The client accepted the quote.
  markRejected:
    on: Quote
    when:
      status: sent
    set:
      status: rejected
    intent: The client rejected the quote.
