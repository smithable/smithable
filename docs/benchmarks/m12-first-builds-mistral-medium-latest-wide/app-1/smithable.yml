smithable: 0.1
app:
  name: Freelance Translator
  description: Track clients, quotes, and payments for a freelance translator.
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      quotes: Quote[]
  Quote:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      status: draft | sent | accepted | rejected
      amount: money!
      description: text
  Payment:
    fields:
      quote: Quote!
      amount: money!
      paidOn: date! = TODAY()
      method: bankTransfer | cash | online
pages:
  clients:
    crud: Client
  quotes:
    crud: Quote
    actions: [markSent, markAccepted, markRejected]
  team:
    users: manage
  payments:
    crud: Payment
actions:
  markSent:
    on: Quote
    when:
      status: draft
    set:
      status: sent
    intent: The quote was sent to the client.
  markAccepted:
    on: Quote
    when:
      status: sent
    set:
      status: accepted
    intent: The client accepted the quote.
  markRejected:
    on: Quote
    when:
      status: sent
    set:
      status: rejected
    intent: The client rejected the quote.
