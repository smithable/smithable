smithable: 0.1
app:
  name: Freelance Translator Clients
  description: Track clients, quotes, and payments for a freelance translator.
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      quotes: Quote[]
  Quote:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      amount: money!
      status: draft | sent | accepted | paid
      description: text
pages:
  clients:
    crud: Client
  quotes:
    crud: Quote
    actions: [markSent, markAccepted, markPaid]
    filters: [client, status]
    search: [number, description]
actions:
  markSent:
    on: Quote
    when:
      status: draft
    set:
      status: sent
    intent: The quote was sent to the client.
  markAccepted:
    on: Quote
    when:
      status: sent
    set:
      status: accepted
    intent: The client accepted the quote.
  markPaid:
    on: Quote
    when:
      status: accepted
    set:
      status: paid
    intent: The client paid the quoted amount.
