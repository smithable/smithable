smithable: 0.1
app:
  name: My Translation Clients
  description: Track my freelance translation clients, quotes, and payments.
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      quotes: Quote[]
  Quote:
    fields:
      client: Client!
      description: text!
      amount: money!
      issuedOn: date! = TODAY()
      status: draft | sent | accepted | paid
      payment: Payment[]
  Payment:
    fields:
      quote: Quote!
      amount: money!
      paidOn: date! = TODAY()
      method: bank | cash | online
pages:
  clients:
    crud: Client
    search: [name, email, vatNumber]
  quotes:
    crud: Quote
    search: [description, client]
    filters: [status, client]
  payments:
    crud: Payment
    filters: [quote, method]
