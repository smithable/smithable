smithable: 0.1
app:
  name: Web Agency CRM
  description: "A sales pipeline for our six-person web agency: leads, deals and who follows up when."
models:
  Lead:
    fields:
      name: string!
      email: email
      phone: phone
      company: string
      status: new | contacted | qualified | lost
      source: referral | website | social | other
      notes: text
      assignee: User
      followUpDate: date
    access:
      delete: [admin]
  Deal:
    fields:
      name: string!
      lead: Lead!
      value: money
      status: proposal | negotiation | won | lost
      closeDate: date
      notes: text
      assignee: User
    access:
      delete: [admin]
pages:
  leads:
    crud: Lead
    search: [name, email, company]
    sortable: [name, followUpDate, createdAt]
    actions: [markContacted, markQualified, markLost]
  deals:
    crud: Deal
    search: [name, lead]
    sortable: [name, value, closeDate, createdAt]
    actions: [markProposal, markNegotiation, markWon]
  team:
    users: manage
actions:
  markContacted:
    on: Lead
    when:
      status: new
    set:
      status: contacted
      followUpDate:
  markQualified:
    on: Lead
    when:
      status: contacted
    set:
      status: qualified
  markLost:
    on: Lead
    when:
      status: [new, contacted, qualified]
    set:
      status: lost
  markProposal:
    on: Deal
    when:
      status: [proposal, negotiation]
    set:
      status: proposal
  markNegotiation:
    on: Deal
    when:
      status: proposal
    set:
      status: negotiation
  markWon:
    on: Deal
    when:
      status: [proposal, negotiation]
    set:
      status: won
      closeDate: TODAY()
navigation: [leads, deals, team]
