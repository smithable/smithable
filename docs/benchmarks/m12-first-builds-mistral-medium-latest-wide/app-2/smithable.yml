smithable: 0.1
app:
  name: Web Agency CRM
  description: A sales pipeline for a six-person web agency to track leads, deals, and follow-ups.
models:
  Lead:
    fields:
      name: string!
      email: email
      phone: phone
      company: string
      status: new | contacted | qualified | lost
      source: referral | website | social | other
      notes: text
      assignee: User
      followUpDate: date
    ownedBy: assignee
  Deal:
    fields:
      name: string!
      customer: string!
      value: money
      status: proposal | negotiation | won | lost
      closeDate: date
      assignee: User
      notes: text
      lead: Lead
    ownedBy: assignee
pages:
  leads:
    crud: Lead
    search: [name, email, company]
    sortable: [followUpDate, createdAt]
    actions: [markAsContacted, markAsQualified, markAsLost]
  deals:
    crud: Deal
    search: [name, customer]
    sortable: [closeDate, value, createdAt]
    actions: [markAsWon, markAsLostDeal]
  team:
    users: manage
actions:
  markAsContacted:
    on: Lead
    when:
      status: new
    set:
      status: contacted
      followUpDate:
    intent: Mark a lead as contacted and set a follow-up date.
  markAsQualified:
    on: Lead
    when:
      status: contacted
    set:
      status: qualified
    intent: Mark a lead as qualified.
  markAsLost:
    on: Lead
    when:
      status: [new, contacted, qualified]
    set:
      status: lost
    intent: Mark a lead as lost.
  markAsWon:
    on: Deal
    when:
      status: [proposal, negotiation]
    set:
      status: won
    intent: Mark a deal as won.
  markAsLostDeal:
    on: Deal
    when:
      status: [proposal, negotiation]
    set:
      status: lost
    intent: Mark a deal as lost.
navigation: [leads, deals, team]
