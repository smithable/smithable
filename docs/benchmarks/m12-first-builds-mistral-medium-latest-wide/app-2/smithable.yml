smithable: 0.1
app:
  name: Web Agency CRM
  description: "A sales pipeline for our six-person web agency: leads, deals and who follows up when."
models:
  Lead:
    fields:
      name: string!
      company: string
      email: email
      phone: phone
      status: new | contacted | qualified | lost
      source: referral | website | social | other
      notes: text
      assignee: User
      followUpDate: date
  Deal:
    fields:
      name: string!
      lead: Lead!
      value: money
      status: proposal | negotiation | won | lost
      closeDate: date
      notes: text
      assignee: User
pages:
  leads:
    crud: Lead
    search: [name, company, email]
    sortable: [name, company, followUpDate, createdAt]
  deals:
    crud: Deal
    search: [name, lead]
    sortable: [name, value, closeDate, createdAt]
  team:
    users: manage
navigation: [leads, deals, team]
