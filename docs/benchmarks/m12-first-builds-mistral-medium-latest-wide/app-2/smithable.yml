smithable: 0.1
app:
  name: Web Agency CRM
  description: A sales pipeline for a six-person web agency to track leads, deals, and follow-ups.
models:
  Lead:
    fields:
      name: string!
      email: email
      phone: phone
      company: string
      source: referral | website | social | other
      status: new | contacted | qualified | disqualified
      notes: text
      assignee: User
      followUpDate: date
    access:
      delete: [admin]
  Deal:
    fields:
      name: string!
      lead: Lead!
      value: money
      status: proposal | negotiation | won | lost
      closeDate: date
      notes: text
      assignee: User
    access:
      delete: [admin]
pages:
  leads:
    crud: Lead
    search: [name, email, company]
    sortable: [name, followUpDate, createdAt]
    actions: [qualifyLead, disqualifyLead]
  deals:
    crud: Deal
    search: [name, lead]
    sortable: [name, value, closeDate, createdAt]
    actions: [winDeal, loseDeal]
  team:
    users: manage
actions:
  qualifyLead:
    on: Lead
    when:
      status: [new, contacted]
    set:
      status: qualified
    intent: Mark a lead as qualified for further follow-up.
  disqualifyLead:
    on: Lead
    when:
      status: [new, contacted, qualified]
    set:
      status: disqualified
      notes:
    intent: Mark a lead as disqualified with an optional reason.
  winDeal:
    on: Deal
    when:
      status: [proposal, negotiation]
    set:
      status: won
    intent: Mark a deal as won.
  loseDeal:
    on: Deal
    when:
      status: [proposal, negotiation]
    set:
      status: lost
      notes:
    intent: Mark a deal as lost with an optional reason.
navigation: [leads, deals, team]
