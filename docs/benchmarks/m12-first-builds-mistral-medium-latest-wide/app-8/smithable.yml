smithable: 0.1
app:
  name: Swap Shelf
  description: Colleagues offer things they no longer need and others claim them.
models:
  Item:
    fields:
      title: string!
      photos: pictures!
      description: text!
      category: furniture | electronics | books | kitchen | office | other
      condition: likeNew | good | worn
      available: bool = true
    review: [photos]
pages:
  catalog:
    route: /
    crud: Item
    search: [title, description]
    filters: [category, condition, available]
    sortable: [createdAt]
    favorites: true
    contact: owner
  myItems:
    crud: Item
    mine: true
  saved:
    crud: Item
    favorites: only
  home:
    route: /welcome
    landing:
      hero:
      footer:
  privacy:
    route: /privacy
    legal: privacy
  review:
    review: all
navigation: [catalog, myItems, saved, review]
