smithable: 0.1
app:
  name: Swap Shelf
  description: Colleagues offer things they no longer need and others claim them.
models:
  Item:
    fields:
      title: string!
      photos: pictures
      description: text!
      category: office | electronics | furniture | books | other
      condition: likeNew | good | worn
      available: bool = true
pages:
  catalog:
    route: /
    crud: Item
    search: [title, description]
    filters: [category, condition, available]
    sortable: [createdAt]
    favorites: true
    contact: owner
  myItems:
    crud: Item
    mine: true
  saved:
    crud: Item
    favorites: only
  home:
    route: /welcome
    landing:
      hero:
      footer:
  team:
    users: manage
navigation: [catalog, myItems, saved, team]
