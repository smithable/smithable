smithable: 0.1
app:
  name: Swap Shelf
  description: "A swap shelf for our office: colleagues offer things they no longer need and others claim them."
models:
  Item:
    fields:
      title: string!
      photos: pictures
      description: text!
      category: furniture | bikes | electronics | sports | kids | other
      condition: likeNew | good | worn
      available: bool = true
pages:
  catalog:
    route: /
    crud: Item
    search: [title, description]
    filters: [category, condition, available]
    sortable: [createdAt]
    favorites: true
    contact: owner
  myItems:
    crud: Item
    mine: true
  saved:
    crud: Item
    favorites: only
  team:
    users: manage
navigation: [catalog, myItems, saved, team]
