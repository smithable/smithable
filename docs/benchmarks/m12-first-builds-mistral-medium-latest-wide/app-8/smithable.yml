smithable: 0.1
app:
  name: Swap Shelf
  description: A place for colleagues to offer and claim items they no longer need.
models:
  Item:
    fields:
      name: string!
      description: text
      status: available | claimed | taken
      offeredBy: User!
      claimedBy: User
      image: url
    access:
      delete: [owner]
pages:
  items:
    crud: Item
    filters: [status]
    search: [name, description]
