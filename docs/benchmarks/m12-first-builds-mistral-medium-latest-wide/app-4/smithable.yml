smithable: 0.1
app:
  name: Piano Lessons
  description: "A piano teacher's lessons: pupils, their weekly times and what each one practises."
models:
  Pupil:
    fields:
      name: string!
      email: email
      phone: phone
      notes: text
  Lesson:
    fields:
      pupil: Pupil!
      dayOfWeek: monday | tuesday | wednesday | thursday | friday | saturday | sunday
      startTime: string!
      durationMinutes: int! = 60
      practiceFocus: text
pages:
  pupils:
    crud: Pupil
    search: [name, email, phone]
  lessons:
    crud: Lesson
    search: [practiceFocus]
