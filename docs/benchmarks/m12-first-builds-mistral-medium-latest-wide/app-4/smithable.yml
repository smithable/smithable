smithable: 0.1
app:
  name: Piano Lessons
  description: "A piano teacher's lessons: pupils, their weekly times and what each one practises."
models:
  Pupil:
    fields:
      name: string!
      email: email
      phone: phone
      notes: text
    access:
      delete: [teacher]
  Lesson:
    fields:
      pupil: Pupil!
      dayOfWeek: monday | tuesday | wednesday | thursday | friday | saturday | sunday
      startTime: string!
      durationMinutes: int! = 60
      notes: text
    access:
      delete: [teacher]
  Practice:
    fields:
      lesson: Lesson!
      date: date!
      piece: string!
      minutes: int
      notes: text
    access:
      delete: [teacher]
pages:
  pupils:
    crud: Pupil
  lessons:
    crud: Lesson
  practice:
    crud: Practice
