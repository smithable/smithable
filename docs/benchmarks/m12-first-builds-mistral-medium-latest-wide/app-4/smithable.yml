smithable: 0.1
app:
  name: Piano Lessons
  description: Track my pupils, their weekly lesson times and what each one practises.
models:
  Pupil:
    fields:
      name: string!
      email: email
      phone: phone
      notes: text
  Lesson:
    fields:
      pupil: Pupil!
      dayOfWeek: monday | tuesday | wednesday | thursday | friday | saturday | sunday
      startTime: string!
      durationMinutes: int! = 60
      notes: text
  Practice:
    fields:
      lesson: Lesson!
      date: date!
      piece: string!
      minutes: int
      notes: text
pages:
  pupils:
    crud: Pupil
    search: [name, email, phone]
  lessons:
    crud: Lesson
    search: [pupil, dayOfWeek]
    filters: [pupil, dayOfWeek]
  practices:
    crud: Practice
    search: [lesson, piece]
    filters: [lesson, date]
