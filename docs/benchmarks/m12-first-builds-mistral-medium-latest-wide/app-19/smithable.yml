smithable: 0.1
app:
  name: Vår Loppis
  description: En sida för vår loppis där folk kan lägga upp saker de vill sälja, med bilder och pris.
  currency: SEK
models:
  Item:
    fields:
      title: string!
      photos: pictures
      description: text!
      price: money
      category: furniture | bikes | electronics | sports | kids | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
pages:
  catalog:
    route: /
    crud: Item
    search: [title, description, place]
    filters: [category, price, condition, available]
    sortable: [price, createdAt]
    favorites: true
    contact: owner
  myItems:
    crud: Item
    mine: true
  saved:
    crud: Item
    favorites: only
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latest:
        records: Item
        where:
          available: true
navigation: [catalog, myItems, saved]
