smithable: 0.1
app:
  name: Vår Loppis
  description: En sida för att lägga upp saker att sälja med bilder och pris.
models:
  Item:
    fields:
      name: string!
      description: text
      price: money!
      image: url
      status: available | sold
pages:
  items:
    crud: Item
    search: [name, description]
    filters: [status]
    sortable: [name, price, createdAt]
  home:
    route: /
    landing:
      hero:
      footer:
      items:
        records: Item
        where:
          status: available
