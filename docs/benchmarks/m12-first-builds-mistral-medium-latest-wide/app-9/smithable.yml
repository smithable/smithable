smithable: 0.1
app:
  name: My Vinyl Collection
  description: A place to keep and show my vinyl record collection with albums, artists, condition and purchase price.
models:
  Album:
    fields:
      name: string!
      artist: string!
      condition: mint | nearMint | veryGood | good | fair | poor
      purchasePrice: money
      releaseYear: int
      notes: text
      coverImage: url
pages:
  albums:
    crud: Album
    search: [name, artist, notes]
    filters: [condition, releaseYear]
