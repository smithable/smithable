smithable: 0.1
app:
  name: My Vinyl Record Collection
  description: A place to keep and show my vinyl record collection with albums, artists, condition and purchase price.
models:
  Record:
    fields:
      title: string!
      artist: string!
      condition: mint | nearMint | veryGood | good | fair | poor
      pricePaid: money
      releaseYear: int
      notes: text
pages:
  records:
    crud: Record
    search: [title, artist, notes]
    filters: [condition, releaseYear]
    sortable: [title, artist, releaseYear, pricePaid]
