smithable: 0.1
app:
  name: Car Log
  description: A log of my car's fuel, service visits and costs.
models:
  Fuel:
    fields:
      date: date!
      odometer: int!
      liters: decimal!
      pricePerLiter: decimal!
      totalCost: money
      notes: text
  Cost:
    fields:
      date: date!
      amount: money!
      category: fuel | maintenance | insurance | tax | other
      description: string!
      receipt: url
  Service:
    fields:
      date: date!
      odometer: int!
      type: oilChange | tireRotation | brakeService | inspection | other
      cost: money
      notes: text
      serviceProvider: string
pages:
  fuel:
    crud: Fuel
    search: [notes]
  costs:
    crud: Cost
    search: [description]
    filters: [category]
  service:
    crud: Service
    search: [notes, serviceProvider]
    filters: [type]
navigation: [fuel, service, costs]
