smithable: 0.1
app:
  name: Car Log
  description: A log of my car's fuel, service visits and costs.
models:
  Fuel:
    fields:
      date: date!
      odometer: int!
      liters: decimal!
      pricePerLiter: money!
      totalCost: money
      notes: text
  Service:
    fields:
      date: date!
      odometer: int!
      type: string!
      description: text
      cost: money!
      notes: text
  Cost:
    fields:
      date: date!
      category: string!
      amount: money!
      description: text
      notes: text
pages:
  fuel:
    crud: Fuel
  services:
    crud: Service
  costs:
    crud: Cost
