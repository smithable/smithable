smithable: 0.1
app:
  name: Car Log
  description: A log of my car's fuel, service visits and costs.
models:
  Fuel:
    fields:
      date: date!
      odometer: int!
      liters: decimal!
      cost: money
      notes: text
  Service:
    fields:
      date: date!
      odometer: int!
      type: string!
      cost: money
      notes: text
      provider: string
  Cost:
    fields:
      date: date!
      amount: money!
      category: fuel | service | insurance | other
      notes: text
pages:
  fuel:
    crud: Fuel
  service:
    crud: Service
  costs:
    crud: Cost
navigation: [fuel, service, costs]
