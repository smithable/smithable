smithable: 0.1
app:
  name: Car Log
  description: A log of my car's fuel, service visits and costs.
models:
  FuelEntry:
    fields:
      date: date!
      odometer: int!
      liters: decimal!
      cost: money
      notes: text
  ServiceVisit:
    fields:
      date: date!
      odometer: int!
      provider: string!
      description: text
      cost: money
      notes: text
  Cost:
    fields:
      date: date!
      category: string!
      amount: money!
      description: text
      receipt: url
pages:
  fuel-entries:
    crud: FuelEntry
  service-visits:
    crud: ServiceVisit
  costs:
    crud: Cost
navigation: [fuel-entries, service-visits, costs]
