smithable: 0.1
app:
  name: Local Museum Collection
  description: Browse the museum's objects and their stories online.
pages:
  home:
    route: /
    landing:
      hero:
      footer:
      featured:
        records: Artifact
        where:
          status: onDisplay
  artifacts:
    crud: Artifact
    search: [name, description, story]
models:
  Artifact:
    fields:
      name: string!
      description: text
      category: string
      period: string
      image: url
      story: text
      status: onDisplay | inStorage | onLoan
navigation: [artifacts]
