smithable: 0.1
app:
  name: Local Museum Collection
  description: Browse the museum's objects and their stories online.
models:
  Artifact:
    fields:
      name: string!
      description: text
      category: artifact | document | photograph | textile | other
      period: string
      origin: string
      image: file
      story: text
      addedOn: date! = TODAY()
pages:
  artifacts:
    crud: Artifact
    search: [name, description, story, period, origin]
    sortable: [name, addedOn, period]
  home:
    route: /
    landing:
      hero:
      footer:
      artifacts:
        records: Artifact
  privacy:
    route: /privacy
    legal: privacy
navigation: [artifacts]
