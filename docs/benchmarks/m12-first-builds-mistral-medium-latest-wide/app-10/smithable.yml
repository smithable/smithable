smithable: 0.1
app:
  name: Local Museum Collection
  description: Browse the museum's objects and their stories online.
models:
  Artifact:
    fields:
      name: string!
      description: text
      category: artifact | document | photograph
      period: string
      origin: string
      story: text
      image: url
pages:
  artifacts:
    crud: Artifact
    search: [name, description, story]
    sortable: [name, period, createdAt]
    filters: [category]
  home:
    route: /
    landing:
      hero:
      footer:
      featured:
        records: Artifact
        where:
          category: artifact
navigation: [home, artifacts]
