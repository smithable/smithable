smithable: 0.1
app:
  name: Local Museum Collection
  description: Browse the museum's objects and their stories online.
models:
  Artifact:
    fields:
      name: string!
      description: text
      category: artifact | painting | sculpture | document | other
      image: url
      period: string
      origin: string
      story: text
      addedOn: date! = TODAY()
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
pages:
  artifacts:
    crud: Artifact
    search: [name, description, story, period, origin]
    sortable: [name, period, addedOn]
  home:
    route: /
    landing:
      hero:
      footer:
      artifacts:
        records: Artifact
navigation: [artifacts]
