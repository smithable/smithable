smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin:
    description: Manages the collection.
  member:
    description: Browses the collection.
    pages: [home, artifacts]
    create: all
    read: [Artifact]
public:
  pages: [home, artifacts]
  read: [Artifact]
defaultRole: member
admins: [johan@smithable.ai]
