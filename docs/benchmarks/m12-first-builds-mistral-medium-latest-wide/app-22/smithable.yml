smithable: 0.1
app:
  name: Mein Hofladen
  description: Produkte, Vorbestellungen der Kunden und Abholzeiten verwalten.
  timezone: Europe/Berlin
models:
  PickupTime:
    fields:
      date: date!
      startTime: string!
      endTime: string!
      maxSlots: int! = 10
      notes: text
  Product:
    fields:
      name: string!
      description: text
      price: money
      category: obst | gemuese | backwaren | milchprodukte | fleisch | sonstiges
      available: bool = true
      image: file
  PreOrder:
    fields:
      product: Product!
      quantity: int!
      customerName: string!
      customerPhone: phone
      orderDate: date! = TODAY()
      status: offen | bestaetigt | abgeholt | storniert
      pickupTime: PickupTime
pages:
  abholzeiten:
    crud: PickupTime
  home:
    route: /
    landing:
      hero:
      footer:
      produkte:
        records: Product
  privacy:
    route: /privacy
    legal: privacy
  produkte:
    crud: Product
  vorbestellungen:
    crud: PreOrder
navigation: [home, produkte, vorbestellungen, abholzeiten]
