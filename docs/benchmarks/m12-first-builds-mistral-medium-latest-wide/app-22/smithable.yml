smithable: 0.1
app:
  name: Hofladen
  description: Verwaltung von Produkten, Vorbestellungen und Abholzeiten für einen kleinen Hofladen.
  currency: EUR
  timezone: Europe/Berlin
models:
  PickupTime:
    fields:
      date: date!
      startTime: string!
      endTime: string!
      notes: text
  Product:
    fields:
      name: string!
      description: text
      price: money!
      category: obst | gemuese | backwaren | sonstiges
      available: bool = true
      image: url
  PreOrder:
    fields:
      customerName: string!
      customerPhone: phone
      product: Product!
      quantity: int!
      orderDate: date = TODAY()
      pickupDate: date!
      status: offen | bestaetigt | abgeholt | storniert
      notes: text
pages:
  abholzeiten:
    crud: PickupTime
    filters: [date]
  produkte:
    crud: Product
    search: [name, category]
  vorbestellungen:
    crud: PreOrder
    actions: [confirmPreOrder, markAsPickedUp, cancelPreOrder]
    search: [customerName, customerPhone]
    filters: [status, pickupDate, product]
  team:
    users: manage
actions:
  confirmPreOrder:
    on: PreOrder
    when:
      status: offen
    set:
      status: bestaetigt
  markAsPickedUp:
    on: PreOrder
    when:
      status: bestaetigt
    set:
      status: abgeholt
  cancelPreOrder:
    on: PreOrder
    when:
      status: [offen, bestaetigt]
    set:
      status: storniert
navigation: [produkte, vorbestellungen, abholzeiten, team]
