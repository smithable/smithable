smithable: 0.1
app:
  name: Hofladen
  description: Verwaltung von Produkten, Vorbestellungen und Abholzeiten für einen kleinen Hofladen.
  currency: EUR
  timezone: Europe/Berlin
models:
  Product:
    fields:
      name: string!
      description: text
      price: money!
      category: string
      available: bool = true
  PreOrder:
    fields:
      customerName: string!
      customerPhone: phone
      product: Product!
      quantity: int! = 1
      pickupTime: datetime!
      status: pending | ready | pickedUp | canceled
  PickupSlot:
    fields:
      date: date!
      startTime: string!
      endTime: string!
      maxPreOrders: int! = 10
pages:
  produkte:
    crud: Product
    search: [name, category]
  vorbestellungen:
    crud: PreOrder
    actions: [markReady, markPickedUp, cancelPreOrder]
    search: [customerName, customerPhone]
    filters: [status, pickupTime]
  abholzeiten:
    crud: PickupSlot
    filters: [date]
  team:
    users: manage
actions:
  markReady:
    on: PreOrder
    when:
      status: pending
    set:
      status: ready
    intent: Markiert eine Vorbestellung als bereit zur Abholung.
  markPickedUp:
    on: PreOrder
    when:
      status: ready
    set:
      status: pickedUp
    intent: Markiert eine Vorbestellung als abgeholt.
  cancelPreOrder:
    on: PreOrder
    when:
      status: [pending, ready]
    set:
      status: canceled
    intent: Storniert eine Vorbestellung.
navigation: [produkte, vorbestellungen, abholzeiten, team]
