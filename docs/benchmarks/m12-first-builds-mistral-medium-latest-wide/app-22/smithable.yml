smithable: 0.1
app:
  name: Hofladen
  description: Verwaltung von Produkten, Vorbestellungen und Abholzeiten für einen kleinen Hofladen.
  currency: EUR
  timezone: Europe/Berlin
models:
  Product:
    fields:
      name: string!
      description: text
      price: money!
      stock: int! = 0
      unit: piece | kg | liter
      category: string
  PreOrder:
    fields:
      customerName: string!
      customerPhone: phone
      product: Product!
      quantity: int!
      orderDate: date! = TODAY()
      pickupDate: date!
      status: pending | ready | pickedUp | canceled
      notes: text
  PickupSlot:
    fields:
      date: date!
      startTime: string!
      endTime: string!
      maxPreOrders: int! = 10
      notes: text
pages:
  produkte:
    crud: Product
    search: [name, category]
  vorbestellungen:
    crud: PreOrder
    search: [customerName, customerPhone]
    filters: [status, pickupDate, product]
  abholzeiten:
    crud: PickupSlot
    filters: [date]
  team:
    users: manage
navigation: [produkte, vorbestellungen, abholzeiten, team]
