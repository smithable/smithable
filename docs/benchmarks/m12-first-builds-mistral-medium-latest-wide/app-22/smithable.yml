smithable: 0.1
app:
  name: Hofladen
  description: Verwaltung von Produkten, Vorbestellungen und Abholzeiten für einen kleinen Hofladen.
  currency: EUR
  timezone: Europe/Berlin
models:
  Product:
    fields:
      name: string!
      description: text
      price: money!
      category: string
      available: bool = true
  PreOrder:
    fields:
      customerName: string!
      customerEmail: email
      customerPhone: phone
      product: Product!
      quantity: int! = 1
      pickupTime: datetime!
      status: pending | confirmed | pickedUp | canceled
      notes: text
  PickupSlot:
    fields:
      date: date!
      startTime: string!
      endTime: string!
      maxCapacity: int! = 10
      notes: text
pages:
  produkte:
    crud: Product
    search: [name, category]
  vorbestellungen:
    crud: PreOrder
    actions: [confirmPreOrder, markPickedUp, cancelPreOrder]
    search: [customerName, customerEmail, product]
    filters: [status, pickupTime]
    sortable: [pickupTime, customerName]
  abholzeiten:
    crud: PickupSlot
  team:
    users: manage
actions:
  confirmPreOrder:
    on: PreOrder
    when:
      status: pending
    set:
      status: confirmed
    intent: Bestätige eine Vorbestellung.
  markPickedUp:
    on: PreOrder
    when:
      status: confirmed
    set:
      status: pickedUp
    intent: Markiere eine Vorbestellung als abgeholt.
  cancelPreOrder:
    on: PreOrder
    when:
      status: [pending, confirmed]
    set:
      status: canceled
      notes:
    intent: Storniere eine Vorbestellung.
navigation: [produkte, vorbestellungen, abholzeiten, team]
