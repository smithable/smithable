smithable: 0.1
app:
  name: Hofladen
  description: Verwaltung von Produkten, Vorbestellungen und Abholzeiten für einen kleinen Hofladen.
  currency: EUR
  timezone: Europe/Berlin
models:
  Product:
    fields:
      name: string!
      description: text
      price: money!
      category: string
      available: bool = true
  PreOrder:
    fields:
      customerName: string!
      customerEmail: email
      customerPhone: phone
      product: Product!
      quantity: int! = 1
      pickupDate: date!
      status: pending | confirmed | pickedUp | canceled
      notes: text
  PickupTime:
    fields:
      date: date!
      startTime: string!
      endTime: string!
      maxSlots: int! = 10
      notes: text
pages:
  produkte:
    crud: Product
  vorbestellungen:
    crud: PreOrder
  abholzeiten:
    crud: PickupTime
  team:
    users: manage
navigation: [produkte, vorbestellungen, abholzeiten, team]
