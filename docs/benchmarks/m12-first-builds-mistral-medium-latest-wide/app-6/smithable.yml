smithable: 0.1
app:
  name: CleanSweep Invoicing
  description: A shared place for our cleaning company to manage monthly invoices to households.
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      address: text
      invoices: Invoice[]
    access:
      delete: [admin]
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      invoice: Invoice!
    access:
      delete: [admin]
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      dueOn:
        type: date
        formula: DATEADD(issuedOn, 30, "day")
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
    access:
      delete: [admin]
pages:
  clients:
    crud: Client
  invoice-lines:
    crud: InvoiceLine
  invoices:
    crud: Invoice
    actions: [markSent, markPaid]
  team:
    users: manage
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice.
