smithable: 0.1
app:
  name: Cleaning Invoices
  description: A shared place for our cleaning company to manage monthly invoices to households.
  currency: EUR
models:
  Client:
    fields:
      name: string!
      address: text
      email: email
      invoices: Invoice[]
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      dueOn: date! = DATEADD(issuedOn, 30, "day")
      status: draft | sent | paid | overdue
      total: money
pages:
  invoices:
    crud: Invoice
    actions: [markSent, markPaid]
    search: [number, client]
    filters: [status, client, issuedOn]
  clients:
    crud: Client
    search: [name, email, address]
  team:
    users: manage
  admin:
    data: all
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice.
