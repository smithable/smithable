smithable: 0.1
app:
  name: App
models:
  Client:
    fields:
      name: string!
      email: email
      address: text
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date!
      dueOn: date!
      status: draft | sent | paid
      total: money
pages:
  clients:
    crud: Client
    search: [name, email]
  invoices:
    crud: Invoice
    actions: [markSent, markPaid]
    filters: [status, client]
    search: [number, client]
  team:
    users: manage
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: sent
    set:
      status: paid
    intent: The client paid the invoice.
