smithable: 0.1
app:
  name: CleanSweep Invoicing
  description: Monthly invoicing for a small cleaning company.
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      address: text
      invoices: Invoice[]
  Invoice:
    fields:
      number: string! unique
      client: Client!
      issuedOn: date! = TODAY()
      dueOn: date! = DATEADD(issuedOn, 30, "day")
      status: draft | sent | paid | overdue
      total: money
