smithable: 0.1
app:
  name: Byggfirma CRM
  description: Ett enkelt CRM-system för en liten byggfirma för att hantera offerter, kunder och fakturor.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Quote:
    fields:
      number: string! unique
      status: draft | sent | accepted | rejected
      total: money!
      validUntil: date
      notes: text
      customer: Customer!
    access:
      delete: [admin]
  Invoice:
    fields:
      number: string! unique
      quote: Quote
      status: draft | sent | paid | overdue
      total: money!
      dueDate: date
      paidAt: datetime
      notes: text
      customer: Customer!
    access:
      delete: [admin]
  Customer:
    fields:
      name: string!
      email: email unique
      phone: phone
      segment: private | company | municipality
      notes: text
      accountManager: User
    access:
      delete: [admin]
pages:
  offerter:
    crud: Quote
    sortable: [number, total, validUntil, createdAt]
    actions: [acceptQuote, rejectQuote, sendQuote]
    search: [number, customer]
    filters: [status, customer]
  fakturor:
    crud: Invoice
    sortable: [number, total, dueDate, createdAt]
    actions: [markInvoicePaid, sendInvoice]
    search: [number, customer]
    filters: [status, customer]
  team:
    users: manage
  kunder:
    crud: Customer
    search: [name, email]
    sortable: [name, createdAt]
actions:
  acceptQuote:
    on: Quote
    when:
      status: sent
    set:
      status: accepted
    intent: Acceptera en offert.
  rejectQuote:
    on: Quote
    when:
      status: sent
    set:
      status: rejected
    intent: Avvisa en offert.
  markInvoicePaid:
    on: Invoice
    when:
      status: sent
    set:
      status: paid
      paidAt: NOW()
    intent: Markera en faktura som betald.
  sendQuote:
    on: Quote
    when:
      status: draft
    set:
      status: sent
    intent: Skicka en offert till kunden.
  sendInvoice:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: Skicka en faktura till kunden.
navigation: [kunder, offerter, fakturor, team]
