smithable: 0.1
app:
  name: Byggfirma CRM
  description: Ett enkelt CRM-system för en liten byggfirma för att hantera offerter, kunder och fakturor.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Customer:
    fields:
      name: string!
      email: email unique
      phone: phone
      notes: text
      accountManager: User
    access:
      delete: [admin]
  Quote:
    fields:
      number: string! unique
      customer: Customer!
      status: draft | sent | accepted | rejected
      total: money!
      description: text
      validUntil: date
    access:
      delete: [admin]
  Invoice:
    fields:
      number: string! unique
      customer: Customer!
      quote: Quote
      status: draft | sent | paid | overdue
      total: money!
      dueDate: date
      paidAt: datetime
    access:
      delete: [admin]
pages:
  kunder:
    crud: Customer
    search: [name, email]
    sortable: [name, createdAt]
  offerter:
    crud: Quote
    search: [number, customer]
    filters: [status, customer]
    sortable: [number, total, validUntil, createdAt]
    actions: [acceptQuote, rejectQuote]
  fakturor:
    crud: Invoice
    search: [number, customer]
    filters: [status, customer]
    sortable: [number, total, dueDate, createdAt]
    actions: [markInvoicePaid]
  anvandare:
    users: manage
actions:
  acceptQuote:
    on: Quote
    when:
      status: sent
    set:
      status: accepted
    intent: Acceptera en skickad offert.
  rejectQuote:
    on: Quote
    when:
      status: sent
    set:
      status: rejected
    intent: Avvisa en skickad offert.
  markInvoicePaid:
    on: Invoice
    when:
      status: sent
    set:
      status: paid
      paidAt: NOW()
    intent: Markera en skickad faktura som betald.
navigation: [kunder, offerter, fakturor, anvandare]
