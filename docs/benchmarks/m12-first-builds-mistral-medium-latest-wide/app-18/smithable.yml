smithable: 0.1
app:
  name: Byggfirma
  description: Håller koll på offerter, kunder och fakturor för en liten byggfirma.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Customer:
    fields:
      name: string!
      email: email
      phone: phone
      address: text
    access:
      delete: [admin]
  Invoice:
    fields:
      customer: Customer!
      title: string!
      amount: money!
      status: draft | sent | paid
      dueDate: date
      invoiceDate: date! = TODAY()
      quote: Quote
    access:
      delete: [admin]
  Quote:
    fields:
      customer: Customer!
      title: string!
      description: text
      amount: money!
      status: draft | sent | accepted | rejected
      validUntil: date
    access:
      delete: [admin]
pages:
  customers:
    crud: Customer
    search: [name, email, phone]
  invoices:
    crud: Invoice
    search: [title, customer]
    filters: [status, customer]
    sortable: [invoiceDate, dueDate, amount]
  quotes:
    crud: Quote
    search: [title, description, customer]
    filters: [status, customer]
    sortable: [createdAt, amount, validUntil]
navigation: [customers, quotes, invoices]
