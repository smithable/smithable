smithable: 0.1
app:
  name: Byggfirma CRM
  description: Ett enkelt CRM-system för en liten byggfirma för att hantera offerter, kunder och fakturor.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Quote:
    fields:
      number: string! unique
      status: utkast | skickad | accepterad | avvisad
      total: money!
      validUntil: date
      notes: text
      customer: Customer!
  Customer:
    fields:
      name: string!
      email: email unique
      phone: phone
      segment: privat | foretag | kommun
      notes: text
      accountManager: User
    ownedBy: accountManager
  Invoice:
    fields:
      number: string! unique
      customer: Customer!
      quote: Quote
      status: utkast | skickad | betald | forfallen
      total: money!
      dueDate: date
      paidAt: date
      notes: text
pages:
  offerter:
    crud: Quote
    search: [number, customer]
  team:
    users: manage
  kunder:
    crud: Customer
    search: [name, email]
  fakturor:
    crud: Invoice
    search: [number, customer]
navigation: [kunder, offerter, fakturor, team]
