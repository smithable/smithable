smithable: 0.1
app:
  name: Byggfirma CRM
  description: Ett enkelt CRM-system för en liten byggfirma för att hantera offerter, kunder och fakturor.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Quote:
    fields:
      number: string! unique
      status: draft | sent | accepted | rejected
      total: money!
      validUntil: date
      notes: text
      customer: Customer!
  Invoice:
    fields:
      number: string! unique
      quote: Quote
      status: draft | sent | paid | overdue
      total: money!
      dueDate: date
      paidAt: date
      notes: text
      customer: Customer!
  Customer:
    fields:
      name: string!
      email: email unique
      phone: phone
      segment: private | company | municipality
      notes: text
      accountManager: User
pages:
  offerter:
    crud: Quote
    search: [number, customer]
    filters: [status, customer]
  fakturor:
    crud: Invoice
    search: [number, customer]
    filters: [status, customer]
  kunder:
    crud: Customer
    search: [name, email]
  anvandare:
    users: manage
navigation: [kunder, offerter, fakturor, anvandare]
