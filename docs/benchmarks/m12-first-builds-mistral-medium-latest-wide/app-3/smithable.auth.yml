smithableAuth: 0.1
signIn:
  providers: [email]
defaultAccess: private
roles:
  admin:
    description: Salon staff. Manage stylists, services, and time slots.
  customer:
    description: A customer who books appointments.
    pages: [bookings]
    create: [Booking]
public:
  pages: [home]
  read: [Stylist, Service, TimeSlot]
defaultRole: customer
admins: [johan@smithable.ai]
