smithable: 0.1
app:
  name: Hair Salon Booking
  description: Online booking for a hair salon where customers pick a stylist and a free time themselves.
models:
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
    access:
      delete: [admin]
      create: [admin]
  Service:
    fields:
      name: string!
      description: text
      durationMinutes: int! = 30
      price: money!
    access:
      delete: [admin]
      create: [admin]
  AppointmentSlot:
    fields:
      stylist: Stylist!
      service: Service!
      startsAt: datetime!
      capacity: int! = 1
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
    access:
      delete: [admin]
      create: [admin]
  Booking:
    fields:
      appointmentSlot: AppointmentSlot! unique
      customerName: string!
      customerEmail: email!
      customerPhone: phone
      notes: text
    capacity:
      per: appointmentSlot
      max: appointmentSlot.capacity
pages:
  stylists:
    crud: Stylist
    access: [admin]
  services:
    crud: Service
    access: [admin]
  appointment-slots:
    crud: AppointmentSlot
    access: [admin]
  my-bookings:
    crud: Booking
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Service
      stylists:
        records: Stylist
