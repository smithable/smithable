smithable: 0.1
app:
  name: Hair Salon Booking
  description: Online booking for a hair salon where customers pick a stylist and a free time themselves.
models:
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
  Service:
    fields:
      name: string!
      description: text
      durationMinutes: int! = 30
      price: money!
  Appointment:
    fields:
      service: Service!
      stylist: Stylist!
      startsAt: datetime!
      customerName: string!
      customerEmail: email!
      customerPhone: phone
      status: booked | confirmed | canceled | completed
      notes: text
pages:
  stylists:
    crud: Stylist
    access: [admin]
  services:
    crud: Service
    access: [admin]
  appointments:
    crud: Appointment
    access: [admin]
    actions: [confirmAppointment, cancelAppointment, completeAppointment]
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Service
      stylists:
        records: Stylist
  schedule:
    calendar:
      model: Appointment
      starts: startsAt
  team:
    users: manage
  admin:
    data: all
navigation: [home, schedule, appointments, stylists, services, admin, team]
actions:
  confirmAppointment:
    on: Appointment
    when:
      status: booked
    set:
      status: confirmed
    intent: Confirm a booked appointment.
  cancelAppointment:
    on: Appointment
    when:
      status: [booked, confirmed]
    set:
      status: canceled
      notes:
    intent: Cancel an appointment.
  completeAppointment:
    on: Appointment
    when:
      status: confirmed
    set:
      status: completed
    intent: Mark an appointment as completed.
