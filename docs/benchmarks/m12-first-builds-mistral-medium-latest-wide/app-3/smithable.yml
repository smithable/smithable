smithable: 0.1
app:
  name: Hair Salon Booking
  description: Online booking for a hair salon where customers pick a stylist and a free time themselves.
models:
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
  Service:
    fields:
      name: string!
      description: text
      durationMinutes: int! = 30
      price: money!
  TimeSlot:
    fields:
      stylist: Stylist!
      service: Service!
      startsAt: datetime!
      capacity: int! = 1
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
  Booking:
    fields:
      timeSlot: TimeSlot! unique
      customerName: string!
      customerEmail: email!
      customerPhone: phone
      notes: text
    capacity:
      per: timeSlot
      max: timeSlot.capacity
pages:
  stylists:
    crud: Stylist
    access: [admin]
  services:
    crud: Service
    access: [admin]
  time-slots:
    crud: TimeSlot
    access: [admin]
  my-bookings:
    crud: Booking
  home:
    route: /
    landing:
      hero:
      footer:
      stylists:
        records: Stylist
      services:
        records: Service
