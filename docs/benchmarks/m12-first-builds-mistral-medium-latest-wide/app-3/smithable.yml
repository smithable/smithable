smithable: 0.1
app:
  name: Hair Salon Booking
  description: Online booking for a hair salon where customers pick a stylist and a free time themselves.
models:
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
  Service:
    fields:
      name: string!
      description: text
      durationMinutes: int! = 30
      price: money!
  Appointment:
    fields:
      service: Service!
      stylist: Stylist!
      startsAt: datetime!
      status: booked | confirmed | cancelled
      customerName: string!
      customerEmail: email!
      customerPhone: phone
pages:
  stylists:
    crud: Stylist
    access: [admin]
  services:
    crud: Service
    access: [admin]
  appointments:
    crud: Appointment
    access: [admin]
    actions: [confirmBooking, cancelBooking]
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Service
      stylists:
        records: Stylist
actions:
  confirmBooking:
    on: Appointment
    when:
      status: booked
    set:
      status: confirmed
  cancelBooking:
    on: Appointment
    when:
      status: [booked, confirmed]
    set:
      status: cancelled
