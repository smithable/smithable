smithable: 0.1
app:
  name: Hair Salon Booking
  description: Online booking for a hair salon where customers pick a stylist and a free time themselves.
models:
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
  Service:
    fields:
      name: string!
      description: text
      durationMinutes: int! = 30
      price: money!
  Appointment:
    fields:
      service: Service!
      stylist: Stylist!
      startsAt: datetime!
      customerName: string!
      customerEmail: email!
      status: pending | confirmed | cancelled | completed
pages:
  stylists:
    crud: Stylist
    access: [admin]
  services:
    crud: Service
    access: [admin]
  appointments:
    crud: Appointment
    access: [admin]
    filters: [status, stylist, service]
    search: [customerName, customerEmail]
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Service
      stylists:
        records: Stylist
  team:
    users: manage
  admin:
    data: all
navigation: [home, appointments, stylists, services, admin]
