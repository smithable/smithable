smithable: 0.1
app:
  name: Hair Salon Booking
  description: Online booking for a hair salon where customers pick a stylist and a free time themselves.
models:
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
    access:
      delete: [admin]
      create: [admin]
  Service:
    fields:
      name: string!
      description: text
      durationMinutes: int! = 30
      price: money!
    access:
      delete: [admin]
      create: [admin]
  Appointment:
    fields:
      service: Service!
      stylist: Stylist!
      startsAt: datetime!
      customerName: string!
      customerEmail: email!
      customerPhone: phone
      status: pending | confirmed | cancelled | completed
    access:
      delete: [admin]
pages:
  stylists:
    crud: Stylist
    access: [admin]
  services:
    crud: Service
    access: [admin]
  appointments:
    crud: Appointment
    access: [admin]
    filters: [stylist, service, status, startsAt]
    search: [customerName, customerEmail, customerPhone]
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Service
      stylists:
        records: Stylist
      contact:
  team:
    users: manage
