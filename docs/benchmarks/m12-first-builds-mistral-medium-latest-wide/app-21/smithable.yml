smithable: 0.1
app:
  name: Pieni Autokorjaamo
  description: "Pieni autokorjaamo: asiakkaat, autot, huoltotyöt ja laskut yhdessä paikassa."
  currency: EUR
  timezone: Europe/Helsinki
models:
  Customer:
    fields:
      name: string!
      email: email
      phone: phone
      notes: text
  Service:
    fields:
      name: string!
      description: text
      price: money!
  Invoice:
    fields:
      number: string! unique
      customer: Customer!
      status: draft | sent | paid | canceled
      total: money!
      dueDate: date
      issuedAt: datetime = NOW()
      workOrder: WorkOrder
  Car:
    fields:
      registrationNumber: string! unique
      make: string!
      model: string!
      year: int
      customer: Customer!
      notes: text
  WorkOrder:
    fields:
      number: string! unique
      customer: Customer!
      car: Car!
      status: pending | inProgress | completed | canceled
      description: text
      total: money
pages:
  asiakkaat:
    crud: Customer
    search: [name, email, phone]
    sortable: [name, createdAt]
  laskut:
    crud: Invoice
    search: [number, customer]
    sortable: [number, issuedAt, dueDate, status]
    filters: [status, customer, workOrder]
  tiimi:
    users: manage
  autot:
    crud: Car
    search: [registrationNumber, make, model]
    sortable: [registrationNumber, make, year]
  huoltotyot:
    crud: WorkOrder
    search: [number, description]
    filters: [status, car, customer]
    sortable: [number, status]
navigation: [asiakkaat, autot, huoltotyot, laskut, tiimi]
