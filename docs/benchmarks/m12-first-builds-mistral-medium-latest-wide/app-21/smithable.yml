smithable: 0.1
app:
  name: Pieni Autokorjaamo
  description: "Small car repair shop: customers, cars, maintenance jobs and invoices in one place."
  currency: EUR
models:
  Customer:
    fields:
      name: string!
      email: email!
      phone: phone
      address: text
      cars: Car[]
  Car:
    fields:
      registrationNumber: string! unique
      make: string!
      model: string!
      year: int
      customer: Customer!
      maintenanceJobs: MaintenanceJob[]
  Invoice:
    fields:
      number: string! unique
      customer: Customer!
      issuedOn: date! = TODAY()
      dueOn:
        type: date!
        default: DATEADD(issuedOn, 14, "day")
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
      maintenanceJob: MaintenanceJob
  InvoiceLine:
    fields:
      invoice: Invoice!
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
  MaintenanceJob:
    fields:
      car: Car!
      description: text!
      status: pending | inProgress | completed | cancelled
      startDate: date
      endDate: date
      invoice: Invoice
      estimatedCost: money
      actualCost: money
pages:
  customers:
    crud: Customer
  cars:
    crud: Car
  invoices:
    crud: Invoice
    actions: [markSent, markPaid]
  invoice-lines:
    crud: InvoiceLine
  maintenance-jobs:
    crud: MaintenanceJob
    actions: [startJob, completeJob]
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice was sent to the customer.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The customer paid the invoice.
  startJob:
    on: MaintenanceJob
    when:
      status: pending
    set:
      status: inProgress
      startDate: TODAY()
    intent: Start the maintenance job.
  completeJob:
    on: MaintenanceJob
    when:
      status: inProgress
    set:
      status: completed
      endDate: TODAY()
    intent: Complete the maintenance job.
outgoing:
  invoiceSent:
    when: markSent
    to: mail
    recipient: customer.email
