smithable: 0.1
app:
  name: Pieni autokorjaamo
  description: Asiakkaat, autot, huoltotyöt ja laskut yhdessä paikassa.
  currency: EUR
models:
  Customer:
    fields:
      name: string!
      email: email
      phone: phone
      address: text
      cars: Car[]
  Car:
    fields:
      registrationNumber: string! unique
      make: string!
      model: string!
      year: int
      customer: Customer!
      serviceJobs: ServiceJob[]
  ServiceJob:
    fields:
      car: Car!
      description: text!
      status: pending | inProgress | completed | cancelled
      startDate: date
      endDate: date
      totalCost: money
      invoice: Invoice
  Invoice:
    fields:
      number: string! unique
      customer: Customer!
      issuedOn: date! = TODAY()
      dueOn: date
      status: draft | sent | paid | overdue
      serviceJobs: ServiceJob[]
      total:
        type: money
        formula: SUM(serviceJobs.totalCost)
pages:
  asiakkaat:
    crud: Customer
    search: [name, email, phone]
  autot:
    crud: Car
    search: [registrationNumber, make, model]
  huoltotyot:
    crud: ServiceJob
    search: [description]
    filters: [status, car]
  laskut:
    crud: Invoice
    actions: [markSent, markPaid]
    filters: [status, customer]
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: Lasku lähetetty asiakkaalle.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: Asiakas on maksanut laskun.
