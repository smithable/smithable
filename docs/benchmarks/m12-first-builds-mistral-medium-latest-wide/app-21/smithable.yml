smithable: 0.1
app:
  name: Pieni autokorjaamo
  description: Asiakkaat, autot, huoltotyöt ja laskut yhdessä paikassa.
  currency: EUR
  timezone: Europe/Helsinki
models:
  Customer:
    fields:
      name: string!
      email: email
      phone: phone
      notes: text
  Car:
    fields:
      registrationNumber: string! unique
      make: string!
      model: string!
      year: int
      customer: Customer!
      notes: text
  Service:
    fields:
      name: string!
      description: text
      price: money!
  WorkOrder:
    fields:
      number: string! unique
      car: Car!
      status: pending | inProgress | completed | canceled
      description: text
      startDate: date
      endDate: date
      total: money
      notes: text
  WorkItem:
    fields:
      workOrder: WorkOrder!
      service: Service!
      quantity: int! = 1
      price: money
      notes: text
  Invoice:
    fields:
      number: string! unique
      workOrder: WorkOrder!
      customer: Customer!
      status: draft | sent | paid | canceled
      issueDate: date = TODAY()
      dueDate: date
      total: money!
      notes: text
pages:
  asiakkaat:
    crud: Customer
    search: [name, email, phone]
  autot:
    crud: Car
    search: [registrationNumber, make, model, customer]
  huoltotyot:
    crud: WorkOrder
    search: [number, car, status]
    filters: [status, startDate, endDate, car]
    actions: [startWork, completeWork, cancelWork]
  laskut:
    crud: Invoice
    search: [number, customer, workOrder, status]
    filters: [status, issueDate, dueDate, customer]
    actions: [sendInvoice, markPaid, cancelInvoice]
  palvelut:
    crud: Service
  tiimi:
    users: manage
actions:
  startWork:
    on: WorkOrder
    when:
      status: pending
    set:
      status: inProgress
      startDate: TODAY()
    intent: Aloita huoltotö.
  completeWork:
    on: WorkOrder
    when:
      status: inProgress
    set:
      status: completed
      endDate: TODAY()
    intent: Merkitse huoltotö valmiiksi.
  sendInvoice:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
      issueDate: TODAY()
    intent: Lähetä lasku asiakkaalle.
  markPaid:
    on: Invoice
    when:
      status: sent
    set:
      status: paid
    intent: Merkitse lasku maksetuksi.
  cancelWork:
    on: WorkOrder
    when:
      status: [pending, inProgress]
    set:
      status: canceled
    intent: Peruuta huoltotö.
  cancelInvoice:
    on: Invoice
    when:
      status: [draft, sent]
    set:
      status: canceled
    intent: Peruuta lasku.
navigation: [asiakkaat, autot, huoltotyot, laskut, palvelut, tiimi]
