smithable: 0.1
app:
  name: Pieni Autokorjaamo
  description: "Pieni autokorjaamo: asiakkaat, autot, huoltotyöt ja laskut yhdessä paikassa."
  currency: EUR
models:
  Customer:
    fields:
      name: string!
      email: email!
      phone: phone
      address: text
      cars: Car[]
  Car:
    fields:
      registrationNumber: string! unique
      make: string!
      model: string!
      year: int
      customer: Customer!
      serviceJobs: ServiceJob[]
  ServiceJob:
    fields:
      car: Car!
      description: text!
      status: pending | inProgress | completed | cancelled
      startDate: date
      endDate: date
      totalCost: money
      invoice: Invoice
  Invoice:
    fields:
      number: string! unique
      customer: Customer!
      serviceJob: ServiceJob
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid | overdue
      total: money
      lines: InvoiceLine[]
  InvoiceLine:
    fields:
      invoice: Invoice!
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount: money
pages:
  customers:
    crud: Customer
    search: [name, email, phone]
  cars:
    crud: Car
    search: [registrationNumber, make, model]
  service-jobs:
    crud: ServiceJob
    search: [description]
    filters: [status, car]
    sortable: [startDate, endDate, totalCost]
  invoices:
    crud: Invoice
    actions: [markSent, markPaid]
    filters: [status, customer]
    sortable: [issuedOn, dueOn, total]
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: Lasku lähetetty asiakkaalle.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: Asiakas on maksanut laskun.
