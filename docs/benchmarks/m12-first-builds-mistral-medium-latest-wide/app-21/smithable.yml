smithable: 0.1
app:
  name: Pieni autokorjaamo
  description: "Pieni autokorjaamo: asiakkaat, autot, huoltotyöt ja laskut yhdessä paikassa."
  currency: EUR
models:
  Customer:
    fields:
      name: string!
      email: email
      phone: phone
      address: text
      cars: Car[]
  Car:
    fields:
      registrationNumber: string! unique
      make: string!
      model: string!
      year: int
      customer: Customer!
      serviceJobs: ServiceJob[]
  ServiceJob:
    fields:
      description: string!
      status: pending | inProgress | completed | cancelled
      car: Car!
      startDate: date
      endDate: date
      notes: text
      invoice: Invoice
  Invoice:
    fields:
      number: string! unique
      customer: Customer!
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid | overdue
      total: money
pages:
  asiakkaat:
    crud: Customer
  autot:
    crud: Car
  huoltotyot:
    crud: ServiceJob
  laskut:
    crud: Invoice
  team:
    users: manage
