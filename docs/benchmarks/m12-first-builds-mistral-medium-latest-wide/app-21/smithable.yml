smithable: 0.1
app:
  name: Pieni autokorjaamo
  description: Asiakkaat, autot, huoltotyöt ja laskut yhdessä paikassa.
  currency: EUR
  timezone: Europe/Helsinki
models:
  Customer:
    fields:
      name: string!
      email: email
      phone: phone
      notes: text
  Car:
    fields:
      registrationNumber: string! unique
      make: string!
      model: string!
      year: int
      customer: Customer!
      notes: text
  Service:
    fields:
      name: string!
      description: text
      price: money!
  WorkOrder:
    fields:
      number: string! unique
      car: Car!
      status: pending | inProgress | completed | canceled
      description: text
      startDate: date
      endDate: date
      total: money
      notes: text
  WorkItem:
    fields:
      workOrder: WorkOrder!
      service: Service!
      quantity: decimal = 1
      unitPrice: money
      total:
        type: money
        formula: quantity * unitPrice
      notes: text
  Invoice:
    fields:
      number: string! unique
      workOrder: WorkOrder!
      customer: Customer!
      status: draft | sent | paid | canceled
      issueDate: date = TODAY()
      dueDate: date
      total: money
      notes: text
pages:
  asiakkaat:
    crud: Customer
    search: [name, email, phone]
  autot:
    crud: Car
    search: [registrationNumber, make, model]
  huoltotyot:
    crud: WorkOrder
    search: [number, description]
    filters: [status, car, startDate, endDate]
    actions: [markWorkOrderCompleted]
  laskut:
    crud: Invoice
    search: [number, customer]
    filters: [status, customer, issueDate, dueDate]
    actions: [markInvoiceSent, markInvoicePaid]
  palvelut:
    crud: Service
  team:
    users: manage
navigation: [asiakkaat, autot, palvelut, huoltotyot, laskut, team]
actions:
  markWorkOrderCompleted:
    on: WorkOrder
    when:
      status: inProgress
    set:
      status: completed
      endDate: TODAY()
  markInvoiceSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
      issueDate: TODAY()
  markInvoicePaid:
    on: Invoice
    when:
      status: sent
    set:
      status: paid
