smithable: 0.1
app:
  name: Pieni autokorjaamo
  description: Asiakkaat, autot, huoltotyöt ja laskut yhdessä paikassa.
  currency: EUR
  timezone: Europe/Helsinki
models:
  Customer:
    fields:
      name: string!
      email: email
      phone: phone
      notes: text
  Car:
    fields:
      registrationNumber: string! unique
      make: string!
      model: string!
      year: int
      customer: Customer!
      notes: text
  Service:
    fields:
      name: string!
      description: text
      price: money!
  WorkOrderLine:
    fields:
      service: Service!
      quantity: int! = 1
      unitPrice: money
      total:
        type: money
        formula: quantity * unitPrice
      workOrder: WorkOrder!
  WorkOrder:
    fields:
      number: string! unique
      car: Car!
      status: pending | inProgress | completed | canceled
      description: text
      total: money
pages:
  team:
    users: manage
