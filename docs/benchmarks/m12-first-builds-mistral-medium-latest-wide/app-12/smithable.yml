smithable: 0.1
app:
  name: Municipal Service Status
  description: Check the current status and outages of our municipality's online services.
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      summary: markdown
      updates: IncidentUpdate[]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
pages:
  incidents:
    crud: Incident
    search: [title, summary]
    filters: [status, component]
  updates:
    crud: IncidentUpdate
  components:
    crud: Component
    access: [admin]
  maintenance:
    crud: Maintenance
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Component
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
  overview:
    crud: Incident
  team:
    users: manage
actions:
  identified:
    custom: true
    input:
      incident: Incident!
    allow: [admin, staff]
    intent: The cause is found; the incident moves to identified.
  monitoring:
    custom: true
    input:
      incident: Incident!
    allow: [admin, staff]
    intent: A fix is out; the incident is watched before it is closed.
  resolve:
    custom: true
    input:
      incident: Incident!
    allow: [admin, staff]
    intent: The incident is over.
navigation: [overview, incidents, updates, maintenance, components, team]
