smithable: 0.1
app:
  name: Municipal Service Status
  description: Check the current status and outages of our municipality's online services.
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
    access:
      delete: [admin]
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      summary: text
      updates: IncidentUpdate[]
    access:
      delete: [admin, staff]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
    access:
      delete: [admin, staff]
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
    access:
      delete: [admin, staff]
pages:
  incidents:
    crud: Incident
  updates:
    crud: IncidentUpdate
  components:
    crud: Component
    access: [admin]
  maintenance:
    crud: Maintenance
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Component
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
  team:
    users: manage
  overview:
    data: all
navigation: [overview, incidents, updates, maintenance, components, team]
