smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
public:
  pages: [home]
  read: [Component, Incident, IncidentUpdate, Maintenance]
roles:
  admin:
    description: Runs the service status page and the team.
  staff:
    description: Writes incidents and their updates.
defaultRole: staff
admins: [johan@smithable.ai]
