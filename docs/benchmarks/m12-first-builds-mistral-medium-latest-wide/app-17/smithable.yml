smithable: 0.1
app:
  name: Min Frisörsalong
  description: Onlinebokning för frisörsalong där kunder kan boka tid själva.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Service:
    fields:
      name: string!
      description: text
      durationMinutes: int! = 30
      price: money!
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Booking:
    fields:
      customerName: string!
      customerEmail: email!
      customerPhone: phone
      appointment: Appointment! unique
    access:
      read: [owner]
      write: [owner]
      delete: [owner]
      create: [customer]
  Message:
    fields:
      name: string!
      email: email!
      message: text!
    access:
      read: [admin]
      write: [admin]
      delete: [admin]
  Appointment:
    fields:
      service: Service!
      stylist: Stylist!
      startsAt: datetime!
      capacity: int! = 1
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
pages:
  tjanster:
    crud: Service
    access: [admin]
  frisorer:
    crud: Stylist
    access: [admin]
  mina-bokningar:
    crud: Booking
    access: [customer]
  meddelanden:
    crud: Message
    access: [admin]
  hem:
    route: /
    landing:
      hero:
      footer:
      tjanster:
        records: Service
      frisorer:
        records: Stylist
      contact:
        form: Message
  tider:
    crud: Appointment
    access: [admin]
  schema:
    calendar:
      model: Appointment
      starts: startsAt
navigation: [hem, schema, mina-bokningar]
