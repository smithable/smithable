smithable: 0.1
app:
  name: Min Frisörsalong
  description: Onlinebokning för frisörsalong där kunder kan boka tid själva.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Service:
    fields:
      name: string!
      description: text
      durationMinutes: int! = 30
      price: money!
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Appointment:
    fields:
      service: Service!
      stylist: Stylist!
      startsAt: datetime!
      capacity: int! = 1
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Booking:
    fields:
      appointment: Appointment! unique
      customerName: string!
      customerEmail: email!
      customerPhone: phone
    access:
      create: [customer, admin]
      read: [owner, admin]
      write: [owner, admin]
      delete: [owner, admin]
pages:
  tjanster:
    crud: Service
    access: [admin]
  stylister:
    crud: Stylist
    access: [admin]
  tider:
    crud: Appointment
    access: [admin]
  mina-bokningar:
    crud: Booking
    access: [customer, admin]
  hem:
    route: /
    landing:
      hero:
      footer:
      tjanster:
        records: Service
      stylister:
        records: Stylist
  schema:
    calendar:
      model: Appointment
      starts: startsAt
