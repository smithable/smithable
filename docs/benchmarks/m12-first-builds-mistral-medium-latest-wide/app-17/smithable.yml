smithable: 0.1
app:
  name: Min Frisörsalong
  description: Onlinebokning för frisörsalong.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Service:
    fields:
      name: string!
      summary: text
      durationMinutes: int! = 30
      price: money!
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Stylist:
    fields:
      name: string!
      bio: text
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Booking:
    fields:
      customerName: string!
      customerEmail: email!
      customerPhone: phone
      appointment: Appointment! unique
    capacity:
      per: appointment
      max: appointment.capacity
  Message:
    fields:
      name: string!
      email: email!
      message: text!
    access:
      read: [admin]
      write: [admin]
      delete: [admin]
  Appointment:
    fields:
      service: Service!
      stylist: Stylist!
      startsAt: datetime!
      capacity: int! = 1
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
pages:
  tjanster:
    crud: Service
    access: [admin]
  frisorer:
    crud: Stylist
    access: [admin]
  boka-nu:
    crud: Booking
  mina-bokningar:
    crud: Booking
    mine: true
  hem:
    route: /
    landing:
      hero:
      footer:
      tjanster:
        records: Service
      frisorer:
        records: Stylist
      contact:
        form: Message
  team:
    users: manage
    access: [admin]
  admin:
    data: all
    access: [admin]
  tider:
    crud: Appointment
    access: [admin]
  schema:
    calendar:
      model: Appointment
      starts: startsAt
navigation: [hem, schema, boka-nu, mina-bokningar]
