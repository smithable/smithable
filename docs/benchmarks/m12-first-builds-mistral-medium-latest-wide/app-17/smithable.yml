smithable: 0.1
app:
  name: Min Frisörsalong
  description: Onlinebokning för frisörsalong.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Service:
    fields:
      name: string!
      description: text
      durationMinutes: int! = 30
      price: money!
    access:
      delete: [admin]
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
    access:
      delete: [admin]
  Appointment:
    fields:
      service: Service!
      stylist: Stylist!
      startsAt: datetime!
      capacity: int! = 1
      bookings: Booking[]
    access:
      delete: [admin]
  Booking:
    fields:
      appointment: Appointment! unique
      customerName: string!
      customerEmail: email!
      customerPhone: phone
    capacity:
      per: appointment
      max: appointment.capacity
pages:
  tjanster:
    crud: Service
    access: [admin]
  stylister:
    crud: Stylist
    access: [admin]
  tider:
    crud: Appointment
    access: [admin]
  mina-bokningar:
    crud: Booking
    access: [customer, admin]
  hem:
    route: /
    landing:
      hero:
      footer:
      tjanster:
        records: Service
      stylister:
        records: Stylist
  schema:
    calendar:
      model: Appointment
      starts: startsAt
navigation: [hem, schema, mina-bokningar]
