smithable: 0.1
app:
  name: Min Frisörsalong
  description: Onlinebokning för frisörsalong.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Service:
    fields:
      name: string!
      summary: text
      durationMinutes: int! = 30
      price: money!
    access:
      read: [admin]
      write: [admin]
      delete: [admin]
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
    access:
      read: [admin]
      write: [admin]
      delete: [admin]
  Booking:
    fields:
      customerName: string!
      customerEmail: email!
      customerPhone: phone
      appointment: Appointment! unique
    capacity:
      per: appointment
      max: appointment.capacity
  Message:
    fields:
      name: string!
      email: email!
      message: text!
    access:
      read: [admin]
      write: [admin]
      delete: [admin]
  Appointment:
    fields:
      service: Service!
      stylist: Stylist!
      startsAt: datetime!
      capacity: int! = 1
pages:
  tjanster:
    crud: Service
    access: [admin]
  stylister:
    crud: Stylist
    access: [admin]
  mina-bokningar:
    crud: Booking
  meddelanden:
    crud: Message
    access: [admin]
  hem:
    route: /
    landing:
      hero:
      footer:
      tjanster:
        records: Service
      stylister:
        records: Stylist
      contact:
        form: Message
  tider:
    crud: Appointment
    access: [admin]
  schema:
    calendar:
      model: Appointment
      starts: startsAt
