smithable: 0.1
app:
  name: Min Frisörsalong
  description: Bokningssystem för min frisörsalong där kunder kan boka tid själva på nätet.
models:
  Service:
    fields:
      name: string!
      description: text
      durationMinutes: int! = 30
      price: money!
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
  TimeSlot:
    fields:
      service: Service!
      stylist: Stylist!
      startsAt: datetime!
      capacity: int! = 1
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
  Booking:
    fields:
      timeSlot: TimeSlot! unique
      customerName: string!
      customerEmail: email!
      customerPhone: phone
      notes: text
    capacity:
      per: timeSlot
      max: timeSlot.capacity
pages:
  tjanster:
    crud: Service
  stylister:
    crud: Stylist
  tider:
    crud: TimeSlot
  mina-bokningar:
    crud: Booking
    mine: true
  hem:
    route: /
    landing:
      hero:
      footer:
      tjanster:
        records: Service
      stylister:
        records: Stylist
  integritetspolicy:
    route: /integritetspolicy
    legal: privacy
  schema:
    calendar:
      model: TimeSlot
      starts: startsAt
outgoing:
  bokningGjord:
    when: Booking created
    to: mail
    recipient: owner
  bokningAndrad:
    when: Booking changed
    to: mail
    recipient: owner
  bokningAvbokad:
    when: Booking deleted
    to: mail
    recipient: owner
navigation: [hem, schema, tjanster, stylister, mina-bokningar]
