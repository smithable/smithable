smithable: 0.1
app:
  name: Min Frisörsalong
  description: Bokningssystem för frisörsalong där kunder kan boka tid själva på nätet.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Service:
    fields:
      name: string!
      description: text
      durationMinutes: int! = 30
      price: money!
    access:
      delete: [admin]
      read: [admin]
      create: [admin]
      write: [admin]
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
    access:
      delete: [admin]
      read: [admin]
      create: [admin]
      write: [admin]
  Appointment:
    fields:
      service: Service!
      stylist: Stylist!
      startsAt: datetime!
      capacity: int! = 1
      bookings: Booking[]
    access:
      delete: [admin]
      read: [admin]
      create: [admin]
      write: [admin]
  Booking:
    fields:
      appointment: Appointment! unique
      customerName: string!
      customerEmail: email!
      customerPhone: phone
    capacity:
      per: appointment
      max: appointment.capacity
pages:
  tjanster:
    crud: Service
    access: [admin]
  stylister:
    crud: Stylist
    access: [admin]
  tider:
    crud: Appointment
    access: [admin]
  mina-bokningar:
    crud: Booking
  schema:
    calendar:
      model: Appointment
      starts: startsAt
  hem:
    route: /
    landing:
      hero:
      footer:
      tjanster:
        records: Service
      stylister:
        records: Stylist
      callToAction:
        button: schema
