smithable: 0.1
app:
  name: Min Frisörsalong
  description: Onlinebokning för frisörsalong där kunder kan boka tid själva.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Service:
    fields:
      name: string!
      description: text
      durationMinutes: int! = 30
      price: money!
    access:
      delete: [admin]
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
    access:
      delete: [admin]
  Session:
    fields:
      service: Service!
      stylist: Stylist!
      startsAt: datetime!
      capacity: int! = 1
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
    access:
      delete: [admin]
  Booking:
    fields:
      session: Session! unique
      customerName: string!
      customerEmail: email!
      customerPhone: phone
      notes: text
    capacity:
      per: session
      max: session.capacity
pages:
  services:
    crud: Service
    access: [admin]
  stylists:
    crud: Stylist
    access: [admin]
  sessions:
    crud: Session
    access: [admin]
  my-bookings:
    crud: Booking
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Service
      stylists:
        records: Stylist
  schedule:
    calendar:
      model: Session
      starts: startsAt
