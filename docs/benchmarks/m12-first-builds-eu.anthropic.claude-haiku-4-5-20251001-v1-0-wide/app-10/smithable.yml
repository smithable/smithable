smithable: 0.1
app:
  name: Museum Collection
  description: Browse the museum's collection of objects and their stories online.
  timezone: Europe/Mariehamn
models:
  Item:
    fields:
      name: string!
      summary: text
      kind: general | favorite | archived
      link: url
      addedOn: date! = TODAY()
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
pages:
  items:
    crud: Item
    search: [name, summary]
  home:
    route: /
    landing:
      hero:
      footer:
      items:
        records: Item
navigation: [items]
