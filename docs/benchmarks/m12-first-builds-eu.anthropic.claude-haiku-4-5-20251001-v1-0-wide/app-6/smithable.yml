smithable: 0.1
app:
  name: Cleaning Invoices
  description: Invoice management for a cleaning company serving households.
  currency: EUR
models:
  Household:
    fields:
      name: string!
      email: email!
      address: text
      invoices: Invoice[]
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      invoice: Invoice!
  Invoice:
    fields:
      number: string! unique
      household: Household!
      issuedOn: date! = TODAY()
      dueOn:
        type: date
        formula: DATEADD(issuedOn, 30, "day")
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
pages:
  households:
    crud: Household
  invoice-lines:
    crud: InvoiceLine
  invoices:
    crud: Invoice
    actions: [markSent, markPaid]
  team:
    users: manage
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the household.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The household paid the invoice.
