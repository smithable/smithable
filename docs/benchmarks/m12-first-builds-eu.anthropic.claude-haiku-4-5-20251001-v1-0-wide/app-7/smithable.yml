smithable: 0.1
app:
  name: Town Flea Market
  description: Buy and sell second-hand things in your town.
  currency: USD
models:
  Item:
    fields:
      title: string!
      photos: pictures
      description: text!
      price: money
      category: furniture | bikes | electronics | sports | kids | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
pages:
  home:
    route: /welcome
    landing:
      hero:
      footer:
      latest:
        records: Item
  catalog:
    route: /
    crud: Item
    search: [title, description, place]
    filters: [category, price, condition, available]
    sortable: [price, createdAt]
    favorites: true
    contact: owner
  myItems:
    crud: Item
    mine: true
  saved:
    crud: Item
    favorites: only
navigation: [catalog, myItems, saved]
