smithable: 0.1
app:
  name: Service Status
  description: Check the status of our municipality's online services and outages.
models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      summary: text
      updates: IncidentUpdate[]
    access:
      write: [admin, staff]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text
pages:
  components:
    route: /components
    crud: Component
    access: [admin]
  incidents:
    route: /incidents
    crud: Incident
    actions: [identified, monitoring, resolve]
  updates:
    route: /updates
    crud: IncidentUpdate
  maintenance:
    route: /maintenance
    crud: Maintenance
  home:
    route: /
    landing:
      hero:
      footer:
      services:
        records: Component
      open:
        records: Incident
        where:
          status: [investigating, identified, monitoring]
      recent:
        records: Incident
        where:
          status: resolved
      planned:
        records: Maintenance
  team:
    users: manage
  overview:
    data: all
actions:
  identified:
    on: Incident
    when:
      status: investigating
    set:
      status: identified
    add:
      IncidentUpdate:
        at: NOW()
        status: identified
        message: The cause is found and a fix is being worked on.
    allow: [admin, staff]
    intent: The cause is found; the incident moves to identified, with an update saying so.
  monitoring:
    on: Incident
    when:
      status: [investigating, identified]
    set:
      status: monitoring
    add:
      IncidentUpdate:
        at: NOW()
        status: monitoring
        message: A fix is out. We are watching before we close this.
    allow: [admin, staff]
    intent: A fix is out; the incident is watched before it is closed, with an update saying so.
  resolve:
    on: Incident
    when:
      status: [investigating, identified, monitoring]
    set:
      status: resolved
      resolvedAt: NOW()
    add:
      IncidentUpdate:
        at: NOW()
        status: resolved
        message: This incident is resolved.
    allow: [admin, staff]
    intent: The incident is over, with an update saying so. The component's state stays what the team sets.
navigation: [home, incidents, updates, maintenance, components, team]
