smithable: 0.1
app:
  name: Stillwater Yoga
  description: Class schedule, teachers and online booking for a yoga studio.
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: allLevels | beginner | advanced
      durationMinutes: int! = 60
      sessions: Session[]
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
      sessions: Session[]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
    namedBy: [classType, startsAt]
  Booking:
    fields:
      session: Session! unique
      attendee: User
    namedBy: session
    ownedBy: attendee
    capacity:
      per: session
      max: session.capacity
      closes: session.startsAt
      cancelUntil: session.startsAt
pages:
  sessions:
    crud: Session
  class-types:
    crud: ClassType
  instructors:
    crud: Instructor
  my-bookings:
    crud: Booking
  schedule:
    calendar:
      model: Session
      starts: startsAt
  home:
    route: /
    landing:
      hero:
        button: schedule
      classes:
        records: ClassType
      team:
        records: Instructor
      faq:
      footer:
  privacy:
    route: /privacy
    legal: privacy
outgoing:
  bookingMade:
    when: Booking created
    to: mail
    recipient: owner
