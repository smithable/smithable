      items: [{ question: Miten varaan paikan tunnille?, answer: "Kirjaudu sisään sähköpostikoodilla, valitse tunti tuntikalenterista ja paina Varaa-painiketta." }, { question: Voinko perua varauksen?, answer: "Voit perua varauksesi omista varauksistasi aina siihen asti, kun tunti alkaa." }, { question: Mitä jos tunti on täynnä?, answer: "Kun kaikki paikat on varattu, tunnille ei voi enää varata. Katso kalenterista toinen aika." }, { question: Sopiiko jooga aloittelijalle?, answer: "Kyllä. Tuntien tasot näkyvät tuntityypeissä, ja moni tunti sopii kaikille." }]
