smithable: 0.1
app:
  name: Allotment Society
  description: Keeps track of who has which allotment plot, the waiting list and each member's yearly fee.
  currency: EUR
models:
  Member:
    fields:
      name: string!
      email: email
      phone: phone
      joinedOn: date! = TODAY()
      notes: text
  Plot:
    fields:
      number: string! unique
      sizeSqm: int
      location: string
      status: vacant | let | reserved
      holder: Member
      notes: text
  WaitingEntry:
    fields:
      name: string!
      email: email
      phone: phone
      appliedOn: date! = TODAY()
      status: waiting | offered | allocated | withdrawn
      note: text
  Fee:
    fields:
      member: Member!
      year:
        type: int!
        min: 2000
        max: 2100
      amount: money!
      status: unpaid | paid
      paidOn: date
    unique: [{ fields: [member, year], scope: app }]
pages:
  plots:
    crud: Plot
    search: [number, location]
    filters: [status]
  members:
    crud: Member
    search: [name, email, phone]
  waiting-list:
    crud: WaitingEntry
    search: [name, email]
    filters: [status]
    actions: [offerPlot]
  fees:
    crud: Fee
    filters: [status, year, member]
    actions: [markPaid]
  team:
    users: manage
actions:
  markPaid:
    on: Fee
    when:
      status: unpaid
    set:
      status: paid
      paidOn: TODAY()
  offerPlot:
    on: WaitingEntry
    when:
      status: waiting
    set:
      status: offered
