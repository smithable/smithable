smithable: 0.1
app:
  name: Shoot Invoices
  description: "Invoices for my photography work: clients, shoots and what is still unpaid."
  currency: EUR
models:
  Client:
    fields:
      name: string!
      email: email!
      phone: phone
      address: text
  Shoot:
    fields:
      title: string!
      client: Client!
      shootDate: date!
      location: string
      notes: text
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
      invoice: Invoice!
  Invoice:
    fields:
      number: string! unique
      client: Client!
      shoot: Shoot
      issuedOn: date! = TODAY()
      dueOn: date
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
pages:
  clients:
    crud: Client
    search: [name, email]
  shoots:
    crud: Shoot
  invoice-lines:
    crud: InvoiceLine
  invoices:
    crud: Invoice
    filters: [client, status]
    actions: [markSent, markOverdue, markPaid]
  overview:
    dashboard:
      unpaid:
        sum: Invoice.total
        where:
          status: [sent, overdue]
      overdue:
        sum: Invoice.total
        where:
          status: overdue
      paid:
        sum: Invoice.total
        where:
          status: paid
      latest:
        list: Invoice
        limit: 5
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markOverdue:
    on: Invoice
    when:
      status: sent
    set:
      status: overdue
    intent: The invoice is late.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice.
