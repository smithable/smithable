smithable: 0.1
app:
  name: Car Log
  description: A log of my car's fuel, service visits and costs.
models:
  FuelUp:
    fields:
      fuelledOn: date! = TODAY()
      odometer: int!
      liters: decimal!
      totalCost: money!
      pricePerLiter:
        type: decimal
        formula: totalCost / liters
      fullTank: bool = true
      station: string
      note: text
  ServiceVisit:
    fields:
      visitedOn: date! = TODAY()
      odometer: int
      kind: maintenance | repair | inspection | tires | other
      garage: string
      description: text!
      cost: money
      nextDueOn: date
  Expense:
    fields:
      spentOn: date! = TODAY()
      category: insurance | tax | parking | toll | cleaning | other
      description: string!
      amount: money!
pages:
  fuel:
    crud: FuelUp
    search: [station, note]
    filters: [fuelledOn, fullTank]
  service:
    crud: ServiceVisit
    search: [garage, description]
    filters: [kind, visitedOn]
  expenses:
    crud: Expense
    search: [description]
    filters: [category, spentOn]
