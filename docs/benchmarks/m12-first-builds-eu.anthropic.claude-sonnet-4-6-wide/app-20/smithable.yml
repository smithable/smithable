smithable: 0.1
app:
  name: Joogastudio
  description: Tuntien aikataulu ja verkkovaraukset joogastudiolle.
  currency: EUR
  timezone: Europe/Helsinki
models:
  ClassType:
    fields:
      name: string!
      summary: text
      level: beginner | allLevels | advanced
      durationMinutes: int! = 60
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Instructor:
    fields:
      name: string!
      bio: markdown
      portrait: picture
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Session:
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Booking:
    fields:
      session: Session! unique
    capacity:
      per: session
      max: session.capacity
  Post:
    fields:
      title: string!
      address: string unique
      summary: text
      cover: picture
      body: markdown!
      publishedOn: date
      status: draft | published
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Message:
    fields:
      name: string!
      email: email!
      message: text!
    access:
      read: [admin]
      write: [admin]
      delete: [admin]
pages:
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule, blog]
      footer:
      classes:
        records: ClassType
      gallery:
      faq:
      news:
        records: Post
        where:
          status: published
      contact:
        form: Message
  schedule:
    calendar:
      model: Session
      starts: startsAt
  my-bookings:
    crud: Booking
  blog:
    articles: Post
  sessions:
    crud: Session
    access: [admin]
    search: [classType, instructor]
    filters: [classType, instructor, startsAt]
  class-types:
    crud: ClassType
    access: [admin]
    search: [name]
    filters: [level]
  instructors:
    crud: Instructor
    access: [admin]
  posts:
    crud: Post
    access: [admin]
    actions: [publish, unpublish]
    search: [title]
    filters: [status, publishedOn]
    sortable: [title, publishedOn, status]
  messages:
    crud: Message
    access: [admin]
  admin:
    data: all
  team:
    users: manage
actions:
  publish:
    on: Post
    when:
      status: draft
    set:
      status: published
      publishedOn: TODAY()
    intent: Julkaise artikkeli.
  unpublish:
    on: Post
    when:
      status: published
    set:
      status: draft
    intent: Palauta artikkeli luonnokseksi.
navigation: [home, schedule, blog, my-bookings, sessions, class-types, instructors, posts, messages, admin, team]
