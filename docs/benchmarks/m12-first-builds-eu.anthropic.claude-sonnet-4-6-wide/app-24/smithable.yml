smithable: 0.1
app:
  name: My AI Tasks
  description: Tasks and notes, grouped by project, that an AI assistant keeps for you.
models:
  Project:
    fields:
      name: string!
      description: text
      tasks: Task[]
      notes: Note[]
    access:
      create: [admin, member]
      write: [admin, member]
      delete: [admin, member]
  Task:
    fields:
      title: string!
      project: Project!
      status: todo | doing | done
      dueDate: date
      details: text
    access:
      write: [admin, member, assistant]
      delete: [admin, member]
  Note:
    fields:
      title: string!
      project: Project!
      body: text
    access:
      write: [admin, member, assistant]
      delete: [admin, member]
pages:
  team:
    users: manage
  admin:
    data: all
    access: [admin, member]
actions:
  complete:
    on: Task
    when:
      status: [todo, doing]
    set:
      status: done
    intent: Mark a task as done.
  reopen:
    on: Task
    when:
      status: done
    set:
      status: todo
    intent: Open a finished task again.
