smithable: 0.1
app:
  name: Min Frisörsalong
  description: Onlinebokning för frisörsalong – kunderna bokar tid själva på nätet.
  timezone: Europe/Stockholm
models:
  Service:
    fields:
      name: string!
      description: text
      durationMinutes: int! = 60
      price: money!
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Slot:
    fields:
      service: Service!
      stylist: Stylist!
      startsAt: datetime!
      capacity: int! = 1
      bookings: Booking[]
      placesLeft:
        type: int
        formula: capacity - COUNT(bookings)
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Booking:
    fields:
      slot: Slot! unique
    capacity:
      per: slot
      max: slot.capacity
  Message:
    fields:
      name: string!
      email: email!
      message: text!
    access:
      read: [admin]
      write: [admin]
      delete: [admin]
pages:
  home:
    route: /
    landing:
      hero:
        shortcuts: [schema, my-bookings]
      footer:
      features:
      tjanster:
        records: Service
      stylister:
        records: Stylist
      faq:
      contact:
        form: Message
  schema:
    calendar:
      model: Slot
      starts: startsAt
  my-bookings:
    crud: Booking
  slots:
    crud: Slot
    access: [admin]
    filters: [service, stylist]
  services:
    crud: Service
    access: [admin]
  stylists:
    crud: Stylist
    access: [admin]
  messages:
    crud: Message
    access: [admin]
  team:
    users: manage
navigation: [home, schema, my-bookings, slots, services, stylists, messages, team]
