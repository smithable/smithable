smithable: 0.1
app:
  name: Byggoffert
  description: Håll koll på offerter, kunder och fakturor för ett litet byggföretag.
  currency: SEK
  timezone: Europe/Stockholm
models:
  Customer:
    fields:
      name: string!
      email: email
      phone: phone
      address: text
      orgNumber: string
      quotes: Quote[]
      invoices: Invoice[]
  Quote:
    fields:
      number: string! unique
      customer: Customer!
      issuedOn: date! = TODAY()
      validUntil: date
      status: draft | sent | accepted | rejected
      description: text
      lines: QuoteLine[]
      total:
        type: money
        formula: SUM(lines.amount)
  QuoteLine:
    fields:
      quote: Quote!
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
  Invoice:
    fields:
      number: string! unique
      customer: Customer!
      quote: Quote
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
  InvoiceLine:
    fields:
      invoice: Invoice!
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
pages:
  customers:
    crud: Customer
    search: [name, email, phone]
  quotes:
    crud: Quote
    actions: [sendQuote, acceptQuote, rejectQuote]
    search: [number]
    filters: [status, customer]
  quote-lines:
    crud: QuoteLine
  invoices:
    crud: Invoice
    actions: [markSent, markPaid]
    search: [number]
    filters: [status, customer]
  invoice-lines:
    crud: InvoiceLine
  overview:
    dashboard:
      latestInvoices:
        list: Invoice
        limit: 5
  team:
    users: manage
actions:
  sendQuote:
    on: Quote
    when:
      status: draft
    set:
      status: sent
    intent: Offerten har skickats till kunden.
  acceptQuote:
    on: Quote
    when:
      status: sent
    set:
      status: accepted
    intent: Kunden har accepterat offerten.
  rejectQuote:
    on: Quote
    when:
      status: sent
    set:
      status: rejected
    intent: Kunden har avböjt offerten.
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: Fakturan har skickats till kunden.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: Kunden har betalat fakturan.
navigation: [overview, customers, quotes, invoices, team]
