smithable: 0.1
app:
  name: Birdwatching Club
  description: Record and share bird sightings for our birdwatching club.
models:
  Sighting:
    fields:
      species: string!
      place: string!
      seenOn: date! = TODAY()
      notes: text
pages:
  sightings:
    crud: Sighting
    search: [species, place]
    filters: [seenOn]
    sortable: [species, place, seenOn]
  home:
    route: /
    landing:
      hero:
      footer:
  team:
    users: manage
