smithable: 0.1
app:
  name: Piano Lessons
  description: Manage pupils, their weekly lesson times and what each one practises.
models:
  Pupil:
    fields:
      name: string!
      email: email
      phone: phone
      notes: text
  LessonSlot:
    fields:
      pupil: Pupil!
      dayOfWeek: monday | tuesday | wednesday | thursday | friday | saturday | sunday
      startTime: string!
      durationMinutes: int! = 30
  Repertoire:
    fields:
      pupil: Pupil!
      piece: string!
      composer: string
      status: learning | polishing | performanceReady
      notes: text
pages:
  pupils:
    crud: Pupil
    search: [name, email]
  lesson-slots:
    crud: LessonSlot
    search: [startTime]
    filters: [dayOfWeek, pupil]
    sortable: [dayOfWeek, startTime, durationMinutes]
  repertoire:
    crud: Repertoire
    search: [piece, composer]
    filters: [status, pupil]
    sortable: [piece, composer, status]
    actions: [markPerformanceReady, startPolishing]
actions:
  markPerformanceReady:
    on: Repertoire
    when:
      status: polishing
    set:
      status: performanceReady
    intent: Mark a piece as performance-ready.
  startPolishing:
    on: Repertoire
    when:
      status: learning
    set:
      status: polishing
    intent: Move a piece from learning to polishing.
