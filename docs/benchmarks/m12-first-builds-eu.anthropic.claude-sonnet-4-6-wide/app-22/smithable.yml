smithable: 0.1
app:
  name: Hofladen
  description: Produkte, Vorbestellungen und Abholzeiten für einen kleinen Hofladen.
  currency: EUR
  timezone: Europe/Berlin
models:
  Product:
    fields:
      name: string!
      description: text
      picture: picture
      price: money!
      unit: string! = Stück
      available: bool! = true
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  PickupSlot:
    fields:
      date: date!
      startTime: string!
      endTime: string!
      capacity: int! = 10
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Order:
    fields:
      pickupSlot: PickupSlot!
      name: string!
      email: email!
      phone: phone
      notes: text
      status: offen | bestaetigt | abgeholt | storniert
    capacity:
      per: pickupSlot
      max: pickupSlot.capacity
  OrderLine:
    fields:
      order: Order!
      product: Product!
      quantity: int! = 1
pages:
  products:
    crud: Product
    access: [admin]
    search: [name]
    filters: [available]
  pickup-slots:
    crud: PickupSlot
    access: [admin]
  home:
    route: /
    landing:
      hero:
      footer:
      produkte:
        records: Product
        where:
          available: true
      contact:
  team:
    users: manage
  orders:
    crud: Order
    actions: [confirm, markPickedUp, cancel]
    search: [name, email]
    filters: [status, pickupSlot]
  order-lines:
    crud: OrderLine
    access: [admin]
actions:
  confirm:
    on: Order
    when:
      status: offen
    set:
      status: bestaetigt
    intent: Bestellung bestätigen.
  markPickedUp:
    on: Order
    when:
      status: bestaetigt
    set:
      status: abgeholt
    intent: Bestellung als abgeholt markieren.
  cancel:
    on: Order
    when:
      status: [offen, bestaetigt]
    set:
      status: storniert
    intent: Bestellung stornieren.
