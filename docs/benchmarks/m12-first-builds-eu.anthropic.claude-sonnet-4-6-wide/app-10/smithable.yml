smithable: 0.1
app:
  name: Museum Collection
  description: Browse the museum's collection of objects and their stories.
pages:
  home:
    route: /
    landing:
      hero:
      footer:
      featured:
        records: MuseumObject
        where:
          featured: true
      callToAction:
        button: objects
  team:
    users: manage
  objects:
    crud: MuseumObject
    search: [name, category, period, material, origin]
    filters: [status, featured, acquisitionDate]
    sortable: [name, acquisitionDate, category, period]
    actions: [putOnDisplay, moveToStorage, lendOut]
models:
  MuseumObject:
    fields:
      name: string!
      summary: text
      story: text
      category: string
      period: string
      material: string
      origin: string
      acquisitionDate: date
      image: url
      featured: bool = false
      status: onDisplay | inStorage | onLoan
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
actions:
  putOnDisplay:
    on: MuseumObject
    when:
      status: [inStorage, onLoan]
    set:
      status: onDisplay
    intent: Mark the object as currently on display in the museum.
    allow: [admin]
  moveToStorage:
    on: MuseumObject
    when:
      status: [onDisplay, onLoan]
    set:
      status: inStorage
    intent: Move the object to storage.
    allow: [admin]
  lendOut:
    on: MuseumObject
    when:
      status: [onDisplay, inStorage]
    set:
      status: onLoan
    intent: Mark the object as on loan to another institution.
    allow: [admin]
navigation: [objects, team]
