smithableUx: 0.1
theme:
  preset: editorial
pages:
  objects:
    table:
      columns: [name, category, period, status]
      below:
        name: summary
      view: cards
    form:
      sections: [{ name: details, fields: [name, category, period, material, origin, acquisitionDate] }, { name: description, fields: [summary, story] }, { name: display, fields: [image, featured, status] }]
      columns: 2
      control:
        story: textarea
        summary: textarea
        featured: switch
    icon: layers
tones:
  MuseumObject.status:
    onDisplay: success
    onLoan: warning
