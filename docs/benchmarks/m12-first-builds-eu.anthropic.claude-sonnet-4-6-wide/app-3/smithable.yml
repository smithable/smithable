smithable: 0.1
app:
  name: StyleBook
  description: "Online booking for a hair salon: customers pick a stylist and a free time themselves."
models:
  ServiceType:
    fields:
      name: string!
      description: text
      durationMinutes: int! = 60
      price: money!
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Stylist:
    fields:
      name: string!
      bio: text
      portrait: picture
      email: email
    access:
      create: [admin]
      write: [admin]
      delete: [admin]
  Appointment:
    fields:
      stylist: Stylist!
      serviceType: ServiceType!
      startsAt: datetime!
      notes: text
      status: pending | confirmed | cancelled | completed
  Message:
    fields:
      name: string!
      email: email!
      message: text!
    access:
      read: [admin]
      write: [admin]
      delete: [admin]
pages:
  home:
    route: /
    landing:
      hero:
        shortcuts: [schedule, my-appointments]
      footer:
      features:
      services:
        records: ServiceType
      faq:
      contact:
        form: Message
      callToAction:
        button: schedule
  schedule:
    calendar:
      model: Appointment
      starts: startsAt
  my-appointments:
    crud: Appointment
    mine: true
    filters: [stylist, serviceType, status, startsAt]
  stylists:
    crud: Stylist
    access: [admin]
  service-types:
    crud: ServiceType
    access: [admin]
  appointments:
    crud: Appointment
    access: [admin]
    search: [status]
    filters: [stylist, serviceType, status, startsAt]
  messages:
    crud: Message
    access: [admin]
  team:
    users: manage
actions:
  confirm:
    on: Appointment
    when:
      status: pending
    set:
      status: confirmed
    allow: [admin]
    intent: Confirm a pending appointment.
  complete:
    on: Appointment
    when:
      status: confirmed
    set:
      status: completed
    allow: [admin]
    intent: Mark an appointment as completed.
  cancel:
    on: Appointment
    when:
      status: [pending, confirmed]
    set:
      status: cancelled
    intent: Cancel an appointment.
navigation: [home, schedule, my-appointments, appointments, stylists, service-types, messages, team]
