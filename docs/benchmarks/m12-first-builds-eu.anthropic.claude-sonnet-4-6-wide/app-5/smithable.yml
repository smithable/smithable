smithable: 0.1
app:
  name: ShootBill
  description: "Invoicing for photographers: manage clients, shoots and track unpaid invoices."
  currency: USD
models:
  BusinessProfile:
    fields:
      businessName: string!
      vatNumber: string
      iban: string
      paymentTermDays: int! = 30
      invoiceFooter: text
  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      invoices: Invoice[]
  Shoot:
    fields:
      name: string!
      client: Client!
      shootDate: date!
      location: string
      notes: text
      invoices: Invoice[]
  Invoice:
    fields:
      number: string! unique
      client: Client!
      shoot: Shoot
      issuedOn: date! = TODAY()
      dueOn: date!
      status: draft | sent | paid | overdue
      lines: InvoiceLine[]
      total:
        type: money
        formula: SUM(lines.amount)
  InvoiceLine:
    fields:
      invoice: Invoice!
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: quantity * unitPrice
actions:
  markSent:
    on: Invoice
    when:
      status: draft
    set:
      status: sent
    intent: The invoice went to the client.
  markPaid:
    on: Invoice
    when:
      status: [sent, overdue]
    set:
      status: paid
    intent: The client paid the invoice.
pages:
  home:
    route: /
    landing:
      hero:
      footer:
      features:
  overview:
    dashboard:
      latest:
        list: Invoice
        limit: 5
  invoices:
    crud: Invoice
    search: [number, status]
    filters: [status, client, shoot, issuedOn, dueOn]
  shoots:
    crud: Shoot
    search: [name, location]
    filters: [client, shootDate]
  clients:
    crud: Client
    search: [name, email]
  invoice-lines:
    crud: InvoiceLine
  team:
    users: manage
navigation: [overview, invoices, shoots, clients, team]
