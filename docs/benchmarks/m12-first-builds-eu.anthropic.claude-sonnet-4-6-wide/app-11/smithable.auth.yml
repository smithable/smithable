smithableAuth: 0.1
signIn:
  providers: [email]
  selfSignUp: false
defaultAccess: shared
public:
  pages: [home]
  read: [Component, Incident, IncidentUpdate, Maintenance]
roles:
  admin:
    description: Runs the status board and the team.
  staff:
    description: Writes incidents and their updates.
defaultRole: staff
api:
  models: [Component, Incident]
  actions: [resolve]
  assistants: true
admins: [johan@smithable.ai]
