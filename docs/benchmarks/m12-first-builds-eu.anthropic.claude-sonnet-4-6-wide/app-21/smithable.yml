smithable: 0.1
app:
  name: AutoHuolto
  description: "Pieni autokorjaamo: asiakkaat, autot, huoltotyöt ja laskut yhdessä paikassa."
  currency: EUR
  timezone: Europe/Helsinki
models:
  Customer:
    fields:
      name: string!
      email: email unique
      phone: phone
      address: string
      notes: text
      cars: Car[]
    access:
      delete: [admin]
  Car:
    fields:
      customer: Customer!
      make: string!
      model: string!
      year: int
      licensePlate: string! unique
      vin: string unique
      mileage: int
      serviceJobs: ServiceJob[]
    access:
      delete: [admin]
  InvoiceLine:
    fields:
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      total:
        type: money
        formula: quantity * unitPrice
      invoice: Invoice!
  ServiceJob:
    fields:
      car: Car!
      description: text!
      status: avoin | tyonalla | valmis | laskutettu
      scheduledDate: date
      completedDate: date
      mechanicNotes: text
  Invoice:
    fields:
      number: string! unique
      serviceJob: ServiceJob!
      status: luonnos | lahetetty | maksettu | peruutettu
      issuedDate: date
      dueDate: date
      notes: text
    access:
      delete: [admin]
pages:
  customers:
    crud: Customer
    search: [name, email, phone]
  cars:
    crud: Car
    search: [licensePlate, vin, make, model]
    filters: [customer]
  team:
    users: manage
    access: [admin]
  service-jobs:
    crud: ServiceJob
    search: [status]
    filters: [status, scheduledDate]
    sortable: [scheduledDate, completedDate]
    actions: [startWork, completeJob, markInvoiced]
  invoices:
    crud: Invoice
    search: [number]
    filters: [status, issuedDate, dueDate]
    sortable: [number, issuedDate, dueDate]
    actions: [sendInvoice, markPaid, cancelInvoice]
actions:
  startWork:
    on: ServiceJob
    when:
      status: avoin
    set:
      status: tyonalla
    intent: Merkitse huoltotyö aloitetuksi.
  completeJob:
    on: ServiceJob
    when:
      status: tyonalla
    set:
      status: valmis
      completedDate: TODAY()
    intent: Merkitse huoltotyö valmiiksi.
  markInvoiced:
    on: ServiceJob
    when:
      status: valmis
    set:
      status: laskutettu
    intent: Merkitse huoltotyö laskutetuksi.
  sendInvoice:
    on: Invoice
    when:
      status: luonnos
    set:
      status: lahetetty
      issuedDate: TODAY()
    intent: Lähetä lasku asiakkaalle.
  markPaid:
    on: Invoice
    when:
      status: lahetetty
    set:
      status: maksettu
    intent: Merkitse lasku maksetuksi.
  cancelInvoice:
    on: Invoice
    when:
      status: [luonnos, lahetetty]
    set:
      status: peruutettu
    intent: Peruuta lasku.
navigation: [customers, cars, service-jobs, invoices, team]
