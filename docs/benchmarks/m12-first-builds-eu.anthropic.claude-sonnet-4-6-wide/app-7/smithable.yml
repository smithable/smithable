smithable: 0.1
app:
  name: Town Flea Market
  description: Browse and sell second-hand items at your local town flea market.
models:
  Item:
    fields:
      title: string!
      photos: pictures
      description: text!
      price: money
      category: clothing | furniture | electronics | bikes | sports | kids | books | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
    access:
      delete: [admin, owner]
pages:
  home:
    route: /
    landing:
      hero:
      footer:
      latest:
        records: Item
  myItems:
    crud: Item
    mine: true
  saved:
    crud: Item
    favorites: only
  team:
    users: manage
  catalog:
    crud: Item
    search: [title, description, place]
    filters: [category, price, condition, available]
    sortable: [price, createdAt]
    favorites: true
    contact: owner
actions:
  markSold:
    on: Item
    when:
      available: true
    set:
      available: false
    intent: Mark an item as sold.
navigation: [catalog, myItems, saved, team]
