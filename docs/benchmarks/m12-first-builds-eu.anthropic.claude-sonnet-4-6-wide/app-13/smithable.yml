smithable: 0.1
app:
  name: My Car Log
  description: A personal log of fuel fill-ups, service visits and costs for my car.
models:
  Car:
    fields:
      make: string!
      model: string!
      year: int!
      licensePlate: string
      notes: text
  FuelLog:
    fields:
      car: Car!
      date: date! = TODAY()
      odometer: int!
      liters: decimal!
      pricePerLiter: money!
      totalCost:
        type: money
        formula: liters * pricePerLiter
      station: string
      fullTank: bool! = true
      notes: text
  ServiceVisit:
    fields:
      car: Car!
      date: date! = TODAY()
      odometer: int!
      type: routine | repair | inspection | tires | other
      description: text!
      workshop: string
      cost: money!
      nextServiceDate: date
      nextServiceOdometer: int
      notes: text
  Expense:
    fields:
      car: Car!
      date: date! = TODAY()
      category: insurance | tax | parking | toll | wash | accessories | other
      description: string!
      cost: money!
      notes: text
pages:
  cars:
    crud: Car
    search: [make, model, licensePlate]
  fuel:
    crud: FuelLog
    search: [station]
    filters: [car, fullTank, date]
  service:
    crud: ServiceVisit
    search: [description, workshop]
    filters: [car, type, date]
    sortable: [date, odometer, cost]
  expenses:
    crud: Expense
    search: [description]
    filters: [car, category, date]
    sortable: [date, cost]
  overview:
    dashboard:
      totalFuelCost:
        sum: FuelLog.totalCost
      totalServiceCost:
        sum: ServiceVisit.cost
      totalOtherExpenses:
        sum: Expense.cost
      recentFuel:
        list: FuelLog
        limit: 5
      recentService:
        list: ServiceVisit
        limit: 5
navigation: [overview, cars, fuel, service, expenses]
