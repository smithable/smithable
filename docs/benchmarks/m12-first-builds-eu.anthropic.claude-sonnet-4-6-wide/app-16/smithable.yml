smithable: 0.1
app:
  name: Our Allotment Society
  description: Manage allotment plots, the waiting list, and yearly membership fees.
  currency: GBP
  timezone: Europe/London
models:
  Plot:
    fields:
      number: string! unique
      sizeM2: decimal
      status: available | occupied | maintenance
      notes: text
  Member:
    fields:
      name: string!
      email: email! unique
      phone: phone
      joinedOn: date! = TODAY()
  Tenancy:
    fields:
      plot: Plot!
      member: Member!
      startDate: date! = TODAY()
      endDate: date
      active: bool! = true
  WaitingListEntry:
    fields:
      member: Member!
      appliedOn: date! = TODAY()
      notes: text
      status: waiting | offered | withdrawn
  Fee:
    fields:
      member: Member!
      year: int!
      amount: money!
      dueDate: date!
      status: unpaid | paid | waived
      paidOn: date
pages:
  plots:
    crud: Plot
    search: [number, notes]
    filters: [status]
  members:
    crud: Member
    search: [name, email, phone]
  tenancies:
    crud: Tenancy
    actions: [endTenancy]
    filters: [active, plot, member]
  waiting-list:
    crud: WaitingListEntry
    actions: [offerPlot, withdrawApplication]
    search: [notes]
    filters: [status, member]
  fees:
    crud: Fee
    actions: [markPaid, waivedFee]
    filters: [status, year, member]
  home:
    route: /
    landing:
      hero:
      footer:
      plots:
        records: Plot
  overview:
    dashboard:
      totalPlots:
        count: Plot
      availablePlots:
        count: Plot
        where:
          status: available
      waitingList:
        count: WaitingListEntry
        where:
          status: waiting
      unpaidFees:
        count: Fee
        where:
          status: unpaid
      feesCollected:
        sum: Fee.amount
        where:
          status: paid
      recentMembers:
        list: Member
        limit: 5
  team:
    users: manage
actions:
  markPaid:
    on: Fee
    when:
      status: unpaid
    set:
      status: paid
      paidOn: TODAY()
    intent: Mark a fee as paid, recording today as the payment date.
  waivedFee:
    on: Fee
    when:
      status: unpaid
    set:
      status: waived
    intent: Waive a fee for a member.
  offerPlot:
    on: WaitingListEntry
    when:
      status: waiting
    set:
      status: offered
    intent: Offer a plot to someone on the waiting list.
  withdrawApplication:
    on: WaitingListEntry
    when:
      status: [waiting, offered]
    set:
      status: withdrawn
    intent: Mark a waiting list application as withdrawn.
  endTenancy:
    on: Tenancy
    when:
      active: true
    set:
      active: false
      endDate: TODAY()
    intent: End a tenancy, recording today as the end date.
navigation: [overview, plots, members, tenancies, waiting-list, fees, team]
