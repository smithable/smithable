smithable: 0.1
app:
  name: Agency Pipeline
  description: Sales pipeline for a web agency to track leads, deals and follow-ups.
  currency: EUR
  timezone: Europe/London
models:
  FollowUp:
    fields:
      assignedTo: User
      dueDate: date!
      type: call | email | meeting | proposal | other
      notes: text
      status: pending | done | skipped
      lead: Lead
      deal: Deal
    ownedBy: assignedTo
    access:
      delete: [admin]
  Lead:
    fields:
      companyName: string!
      contactName: string!
      email: email
      phone: phone
      source: referral | website | coldOutreach | event | other
      service: webDesign | webDevelopment | seo | maintenance | other
      estimatedValue: money
      notes: text
      assignedTo: User
    ownedBy: assignedTo
    access:
      delete: [admin]
  Deal:
    fields:
      title: string!
      lead: Lead
      companyName: string!
      contactName: string!
      email: email
      phone: phone
      service: webDesign | webDevelopment | seo | maintenance | other
      value: money!
      stage: proposal | negotiation | contract | won | lost
      closedAt: date
      lostReason: text
      notes: text
      assignedTo: User
    ownedBy: assignedTo
    access:
      delete: [admin]
pages:
  follow-ups:
    crud: FollowUp
    search: [notes]
    sortable: [dueDate]
    actions: [completeFollowUp, skipFollowUp]
    filters: [status, type, dueDate]
  team:
    users: manage
  overview:
    dashboard:
      pendingFollowUps:
        count: FollowUp
        where:
          status: pending
      openLeads:
        count: Lead
      activeDeals:
        count: Deal
        where:
          stage: [proposal, negotiation, contract]
      pipelineValue:
        sum: Deal.value
        where:
          stage: [proposal, negotiation, contract]
      wonDeals:
        count: Deal
        where:
          stage: won
      wonRevenue:
        sum: Deal.value
        where:
          stage: won
      recentDeals:
        list: Deal
        limit: 5
  leads:
    crud: Lead
    search: [companyName, contactName, email]
    filters: [source, service]
    sortable: [companyName, estimatedValue]
    actions: [qualifyLead]
  deals:
    crud: Deal
    search: [title, companyName, contactName, email]
    filters: [stage, service, closedAt]
    sortable: [title, value, closedAt]
    actions: [markWon, markLost]
actions:
  completeFollowUp:
    on: FollowUp
    when:
      status: pending
    set:
      status: done
    intent: Mark a follow-up as done.
  skipFollowUp:
    on: FollowUp
    when:
      status: pending
    set:
      status: skipped
    intent: Mark a follow-up as skipped.
  qualifyLead:
    on: Lead
    set:
      notes:
    intent: Convert a qualified lead into a deal.
  markWon:
    on: Deal
    when:
      stage: [proposal, negotiation, contract]
    set:
      stage: won
      closedAt: TODAY()
    intent: Mark a deal as won.
  markLost:
    on: Deal
    when:
      stage: [proposal, negotiation, contract]
    set:
      stage: lost
      closedAt: TODAY()
      lostReason:
    intent: Mark a deal as lost and record the reason.
navigation: [overview, leads, deals, follow-ups, team]
