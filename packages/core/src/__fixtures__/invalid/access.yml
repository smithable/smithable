smithable: 0.1
app: { name: Access }
models:
  User:                                   # expect: reserved-name
    fields: { name: string }
  Customer:
    fields:
      name: string!
      manager: User
      helpers: User[]                     # expect: invalid-field
    ownedBy: name                         # expect: invalid-owner
    access:
      create: [owner]                     # expect: invalid-role
      remove: [admin]                     # expect: unknown-key
pages:
  customers:
    crud: Customer
    access: [owner]                       # expect: invalid-role
  sign-in:                                # expect: reserved-route
    crud: Customer
