smithable: 0.1
app: { name: Access }
models:
  User:                                   # expect: reserved-name
    fields: { name: string }
  Customer:
    fields:
      name: string!
      manager: User
      helpers: User[]                     # expect: invalid-field
    ownedBy: name                         # expect: invalid-owner
    access:                               # expect: moved-key
      create: [owner]
actions:
  archive:
    custom: true
    input: { customer: Customer! }
    allow: [admin]                        # expect: moved-key
pages:
  customers:
    crud: Customer
    access: [owner]                       # expect: moved-key
    search: [name, nam, helpers]          # expect: unknown-field, invalid-search
  sign-in:                                # expect: reserved-route
    crud: Customer
