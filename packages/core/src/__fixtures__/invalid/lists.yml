smithable: 0.1
app: { name: Torget }
models:
  Item:
    fields:
      title: string!
      description: text
      cover: picture unique                    # expect: invalid-field
      photos: pictures
      price: money
      category: furniture | other
      seller: User
  Tag:
    fields:
      name: string!
      item: Item
pages:
  catalogue:
    crud: Item
    filters: [description, photos, nope, category, category]   # expect: invalid-filter, invalid-filter, unknown-field, duplicate-field
    sortable: [photos, description, owner]    # expect: invalid-sort, invalid-sort, unknown-field
    favourites: maybe                         # expect: invalid-value
    mine: maybe                               # expect: expected-boolean
    contact: title                            # expect: invalid-contact
  kept:
    crud: Item
    contact: { to: owner, keep: Tag }         # expect: invalid-value
  nobody:
    crud: Item
    contact: { keep: Tag }                    # expect: missing-key
  home:
    route: /
    landing:
      hero: { search: true }                  # expect: invalid-key
      features: { filters: [category] }       # expect: invalid-key
      latest: { records: Item, filters: [description] }   # expect: invalid-filter
  overview:
    dashboard:
      items: { count: Item }
    filters: [category]                       # expect: invalid-key
    favourites: true                          # expect: invalid-key
    mine: true                                # expect: invalid-key
