smithable: 0.1
app:
  name: Broken actions
models:
  Customer:
    fields:
      name: string!
      status: lead | active | lost
      active: bool
      total:
        type: money
        formula: 2 * 3
      since: date
      logo: picture
      notes: text
  Order:
    fields:
      ref: string! unique
      lines: Line[]
  Line:
    fields:
      order: Order!
      qty: int
      note: text!
  Shipment:
    fields:
      order: Order!
      customer: Customer!
      note: text
actions:
  merge:                           # expect: missing-key
    input: { keep: Customer! }
  archive:
    custom: true
    on: Customer                   # expect: invalid-action
  notify:
    custom: true
    input:
      who: Custmer!                # expect: unknown-model
      all: User[]                  # expect: invalid-field
      when: date = 2026-01-01      # expect: invalid-field
  Export:                          # expect: invalid-name
    custom: true
  win:
    on: Custmer                    # expect: unknown-model
    set: { status: active }
  activate:
    on: Customer
    when: { status: leed }         # expect: unknown-value
    set:
      status: actve                # expect: invalid-default
      total: 10                    # expect: invalid-set
      logo: x                      # expect: invalid-set
      nmae: x                      # expect: unknown-field
      since: NOW() & "x"           # expect: invalid-formula
      notes:                       # asked for
  half:
    on: Customer                   # expect: missing-key
  addToNothing:
    on: Customer
    add:
      Order: { ref: x }            # expect: invalid-add
  addMissing:
    on: Order
    add:
      Line: { qty: 1 }             # expect: invalid-add
  addOther:
    on: Order
    add:
      Shipment: { note: x }        # expect: invalid-add
  addBack:
    on: Order
    add:
      Line:
        order: 1                   # expect: invalid-add
        note: x
  copyAndSet:
    on: Customer
    set: { status: lost }
    copy: {}                       # expect: invalid-action
  copyUnique:
    on: Order
    copy: { ref: R-1 }             # expect: invalid-copy
  copyBadList:
    on: Customer
    copy: {}
    with: [notalist]               # expect: invalid-copy
  meNotUser:
    on: Customer
    set: { notes: ME() }           # expect: invalid-set
  withInput:
    on: Customer
    set: { status: lost }
    input: { why: text }           # expect: invalid-action
  again:
    on: Customer
    when: { status: lost }
    set: { status: lost }          # expect: action-changes-nothing
  remind:
    on: Customer
    when: { status: lost }
    set: { status: lost, since: TODAY() }
    rules:                         # expect: rules-not-enforced
      - Only lost customers.
pages:
  leads:
    crud: Customer
    actions: [again]
  other:
    crud: Order
    actions: [again]               # expect: invalid-action
  front:
    landing: { hero: {} }
    actions: [again]               # expect: invalid-key
  overview:
    dashboard: { open: { count: Customer } }
    actions: [again]               # expect: invalid-key
  customers:
    crud: Customer
    actions: [notfy]               # expect: unknown-action
