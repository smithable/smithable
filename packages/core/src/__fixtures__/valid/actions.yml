smithable: 0.1
app:
  name: Actions
models:
  Customer:
    fields:
      name: string!
actions:
  mergeCustomers:
    custom: true
    input: { keep: Customer!, duplicate: Customer! }
    intent: Merge a duplicate customer record into the one we keep.
    rules:
      - All orders of the duplicate move to the kept customer.
  sendNewsletter:
    custom: true
    input: { subject: string!, segment: all | active }
    output: { sent: int! }
pages:
  customers:
    crud: Customer
    actions: [mergeCustomers, sendNewsletter]
