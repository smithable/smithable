smithable: 0.1
app:
  name: Standard actions
models:
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      resolvedAt: datetime
      followUp: date
      pinned: bool
      severity: int
      note: text
      updates: IncidentUpdate[]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
actions:
  resolve:
    on: Incident
    when: { status: [investigating, identified, monitoring] }
    set:
      status: resolved
      resolvedAt: NOW()
      followUp: DATEADD(TODAY(), 14, "day")
      pinned: false
    allow: [admin]
    intent: The incident is over.
    add:
      IncidentUpdate: { at: NOW(), status: resolved, message: This incident is resolved. }
  annotate:
    on: Incident
    set: { note: }
    add:
      IncidentUpdate: { at: NOW(), status: investigating, message: }
  escalate:
    on: Incident
    when: { pinned: false }
    set: { pinned: true, severity: 1 }
pages:
  incidents:
    crud: Incident
    actions: [resolve, escalate, annotate]
