smithable: 0.1
app: { name: Access }
models:
  Customer:
    fields:
      name: string!
      accountManager: User
    ownedBy: accountManager
    access:
      write: [owner, sales]
      delete: [admin]
actions:
  archive:
    custom: true
    input: { customer: Customer!, reviewer: User }
    allow: [admin]
pages:
  customers:
    crud: Customer
    access: [sales]
