smithable: 0.1
app: { name: Torget, description: A place to sell things. }
models:
  Item:
    fields:
      title: string!
      description: text!
      photos: pictures
      price: money
      category: furniture | electronics | vehicles | other
      condition: new | used
      place: string
      available: bool = true
      seller: User
  Message:
    fields:
      name: string!
      email: email!
      message: text!
pages:
  catalog:
    route: /
    crud: Item
    search: [title, description]
    filters: [category, price, condition, available, owner, createdAt]
    sortable: [price, createdAt, title]
    favorites: true
    contact: { to: seller, keep: Message }
  saved:
    crud: Item
    favorites: only
  mine:
    crud: Item
    contact: owner
    mine: true
  welcome:
    route: /welcome
    landing:
      hero: { button: catalog }
      latest: { records: Item, search: true, filters: [category, price], limit: 8 }
