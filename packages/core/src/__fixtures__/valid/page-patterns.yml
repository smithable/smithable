smithable: 0.1
app:
  name: Page patterns
models:
  Invoice:
    fields:
      number: string!
      status: draft | sent | paid
      total: money
      issuedOn: date
pages:
  home:
    route: /
    landing:
      hero: { button: invoices }
      features:
      latest: { records: Invoice, limit: 3 }
      faq: {}
      callToAction: { button: overview }
  overview:
    dashboard:
      open: { count: Invoice, where: { status: sent } }
      paid: { sum: Invoice.total, where: { status: paid } }
      revenue: { sum: Invoice.total, by: issuedOn }
      latest: { list: Invoice, limit: 5 }
  invoices:
    crud: Invoice
  settings:
    settings: Invoice
  welcome:
    onboarding:
      model: Invoice
      steps:
        first: [number, status]
        second: [total, issuedOn]
