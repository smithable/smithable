# What people read. Derived from names when not given here.
smithableContent: 0.1
logo: { src: images/logo.webp, alt: A cup, generated: true }

models:
  Stop:
    fields:
      place: { label: Venue }
      startsAt: { label: Service starts }
      endsAt: { label: Service ends }
      directionsUrl: { label: Map link }
      photo: { label: Stop photo }
      menuOverride:
        label: Menu for this stop
        help: Add dishes and prices for this venue. Leave blank to use the regular menu.
  CateringEnquiry:
    fields:
      eventDate: { label: Event date }
      guests: { label: Number of guests }
      message: { label: Venue and what you have in mind }
      followUpOn: { label: Follow up on }
  Dish:
    fields:
      section: { values: { starters: Starters, mains: Mains, drinks: Drinks, sweets: Sweets } }

actions:
  contacted: { label: Mark contacted }
  booked: { label: Mark booked }
  closed: { label: Close enquiry }

pages:
  menu:
    title: Order from the truck
  where:
    title: Where we are
    hero:
      title: Find the truck
      subtitle: Fish soup, salmon, burgers and cinnamon buns from a small truck that moves around Mariehamn during the week. Order ahead on the menu, tell us when you come, and pick up at the hatch. Or just walk up and order there.
      image:
        src: images/hero.webp
        alt: People at tables under string lights by a food truck on a summer evening
        generated: false
      tiles:                           # the stops tile has no picture: its title on the primary
        menu:
          image: { src: images/samples/food-soup-b.webp, alt: A bowl of soup with bread, generated: true }
    stops:
      title: Upcoming stops
    gallery:
      title: At the market
      items:
        - caption: Produce at the market
          image:
            src: images/hero/market-stall.webp
            alt: Green gourds, beans and potatoes in baskets at a market stall
  catering:
    title: Catering
    hero:
      title: Food truck catering
      subtitle: Burgers and seasonal sides cooked on site for your guests.
      image:
        src: images/hero/event-table.webp
        alt: A long table set for a celebration under string lights in a garden
        generated: true
    contact:
      title: Bring the truck to your event
      text: Tell us where and when you are gathering, and how many you are feeding. We’ll get back to you about the menu and availability.
      button: Send catering enquiry
      thanks: Thanks for your enquiry. We’ll get back to you about your event.
  enquiries:
    title: Catering enquiries

outgoing:
  orderPlaced:
    subject: "New order {number}"
    text: A new order has come in. Open the orders page to accept it, or decline it and say why.
  orderAccepted:
    subject: Your order is being made
    text: Thank you. The kitchen has your order and has started on it. We mail you again when it is ready at the hatch.
  orderReady:
    subject: Your order is ready
    text: Your order waits at the hatch. Tell us your order number when you come. We keep hot food warm for about fifteen minutes.
