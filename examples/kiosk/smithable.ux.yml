# How the app looks. Technology-neutral: presets and choices, never CSS.
smithableUx: 0.1

theme:
  preset: street-food
  brand: { primary: "#b0402f", background: "#e8a33d" }   # the red a notch quieter; the string lights' amber: cream in light, a warm deep brown in dark

tones:
  Order.status: { new: warning, accepted: warning, ready: success, collected: neutral, declined: danger }   # accepted is work in progress; collected, done, stays quiet

pages:
  where:
    width: wide
    sections:
      hero: { layout: tiles }          # the evening photo large, the menu and the week as tiles beside it
      stops: { layout: week, band: muted }   # the week as columns of days, each stop under its day
  orders:
    table:
      columns: [number, name, status, wanted, total]
      sort: wanted                       # the kitchen works to pickup time
  dishes:
    table: { view: cards }             # dishes are pictures and prices, not rows
  stops:
    table: { view: cards }
