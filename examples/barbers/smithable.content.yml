outgoing:
  appointmentRequested:
    subject: A new appointment to confirm
    text: A customer has asked for a time. Check the barber's day and confirm it, or cancel it and call the customer if the time does not work.
  appointmentMade:
    subject: We have your appointment
    text: Thank you. We have your request and mail you again when it is confirmed. You can cancel online until 12 hours before. After that, please call the shop.
