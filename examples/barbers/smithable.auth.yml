# Who signs in, the roles and the default access. Technology-neutral.
smithableAuth: 0.1

signIn:
  providers: [email]                 # customers sign in with a code by mail, no password

defaultAccess: private               # customers see only their own appointments

roles:
  admin:
    description: The shop's owner. Runs the team and the settings, the services and the barbers.
  staff:
    description: A barber. Runs the day, confirms and cancels appointments, and enters time off.
    pages: [day, appointments, time-off]
    read: [Appointment, TimeOff]
    create: [Appointment, TimeOff]
    write: [Appointment, TimeOff]
    delete: [TimeOff]
    actions: [confirm, cancel]
  member:
    description: A customer who books appointments.
    pages: [appointments]
    create: [Appointment]

defaultRole: member

admins: [owner@harbourcuts.example]

# ⚠ PUBLIC: everything listed here is visible to anyone on the internet, without
# signing in. Never add models that contain personal or business data.
public:
  pages: [home, privacy]
  read: [Service, Barber]
