# Who signs in, the roles and the default access. Technology-neutral.
smithableAuth: 0.1

signIn:
  providers: [email]                 # customers sign in with a code by mail, no password

defaultAccess: private               # customers see only their own appointments

roles:
  admin:
    description: The shop. Keeps the services, the barbers and their time off; confirms appointments.
  member:
    description: A customer who books appointments.
    pages: [appointments]
    create: [Appointment]

admins: [owner@harbourcuts.example]

# ⚠ PUBLIC: everything listed here is visible to anyone on the internet, without
# signing in. Never add models that contain personal or business data.
public:
  pages: [home, privacy]
  read: [Service, Barber]
