# yaml-language-server: $schema=../../packages/core/schema/smithable.schema.json
# Tasks and notes an AI assistant keeps for a small team: an app for programs and assistants, with
# the team page and a data page as its only screens (docs/design/api-only.md).
smithable: 0.1
app:
  name: Team Tasks
  description: Tasks and notes, grouped in projects, that an AI assistant keeps for a small team.
  timezone: Europe/Stockholm
models:
  Project:
    fields:
      name: string!
      description: text
      tasks: Task[]
      notes: Note[]
    access:
      create: [admin, member]
      write: [admin, member]
      delete: [admin, member]
  Task:
    fields:
      title: string!
      project: Project!
      status: todo | doing | done
      dueDate: date
      assignee: User
      details: text
    access:
      delete: [admin, member]
  Note:
    fields:
      title: string!
      project: Project!
      body: text
    access:
      delete: [admin, member]
pages:
  team:
    users: manage
  admin:
    route: /admin
    data: all
    access: [admin, member]
actions:
  complete:
    on: Task
    when:
      status: [todo, doing]
    set:
      status: done
    intent: Mark a task as done.
  reopen:
    on: Task
    when:
      status: done
    set:
      status: todo
