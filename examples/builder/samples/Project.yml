# Finished jobs shown to visitors. A project reads well without photos; the builder adds their own.
- title: A fisherman's cottage made liveable all year
  service: Renovation
  place: Eckerö
  year: 2025
  summary: A 1920s cottage used only in summer. We insulated the walls and the floor, put in new windows in the old proportions, and rebuilt the kitchen around the old baking oven.
- title: Glazed veranda facing the sound
  service: Extension
  place: Lemland
  year: 2025
  summary: A veranda of twelve square metres on the south side, glazed on three sides, with a floor that stays warm into October.
- title: Shore sauna with a view west
  service: Sauna
  place: Föglö
  year: 2024
  summary: A sauna of eight square metres on a rock by the shore, with a wood-burning stove, a small changing room and a deck down to the water.
- title: Larch deck around a summer house
  service: Deck and jetty
  place: Jomala
  year: 2024
  summary: Seventy square metres of larch deck on three levels, following the rock, with wide steps down to the garden.
- title: Farmhouse kitchen and bathroom
  service: Renovation
  place: Finström
  year: 2023
  summary: A farmhouse from 1890 with a new kitchen, a bathroom where the pantry was, and the old floorboards lifted, mended and laid again.
- title: Floating jetty for two boats
  service: Deck and jetty
  place: Saltvik
  year: 2023
  summary: A floating jetty of fourteen metres, anchored for the ice, with a fixed walkway from the shore.
