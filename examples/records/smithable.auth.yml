# Who signs in, the roles and the default access. Technology-neutral.
smithableAuth: 0.1

signIn:
  providers: [google]

defaultAccess: private             # the collection itself is public (below); private covers the rest

roles:
  admin: { description: Keeps the collection. }
  member: { description: Looks at it. }

# ⚠ PUBLIC: everything listed here is visible to anyone on the internet, without
# signing in. Never add models that contain personal or business data.
public:
  pages: [home, items]             # the collection is a public site
  read: [Item]
