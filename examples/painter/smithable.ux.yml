# How the app looks. Technology-neutral: presets and choices, never CSS.
smithableUx: 0.1

theme:
  preset: modern                       # clean and light, so the colours in the photos lead

tones:
  Enquiry.status: { new: warning, won: success, lost: neutral }

pages:
  home:
    sections:
      hero: { layout: photo }
      latest: { layout: grid, columns: 3, band: muted }
      gallery: { columns: 2 }
  jobs:
    table: { view: cards, sort: year }
    record: { pictures: top }
  enquiries:
    table:
      columns: [name, job, status, followUpOn]
      sort: followUpOn
      actions: menu                    # the next steps in one menu, not Won beside Lost
    form:
      sections:
        - { name: who, fields: [name, email, phone] }
        - { name: what, fields: [job, message] }
