# Finished jobs shown to visitors. A job reads well without photos; the painter adds their own.
- title: Red farmhouse in linseed oil paint
  surface: facade
  setting: outdoor
  place: Finström
  year: 2025
  summary: A farmhouse from 1890 with cladding that had not been painted in thirty years. Scraped to the wood where it flaked, boards mended, two coats of red linseed oil paint and white trim.
- title: Tin roof on a summer house
  surface: roof
  setting: outdoor
  place: Lemland
  year: 2025
  summary: A tin roof with rust along the seams. Washed, rust treated, primed and painted black in two coats, with new paint on the chimney flashing.
- title: Twelve windows from a villa in town
  surface: windows
  setting: outdoor
  place: Mariehamn
  year: 2025
  summary: The windows of a 1910 villa, taken out in October and restored in the workshop over winter. New putty, mended sills, linseed oil paint inside and out.
- title: Yellow cladding facing the sea
  surface: facade
  setting: outdoor
  place: Eckerö
  year: 2024
  summary: A summer house on the west shore, where the sun and the salt take the paint off in a few years. Washed, scraped, primed with oil and painted a pale yellow.
- title: Staircase and banisters
  surface: woodwork
  setting: indoor
  place: Jomala
  year: 2024
  summary: A staircase from the 1950s with layers of old varnish. Stripped, sanded and painted in a hard-wearing floor paint, the handrail oiled.
- title: Living room and hall in a 1930s flat
  surface: walls
  setting: indoor
  place: Mariehamn
  year: 2024
  summary: Cracks filled, the ceiling painted white and the walls a warm grey, the plaster cornice picked out. Done in a week with the family at home.
- title: Pine floor painted grey
  surface: floors
  setting: indoor
  place: Saltvik
  year: 2023
  summary: A worn pine floor in a cottage kitchen, sanded and painted in three coats of floor paint, a pale grey that hides the sand brought in from the shore.
