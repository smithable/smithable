# yaml-language-server: $schema=../../packages/core/schema/smithable.schema.json
smithable: 0.1

app:
  name: Acme CRM
  description: Lightweight CRM for a small B2B sales team.
  currency: EUR
  timezone: Europe/Mariehamn

models:
  Customer:
    description: A company we have a commercial relationship with.
    fields:
      name: string!
      email: email unique
      phone: phone
      segment: smb | enterprise | government      # first value is the default
      creditLimit:
        type: money
        min: 0
        description: Maximum outstanding balance before new orders are held.
      notes: text
      orders: Order[]                # every order that refers to this customer

  Order:
    fields:
      number: string! unique
      customer: Customer!
      status: draft | placed | shipped | cancelled
      total: money!
      placedAt: datetime

pages:
  customers:
    intent: Find a customer quickly and keep their details current.
    crud: Customer
  orders:
    crud: Order

navigation: [customers, orders]
