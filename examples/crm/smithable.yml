# yaml-language-server: $schema=../../packages/core/schema/smithable.schema.json
smithable: 0.1

app:
  name: Acme CRM
  description: Lightweight CRM for a small B2B sales team.
  currency: EUR
  timezone: Europe/Mariehamn

models:
  Customer:
    description: A company we have a commercial relationship with.
    trash: true                       # a deleted customer can be restored for thirty days
    fields:
      name: string!
      email: email unique
      phone: phone
      segment: smb | enterprise | government      # first value is the default
      creditLimit:
        type: money
        min: 0
        description: Maximum outstanding balance before new orders are held.
      notes: text
      accountManager: User
      orders: Order[]                # every order that refers to this customer
      followUps: FollowUp[]          # what to do next with them, and when
    ownedBy: accountManager          # the account manager owns the customer

  Order:
    trash: true
    fields:
      number: string! unique
      customer: Customer!
      status: draft | placed | shipped | canceled
      total: money!
      shippingMethod: standard | express
      shippingCost:
        type: money
        formula: IF(AND(shippingMethod = "standard", total > 100), 0, IF(shippingMethod = "express", 15, 5))
        description: Standard shipping is free above 100 EUR, otherwise 5 EUR. Express always costs 15 EUR.
        examples:
          - input: { total: 150, shippingMethod: standard }
            expected: 0
          - input: { total: 80, shippingMethod: standard }
            expected: 5
          - input: { total: 150, shippingMethod: express }
            expected: 15
      placedAt: datetime = NOW()

  FollowUp:
    trash: true
    fields:
      customer: Customer!
      dueOn: date! = TODAY()
      done: bool
      note: text

actions:
  mergeCustomers:
    merge: Customer                  # two customers become one: orders and follow-ups move to the kept one
  scheduleFollowUps:
    custom: true
    input: { customer: Customer!, count: int!, everyDays: int! }
    output: { created: int! }
    intent: Plan a series of follow-up notes for a customer, one every so many days.
    rules:
      - The first note is due today; each next one everyDays later.

pages:
  customers:
    intent: Find a customer quickly and keep their details current.
    crud: Customer
    search: [name, email]
    actions: [mergeCustomers, scheduleFollowUps]
  orders:
    crud: Order
    search: [number, customer]
    filters: [status]
  followUps:
    crud: FollowUp
    search: [customer, note]
    filters: [done]
  team:
    intent: Invite colleagues and manage who has access.
    users: manage

navigation: [customers, orders, followUps, team]
