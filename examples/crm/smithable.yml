# DRAFT: spec design proposal, not yet parsed by Smithable.
smithable: 0.1

app:
  name: Acme CRM
  description: Lightweight CRM for a small B2B sales team.
  currency: EUR
  timezone: Europe/Mariehamn

models:
  Customer:
    description: A company we have a commercial relationship with.
    fields:
      name: string!
      email: email unique
      phone: phone
      segment: smb | enterprise | government      # first value is the default
      creditLimit:
        type: money
        min: 0
        description: Maximum outstanding balance before new orders are held.
      notes: text
      accountManager: User
      orders: Order[]                # inverse of Order.customer
    ownedBy: accountManager          # the account manager owns the customer
    access:                          # exceptions to "shared" (see smithable.auth.yml)
      write: [sales]                 # any salesperson may edit any customer
      delete: [admin]

  Order:
    fields:
      number: string! unique
      customer: Customer!
      status: draft | placed | shipped | cancelled
      shippingMethod: standard | express
      total: money!
      shippingCost:
        type: money
        formula: IF(AND(shippingMethod = "standard", total > 100), 0, IF(shippingMethod = "express", 15, 5))
        description: Standard shipping is free above 100 EUR, otherwise 5 EUR. Express always costs 15 EUR.
        examples:
          - input: { total: 150, shippingMethod: standard }
            expected: 0
          - input: { total: 80, shippingMethod: standard }
            expected: 5
          - input: { total: 150, shippingMethod: express }
            expected: 15
      placedAt: datetime
    access:
      write: [sales]
      delete: [admin]

actions:
  placeOrder:
    on: Order
    when: { status: draft }
    set: { status: placed, placedAt: now }

  mergeCustomers:
    custom: true
    input: { keep: Customer, duplicate: Customer }
    allow: [admin]
    intent: Merge a duplicate customer record into the one we keep.
    rules:
      - All orders of the duplicate move to the kept customer.
      - Empty fields on the kept customer are filled from the duplicate.
      - The duplicate is deleted afterwards.

queries:
  myCustomers:
    from: Customer
    where: { accountManager: currentUser }
    orderBy: name

pages:
  overview:
    route: /
    intent: Give salespeople a rapid overview of customers requiring attention today.
    dashboard:
      - stat: { label: Open orders, count: Order, where: { status: placed } }
      - list: { title: My customers, query: myCustomers, limit: 5 }

  customers:
    intent: Find a customer quickly and keep their details current.
    crud: Customer
    search: [name, email]
    actions: [mergeCustomers]

  orders:
    crud: Order
    filters: [status]
    actions: [placeOrder]

navigation: [overview, customers, orders]

jobs:
  sendOverdueReminders:
    schedule: daily 07:00
    custom: true
    intent: Email customers whose invoices are more than 14 days overdue.
