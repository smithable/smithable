# How the app looks. Technology-neutral: presets and choices, never CSS.
smithableUx: 0.1

theme:
  preset: corporate
  density: compact          # an internal tool: more rows on screen

pages:
  customers:
    table:
      columns: [name, email, segment, creditLimit]
      below: { email: phone }   # the phone number under the email
    form:
      fieldOrder: [name, segment, email, phone]

tones:
  Order.status: { shipped: success, canceled: danger }
