# How the app looks. Technology-neutral: presets and choices, never CSS.
smithableUx: 0.1

theme:
  preset: workbench         # the CRM's own theme: compact, quiet, a light sidebar

pages:
  customers:
    table:
      columns: [name, email, segment, creditLimit]
      below: { email: phone }   # the phone number under the email
      sort: name
      mark: initials            # each customer's initials before their name
    form:
      sections:                 # groups with headings; their texts are in the content file
        - { name: contact, fields: [name, email, phone] }
        - { name: terms, fields: [segment, creditLimit, accountManager] }
        - { name: notes, fields: [notes] }
      columns: 2
      control: { notes: textarea }

tones:
  Order.status: { shipped: success, canceled: danger }
