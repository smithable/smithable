# Who signs in, the roles and the default access. Technology-neutral.
smithableAuth: 0.1

signIn:
  providers: [google]
  allowedDomains: [acme.com]       # only Acme's Google Workspace accounts
  selfSignUp: false                # and only colleagues invited from the team page

defaultAccess: shared              # an internal tool: colleagues see each other's data

roles:
  admin: { description: Sales management. Full access. }
  sales: { description: Works with customers and orders. }

admins: [owner@acme.com]           # become admin when they first sign in

# ⚠ PUBLIC: everything listed here is visible to anyone on the internet, without
# signing in. Never add models that contain personal or business data.
public:
  pages: []                        # an internal tool: nothing is public
