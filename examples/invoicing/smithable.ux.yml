# How the app looks. Technology-neutral: presets and choices, never CSS.
smithableUx: 0.1

theme:
  preset: paperwork                    # the tool's own: a geometric heading over Inter, bordered blocks, tabular amounts

# Status colors by meaning; values not listed are neutral.
tones:
  Invoice.status: { paid: success, overdue: warning }

pages:
  home:
    sections:                          # how the landing page's sections look
      hero: { layout: split, image: right }   # the photo undimmed, the text on a clean ground
      pricing: { highlight: Pro }      # the plan drawn forward
      faq: { layout: accordion }       # a shorter page
      callToAction: { band: primary }  # the one band on an otherwise open page
  invoices:
    table:
      columns: [number, client, status, issuedOn, total]
      sort: -issuedOn                    # the newest invoice first
    form:
      sections:                          # who and what state first, then the dates as a pair, then the agreement
        - { name: invoice, fields: [number, client, status] }
        - { name: dates, fields: [issuedOn, dueOn] }
        - { name: documents, fields: [contract] }
      columns: 2
      control: { status: radio }         # the four states shown at once
      aside: summary                     # the status, the total and the dates beside the form
    record:
      lists: { lines: inline }           # the lines edited in place, the total under them
      header: summary                    # the status, the total and the dates under the number
