# yaml-language-server: $schema=../../packages/core/schema/smithable.schema.json
smithable: 0.1

app:
  name: Invoicely
  description: Simple invoicing for freelancers. Each user manages their own clients and invoices.
  currency: EUR

models:
  BusinessProfile:
    description: The freelancer's own business details, printed on their invoices.
    fields:
      businessName: string!
      businessId: string
      registeredOffice: string
      address: text
      vatNumber: string
      iban: string
      paymentTermDays: int! = 30
      invoiceFooter: text

  Client:
    fields:
      name: string!
      email: email!
      address: text
      vatNumber: string
      invoices: Invoice[]

  Invoice:
    fields:
      number: { type: string!, unique: true, locked: { status: [sent, paid, overdue] } }
      client: { type: Client!, locked: { status: [sent, paid, overdue] } }
      issuedOn: { type: date!, default: TODAY(), locked: { status: [sent, paid, overdue] } }
      dueOn:
        type: date!
        default: DATEADD(issuedOn, 30, "day")
        locked: { status: [sent, paid, overdue] }
      deliveryDate: { type: date, locked: { status: [sent, paid, overdue] } }
      status: { type: draft | sent | paid | overdue, default: draft, by: app }
      sentAt: { type: datetime, by: app }
      vatNote: { type: text, locked: { status: [sent, paid, overdue] } }
      contract: file                   # the agreement the invoice is for, as a PDF or a document
      lines: InvoiceLine[]
      total: { type: money, formula: netTotal + vatTotal }
      netTotal: { type: money, formula: SUM(lines.amount) }
      vatTotal: { type: money, formula: SUM(lines.vatAmount) }
    rules:
      - Invoice numbers are sequential per user, like 2026-001, 2026-002.
      - A sent or paid invoice can no longer be edited, only credited.

  InvoiceLine:
    fields:
      invoice: Invoice!
      description: string!
      quantity: decimal! = 1
      unitPrice: money!
      amount:
        type: money
        formula: ROUND(quantity * unitPrice, 2)
        examples:
          - input: { quantity: 3, unitPrice: 40 }
            expected: 120
          - input: { quantity: 0.5, unitPrice: 19.99 }
            expected: 10
      vatRate: { type: decimal!, default: 0, min: 0, max: 100 }
      vatAmount: { type: money, formula: "ROUND(amount * vatRate / 100, 2)" }

actions:
  sendInvoice:
    on: Invoice
    when: { status: draft }
    set: { status: sent, sentAt: NOW() }
    confirm: true
    intent: Email the invoice to the client.
  markSent:
    on: Invoice
    when: { status: draft }
    set: { status: sent, sentAt: NOW() }
    intent: The invoice went to the client another way.
  markPaid:
    on: Invoice
    when: { status: [sent, overdue] }
    set: { status: paid }
    intent: The client paid the invoice.
  markOverdue:
    on: Invoice
    when: { status: sent }
    set: { status: overdue }
    intent: The invoice is late.

# What the app does on a clock: a week after its due date, a sent invoice is overdue.
timers:
  markOverdue:
    on: Invoice
    at: 7 days after dueOn
    where: { status: sent }
    run: markOverdue

outgoing:
  invoiceSent:
    when: sendInvoice
    to: mail
    recipient: client.email

pages:
  home:
    route: /
    landing:
      hero: { button: overview }
      features:
      pricing:
      faq:
      callToAction: { button: overview }
      footer:                           # who is behind it and how to write to them; the privacy page beside
  overview:
    period: issuedOn                    # the numbers of a month, a year, or all time
    dashboard:
      outstanding: { sum: Invoice.total, where: { status: sent } }
      overdue: { sum: Invoice.total, where: { status: overdue } }
      paid: { sum: Invoice.total, where: { status: paid } }
      invoiced: { sum: Invoice.total, by: issuedOn }
      latest: { list: Invoice, limit: 5 }
  invoices:
    crud: Invoice
    search: [number, client]
    filters: [client, status]
    sortable: [issuedOn, dueOn, number]
    actions: [sendInvoice, markSent, markPaid]
    document:
      from: [businessName, businessId, registeredOffice, address, vatNumber, iban]
      to: { ref: client, show: [name, address, vatNumber] }
      show: [number, issuedOn, deliveryDate, dueOn]
      lines: { list: lines, show: [description, quantity, unitPrice, amount, vatRate, vatAmount] }
      totals: [netTotal, vatTotal, total]
      note: vatNote
  clients:
    crud: Client
    search: [name, email]
    sortable: [name, createdAt]
  privacy:
    route: /privacy
    legal: privacy                      # written from the app: who runs it, what it stores, cookies, mail
  settings:
    settings: BusinessProfile
  welcome:
    onboarding:
      model: BusinessProfile
      steps:
        business: [businessName, businessId, registeredOffice, address, vatNumber]
        payment: [iban, paymentTermDays]

navigation:                             # invoice lines are edited on their invoice (smithable.ux.yml), with no page of their own
  main: [overview, invoices, clients, settings]
