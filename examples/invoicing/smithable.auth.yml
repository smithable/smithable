# DRAFT: spec design proposal, not yet parsed by Smithable.
smithableAuth: 0.1

signIn:
  providers: [google]
  selfSignUp: true                 # anyone can create an account

defaultAccess: private             # each freelancer sees only their own data

roles:
  admin: { description: Invoicely staff. }
  member: { description: A freelancer using Invoicely. }

defaultRole: member
admins: [owner@invoicely.example]

# ⚠ PUBLIC: everything listed here is visible to anyone on the internet, without
# signing in. Never add models that contain personal or business data.
public:
  pages: [home]
