# How the app looks. Technology-neutral: presets and choices, never CSS.
smithableUx: 0.1

theme:
  preset: monochrome                   # the market's own: black on white, heavy capital titles, hairline tiles

pages:
  home:
    width: wide                        # more of the catalog across a wide screen
    sections:
      hero: { layout: stage, stage: catalog }   # the catalog itself beside the headline (look-breadth §3)
      latest: { layout: grid, columns: 4, band: muted }   # the like-new items' pictures, a row of four
  catalog:
    table: { view: cards }
