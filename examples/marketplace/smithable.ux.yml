# How the app looks. Technology-neutral: presets and choices, never CSS.
smithableUx: 0.1

theme:
  preset: modern

pages:
  home:
    sections:
      hero: { layout: photo }          # the market across the window, the text on a dark scrim
      latest: { layout: grid, columns: 3, band: muted }   # the newest items' pictures, two rows of three
  catalog:
    table: { view: cards }
