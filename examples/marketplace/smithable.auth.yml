# Who signs in, the roles and the default access. Technology-neutral.
smithableAuth: 0.1

signIn:
  providers: [email]              # anyone may sign up and sell

defaultAccess: private             # people change only their own items

roles:
  admin: all
  member: { description: Sells and saves items., pages: all, create: all }

defaultRole: member
admins: [owner@torget.example]

# ⚠ PUBLIC: everything listed here is visible to anyone on the internet, without
# signing in. Never add models that contain personal or business data.
public:
  pages: [home, catalog]         # the catalog is the front door
  read: [Item]                     # items, never who sells them: the owner is not shown
