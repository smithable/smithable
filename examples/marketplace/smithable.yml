# yaml-language-server: $schema=../../packages/core/schema/smithable.schema.json
# Torget: a local marketplace. People sell things they no longer need; visitors browse.
smithable: 0.1

app:
  name: Torget
  description: Buy and sell second-hand things in your neighborhood.
  currency: EUR

models:
  Item:
    fields:
      title: string!
      photos: pictures!             # an item without a photo is not a listing
      description: text!
      price: money
      category: furniture | bikes | electronics | sports | kids | other
      condition: likeNew | good | worn
      place: string
      available: bool = true
    review: [photos]               # required, so an item waits for its photos to be approved

pages:
  home:
    route: /welcome
    landing:
      hero: { button: catalog, secondButton: myItems }
      latest: { records: Item, search: true, filters: [category], limit: 6 }
      footer: {}
  catalog:
    route: /
    crud: Item
    search: [title, description, place]
    filters: [category, price, condition, available]
    sortable: [price, createdAt]
    favorites: true
    contact: owner
  myItems:
    crud: Item
    mine: true
  saved:
    crud: Item
    favorites: only
  review:
    review: all                    # for admins: the photos waiting for approval

navigation:
  main: [catalog, myItems, saved, review]
