# How the app looks. Technology-neutral: presets and choices, never CSS.
smithableUx: 0.1

theme:
  preset: helpdesk                     # the desk's own: small firm titles, the form and the thread lifted a little, quiet buttons

tones:
  SupportCase.status: { open: warning, inProgress: neutral, closed: success, reopened: danger }

pages:
  cases:
    table:
      columns: [subject, status, priority, assignee]   # the messages' count comes after them
    record:
      lists: { messages: thread }    # a case's messages as a conversation with a reply box
