  caseReceived:
    subject: We got your request
    text: Thank you for writing to Harbour Support. Your request is now a case, and its number is in the subject of this mail. If you want to add something, answer this mail and keep the subject as it is; your answer goes to the same case. We read the support mail on weekdays from 8 to 17 and usually answer within one working day.
