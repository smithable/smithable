# Who signs in, the roles and the default access. Technology-neutral.
smithableAuth: 0.1

signIn:
  providers: [email]
  selfSignUp: false                # only people invited from the team page

defaultAccess: shared              # the team sees and writes everything

roles:
  admin: all
  staff:
    description: Writes incidents and their updates.
    pages: [overview, incidents, updates, maintenance]   # the components and the team are the administrators'
    create: all
    write: all                       # any of the team moves any incident on

defaultRole: staff
admins: [ops@northwind.example]

# ⚠ PUBLIC: everything listed here is visible to anyone on the internet, without
# signing in. Never add models that contain personal or business data.
public:
  pages: [home, history]           # the status page and the incident history
  read:
    - Component
    # Every state an incident has today is public; one added later is not until it is named here.
    - Incident: { where: { status: [investigating, identified, monitoring, resolved] } }
    - IncidentUpdate
    - Maintenance

# What other programs may reach with a key made on the team page (a monitoring tool posting
# incidents, say). A key acts with its role: listing is not granting.
api:
  models: [Component, Incident]
  actions: [resolve]
  assistants: true                 # the same as tools for AI assistants, at /mcp (no deleting)
