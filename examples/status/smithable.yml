# yaml-language-server: $schema=../../packages/core/schema/smithable.schema.json
# A status page: what works, what is being fixed, and what is planned. Visitors read it; the
# team, invited, writes incidents and their updates.
smithable: 0.1

app:
  name: Northwind Status
  description: Is it working? The state of our services, live.
  timezone: Europe/Mariehamn

models:
  Component:
    fields:
      name: string!
      status: operational | degraded | down | maintenance
      description: text
      incidents: Incident[]
      maintenances: Maintenance[]       # planned work on it, on its page
  Incident:
    fields:
      title: string!
      status: investigating | identified | monitoring | resolved
      component: Component
      detectedAt: datetime!
      resolvedAt: datetime
      summary: markdown
      updates: IncidentUpdate[]
  IncidentUpdate:
    fields:
      incident: Incident!
      at: datetime!
      status: investigating | identified | monitoring | resolved
      message: text!
  Maintenance:
    fields:
      title: string!
      component: Component
      startsAt: datetime!
      endsAt: datetime!
      description: text

actions:
  identified:
    on: Incident
    when: { status: investigating }
    set: { status: identified }
    add:
      IncidentUpdate: { at: NOW(), status: identified, message: The cause is found and a fix is being worked on. }
    intent: The cause is found; the incident moves to identified, with an update saying so.
  monitoring:
    on: Incident
    when: { status: [investigating, identified] }
    set: { status: monitoring }
    add:
      IncidentUpdate: { at: NOW(), status: monitoring, message: A fix is out. We are watching before we close this. }
    intent: A fix is out; the incident is watched before it is closed, with an update saying so.
  resolve:
    on: Incident
    when: { status: [investigating, identified, monitoring] }
    set: { status: resolved, resolvedAt: NOW() }
    add:
      IncidentUpdate: { at: NOW(), status: resolved, message: This incident is resolved. }
    intent: The incident is over, with an update saying so. The component's state stays what the team sets.

pages:
  home:
    route: /
    landing:
      hero: { button: history }
      services: { records: Component }
      uptime: { custom: Uptime }       # src/custom/sections/Uptime.tsx, the starter's own
      open: { records: Incident, where: { status: [investigating, identified, monitoring] } }
      recent: { records: Incident, where: { status: resolved }, limit: 5 }
      planned: { records: Maintenance, limit: 3 }
      footer: {}
  history:
    articles: { model: Incident, title: title, body: summary, date: detectedAt }
  incidents:
    crud: Incident
    actions: [identified, monitoring, resolve]
    filters: [status]
  updates: { crud: IncidentUpdate }
  components: { crud: Component }
  maintenance: { crud: Maintenance }
  overview:
    dashboard:
      open: { count: Incident, where: { status: [investigating, identified, monitoring] } }
      perMonth: { count: Incident, by: detectedAt }
      latest: { list: Incident, limit: 5 }
  team: { users: manage }

navigation:
  main: [overview, incidents, updates, maintenance, components, team]
