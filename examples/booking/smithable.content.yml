    operator:
      name: Calm Yoga Studio Ab
      address: Torggatan 1, 22100 Mariehamn
      email: hello@calmyoga.example
      country: Åland, Finland
      hosting: in the EU
  about:
    title: About us
    story:
      title: A small studio by the harbour
      text: |-
        Calm Yoga began in 2019 as one evening class in a borrowed room. Today it is a studio of
        its own on Torggatan, with classes from early morning to late evening.

        The classes stay small, so every teacher knows your name and how your practice is going.
    team: { title: Who teaches }
    faq:
      title: Questions before you come
      items:
        - question: Do I need experience?
          answer: No. Foundations and all-levels classes are made for beginners.
        - question: How early should I arrive?
          answer: Ten minutes before the class, to settle in and find your mat.
  home:
    description: Small yoga classes in Mariehamn for every level. See the schedule and book a mat.
    estimate:
      title: Would a monthly pass pay off?
      text: Try your own numbers. Nothing is saved.
      fields:
        classesPerMonth: { label: Classes a month }
        dropIn: { label: One class }
        pass: { label: Monthly pass }
        withoutPass: { label: Paying per class }
        saved: { label: The pass saves you }
      results: A month
    hero:
      title: Find your calm
      subtitle: Small yoga classes for every level, in the heart of Mariehamn.
      button: See the schedule
      image:
        src: images/hero.webp
        alt: People stretching on yoga mats in a bright studio with large windows
        generated: true
    classes:
      title: Our classes
      text: Something for every level, from first steps to deep stretches.
    faq:
      title: Before your first class
      items:
        - question: Do I need experience?
          answer: No. Foundations and all-levels classes are made for beginners.
        - question: What should I bring?
          answer: Comfortable clothes and water. Mats are there for you.
        - question: How do I cancel a booking?
          answer: Open your booking and cancel it; the spot goes to someone else.
    callToAction:
      title: Your first class is waiting
      button: Book a class
    gallery:
      title: Inside the studio
      items:
        - image: { src: images/gallery/studio.webp, alt: A rolled-up yoga mat and a water bottle on a wooden floor by a window, generated: true }
          caption: Morning light in the studio
        - image: { src: images/gallery/class.webp, alt: Three people stretching sideways in a bright room, generated: true }
          caption: Our Tuesday evening class
        - image: { src: images/gallery/coast.webp, alt: A runner on a path by the sea at sunset, generated: true }
          caption: Summer sessions by the sea
