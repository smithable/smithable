pages:
  privacy:
    title: Privacy
    operator:
      name: Calm Yoga Studio Ab
      address: Torggatan 1, 22100 Mariehamn
      email: hello@calmyoga.example
      country: Åland, Finland
      hosting: in the EU
  about:
    title: About us
    story:
      title: A small studio by the harbour
      text: |-
        Stillwater began in 2019 as one evening class a week in a borrowed room above a bakery. Today it is a studio of
        its own on Storagatan, a few minutes from the harbour, with classes from seven in the morning to late evening.

        The classes stay small, never more than sixteen mats, so every teacher knows your name and how your practice
        is going. The room has wooden floors, tall windows and a radiator under each of them, which matters in February.

        We keep things simple. You book a mat online, you cancel it if plans change, and if you want to talk about
        your practice, there is time for that after class.
    team: { title: Who teaches }
    faq:
      title: Questions before you come
      items:
        - question: Do I need experience?
          answer: No. Foundations and all-levels classes are made for beginners, and every posture has an easier version.
        - question: How early should I arrive?
          answer: Ten minutes before the class, to settle in and find your mat. We close the door when the class starts, to keep the room quiet.
        - question: Which languages do the teachers speak?
          answer: All classes are taught in Swedish and English. Aino also teaches in Finnish if you ask.
        - question: Is there a changing room?
          answer: Yes, with lockers and two showers. Bring a padlock or borrow one at the desk.
        - question: Can I buy a gift card?
          answer: Yes, for one class or for a month. Ask at the desk or write to us, and we will post it or keep it for you to collect.
  home:
    description: Small yoga classes in Mariehamn for every level, from a first class to arm balances. See the schedule and book a mat online.
    estimate:
      title: Would a monthly pass pay off?
      text: Try your own numbers. One class is 16 euros and the monthly pass 99, so at seven classes a month or more the pass is cheaper. Nothing you type is saved.
      fields:
        classesPerMonth: { label: Classes a month }
        dropIn: { label: One class }
        pass: { label: Monthly pass }
        withoutPass: { label: Paying per class }
        saved: { label: The pass saves you }
      results: A month
    hero:
      title: Find your calm
      subtitle: Small yoga classes for every level, a short walk from the harbour in Mariehamn. Book a mat online and come as you are.
      button: See the schedule
      image:
        src: images/hero.webp
        alt: People stretching on yoga mats in a bright studio with large windows
        generated: true
    classes:
      title: Our classes
      text: Six kinds of class, from first steps to deep stretches and arm balances. Each has an easier version of every posture, so you can start where you are.
    faq:
      title: Before your first class
      items:
        - question: Do I need experience?
          answer: No. Foundations and all-levels classes are made for beginners. The teacher shows the easier version of each posture first.
        - question: What should I bring?
          answer: Comfortable clothes and water. Mats, blocks, straps and blankets are here for you, free of charge.
        - question: How do I cancel a booking?
          answer: Open it under My bookings and cancel it before the class starts. The mat then goes to someone else.
        - question: What does a class cost?
          answer: One class is 16 euros. A monthly pass is 99 euros and covers as many classes as you like that month.
        - question: Can I come if I am pregnant or have an injury?
          answer: Often yes. Write to us or tell the teacher before the class, and we will suggest the classes that suit you.
