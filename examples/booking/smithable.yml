# yaml-language-server: $schema=../../packages/core/schema/smithable.schema.json
smithable: 0.1

app:
  name: Stillwater Yoga
  description: Class schedule and online booking for a small yoga studio.
  currency: EUR
  timezone: Europe/Mariehamn

models:
  ClassType:
    description: A kind of class the studio offers, such as Vinyasa, Yin, Hatha or Foundations.
    fields:
      name: string!
      summary: text
      level:                            # long form: default is not the first value
        type: beginner | allLevels | advanced
        default: allLevels
      durationMinutes: int! = 60
      sessions: Session[]               # the sessions of this kind, on its page

  Instructor:
    fields:
      name: string!
      bio: markdown                     # formatted text: headings, lists, links
      portrait: picture                 # a stored picture with its description
      sessions: Session[]               # the classes they teach, on their page

  Session:
    description: One scheduled occurrence of a class.
    namedBy: [classType, startsAt]     # "Hatha · Mon 19 Oct, 08:00"
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
      bookings: Booking[]
      placesLeft: { type: int, formula: capacity - COUNT(bookings) }

  Booking:
    description: A member's place in a session.
    namedBy: session                   # named as its session is
    fields:
      session: Session!  unique         # private access: one booking per member and session
      attendee: User                    # whose place it is: staff book for a member, a member for themselves
    ownedBy: attendee                   # left empty, the one who books; only staff may choose someone else
    capacity:                           # a session never has more bookings than its capacity
      per: session
      max: session.capacity
      closes: session.startsAt          # booking until the class starts
      cancelUntil: session.startsAt     # and cancelling (e.g. "2 hours before session.startsAt")

  Post:
    description: News and articles on the studio's blog.
    fields:
      title: string!
      address: string unique            # the article's address; made from the title when empty
      summary: text
      cover: picture
      body: markdown!
      publishedOn: date
      status: draft | published

  Message:
    description: A question a visitor sends from the contact form on the home page.
    fields:
      name: string!
      email: email!
      message: text!

actions:
  publish:
    on: Post
    when: { status: draft }
    set: { status: published }
    intent: The post is out for everyone to read.

# What the app does on a clock: a reminder the day before, and a post out on its date.
timers:
  remind:
    on: Booking
    at: 1 day before session.startsAt   # raises its event; the reminder below mails it
  publish:
    on: Post
    at: publishedOn
    where: { status: draft }
    run: publish

outgoing:
  reminder:
    when: remind
    to: mail
    recipient: owner
  bookingMade:
    when: Booking created
    to: mail
    recipient: owner                 # the member who booked
  bookingChanged:
    when: Booking changed
    to: mail
    recipient: owner                 # when the studio moves it; not for the member's own edit
  bookingCancelled:
    when: Booking deleted
    to: mail
    recipient: owner
  sessionMoved:
    when: Session changed
    fields: [startsAt]                # only a new time counts
    show: [classType, startsAt, instructor]   # the mail lists these, not the capacity
    previous: true                    # and says what the time was
    to: mail
    recipient: bookings.owner        # one mail per booking, to the member who booked

pages:
  home:
    route: /
    landing:
      hero: { button: schedule, shortcuts: [schedule, blog] }   # round links over the picture's edge
      classes: { records: ClassType }
      estimate:                         # does a monthly pass pay off? Worked out as you type
        calculator:
          fields:
            classesPerMonth: { type: int, min: 0, max: 31, default: 8 }
            dropIn: { type: money, min: 0, default: 16 }
            pass: { type: money, min: 0, default: 99 }
            withoutPass: { type: money, formula: classesPerMonth * dropIn }
            saved: { type: money, formula: classesPerMonth * dropIn - pass }
          examples:
            - input: { classesPerMonth: 8, dropIn: 16, pass: 99 }
              expected: { withoutPass: 128, saved: 29 }
      gallery:
      faq:
      callToAction: { button: schedule }
      news: { records: Post }
      contact: { form: Message }
      footer:
  schedule:                           # the week's classes, for visitors too
    calendar: { model: Session, duration: classType.durationMinutes }
  sessions:                           # the staff's list of sessions
    crud: Session
    filters: [classType, instructor, startsAt]
    defaultFilter: { startsAt: upcoming }   # opens on what is to come; All shows the past too
    sortable: [startsAt, capacity]
  class-types:
    crud: ClassType
    filters: [level]
  instructors:
    crud: Instructor
  messages:
    crud: Message
  blog:                               # the studio's articles, for visitors too
    articles: Post
  about:                              # a page of parts: the story, who teaches, questions
    sections:
      story: { text: }
      team: { records: Instructor }
      faq:
  privacy:
    route: /privacy
    legal: privacy                      # written from the app: who runs it, what it stores, cookies, mail
  posts:                              # where staff write them
    crud: Post
    filters: [status]
  my-bookings:                        # a member's own bookings (private access)
    crud: Booking
    sections:
      cancelling: { text: }             # a note under the list
  admin:
    data: all                      # every model, for administrators

# The menus: what members use first, then the studio's setup and its website. A page in no menu
# is in none, so every page people open is named here.
navigation:
  schedule: [schedule, my-bookings, sessions]
  messages: [messages]
  studioSetup: [class-types, instructors]
  website: [blog, about, posts, home]
  admin: [admin]
