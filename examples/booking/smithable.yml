# yaml-language-server: $schema=../../packages/core/schema/smithable.schema.json
smithable: 0.1

app:
  name: Stillwater Yoga
  description: Class schedule and online booking for a small yoga studio.
  currency: EUR
  timezone: Europe/Mariehamn

models:
  ClassType:
    description: A kind of class the studio offers, such as Vinyasa, Yin, Hatha or Foundations.
    fields:
      name: string!
      summary: text
      level:                            # long form: default is not the first value
        type: beginner | allLevels | advanced
        default: allLevels
      durationMinutes: int! = 60
    access: { create: [admin] }         # members don't add classes

  Instructor:
    fields:
      name: string!
      bio: text
    access: { create: [admin] }

  Session:
    description: One scheduled occurrence of a class.
    fields:
      classType: ClassType!
      instructor: Instructor!
      startsAt: datetime!
      capacity: int! = 12
    access: { create: [admin] }
    rules:
      - A session never has more confirmed bookings than its capacity.

pages:
  sessions:
    crud: Session
  class-types:
    crud: ClassType
    access: [admin]
  instructors:
    crud: Instructor
    access: [admin]
