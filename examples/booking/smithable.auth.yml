# DRAFT: spec design proposal, not yet parsed by Smithable.
smithableAuth: 0.1

signIn:
  providers: [google, facebook]
  selfSignUp: true

defaultAccess: private             # members only see their own bookings

roles:
  admin: { description: Studio staff. Manage the schedule, classes and teachers. }
  member: { description: A student who books classes. }

defaultRole: member
admins: [owner@stillwater.ax]

user:
  fields:
    displayName: string!
    phone: phone

# ⚠ PUBLIC: everything listed here is visible to anyone on the internet, without
# signing in. Never add models that contain personal or business data.
public:
  pages: [home, schedule]
  read: [ClassType, Instructor, Session]
