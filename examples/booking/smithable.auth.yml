# Who signs in, the roles and the default access. Technology-neutral.
smithableAuth: 0.1

signIn:
  providers: [email]

defaultAccess: private             # members only see their own records

roles:                             # what each role may do, beyond their own records
  admin:
    description: Studio staff. Manage the schedule, classes and teachers.
  member:
    description: A student who books classes.
    pages: [my-bookings]             # the public pages are open to everyone
    create: [Booking]                # members book; the classes and sessions are the staff's

admins: [owner@stillwater.example]

# ⚠ PUBLIC: everything listed here is visible to anyone on the internet, without
# signing in. Never add models that contain personal or business data.
public:
  pages: [home, schedule, blog, about, privacy]    # the landing page, the schedule, the blog, about us, the privacy page
  read:
    - ClassType
    - Instructor
    - Session
    - Post: { where: { status: published } }   # visitors read published posts, not drafts
  create: [Message]                # the contact form; only admins read the messages

# Ask, the assistant in the app, for everyone who signs in (setAssistant).
assistant:
  for: signed-in
