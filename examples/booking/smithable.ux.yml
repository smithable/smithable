# How the app looks. Technology-neutral: presets and choices, never CSS.
smithableUx: 0.1

theme:
  preset: stillwater                   # the studio's own theme: one ink on warm paper

pages:
  home:
    sections:
      hero: { layout: inset, facts: [Instructor, ClassType], eyebrow: address }   # the picture as a tall card, the teachers and classes counted, the city over the title
      classes: { layout: cards }
      estimate: { band: muted }        # every second section on the muted band, as a club's site
      faq: { layout: accordion, band: muted }
      callToAction: { band: primary }
      contact: { band: muted }
  # The members' pages in the site frame, for staff too (page-sections.md §4).
  schedule:
    frame: site
    # Each class coloured by its level, its places a dot each (look-gap §4).
    calendar: { colorBy: classType.level, capacity: { left: placesLeft, of: capacity, look: pips } }
  my-bookings: { frame: site }
  about: { frame: site }
  sessions:
    filters: { shown: [startsAt, classType], look: chips }   # the instructor behind "More filters"; every value a chip, an instructor's with their portrait
    # Under a session's name where there is room: who teaches it, and its level.
    record: { subtitle: instructor.name, detail: [classType.level] }
    table:
      columns: [classType, startsAt, instructor, placesLeft, capacity]
      sort: startsAt
    form:
      fieldOrder: [classType, instructor, startsAt, capacity]
      columns: 2
      control: { classType: select, instructor: select, capacity: stepper }
  class-types:
    table: { view: cards, sort: name }
  instructors:
    table: { columns: [name, portrait], view: cards }
