# How the app looks. Technology-neutral: presets and choices, never CSS.
smithableUx: 0.1

theme:
  preset: playful

pages:
  home:
    sections:
      hero: { layout: split, image: right }   # the text beside the picture
      classes: { layout: cards }
      faq: { layout: accordion }
  sessions:
    # Under a session's name where there is room: who teaches it, and its level.
    record: { subtitle: instructor.name, detail: [classType.level] }
    table:
      columns: [classType, startsAt, instructor, placesLeft, capacity]
      sort: startsAt
    form:
      fieldOrder: [classType, instructor, startsAt, capacity]
      columns: 2
      control: { capacity: stepper }
  instructors:
    table: { columns: [name, portrait], view: cards }
