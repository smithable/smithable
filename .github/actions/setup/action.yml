# What every CI job starts with: pnpm (the version package.json pins; setup-node caches its store
# and needs it on the PATH first), Node, the dependencies, and for the browser jobs Chromium
# (cached per Playwright version; its system libraries are installed each time) and a Git identity
# for the generated apps' commits.
name: Setup
description: pnpm, Node, dependencies, and optionally the browser
inputs:
  browser:
    description: Install Playwright's Chromium and a Git identity
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v5
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.browser == 'true'
      id: playwright
      run: echo "version=$(pnpm exec playwright --version | tr ' ' -)" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: inputs.browser == 'true'
      id: browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - if: inputs.browser == 'true' && steps.browsers.outputs.cache-hit != 'true'
      run: pnpm exec playwright install --with-deps chromium
      shell: bash
    - if: inputs.browser == 'true' && steps.browsers.outputs.cache-hit == 'true'
      run: pnpm exec playwright install-deps chromium
      shell: bash
    - if: inputs.browser == 'true'
      run: git config --global user.name CI && git config --global user.email ci@example.com
      shell: bash
