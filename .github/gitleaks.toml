# Gitleaks configuration for this repository (the generated apps have their own scan in
# `smithable security`). The tests and benchmarks use made-up secrets whose values say so.
[extend]
useDefault = true

[allowlist]
description = "Placeholder secrets in the test and benchmark scripts, and an RFC's published example keys"
regexes = [
  '''(test|bench|container-test)-secret-0123456789''',
  '''smithable-secret-key-0123456789''',
  # RFC 8291 Appendix A's published example (the auth secret and the server's private key),
  # which packages/adapter-tanstack/src/push-crypto.test.ts encrypts with to match the RFC.
  '''BTBZMqHH6r4Tts7J_aSIgg''',
  '''yfWPiYE-n46HLnH0KqZOF1fJJU3MYrct3AELtAQ-oRw''',
]
