# Every day: the stack profile's pins against their packages' own advisory lists on GitHub
# (scripts/stack-advisories.mjs). The databases the scanners read list a new hole days later:
# six advisories of 2026-09-30 were in none of them on 2026-10-04. A failed run means a pinned
# version has a published hole, or a list could not be read; GitHub mails whoever last changed
# this file. The fix is to move the pin in packages/adapter-tanstack/src/stack.ts, through the
# gate. The run's summary also names the pins with a newer patch release, for the weekly bump.
name: Stack advisories
on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The script needs Node alone: no pnpm, so nothing of a package manager to cache
      # (setup-node would look for pnpm because package.json names it).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Pins against their packages' advisory lists
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/stack-advisories.mjs | tee -a "$GITHUB_STEP_SUMMARY"
