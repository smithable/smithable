# Publishes the engine to npm: `smithable` (the CLI), `create-smithable` (npm create smithable)
# and the packages under @smithable/. Only by hand (Actions → Publish → Run workflow), with the
# version to publish, and a dry run unless that box is cleared. The version is stamped into the
# packages for the build (scripts/set-version.mjs) and not committed.
#
# No token: npm trusts this workflow as a publisher (OIDC, `id-token: write`) in stage-only mode,
# so a run can only stage each version; ops-smithable approves it with a passkey on npmjs.com
# (or `npm stage approve <id>`) before it is live. The run's summary lists what was staged.
# npm adds provenance by itself with trusted publishing, now that the repository is public.
name: Publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, like 0.1.0
        required: true
      dry_run:
        description: Pack and check only; stage nothing
        type: boolean
        default: true
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The inputs reach the shell as variables, never pasted into a command.
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: node scripts/set-version.mjs "$VERSION"
      - run: pnpm build
      - run: pnpm test
      # pnpm packs each package, turning its workspace: references into the version above.
      - run: mkdir -p "$RUNNER_TEMP/packed" && pnpm -r --filter "./packages/*" pack --pack-destination "$RUNNER_TEMP/packed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-packages
          path: ${{ runner.temp }}/packed/*.tgz

  # Apart from the build, so the job that may publish runs no code of the repository; a real
  # publish only from main.
  publish:
    needs: pack
    if: github.ref == 'refs/heads/main' || inputs.dry_run == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      # Only for .node-version: nothing of the repository runs in this job, which can publish.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .node-version
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed-packages
          path: ${{ runner.temp }}/packed
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Staged publishing needs npm 11.15 or later.
      - run: npm install --global npm@11.15.0 && npm --version
      - name: Stage each package (or a dry run)
        run: |
          # npm refuses a prerelease (0.2.0-rc.1) without a tag; it goes to next, so latest stays the release.
          case "$VERSION" in *-*) tag=next ;; *) tag=latest ;; esac
          echo "## Version $VERSION (tag $tag)" >> "$GITHUB_STEP_SUMMARY"
          for tarball in "$RUNNER_TEMP"/packed/*.tgz; do
            if [ "$DRY_RUN" = true ]; then
              npm publish "$tarball" --access public --tag "$tag" --dry-run
              echo "- dry run: $(basename "$tarball")" >> "$GITHUB_STEP_SUMMARY"
            else
              out=$(npm stage publish "$tarball" --access public --tag "$tag" 2>&1) || { echo "$out" >&2; exit 1; }
              echo "$out"
              echo "- staged $(basename "$tarball"): $(echo "$out" | tail -n 1)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          [ "$DRY_RUN" = true ] || echo "Approve each staged version on npmjs.com, or with npm stage approve <id>." >> "$GITHUB_STEP_SUMMARY"
