# The weekly long run of the random tests (docs/ci.md): every fast-check property with FC_SCALE
# times its usual cases and a new seed each week, on the self-hosted runner in a turn of the
# machine's gate queue, like main's full check. A failure keeps the seed and the case in that
# week's issue, so it can be run again: FC_SEED=<seed> FC_SCALE=<scale> pnpm exec vitest run properties.
name: Weekly properties

on:
  schedule:
    - cron: "0 21 * * 0" # Sunday 21:00 UTC: before the night's own runs on the machine
  workflow_dispatch:
    inputs:
      scale:
        description: Cases, as a multiple of each property's usual number
        default: "100"
      seed:
        description: The seed (empty for this week's)
        default: ""

permissions: { contents: read }

concurrency: { group: weekly-properties, cancel-in-progress: false }

jobs:
  properties:
    if: github.repository == 'smithable/smithable'
    runs-on: [self-hosted, smithable]
    timeout-minutes: 240
    outputs:
      seed: ${{ steps.seed.outputs.seed }}
      scale: ${{ steps.seed.outputs.scale }}
    env:
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@smithable.invalid
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@smithable.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "$HOME/.local/share/fnm/aliases/default/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      # This week's seed (the date), unless one was given to run a failure again.
      - id: seed
        run: |
          seed=${INPUT_SEED:-$(date -u +%Y%m%d)}; scale=${INPUT_SCALE:-100}
          # Numbers only: they become part of a command.
          [[ $seed =~ ^[0-9]{1,9}$ && $scale =~ ^[1-9][0-9]{0,3}$ ]] || { echo "seed and scale are whole numbers"; exit 1; }
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "scale=$scale" >> "$GITHUB_OUTPUT"
        env:
          INPUT_SEED: ${{ inputs.seed }}
          INPUT_SCALE: ${{ inputs.scale }}
      - run: SESSION=ci GATE_AHEAD_MAX=99 scripts/gate.sh
        env:
          GATE_RUN: >-
            pnpm build && FC_SEED=${{ steps.seed.outputs.seed }} FC_SCALE=${{ steps.seed.outputs.scale }}
            pnpm exec vitest run properties 2>&1 | tee "$RUNNER_TEMP/properties.log"; exit ${PIPESTATUS[0]}
          TMPDIR: ${{ runner.temp }}
      # Also when the job ran out of time (cancelled): the log is what the issue needs.
      - if: ${{ !success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: properties-log
          path: ${{ runner.temp }}/properties.log
          if-no-files-found: ignore

  # The failure into this week's issue, from GitHub's own runner: the machine's runner holds no
  # token that writes issues.
  report:
    needs: properties
    if: always() && (needs.properties.result == 'failure' || needs.properties.result == 'cancelled')
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: properties-log }
        continue-on-error: true
      - run: |
          # The week of the seed (a date), not of when the report runs: a Sunday night run may end on Monday.
          week=$(date -u -d "$SEED" +%G-W%V 2>/dev/null || date -u +%G-W%V)
          title="Weekly properties: a failure in $week"
          {
            echo "The weekly long run of the properties failed on ${GITHUB_SHA:0:12}: [the run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "Run it again: \`FC_SEED=$SEED FC_SCALE=$SCALE pnpm exec vitest run properties\` (fast-check prints the path of the case; \`FC_PATH\` replays it in the adapter's property)."
            echo
            echo '```'
            if [ -f properties.log ]; then
              # A fence in the output would end the block early.
              grep -E -A40 "Property failed|FAIL |Counterexample|seed:|path:" properties.log | head -200 | sed 's/```/` ` `/g'
            else
              echo "No log: the run failed before the tests (see the run)."
            fi
            echo '```'
          } > body.md
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ needs.properties.outputs.seed }}
          SCALE: ${{ needs.properties.outputs.scale }}
