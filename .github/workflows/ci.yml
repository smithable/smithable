# The gate. The required status is the `check` job, which only reports on the jobs it needs.
# Every pull request runs lint, build, units and the site on GitHub's runners. The full check (the
# example apps and Studio in a real browser, as `pnpm check`) runs on the self-hosted runner, one
# job through scripts/gate.sh, when the change touches the
# engine, the examples, the scripts `pnpm check` runs, the dependencies or this workflow, and either
# the repository variable FULL_CI is "true" or the pull request has the label `full-ci` (for a
# change someone judges risky). While the repository is private FULL_CI is off and the local
# `pnpm check` is the gate for engine changes (CLAUDE.md); at the public flip it is switched on,
# with no edit here.
# A pull request of plain documents alone (the list under paths-ignore: design notes, benchmark
# reports, the Markdown at the root) starts no run: nothing here reads those files. It has no
# `check` to wait for, so scripts/merge-green.sh merges it itself, after reading the same list from
# main and scanning its commits for secrets.
# A push to main starts no run: a merge is of a pull request that was checked, or of plain
# documents. Main itself gets the full check twice a day (03:00 and 13:00 UTC), which is also
# where two changes that only clash together show (a pull request is no longer run again when it
# is merely behind main), and an administrator's merge past the check. It is skipped when main's
# head is the commit the last scheduled run checked: it passes again if that run passed and fails
# again if it failed (a cancelled one is run again), so the latest scheduled run always tells
# main's state. Run workflow (workflow_dispatch) runs the full check on any branch. A newer push
# to a pull request cancels its older run; adding any other label runs nothing and cancels nothing.
name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    # Files no job reads. scripts/merge-green.sh takes the list from between the two markers, so
    # one quoted path a line. docs/ai.md is a page of the site and is not here.
    paths-ignore:
      # plain docs: begin
      - "docs/design/**/*.md"
      - "docs/benchmarks/**"
      - "docs/research/**"
      - "docs/ARCHITECTURE.md"
      - "docs/ROADMAP.md"
      - "docs/VISION.md"
      - "docs/as-built.md"
      - "docs/releasing.md"
      - "*.md"
      # plain docs: end
  schedule:
    - cron: "0 3,13 * * *"
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    outputs:
      full: ${{ steps.scope.outputs.full }}
      basics: ${{ steps.scope.outputs.basics }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Full check or short run
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          FULL_CI: ${{ vars.FULL_CI }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          engine='^(packages/|apps/|examples/|scripts/test-[^/]*\.mjs$|scripts/embed\.mjs$|package\.json$|pnpm-lock\.yaml$|\.github/workflows/|\.github/actions/)'
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            # The scheduled run before this one (this one is listed first, still running).
            last=$(gh run list --workflow ci.yml --event schedule --limit 2 --json headSha,conclusion \
              --jq '.[1] // {} | "\(.headSha) \(.conclusion)"')
            if [ "${last% *}" = "$GITHUB_SHA" ]; then
              case "${last#* }" in
                success)
                  echo "main is still $GITHUB_SHA, which the last scheduled run checked: skipped" | tee -a "$GITHUB_STEP_SUMMARY"
                  { echo "full=false"; echo "basics=false"; } >> "$GITHUB_OUTPUT"
                  exit 0 ;;
                failure)
                  echo "main is still $GITHUB_SHA, whose last scheduled run failed" | tee -a "$GITHUB_STEP_SUMMARY"
                  exit 1 ;;
              esac
            fi
          fi
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            full=true; why="$GITHUB_EVENT_NAME"
          elif ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            full=true; why="no base to compare with"
          elif git diff --name-only "$BASE" HEAD | grep -qE "$engine"; then
            full=true; why="engine files changed"
          else
            full=false; why="no engine files changed"
          fi
          if [ "$full" = true ] && [ "$FULL_CI" != true ] && [ "$LABELLED" != true ] && [ "$why" != "$GITHUB_EVENT_NAME" ]; then
            full=false; why="$why, but FULL_CI is off and no full-ci label: the local pnpm check is the gate"
          fi
          basics=true
          { echo "full=$full"; echo "basics=$basics"; } >> "$GITHUB_OUTPUT"
          echo "Full check: $full ($why)" | tee -a "$GITHUB_STEP_SUMMARY"

  lint-build-units:
    needs: scope
    if: needs.scope.outputs.basics == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # the whole history, for the secrets scan
      - uses: ./.github/actions/setup
      # Secrets in the tree or the history (the test scripts' placeholders are allowlisted).
      - run: docker run --rm -v "$PWD:/repo" -v "$PWD/.gitleaks.toml:/cfg.toml" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --no-banner --config /cfg.toml
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm site

  # The full check runs on the self-hosted runner (Johan's dev machine, docs/ci.md): no billed
  # minutes, and the machine already runs this check for every engine change through the gate
  # lock, which this job takes its turn in (SESSION=ci). One job, as `pnpm check` is one command:
  # lint, build, units, the site, every example in parallel, Studio in a real browser. Never for a
  # pull request from a fork: that would run a stranger's code on the machine.
  full:
    needs: scope
    if: needs.scope.outputs.full == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, smithable]
    # The job's clock runs while it waits for its turn in the gate queue, up to an hour a gate on
    # a loaded machine; the runner's minutes are free, so the limit is a guard against a hung
    # run, not a budget (2026-10-22: a ninety-minute limit cancelled runs behind four gates).
    timeout-minutes: 300
    permissions: { contents: read }
    env:
      # The generated apps' commits need an identity; the machine's own global config is left alone.
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@smithable.invalid
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@smithable.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The machine's Node through fnm (the runner's service has no shell profile).
      - run: echo "$HOME/.local/share/fnm/aliases/default/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      # The runner's user keeps its own browser; nothing to do once it is there.
      - run: pnpm exec playwright install chromium
      # Three examples at a time: the runner shares the machine with the sessions' own work.
      - run: SESSION=ci GATE_AHEAD_MAX=99 TEST_APPS_PORT=8600 TEST_STUDIO_PORT=8610 TEST_APPS_CONCURRENCY=3 scripts/gate.sh
        # Its temporary files in the runner's own folder: /tmp holds the sessions' private ones,
        # which a glob over it cannot read (the failure picture was never uploaded).
        env:
          npm_config_frozen_lockfile: "false"
          pnpm_config_frozen_lockfile: "false"
          TMPDIR: ${{ runner.temp }}
      # The picture Studio's test takes of a failed step.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-failure
          path: ${{ runner.temp }}/smithable-studio-*/failure.png
          if-no-files-found: ignore

  # Twice a day a main that passed everything goes to the beta (Johan, 2026-10-11): the cloud's
  # Release images run builds this commit, and skips it when neither repository has moved since
  # its last release. A scheduled run skipped because main had not moved asks nothing (the run
  # before it did); the cloud's own daily schedule stays the fallback. CLOUD_RELEASE_TOKEN: a
  # fine-grained token for smithable/smithable-cloud alone, with Actions read and write.
  release:
    needs: [lint-build-units, full]
    if: github.event_name == 'schedule' && needs.lint-build-units.result == 'success' && needs.full.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    # A lapsed token must not turn main's scheduled run red (scope then fails the next runs on an
    # unchanged main): the job shows yellow with a line in the summary, and the fallbacks release.
    continue-on-error: true
    steps:
      - name: Start the cloud's release of this commit
        env:
          GH_TOKEN: ${{ secrets.CLOUD_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No CLOUD_RELEASE_TOKEN secret: the cloud releases on its own schedule." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # --ref: without it gh first reads the default branch, which the Actions-only token may not.
          if ! gh workflow run images.yml --repo smithable/smithable-cloud --ref main -f oss_ref="$GITHUB_SHA" -f if_new=true; then
            echo "::warning::Could not start smithable-cloud's Release images: is CLOUD_RELEASE_TOKEN lapsed? The cloud's own schedule still releases." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Asked smithable-cloud's Release images to release $GITHUB_SHA if anything is new." | tee -a "$GITHUB_STEP_SUMMARY"

  # The required status: green when every job it needs passed, or was skipped on the short run.
  # Not for a run that was cancelled (a newer push, or the full-ci label added while the first
  # run was going: a pull request opened with the label starts two runs): its jobs are cancelled,
  # and reporting that as a failed `check` stood in the way of the newer run's result.
  check:
    needs: [scope, lint-build-units, full]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "A job ended $r."; exit 1 ;; esac
          done
