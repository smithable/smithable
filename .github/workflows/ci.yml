# Lint, build and unit tests, once per pull request and on every push to main. `pnpm check`
# (which adds the generated apps and Studio in a real browser) stays the local gate before every
# commit. A newer push to a pull request cancels its older run, since three sessions share the
# Actions minutes.
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }   # the whole history, for the secrets scan
      # pnpm first (the version package.json pins): setup-node caches for the package manager
      # package.json names, and needs it on the PATH to ask where its store is.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Secrets in the tree or the history (the test scripts' placeholders are allowlisted).
      - run: docker run --rm -v "$PWD:/repo" -v "$PWD/.gitleaks.toml:/cfg.toml" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --config /cfg.toml
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
