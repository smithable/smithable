# The gate. The required status is the `check` job, which only reports on the jobs it needs.
# A change to the engine, the examples, the scripts `pnpm check` runs, the dependencies or this
# workflow runs the full check as parallel jobs: lint, build, units and the site; one job per
# example (scripts/test-apps.mjs <example>); and Studio in a real browser. Anything else runs lint,
# build, units and the site. Once per pull request and on every push to main; a push to main
# whose tree the pull request already checked in full only gets the short run. A newer push to a
# pull request cancels its older run, since several sessions share the Actions minutes.
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      examples: ${{ steps.scope.outputs.examples }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Full check or short run
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          engine='^(packages/|apps/|examples/|scripts/test-[^/]*\.mjs$|scripts/embed\.mjs$|package\.json$|pnpm-lock\.yaml$|\.github/workflows/|\.github/actions/)'
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            full=true; why="no base to compare with"
          elif git diff --name-only "$BASE" HEAD | grep -qE "$engine"; then
            full=true; why="engine files changed"
          else
            full=false; why="no engine files changed"
          fi
          # A merge to main of an up-to-date pull request has the tree its pull request run checked.
          if [ "$full" = true ] && [ "$GITHUB_EVENT_NAME" = push ] && git rev-parse -q --verify HEAD^2 >/dev/null \
            && [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse HEAD^2^{tree})" ]; then
            full=false; why="the pull request checked this tree in full"
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          # Every example gets its own job, so a new starter is tested without editing this file.
          echo "examples=$(ls -d examples/*/ | xargs -n1 basename | jq -Rcs 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          echo "Full check: $full ($why)" | tee -a "$GITHUB_STEP_SUMMARY"

  lint-build-units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }   # the whole history, for the secrets scan
      - uses: ./.github/actions/setup
      # Secrets in the tree or the history (the test scripts' placeholders are allowlisted).
      - run: docker run --rm -v "$PWD:/repo" -v "$PWD/.gitleaks.toml:/cfg.toml" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --config /cfg.toml
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm site

  apps:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.scope.outputs.examples) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - run: pnpm build
      # The generated apps install what an operation adds, so not with CI's frozen lockfile.
      - run: node scripts/test-apps.mjs ${{ matrix.example }}
        env: { npm_config_frozen_lockfile: "false", pnpm_config_frozen_lockfile: "false" }

  # One job: its 37 steps share one Studio session, each building on the one before.
  studio:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - run: pnpm build
      - run: pnpm test:studio
        env: { npm_config_frozen_lockfile: "false", pnpm_config_frozen_lockfile: "false" }

  # The required status: green when every job it needs passed, or was skipped on the short run.
  check:
    needs: [scope, lint-build-units, apps, studio]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "A job ended $r."; exit 1 ;; esac
          done
