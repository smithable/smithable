# The gate. The required status is the `check` job, which only reports on the jobs it needs.
# Every pull request runs lint, build, units and the site. The example apps (one job each, through
# scripts/test-apps.mjs <example>) and Studio in a real browser run too when the repository
# variable FULL_CI is "true" and the change touches the engine, the examples, the scripts
# `pnpm check` runs, the dependencies or this workflow. While the repository is private FULL_CI
# is off and the local `pnpm check` is the gate for engine changes (CLAUDE.md); at the public
# flip it is switched on, with no edit here. A push to main whose tree its pull request already
# checked runs nothing beyond the scope job; one that differs (an administrator's merge) gets lint,
# build, units and the site. A newer push to a pull request cancels its older run.
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      basics: ${{ steps.scope.outputs.basics }}
      examples: ${{ steps.scope.outputs.examples }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Full check or short run
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FULL_CI: ${{ vars.FULL_CI }}
        run: |
          engine='^(packages/|apps/|examples/|scripts/test-[^/]*\.mjs$|scripts/embed\.mjs$|package\.json$|pnpm-lock\.yaml$|\.github/workflows/|\.github/actions/)'
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            full=true; why="no base to compare with"
          elif git diff --name-only "$BASE" HEAD | grep -qE "$engine"; then
            full=true; why="engine files changed"
          else
            full=false; why="no engine files changed"
          fi
          if [ "$full" = true ] && [ "$FULL_CI" != true ]; then
            full=false; why="$why, but FULL_CI is off: the local pnpm check is the gate"
          fi
          # A merge to main of an up-to-date pull request has the tree its pull request run checked.
          basics=true
          if [ "$GITHUB_EVENT_NAME" = push ] && git rev-parse -q --verify HEAD^2 >/dev/null \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
            full=false; basics=false; why="the pull request checked this tree"
          fi
          # Every example gets its own job, so a new starter is tested without editing this file.
          examples=$(find examples -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rcs 'split("\n") | map(select(. != ""))')
          { echo "full=$full"; echo "basics=$basics"; echo "examples=$examples"; } >> "$GITHUB_OUTPUT"
          echo "Full check: $full ($why)" | tee -a "$GITHUB_STEP_SUMMARY"

  lint-build-units:
    needs: scope
    if: needs.scope.outputs.basics == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }   # the whole history, for the secrets scan
      - uses: ./.github/actions/setup
      # Secrets in the tree or the history (the test scripts' placeholders are allowlisted).
      - run: docker run --rm -v "$PWD:/repo" -v "$PWD/.gitleaks.toml:/cfg.toml" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --config /cfg.toml
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm site

  apps:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.scope.outputs.examples) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - run: pnpm build
      # The generated apps install what an operation adds, so not with CI's frozen lockfile.
      - run: node scripts/test-apps.mjs ${{ matrix.example }}
        env: { npm_config_frozen_lockfile: "false", pnpm_config_frozen_lockfile: "false" }

  # One job: its 37 steps share one Studio session, each building on the one before.
  studio:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with: { browser: "true" }
      - run: pnpm build
      - run: pnpm test:studio
        env: { npm_config_frozen_lockfile: "false", pnpm_config_frozen_lockfile: "false" }

  # The required status: green when every job it needs passed, or was skipped on the short run.
  check:
    needs: [scope, lint-build-units, apps, studio]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "A job ended $r."; exit 1 ;; esac
          done
